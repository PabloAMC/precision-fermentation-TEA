# Incumbent prices and literature titers shown next to the model results (Figs 1, 4; report sec. 5).
# No numbers are copied here: prices are read from data/evidence/prices.yaml by key, titers
# from data/titers.csv by (product, source_key, host). Only the protein fractions are
# assumptions, graded like any parameter. Computed by src/pftea/benchmarks.py.

incumbents:
  whey:
    label: "whey protein concentrate/isolate (WPC80/WPI)"
    compare_to: blg
    trade_series:          # annual unit values, per kg product
      - {key: whey_protein_gt80_us_export_unit_value, currency: USD}
      - {key: whey_protein_gt80_eu_export_unit_value, currency: EUR}
    protein_frac: {value: 0.80, low: 0.76, high: 0.88, grade: C,
      source: "HS 3502.20 / CN 3502 20 91 cover products with >80% whey protein on dry matter (WPC80 and WPI mixed); 0.80 as traded assumed. GFI 2025 p.31 converts WPC80/WPI $8.2-17.7/kg product to $10.3-19.9/kg protein, i.e. 0.80 (WPC80) and 0.89 (WPI)"}
    spot:                  # 2026 USDA Dairy Market News narrative quotes, per lb product
      - {key: wpc80_regular_us_dmn_2026, protein_frac: 0.80, label: "WPC80 spot 2026"}
      - {key: wpi_us_dmn_2026, protein_frac: 0.90, label: "WPI spot 2026"}
  egg:
    label: "dried egg white (egg albumin)"
    compare_to: [ova, ovd]        # both replace egg-white protein (ovomucoid.yaml ovd_incumbent_price_basis)
    trade_series:
      - {key: egg_albumin_dried_eu_export_unit_value, currency: EUR}
    protein_frac: {value: 0.811, grade: A,
      source: "USDA FoodData Central, SR Legacy fdcId 172204 'Egg, white, dried': protein 81.1 g, water 5.8 g per 100 g (API record, fetched 2026-09-26). Voutilainen 2021 SI lists 78%"}
    spot: []
  casein:
    label: "casein (acid and rennet casein, caseinates)"
    compare_to: cas
    trade_series:
      - {key: casein_food_eu_export_unit_value, currency: EUR}
      - {key: casein_acid_us_dmn_annual, currency: USD, per: lb}     # USDA Dairy Market News, U.S. import prices
      - {key: casein_rennet_us_dmn_annual, currency: USD, per: lb}
    protein_frac: {value: 0.854, low: 0.83, high: 0.90, grade: A,
      source: "Southward, 'Casein products' (NZ Institute of Chemistry) Table 1: acid casein as sold 85.4% protein, 11.4% moisture (casein.yaml casein_dairy_yield_from_skim_milk). low/high = the conversion GFI 2025 implies, $8.0-11.0/kg product to $9.6-12.2/kg protein (0.83-0.90; C)"}
    spot: []
  years: [2015, 2025]      # window for the trade-value band
  money_year: 2025         # trade values are deflated to this year's dollars (the model's money year)
  deflator: cpi_u_us       # BLS CPI-U annual average, data/evidence/prices.yaml

reported_prices:           # products without a trade code: price points from reports and trade press (benchmarks.reported_prices)
  lactoferrin:
    label: "dairy bovine lactoferrin (reports and trade press, 2025 US$)"
    compare_to: lf
    evidence: lactoferrin      # data/evidence/lactoferrin.yaml
    keys: [blf_price_trade_press_series, blf_price_range_gfi2025, blf_price_gfieurope2025, blf_price_mao2023]
    grade: C
    deflate: true              # each point's year -> incumbents.money_year with the CPI deflator (review SC-6)
    comparators: [lf_cost_intelligen2026_case_a_ufdf, lf_cost_intelligen2026_case_b_cex]   # published model costs (not prices)
    comparator_cases:          # our case on the same route; compare cost of production (SuperPro's unit cost has
      lf_cost_intelligen2026_case_a_ufdf: lf_ufdf_only    # depreciation and no return on capital)
      lf_cost_intelligen2026_case_b_cex: lf

  albumin:
    label: "bulk serum albumin (technical BSA: trade data, 2025 US$)"
    compare_to: alb
    evidence: albumin          # data/evidence/albumin.yaml
    keys: [gfi2025_albumin_trade_price, albumin_bulk_trade_us_nl_2023]
    grade: C
    deflate: true
    comparators: []            # no published cost model of recombinant albumin (albumin.yaml)
    # Not in the band (context in the report): GFI 2023's $10/kg target and research-catalogue rHSA at $43-55k/kg.

  alpha_lactalbumin:
    label: "dairy alpha-lactalbumin (market reports, 2025 US$)"
    compare_to: alac
    evidence: alac             # data/evidence/alac.yaml
    keys: [alac_price_points_gfieurope2025]   # FMI's $31-86/kg: basis unknown, context only (audit R14-H2)
    grade: C
    deflate: true
    comparators: []            # GFI Europe/ADL's $24/kg (food grade) and $100/kg (high purity) PF costs are quoted in the report, not banded


context:                   # protein ingredients for context (benchmarks.context_prices; report Q1, explorer, fig 11)
  - {label: "Pea protein concentrate/isolate", key: pea_protein_price_range_gfi2025, basis: protein, grade: C, group: plant, when: "GFI 2025, nominal"}
  - {label: "Soy protein concentrate/isolate", key: soy_protein_price_range_gfi2025, basis: protein, grade: C, group: plant, when: "GFI 2025, nominal"}
  - {label: "Collagen and gelatin (>90% protein)", key: collagen_gelatin_price_range_gfi2025, basis: product, protein_frac: 0.90, grade: C, group: animal, when: "GFI 2025, nominal"}
  - {label: "Casein", key: casein_price_range_gfi2025, basis: protein, grade: C, group: dairy, when: "GFI 2025, nominal"}
  - {label: "Whey proteins, all grades", key: whey_protein_price_range_gfi2025, basis: protein, grade: C, group: dairy, when: "GFI 2025, nominal"}
  - {label: "WPC80 and WPI", key: wpc80_wpi_price_range_gfi2025, basis: protein, grade: C, group: dairy, when: "GFI 2025, nominal"}
  - {label: "Whey protein >80%, export unit values", incumbent: whey, grade: A, group: dairy}
  - {label: "Dried egg white, export unit values", incumbent: egg, grade: A, group: egg}
  - {label: "Egg white protein, all purities", key: egg_white_price_range_gfi2025, basis: protein, grade: C, group: egg, when: "GFI 2025, nominal"}

equivalents:               # the model's $/kg protein expressed per litre of milk and per egg (benchmarks.equivalents)
  # Composition from data/evidence/milk_egg.yaml (entry derived_protein_per_litre_and_per_egg, by field).
  # Prices are that file's annual series, converted per unit and deflated with CPI-U to money_year.
  evidence_key: derived_protein_per_litre_and_per_egg
  milk:
    per: "litre of cow's milk"
    compare_to: [blg, cas]
    target_field: {blg: milk_blg_g_per_L, cas: milk_beta_casein_g_per_L}   # BLG (3.3 g) and beta-casein (9.2 g) in a litre
    all_protein_field: milk_all_protein_g_per_L  # all milk protein in a litre (33.7 g)
    density_key: milk_density_fdc_sr_legacy    # kg/L, for prices per kg or per cwt
    prices:
      - {key: us_all_milk_price_nass, unit: usd_per_cwt, label: "US farm milk (all-milk price)"}
      - {key: eu_raw_milk_price_mmo, unit: eur_per_100kg, label: "EU raw milk (first purchasers)"}
      - {key: us_retail_milk_whole_bls, unit: usd_per_gal, label: "US retail whole milk"}
  egg:
    per: "US large egg"
    compare_to: [ova, ovd]
    target_field: {ova: ova_g_per_large_egg, ovd: ovd_g_per_large_egg}   # ovalbumin (1.96 g) and ovomucoid (0.40 g) in an egg
    all_protein_field: egg_white_protein_g_per_large_egg   # egg-white protein in an egg (3.64 g)
    prices:
      - {key: us_wholesale_eggs_ny_ers, unit: usc_per_doz, label: "US wholesale eggs (New York, Grade A large)"}
      - {key: us_retail_eggs_grade_a_large_bls, unit: usd_per_doz, label: "US retail eggs (Grade A large)"}

titer_markers:             # (product in titers.csv, source_key, host) -> max titer of matching rows
  blg:
    - {product: blg, source_key: Yao2026, host: K. phaffii, label: "best published BLG (Yao 2026; ethanol induction)"}
    - {product: blg, source_key: Li2026, host: K. phaffii, label: "best published BLG on glucose (Li 2026)"}
    - {product: "other:PF-average-published", source_key: gfi2025costs, host: various, label: "average in published cost models (GFI 2025)"}
    - {product: "other:PF-average-private", source_key: gfi2025costs, host: various, label: "average in private cost models (GFI 2025)"}
    - {product: blg, source_key: behm2022, host: T. reesei, label: "design titer (Behm 2022; NREL cellulase)"}
  ova:
    - {product: ova, source_key: Aro2023, host: T. reesei, label: "best public secreted OVA (Aro 2023; incl. a clipped form)"}
    - {product: ova, source_key: Beck2025, host: E. coli EcN, label: "OVA, intracellular E. coli (Beck 2025, 3 L)"}
    - {product: ova, source_key: intelligen_ovalbumin2025, host: K. phaffii, label: "Intelligen design (borrows EVERY's ovomucoid patent titer)"}
    - {product: "other:PF-average-private", source_key: gfi2025costs, host: various, label: "average in private cost models (GFI 2025)"}
    - {product: ova, source_key: intelligen_ovalbumin2025, host: T. reesei, label: "Onego platform claim (protein not specified; press)"}
  lf:                      # no company discloses a lactoferrin titer (lactoferrin.yaml); Iglesias 2016's 3.5 g/L is a lysate yield, not shown
    - {product: lactoferrin, source_key: Yen2024, host: K. phaffii, label: "best public methanol-free LF (Yen 2024; porcine)"}
    - {product: lactoferrin, source_key: Lv2023b, host: K. phaffii, label: "best public secreted LF (Lv 2023; human, methanol, ELISA)"}
    - {product: lactoferrin, source_key: Liu2026, host: K. phaffii, label: "human LF, methanol (Liu 2026)"}
    - {product: lactoferrin, source_key: Hu2025, host: T. reesei, label: "human LF, T. reesei (Hu 2025)"}
    - {product: lactoferrin, source_key: intelligen_lactoferrin2024, host: K. phaffii, label: "Intelligen design titer (methanol)"}
    - {product: "other:PF-average-private", source_key: gfi2025costs, host: various, label: "average in private cost models (GFI 2025)"}

  ovd:                     # EVERY's patent example is the only ovomucoid titer above 1 g/L
    - {product: ovomucoid, source_key: Every2024-HY, host: K. phaffii, label: "EVERY patent example"}
    - {product: ovomucoid, source_key: Kim2025, host: K. phaffii, label: "best peer-reviewed (Kim 2025)"}
    - {product: "other:PF-average-private", source_key: gfi2025costs, host: various, label: "average in private cost models (GFI 2025)"}
  alb:                     # no albumin maker discloses a titer (Sartorius/Albumedix, InVitria, Healthgen; albumin.yaml)
    - {product: albumin, source_key: Zhu2021, host: K. phaffii, factor: 0.5003, label: "best public rHSA (Zhu 2021; methanol; whole broth)"}   # 17.47 g/L of supernatant, 192 h; 21.84 g in 2.5 L / 17.47 (albumin.yaml zhu2021_whole_broth_titer)
    - {product: albumin, source_key: Zhu2018, host: K. phaffii, factor: 0.5003, label: "rHSA (Zhu 2018; methanol; whole broth by analogy)"}   # 8.86 g/L of supernatant, 96 h
    - {product: albumin, source_key: Kim2025, host: K. phaffii, label: "tagged BSA, total protein (Kim 2025; upper bound)"}
    - {product: albumin, source_key: Delta2003-740, host: S. cerevisiae, label: "best methanol-free (Delta/Recombumin patent)"}
    - {product: "other:PF-average-private", source_key: gfi2025costs, host: various, label: "average in private cost models (GFI 2025)"}
  alac:                    # no alpha-lac maker discloses a titer (21st.BIO/Novonesis; alac.yaml); every K. phaffii titer is human alpha-lac
    - {product: alpha-lactalbumin, source_key: Wang2025, host: "K. phaffii GS115-ICL1-LM (LA-3C, 3 copies, 5xlacO-corePAOX1 + LacI-Mit1AD ESAD, hybrid P4 signal; ADH2-SePPK)", factor: 0.643, label: "best public alpha-lac (Wang 2025; human; ethanol; whole broth)"}   # 0.60 g/L of supernatant x 0.643
    - {product: "other:alpha-lactalbumin", source_key: gfieurope2025, host: yeast (unspecified), label: "GFI Europe/ADL design titer"}
    - {product: "other:PF-average-private", source_key: gfi2025costs, host: various, label: "average in private cost models (GFI 2025)"}
  cas:                     # no company discloses a casein titer (casein.yaml); Wang 2021's 1.13 g/L is bovine, its 1.45 human
    - {product: casein, source_key: StandingOvation_US20240251812A1, host: "E. coli BL21(DE3) pET25b+", label: "best public casein, intracellular E. coli (Standing Ovation patent)"}
    - {product: casein, source_key: Wang2021, host: "E. coli BL21(DE3) pET22b", label: "alpha-s1 casein, E. coli (Wang 2021; human)"}
    - {product: casein, source_key: Choi1996, host: "K. phaffii (P. pastoris) GS115, His+ Mut-s, pHIL-D2 AOX1 integrant", label: "beta-casein, K. phaffii, intracellular, methanol (Choi 1996)"}
    - {product: "other:PF-average-private", source_key: gfi2025costs, host: various, label: "average in private cost models (GFI 2025)"}

required_targets:          # target $/kg target protein for the required-titer analysis (report Q3)
  alac: [25, 60, 130]      # the band's ends per kg alpha-lac (GFI's $15 at 60% and $123 at 95% purity, divided by purity) and a midpoint (C)
  alb: [10, 50, 100]       # 10 = GFI 2023's target for cultivated-meat media; 50 ~ bulk BSA ($40-70/kg); 100 = the question's other end (albumin.yaml)
  blg: [10, 20, 50]        # round numbers across the whey band ($8.7-17.8/kg protein, 2015-2025) and above it
  ova: [10, 20, 50]        # same, across the egg-white band ($9.7-21.2)
  ovd: [10, 20, 50]        # same as OVA: the incumbent is dried egg white per kg protein
  cas: [10, 20, 50]        # same, across the casein band ($7.9-18.7/kg protein, 2015-2025; benchmarks.incumbents)
  lf: [100, 200, 400]      # 100 ~ the 'PF average price' GFI Europe/ADL assume for the lactoferrin archetype ($105); 200 = the bottom of the
                           # reported dairy range (2016 trade press, nominal); 400 = GFI Europe's average market price (lactoferrin.yaml; all grade C)

claims:                    # Q5: is the claimed titer reachable within O2/heat limits, and in how long?
  # model: the host and cell density we run it with (T. reesei at the academic OVA scenario's density)
  # t_prod_h: the claim's own production phase where the source gives one (else 72 h is used)
  - {product: "other:PF-average-private", source_key: gfi2025costs, host: various, model_host: kphaffii, model_product: blg,
     label: "average titer in private companies' cost models (GFI 2025)"}
  - {product: "other:PF-average-published", source_key: gfi2025costs, host: various, model_host: kphaffii, model_product: blg,
     label: "average titer in published cost models (GFI 2025)"}
  - {product: blg, source_key: behm2022, host: T. reesei, model_host: treesei, model_product: blg, t_prod_h: 120,
     label: "Behm 2022 BLG design titer (T. reesei, 120 h)"}
  - {product: "other:homologous-secreted-protein", source_key: behm2022, host: T. reesei, model_host: treesei, model_product: blg,
     label: "T. reesei homologous secreted protein (Behm 2022, grade C)"}
  - {product: ova, source_key: intelligen_ovalbumin2025, host: T. reesei, model_host: treesei, model_product: ova,
     label: "Onego platform claim (protein not specified; tested as OVA; press, grade C)"}
