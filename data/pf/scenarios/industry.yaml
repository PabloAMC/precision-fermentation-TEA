# 'industry': adds grade C evidence (company claims, GFI private-sector survey averages).
# GFI 2025's 42 g/L is Hawkwood's average over private-company models of unspecified secreted
# proteins and hosts (audit R7-M7), not a measured BLG, OVA or lactoferrin titer. Everything else is
# the product's base case (yield and cells derived from Intelligen; lactoferrin at 250 t/yr with
# cation exchange, data/pf/products.yaml).
description: "Private-sector benchmark titer (GFI 2025 survey average), product base-case plant"
blg:
  strain.titer_g_L: 42            # gfi2025costs Table 2: private-sector average 42 g/L (grade C)
ova:
  strain.titer_g_L: 42
lf:
  strain.titer_g_L: 42            # same survey average. FLAG: no lactoferrin company discloses a titer (Helaina,
                                  # TurtleTree, All G; lactoferrin.yaml), and lactoferrin (76 kDa, 16 disulfides,
                                  # glycosylated) is harder to secrete than BLG; the public best is 2.8-5.4 g/L
ovd:
  strain.titer_g_L: 42            # same survey average; EVERY's patent example (30.19 g/L) is the only ovomucoid figure on record
cas:
  strain.titer_g_L: 42            # same survey average. FLAG: no casein company discloses a titer (Eden Brew, Formo,
                                  # Fermify, New Culture, Standing Ovation; casein.yaml); the public best is 3 g/L
alb:
  strain.titer_g_L: 42            # same survey average. FLAG: no albumin maker discloses a titer (Sartorius/Albumedix,
                                  # InVitria, Healthgen); the public best is 17.47 g/L after 192 h of methanol induction
mc_paths:
  common: [strain.titer_g_L, strain.t_prod_h, strain.Y_ps_g_g, strain.X_prod_g_L, strain.mu_prod_per_h,
    hosts.kphaffii.maint_factor, hosts.kphaffii.m_s_prod_g_g_h, fermenter.otr_cap_mol_m3_h, fermenter.turnaround_h,
    dsp.paste_extracellular_frac, dsp.mf_flux_LMH, dsp.uf_flux_LMH, dsp.df_flux_LMH, dsp.membrane_price_usd_m2,
    dsp.membrane_skid_usd_m2, dsp.dryer_MJ_per_kg_water, dsp.spray_dryer_cost_2018usd, utilities.glucose_usd_kg,
    utilities.biomass_disposal_usd_t_dry, capital.cost_index_2018_to_2025]
  blg: [dsp.concentrate_target_frac_dry]
  ova: [dsp.concentrate_target_frac_dry]
  ovd: [dsp.concentrate_target_frac_dry, dsp.dryer_feed_solids_ovd]
  lf: [dsp.dryer_feed_solids_lf, dsp.cex_dbc_g_L, dsp.cex_cv_per_cycle, dsp.cex_flow_cv_per_h, dsp.cex_recovery,
    dsp.cex_resin_usd_L, dsp.cex_resin_life_cycles, dsp.cex_hardware_usd_per_L_resin, dsp.cex_target_frac_dry]
  alb: [dsp.dryer_feed_solids_alb, dsp.cex_dbc_g_L, dsp.cex_cv_per_cycle, dsp.cex_flow_cv_per_h, dsp.cex_recovery,
    dsp.cex_resin_usd_L, dsp.cex_resin_life_cycles, dsp.cex_hardware_usd_per_L_resin, dsp.cex_target_frac_dry]
  cas: [dsp.dryer_feed_solids_cas, dsp.acid_h3po4_kg_per_m3, dsp.acid_precip_temperature_C, dsp.acid_heat_recovery,
    dsp.acid_precip_recovery, dsp.acid_wash_L_per_kg, dsp.acid_curd_solids, dsp.acid_naoh_kg_per_kg, dsp.acid_target_frac_dry]
mc_ranges:
  common:
    strain.titer_g_L: {low: 24, high: 54, grade: C}   # GFI 2025: public models 0.03-54 g/L, average ~24; private average 42 (grade C; the v2 60 was unsourced, review SC-8)
