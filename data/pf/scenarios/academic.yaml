# 'academic': only peer-reviewed or patent-example evidence (grades A/B), per product.
# Titers are the best public numbers (docs/LITERATURE.md; data/titers.csv). Where no product-specific
# value exists (yield, maintenance) the base-case values (grade B, derived from Intelligen) are kept:
# no public measured BLG or OVA yield on sugar exists (audit NP-6).
description: "Best public academic strain performance, 10 kt/yr, food-grade plant"
blg:                                     # Yao et al. 2026 (K. phaffii), the best public BLG titer (audit R6-C1)
  strain.titer_g_L: 13.88                # verified in the full text, 5 L tank
  strain.X_prod_g_L: 50                  # ~200 g/L wet cells at the switch to induction (~36 h) at 4:1 wet:dry (Li 2026, same lab); derived
  strain.t_prod_h: 108                   # ethanol induction ~36 -> 144 h (Fig. 6B)
  strain.mu_prod_per_h: 0.0083           # 50 -> ~122 g DCW/L (489 g/L wet at harvest) over 108 h; derived
  # FLAG: Yao's production phase runs on ethanol with glutamate feeding; the model has one carbon
  # source, so it is costed as glucose-equivalent (per electron the two feeds cost about the same).
blg_li2026:                              # variant: Li et al. 2026, the best public BLG titer on glucose
  strain.titer_g_L: 5.14                 # verified in the full text, 5 L tank, glucose
  strain.X_prod_g_L: 38                  # DCW at the end of the ~24 h batch, read from Fig. 6B at 4:1; derived
  strain.t_prod_h: 108                   # glucose fed-batch 24 -> 132 h (Fig. 6B); the v1 96 h was the plate assay time
  strain.mu_prod_per_h: 0.0100           # 38 -> ~112 g DCW/L over 108 h; derived
ova:                                     # Aro et al. 2023 (T. reesei)
  strain.host: treesei
  strain.titer_g_L: 2.0                  # full-length + a 36 kDa clipped form summed; an upper bound for intact OVA (audit NP-3)
  strain.X_prod_g_L: 35                  # T. reesei harvest 20-50 g DCW/L (PerfectDay2023-hypo [0248], grade B)
  strain.mu_prod_per_h: 0.0              # no production-phase growth (audit R6-C4)
  strain.t_prod_h: 110                   # total ~133 h (Aro's last sample) less the model's ~23 h growth phase
mc_paths:
  common: [strain.Y_ps_g_g, fermenter.otr_cap_mol_m3_h, fermenter.turnaround_h, dsp.paste_extracellular_frac,
    dsp.mf_flux_LMH, dsp.uf_flux_LMH, dsp.df_flux_LMH, dsp.membrane_price_usd_m2, dsp.membrane_skid_usd_m2,
    dsp.dryer_MJ_per_kg_water, dsp.spray_dryer_cost_2018usd, dsp.concentrate_target_frac_dry,
    utilities.glucose_usd_kg, utilities.biomass_disposal_usd_t_dry, capital.cost_index_2018_to_2025]
  blg: [strain.X_prod_g_L, strain.mu_prod_per_h, hosts.kphaffii.maint_factor, hosts.kphaffii.m_s_prod_g_g_h,
    dsp.dryer_feed_solids_blg]
  ova: [strain.X_prod_g_L, hosts.treesei.maint_factor, hosts.treesei.mu_max_per_h, hosts.treesei.kla_factor,
    dsp.dryer_feed_solids_ova]
mc_ranges:
  blg:
    strain.titer_g_L: {low: 13.88, high: 13.88}
  ova:
    strain.titer_g_L: {low: 2.0, high: 2.0}
    strain.X_prod_g_L: {low: 20, high: 50}   # T. reesei harvest range (same patent)
