# 'albumin': variants of the albumin base case (serum albumin for cultivated-meat media, 30 g/L in 72 h on glucose,
# cation-exchange capture, 1 kt/yr; data/pf/products.yaml). Every public rHSA titer above ~1.5 g/L is methanol-induced
# (albumin.yaml), so the base design point is also costed with a methanol induction phase.
description: "Albumin variants: methanol induction, purification recovery (base case: data/pf/products.yaml)"
alb_methanol:                         # the base design point with a methanol-only production phase (K. phaffii AOX1)
  strain.methanol_frac_prod: 1
alb_recovery_low:                     # the CEX capture at its lowest reported recovery (US 5,728,553 Table 4: '>40%')
  dsp.cex_recovery: 0.40
alb_recovery_high:                    # one capture step at Zhu 2021's measured 86% (dye affinity at pH 5; analogy for CEX, B)
  dsp.cex_recovery: 0.86
alb_ufdf_only:                        # optimistic route bound (as lactoferrin's lf_ufdf_only): UF/DF alone, no chromatography.
  plant.spec: concentrate             # Albumin is 76.86% of the supernatant's protein in the best public run (Zhu 2021 Table 1),
  dsp.concentrate_target_frac_dry: 0.77   # so membranes give at most ~77% albumin (less of dry matter): BELOW the 96% cell-culture spec
alb_capture_only:                     # optimistic: the capture column alone reaches the cell-culture grade (one dye-affinity step did,
  dsp.polish_columns: 0               # 96.4% at 86% recovery, in Zhu 2021 Table 1; no such data for cation exchange; audit R12-H1)
