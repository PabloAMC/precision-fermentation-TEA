# 'lactoferrin': a high-value contrast case (bovine lactoferrin, K. phaffii, methanol-free as in
# FDA GRN 1219 and 1284), at a plant size that fits the market: 250 t/yr (Intelligen's 2024 design
# made 251 t/yr of powder; the world bLF market is ~0.3-1.6 kt/yr, sources disagree ~5x).
# Downstream: MF -> cation exchange -> UF/DF -> spray dryer, the dairy route and every
# commercial PF route; UF/DF without chromatography (Intelligen case a) is the optimistic variant.
# Price band: dairy bLF US$200-1,500/kg in 2013-2025 trade press and reports (grade C;
# data/evidence/lactoferrin.yaml); no PF lactoferrin price is public.
description: "Bovine lactoferrin, 250 t/yr, cation-exchange purification"
common:
  plant.product: lf
  plant.spec: cex
  plant.annual_target_protein_t: 250
lf:                                   # design titer: Intelligen's LF design (Feb 2026 report p.4; its 2024 version via David 2026)
  strain.titer_g_L: 10                # 10 g/L after 5 days (Intelligen p.4; B). Their design induces with methanol; this methanol-free case borrows the titer
  strain.t_prod_h: 90                 # 5-day batch less the model's ~30 h growth phase
lf_academic:                          # best public methanol-free secreted LF: Yen 2024, porcine LF, K. phaffii, 5 L
  strain.titer_g_L: 2.8               # grade A (full text); bovine 3.5 g/L (Iglesias-Figueroa 2016) is a lysate yield, not used
  strain.t_prod_h: 114                # 144 h total less ~30 h growth
lf_ufdf_only:                         # optimistic: Intelligen case a, purity by UF/DF alone (a design assumption); ours is 90% of dry matter (85.5% as sold at 5% moisture), theirs 90% as sold
  strain.titer_g_L: 10
  strain.t_prod_h: 90
  plant.spec: concentrate
  dsp.concentrate_target_frac_dry: 0.90
# Intelligen's own design inputs in our model (reconciliation, review L; report pp.4-10 and Fig. 12-14).
# Only what the report states; their unit prices for materials, labour and consumables are not used.
lf_intelligen_a:                      # case a: UF/DF only
  strain.titer_g_L: 10
  strain.t_prod_h: 90
  plant.spec: concentrate
  dsp.concentrate_target_frac_dry: 0.90
  plant.annual_target_protein_t: 226.2  # 251,304 kg powder/yr x 0.90 lactoferrin (Table 2; p.7)
  fermenter.volume_m3: 100              # 6 staggered 100 m3 fermenters (p.4, p.11)
  utilities.electricity_usd_kWh: 0.10   # Fig. 12
  dsp.diafiltration_volumes: 5          # p.7
lf_intelligen_b:                      # case b: cation exchange
  strain.titer_g_L: 10
  strain.t_prod_h: 90
  plant.annual_target_protein_t: 204.1  # 215,551 kg powder/yr x 0.947 (Table 3; p.10)
  fermenter.volume_m3: 100
  utilities.electricity_usd_kWh: 0.10
  dsp.cex_recovery: 0.97                # lactoferrin retention 97% (p.9)
  dsp.cex_dbc_g_L: 90                   # their load: 33 min at 20 CV/h of ~8 g/L permeate (capacity 100 g/L, p.9)
  dsp.cex_flow_cv_per_h: 20             # 500 cm/h through a 25 cm bed (p.10)
  dsp.cex_cv_per_cycle: 25              # 10 + 5 + 5 + 5 bed volumes of buffer (p.9)
  dsp.cex_elution_cv: 5                 # p.9
  dsp.cex_diafiltration_volumes: 5      # p.10
  dsp.cex_resin_usd_L: 1000             # Fig. 14
  dsp.cex_resin_life_cycles: 150        # Fig. 14
