  acid_precip_feed_g_L: {value: 26.8, unit: g casein/L of precipitation feed, grade: D,
    source: "design choice by analogy: the permeate is ultrafiltered to the casein concentration of skim milk (26 g/kg x 1.031 kg/L = 26.8 g/L; milk_egg.yaml milk_casein_tetrapak, A as data), so the dairy recovery, acid and wash data apply to a feed like the one they were measured on (audit R9-1: a dilute permeate would not precipitate as completely). No PF casein process states a precipitation concentration"}
  acid_h3po4_kg_per_m3: {value: 5.65, low: 2.3, high: 17.3, unit: kg H3PO4 (85%) per m3 of precipitation feed, grade: D,
    source: "derived (mine; check): milk takes 0.049 mol H+/L from pH 6.6 to 4.6 (Nestle US4075196A Ex. 1: 18 kg/h HCl for 10,000 L/h skim milk; casein.yaml casein_dairy_acid_and_wash_water_per_kg, B). Applied per m3 of the UF-concentrated feed, which holds milk's casein concentration, as an analogy (D): 49 mol/m3 x 98 g/mol, one proton per H3PO4 at pH 4-4.5 (pKa1 2.15, pKa2 7.2), / 0.85 for the 85% acid priced in media.h3po4_price_usd_kg. The model's target is pH 4.5, recombinant beta-casein's solubility minimum (Chezan 2026, full text; milk's dose takes it to 4.6); Formo acidifies its alpha-s1 extract to pH 4 with H3PO4 (GRN 1312). low/high = 20/150 mol H+/m3 (guess, E). Pulling down: milk's buffering is largely calcium phosphate, phosphoserines and citrate, absent here; beta-casein itself takes up ~14-17 H+ per molecule (~16-19 mol/m3 at this concentration; audit R9-2, derived). Pulling up: medium phosphate carried into the permeate. The K. phaffii casein fermentations on file run at pH 6.8 (NewMilkBuzz; casein.yaml), near milk's 6.6. Recombinant beta-casein's zeta-potential pI is 5.5, but it is least soluble at pH 4.5 (Chezan 2026). Sulfuric or hydrochloric acid (dairy practice; NewMilkBuzz reports HCl works) would cost several times less per mol H+ and keep phosphorus out of the effluent; no price is on file"}
