    source: "Standing Ovation US 2024/0251812 A1 Ex. 7: recombinant beta-casein at pH 4 'partial precipitation ... at 40 C and full precipitation at 90 C' for 20 min (casein.yaml casein_pf_patent_acid_precipitation_and_neutralisation). low = dairy practice for native casein, D for a recombinant one: acidify, then heat to 40-45 C (Tetra Pak ch.20; the scan's 'approx. 82 C' before that is almost certainly 32 C, audit R9-4) or cook at 50-55 C (Southward)"}
  acid_hold_h: {value: 0.333, unit: h, grade: B, source: "Standing Ovation Ex. 7: 20 min at 90 C (sizes the holding tank only)"}
