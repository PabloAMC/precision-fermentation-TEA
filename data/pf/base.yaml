    source: "prices.yaml: US anhydrous NH3 import unit value 2025 $0.611/kg (UN Comtrade, A proxy; EU import UV EUR 0.53 = $0.60); low = Humbird SI $0.30 (2019); high = USDA Iowa retail 2025 $784/short ton"}
  water_usd_m3: {us_midwest: 1.50, eu_nw: 1.62, low: 0.26, high: 3.0, grade: B,
    source: "prices.yaml: GFI/Hawkwood 2025 Midwest $1.50/m3 (B); low = Humbird well water $0.26 (2019); high = Intelligen $3/t; EU = VEMW 2025 NL large-user average EUR 1.43/m3 (C)"}
  wastewater_usd_m3: {value: 1.0, low: 0.4, high: 4.0, grade: B, source: "dsp.yaml: $0.2-0.5/m3 below 1 g/L BOD (Petrides); Chicago $0.42/kg BOD implies ~$4/m3 at 10 g/L (A)"}
  steam_usd_t: {us_midwest: 16.9, eu_nw: 56.9, low: 12, high: 25, grade: D,
    source: "gas-fired LP steam at Humbird's ratio: $9.7/t at $2.9/MMBtu gas = 3.53 GJ gas per t steam (Humbird SI RawUtil, B), times the gas price above; Intelligen $20/t (2025); range guess"}
