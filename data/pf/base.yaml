# pf-tea v1 base case: every model parameter, with value/low/high, unit, evidence grade and source.
# Grades (docs/SCOPE.md): A measured/official data; B published design basis (NREL, Intelligen,
# Humbird) or patent example; C company claim or survey; D analogy; E guess (listed in
# docs/VALIDATION.md). Money is 2025 US$ unless a `year` is given. Scenario files in data/pf/
# override the `strain` and `plant` blocks; everything else is shared.
# Location-keyed leaves give `us_midwest` / `eu_nw` values; their `low`/`high` may be keyed the
# same way. "Derived" means our arithmetic on the cited numbers (shown so it can be checked).

plant:
  product: {value: blg, note: "blg | ova"}
  spec: {value: concentrate, note: "concentrate (GRN 1056-type, UF/DF + dry) | isolate (adds precipitation) | cex (adds cation-exchange capture; lactoferrin) | crude (whole broth)"}
  annual_target_protein_t: {value: 10000, low: 1000, high: 100000, unit: t/yr, grade: C,
    source: "gfi2025costs Table 2: private-sector volumes 2,500-25,000+ t/yr; SCOPE base"}
  operating_days: {value: 330, low: 320, high: 350, unit: d/yr, grade: B,
    source: "NREL 2011 uses 8,410 h/yr (96%); Humbird A.1 350 d; Intelligen ~342 batches x 24 h; 330 d allows for campaigns and cleaning"}
  location: {value: us_midwest, note: "us_midwest | eu_nw"}

strain:                      # base = 'industry-benchmark' K. phaffii process (overridden by scenarios)
  host: {value: kphaffii}
  titer_g_L: {value: 30, low: 5, high: 60, unit: g/L, grade: B,
    source: "intelligen_ovalbumin2025 design basis 30 g/L; Every2024-HY ovomucoid 30.19 g/L (patent Ex. 9); gfi2025costs public avg 24, private avg 42. For scale: the highest secreted titer in the Looser 2015 review's compilation is 19.55 g/L (glucose oxidase, methanol/mannitol, 168 h, 100 -> 245 g/L cells; Table 4). Tornado ends beyond the feasibility boundary are truncated to it"}
  t_prod_h: {value: 72, low: 48, high: 120, unit: h, grade: B,
    source: "intelligen_ovalbumin2025 p.6: expression phase 72 h; NREL 2011: 96 h production"}
  X_prod_g_L: {value: 107, low: 40, high: 150, unit: g DCW/L at the start of production, grade: B,
    source: "derived from intelligen_ovalbumin2025: cells at the start of expression = 92 g/L x 107 m3 at harvest (p.7) - 8/28 x 3,210 kg rOVA made (Eq. 2) = 8,927 kg, in 107 m3 less the expression-phase additions (11,464 kg glucose as 500 g/L solution 22.9 m3 + 30% ammonia 3.5 m3 - net O2/CO2 exchange 2.2 m3) = 82.8 m3 -> 108 g/L; feeding then dilutes it to 92 g/L at harvest. Range: K. phaffii glucose fed-batch 93-169 g/L at harvest (Shemesh 2024, A); patents 100-200 (Every2024-HY, B); hosts.yaml"}
  X_max_g_L: {value: 150, low: 100, high: 200, unit: g DCW/L, grade: A,
    source: "K. phaffii glucose fed-batch 93-169 g/L (Shemesh 2024); typical 150; patents up to 200 (hosts.yaml). Growth stops here. Heyland 2010 grew at constant rate only up to ~155 g/L, slowing above it (218 g/L after 65 h in 2.6 L), and states such densities are reachable only in small fermenters because O2 transfer and heat removal limit larger ones (hosts.yaml kphaffii_glucose_hcd_fedbatch_heyland2010)"}
  mu_prod_per_h: {value: 0.0014, low: 0.0, high: 0.02, unit: 1/h, grade: B,
    source: "derived from intelligen_ovalbumin2025 Eq. 2: 917 kg cells made on ~8,930 kg in 72 h (8 g per 28 g rOVA at 30 g/L x 107 m3; 92 g/L at harvest) -> ln(9,844/8,927)/72 = 0.00136/h. Range: 0 (non-growing production) to 0.02 (K. phaffii production-phase growth rates, hosts.yaml; D). Growth stops at X_max: from 107 g/L the high end reaches 150 g/L after ~17 h and the phase continues without growth"}
  Y_ps_g_g: {value: 0.465, low: 0.28, high: 0.535, unit: g protein/g glucose (product reaction only), grade: B,
    source: "derived so that the model reproduces intelligen_ovalbumin2025 Eq. 2 (expression phase: 100 g glucose -> 28 g rOVA + 8 g cells + 4 g HCP, maintenance included). Glucose per g product in expression = 1/Y_ps + (8/28)/Y_x + m_s,prod/q_p = 100/28, with Y_x = 0.5705 g/g (the model's Heijnen growth yield for K. phaffii), m_s,prod = 0.00437 g/g/h (hosts.kphaffii.m_s_prod_g_g_h) and q_p = 3,210 kg / 675,213 kg.h = 0.00475 g/g/h (Intelligen) -> 1/Y_ps = 3.5714 - 0.5008 - 0.9192 = 2.151, Y_ps = 0.465 (audit R2-Q2/R6-C2: 0.28 is a lumped yield, not a reaction yield). The glucose of Intelligen's 4 g of host-cell protein is charged to the target (read with the HCP as product, the yield would be 0.53; review HM-6). The inversion is sensitive to m_s,prod: at 0.0023 it gives 0.39 (review FS-4). low = 0.28 (the lumped value read as a reaction yield, as in v1); high = 0.535 (0.95 x the energetic ceiling 0.564 of BLG with amino-acid synthesis and sulfate assimilation counted, product.energetic_ceiling; review FS-2/SC-2; D). Checks: Behm 2022 design 0.223 g/g overall (T. reesei BLG); NREL cellulase 0.24 g/g overall"}
  q_p_max_mg_g_h: {value: 40, low: 5, high: 40, unit: mg product/g DCW/h, grade: D,
    source: "judgment: a physiological ceiling on specific secretion, applied as a feasibility limit. No K. phaffii measurement is near it: Intelligen's design runs at 4.75 mg/g/h (low, B); the best public BLG fed-batch implies ~1 (Yao 2026, 13.88 g/L in 108 h at ~120 g/L cells); a VHH-secreting strain peaked at 0.64 and fell to 0.019 at near-zero growth (Rebnegger 2024, hosts.yaml); the Looser 2015 review compiles q_P,max of secreted proteins from 0.004 to 0.69, the glucose (GAP) ones 0.05-0.49 at mu 0.15-0.20/h, growth-coupled; the best glucose fed-batch on file secreted 2.1 near mu 0.1/h (Prielhofer 2018, hosts.yaml; the report's 'best demonstrated' case); fungal enzyme processes reach ~5-20 (Ellila 2017 productivities at 20-50 g/L cells; review FS-3). Our model of NREL's T. reesei cellulase design implies ~118 (a model output at 6.6 g/L cells, not physiological evidence; shown only as a sensitivity). Binds only in the physical-limit and required-titer analyses, where the report shows the floor at 5-120"}
  X0_g_L: {value: 0.88, low: 0.88, high: 15, unit: g DCW/L, grade: B,
    source: "derived: inoculum 5% v/v (Intelligen OVA p.6) x the seed density fermenter.seed_final_X_g_L = 17.6 g/L (Intelligen's lactoferrin flowsheet; one number for both, review FS-11). v2.1 used 3 (from a guessed 60 g/L seed). Humbird A.1 starts at 15 g/L (high)"}

hosts:
  kphaffii:
    biomass_formula: {value: {C: 1, H: 1.665, O: 0.602, N: 0.134}, grade: A,
      source: "Carnicer et al. 2009 Microb Cell Fact 8:65, Table 4: Fab-producing K. phaffii CH1.665N0.134O0.602S0.0039 (evidence hosts.yaml; re-check table cell)"}
    mu_max_per_h: {value: 0.20, low: 0.15, high: 0.28, unit: 1/h, grade: A,
      source: "hosts.yaml: mu_max ~0.2 1/h on sugar vs 0.11-0.12 on methanol. Glucose batch (Heyland 2010 Table I and p.360): 0.28 for the non-producing parent (high: a producer cannot outgrow it; also Looser 2015 Table 2, glucose) and 0.15-0.16 for the producing strain (low); both papers note the better producers grow more slowly"}
    temperature_C: {value: 30, unit: C, grade: B, source: "intelligen_ovalbumin2025 p.6: 30 C"}
    maint_factor: {value: 1.0, low: 0.57, high: 1.67, grade: A,
      source: "growth phase: multiplier on Tijhuis 1993 maintenance (0.0174 g glucose/g DCW/h at 30 C, Humbird A.1 method). Producing K. phaffii in glucose chemostats: 0.0147-0.0161 (Rebnegger 2016 citing Rebnegger 2014; Maurer 2006) = 0.85-0.93x. low = 0.0100 (non-producing strain, Rebnegger 2016) / 0.0174; high = 0.029 (5-copy lipase clone, Nieto-Taype 2020) / 0.0174"}
    m_s_prod_g_g_h: {value: 0.00437, low: 0.0023, high: 0.0161, unit: g glucose/g DCW/h, grade: A,
      source: "production phase (mu ~ 0): Rebnegger et al. 2024 Microb Cell Fact 23:44, VHH-secreting K. phaffii, glucose, 30 C, fitted over mu <= 0.05/h: 'm S (4.37 +/- 0.27 mg g-1 h-1)'. Maintenance falls at near-zero growth (Rebnegger 2016: retentostat 0.0031 vs chemostat 0.0100 for the same strain). low = 0.0023 (1-copy lipase clone, Nieto-Taype 2020); high = 0.0161 (Maurer 2006 chemostat, producing Fab strain). Not raised to Looser 2015 Table 2's 0.009-0.032 (growing cultures on methanol and glycerol; no glucose value) or to the 5-copy lipase clone's 0.029 (Nieto-Taype 2020, chemostat; used for the growth phase, maint_factor high): maintenance falls at near-zero growth (Rebnegger 2016). The base expression phase can carry at most ~0.006 with the product made at the energetic ceiling (results constants ms_prod_max_at_ceiling; review H2). Evidence: placeholders.yaml nietotaype2020 and ms_heyland2010_looser2015 entries"}
    po_ratio: {value: 1.48, unit: mol ATP/mol O, grade: B,
      source: "Chung et al. 2010 Microb Cell Fact 9:50: 'P/O ratio (1.48 mol ATP/mol O)', a genome-scale-model constraint (hosts.yaml kphaffii_po_ratio_chung2010); no measured P/O found"}
    kla_factor: {value: 1.0, grade: B, source: "yeast broth treated as non-coalescing water-like (Humbird Fig1.3)"}
    cell_removal: {value: centrifuge}
  treesei:
    biomass_formula: {value: {C: 1, H: 1.645, O: 0.445, N: 0.205}, grade: B,
      source: "humbird2011 p.38: T. reesei cell mass CH1.645O0.445N0.205S0.005"}
    mu_max_per_h: {value: 0.1, low: 0.05, high: 0.2, unit: 1/h, grade: E, source: "no sourced T. reesei mu_max found (hosts.yaml gap entry); fungi grow slower than yeast"}
    temperature_C: {value: 28, unit: C, grade: B, source: "humbird2011 Table 19: 28 C"}
    maint_factor: {value: 1.0, low: 0.5, high: 2.0, grade: D, source: "as for yeast (Tijhuis in both phases; no T. reesei production-phase m_s found)"}
    m_s_prod_g_g_h: {value: null, note: "no evidence: the production phase uses Tijhuis x maint_factor"}
    po_ratio: {value: 1.0, unit: mol ATP/mol O, grade: B,
      source: "Castillo et al. 2016 Biotechnol Biofuels 9:252: 'the P/O ratio was set to 1', a metabolic-model assumption (hosts.yaml treesei_po_ratio_castillo2016); no measured value"}
    kla_factor: {value: 0.5, low: 0.3, high: 0.8, grade: D,
      source: "viscous mycelial broth lowers kLa vs water-like correlations (humbird2011 used a fungal-specific correlation); evidence file"}
    cell_removal: {value: filter_press}

energetics:                   # energetic ceiling on the product-reaction yield (product.energetic_ceiling)
  atp_per_peptide_bond: {value: 4, unit: ATP/peptide bond, grade: A,
    source: "Martin et al. 2025 BBA Bioenerg 10.1016/j.bbabio.2025.149564: 'The cost assumed for protein synthesis at the ribosome is uncontested, 4 ATP per peptide bond' (hosts.yaml atp_per_peptide_bond)"}
  atp_aa_synthesis_per_residue: {value: 0.29, low: 0.0, high: 1.2, unit: ATP/amino acid, grade: A,
    source: "Stouthamer 1973 as recomputed by Martin et al. 2025 (PMC7617979, section 1.2): synthesis of amino acids from glucose and NH4+ adds '1.4 mmol ATP for amino acid synthesis from glucose' per 4.78 mmol of amino acids, 'or average 0.28 ATP per amino acid' weighted by E. coli composition (0.29 = 1.4/4.78). high = the unweighted average over amino acids, 1.2 (same source, Table 2); low = 0 (the common amino acids yield net ATP). Membrane transport (~5 mmol ATP/g cells, Stouthamer) and secretion costs are not counted, so the ceiling stays an upper bound"}
  sulfur_atp_per_S: {value: 3, unit: ATP/S atom, grade: B,
    source: "textbook sulfate assimilation: ATP sulfurylase (ATP -> AMP + PPi, 2 ATP-equivalents) + APS kinase (1 ATP). Not re-read for this project. The 8 electrons of sulfate -> sulfide are charged separately at the host's P/O (4 NADH-equivalents), sulfur_electrons_per_S"}
  sulfur_electrons_per_S: {value: 8, unit: e-/S atom, grade: A, source: "oxidation state +6 (sulfate) to -2 (cysteine/methionine sulfur)"}
  substrate_atp_per_glucose: {value: 4, unit: ATP/glucose, grade: A,
    source: "textbook stoichiometry: 2 ATP in glycolysis + 2 GTP/ATP from succinyl-CoA in the TCA cycle per glucose. Oxidative phosphorylation adds P/O x 12 (24 electrons = 12 O atoms = 6 O2 per glucose), so 4 + 12 x 1.48 = 21.8 ATP per glucose for K. phaffii. Not re-read for this project"}

fermenter:
  volume_m3: {value: 200, low: 100, high: 500, unit: m3, grade: B,
    source: "engineering.yaml: industrial aerobic vessels 200-1,000 m3 (Humbird, B), lysine 500 m3 (B), baker's yeast 200 m3 (B); PF designs 136 m3 (Intelligen, B), 150 m3 (Liberation Labs, C), 80-120 m3 culture volume (GFI Europe, C); Humbird STRFERM quotes to 196 m3 (larger sizes extrapolate with capital.fermenter_exponent_above_table)"}
  h_to_d: {value: 2.0, grade: B, source: "Humbird Equip Table10 STRFERM 200,000: 196.5 m3, D 5 m"}
  fill_max: {value: 0.8, grade: B, source: "Humbird Fig1.3!C8; NREL 2011 80%"}
  min_initial_fill: {value: 0.30, low: 0.30, high: 0.50, grade: B,
    source: "lowest start fill in a published design: Intelligen OVA starts the growth phase at 41,523 L in a 136 m3 vessel = 30.5% (p.6); NREL 2011 starts at 50% (p.37, high); Impossible US 9,938,327: 40% of the maximum working volume (= 32% of vessel). No design text states a physical minimum (impeller submergence). A batch that must start below this fill is infeasible"}
  pv_max_W_m3: {value: 5000, low: 2500, high: 5000, unit: W/m3, grade: B,
    source: "Humbird 2021 p.5 'an agitation rate up to ~5,000 W/m3' design limit in high-density fermentation (B); low = NREL 300 m3 T. reesei maximum 600 kW on 240 m3 of liquid = 2,500 W/m3 (B, derived)"}
  us_max_m_s: {value: 0.10, low: 0.05, high: 0.23, unit: m/s, grade: D,
    source: "judgment: no design text states a superficial-velocity limit. Humbird's own 200 m3 aeration model at OUR 150 runs 0.050 m/s at the top (Fig1.3 row 197, B); NREL averages 0.033 m/s (B). high = Humbird 2021 p.5 'sparge rate up to ~2 vvm' in a 200 m3 vessel (8 m liquid height, top at 1.33 bar, 30 C) = 0.23 m/s (derived); Intelligen runs 1.6 vvm (B)"}
  otr_cap_mol_m3_h: {value: 200, low: 150, high: 250, unit: mol/m3 cell-free liquid/h, grade: B,
    source: "Humbird 2021: 'an OTR approaching 200 mol O2/m3-h is common in an air-sparged STR fermentor' (text p.28), on his basis OUR = qO2 / cell-free liquid volume (Eq. 4.2, p.49); low = 'Bubble columns have a practical OTR limit of 150 mol O2/m3-h' (A.1, p.91); high = physical-limit scenario (head pressure, D). Per m3 of broth this is 129 at 107 g/L cells, 147 at 80 and 100 at 150 (review HM-3/BE-7: an industrial designer would use 100-120 per m3 of broth with air at ~100 g/L cells)",
    v2_note: "v2 used 150 per m3 of broth (engineering.yaml: Humbird A.1!C93 design cap 150, which is his bubble-column value; '200 mol O2/m3-h is about as high as it gets', p.10; >120 needed by new processes, Takors, A; 100 industrial experience, C)"}
  otr_cap_basis: {value: cell_free_liquid, note: "cell_free_liquid (Humbird's basis, Eq. 4.2; base since the Phase F review) | broth (the cap applied per m3 of broth, the v2 base with 150)"}
  heat_per_o2_kJ: {value: 460, low: 430, high: 500, unit: kJ/mol O2, grade: A,
    source: "Roels 1983 via Almeida Benalcazar et al. 2025 (engineering.yaml heat_per_o2_roels_design_value); calorimetry 455 +/- 15, range 430-480 (Maskow et al. 2010, engineering.yaml oxycaloric_equivalent); Cooney/Shuler-Kargi 500 (high). Used only in the OTR_max heat check; the batch heat comes from formation enthalpies (~480-510)"}
  heat_removal_max_kW_m3: {value: 25, low: 15, high: 40, unit: kW/m3, grade: D,
    source: "no production-scale ceiling is published. Evidence: 'several million kcal' per hour from 200-300 m3 SCP yeast fermenters = ~8-30 kW/m3 (US 3,986,934, B, derived); internal coils alone ~17 kW/m3 in a 600 m3 column (Almeida Benalcazar 2025, derived with its U 1.4 kW/m2/K), so external exchangers are needed; 42 kW/m3 claimed at pilot scale with tube baffles (US 4,670,397, B). 25 = 1.2 x the OTR-150 load (19.2 metabolic + ~1.2 agitation)"}
  turnaround_h: {value: 12, low: 8, high: 48, unit: h, grade: B,
    source: "intelligen_ovalbumin2025 (5 fermenters, 24 h cycle, 108 h culture -> ~12 h); Humbird A.1 8 h; NREL 48 h"}
  feed_glucose_g_L: {value: 500, low: 500, high: 600, unit: g glucose/L feed, grade: B,
    source: "intelligen_ovalbumin2025 p.6: 500 g/L glucose solution (about 42 wt%; not '50 wt%', review FS-1/BE-2/HM-1). high = Shemesh 2024 K. phaffii fed-batches: 'Dextrose or glycerol as a carbon source was fed from a 60% (w/v) sterile solution' (600 g/L, A). Concentrated feeds are common in industry (Aro 2023: '55 % glucose'; Nielsen 2025 DoE up to 52 w/w%), and the titer ceiling depends on this choice (report Table 7). Heyland 2010 fed 730 g/L (73% w/v) to a 2.6 L lab fermenter; not used as the high, which already comes from lab fed-batches (Shemesh 2024), while no production-scale design on file feeds more than 500 g/L. A 730 g/L feed would raise the physical-limit ceiling somewhat further (not computed)"}
  nh3_feed_g_L: {value: 268, unit: g NH3/L feed, grade: B,
    source: "intelligen_ovalbumin2025 p.6: 'aqueous ammonia (30% w/w)' at 0.895 kg/L (interpolated between 0.91 at 25% and 0.88 at 35% w/w: GESTIS via Wikipedia 'Ammonia solution') = 268 g NH3/L (review BE-2: v2 counted it at 1 kg/L)"}
  seed_ratio: {value: 0.1, grade: B, source: "NREL 2011 p.39: seed vessels 10% of the next; Intelligen 5% inoculum"}
  seed_time_h: {value: 24, low: 15, high: 36, unit: h, grade: B, source: "intelligen 15 h per seed step; NREL 2-day seed cycle incl. cleaning"}
  seed_final_X_g_L: {value: 17.6, grade: B, source: "Intelligen lactoferrin design (Feb 2026 report, flowsheet of case a): seed broth leaves the first two seed fermenters at 17.36 and 17.77 g/L biomass (15-16 h fed-batch steps, 5% transfers); the ovalbumin report (the base process) does not state it. v2.1 used 60 g/L (D, a guess)"}
  DO_top_frac: {value: 0.1258, unit: fraction of air saturation at the vessel top, grade: B,
    source: "Humbird 2021 A.1!C92 (the dissolved-O2 setpoint of his aeration method). Humbird, Davis & McMillan 2017 p.10: in practice fed-batch aeration and agitation hold DO near zero, where transfer is most efficient; their own simulations could not set DO, and imply about three times this model's aeration energy per kg O2. Review H1 reproduced their 200 m3 stirred-tank curve with this model's equations only by holding DO near 0.5 together with their geometry, 1 atm headspace, no kLa temperature term and a 72%-efficient compressor with line losses (a reconstruction, not a published value); the base sensitivity at 0.5 alone raises aeration energy by about half"}
  kla_temperature_factor: {value: 1.025, low: 1.0, high: 1.025, unit: multiplier per C above 20 C, grade: B,
    source: "Humbird 2021 Fig1.3!C11:F11: van 't Riet kLa x 1.025^(T-20). low = Humbird, Davis & McMillan 2017 Eq. 2, the same correlation (0.002, 0.7, 0.2) with no temperature term (review H1)"}
  compressor_formula: {value: adiabatic, note: "adiabatic: P = (D/3600) R T_in (r^a - 1) / (a eta), a = (k-1)/k = 0.286, r = p_btm,max / 1 atm (the textbook form; review H1) | humbird_a1: A.1!BD as written, which puts k = 1.4 where a belongs (1.6x the power at r = 2.1)"}
  compressor_efficiency: {value: 0.8, grade: B, source: "Humbird 2021 A.1!BD: the compressor power is divided by 0.8"}

media:                        # kg per kg of dry cells made, or per m3 of broth
  salts_kg_per_m3: {value: 22.3, low: 14.7, high: 38.0, unit: kg/m3 final broth, grade: B,
    source: "derived from intelligen_ovalbumin2025 Table 3: 'Basal Salts' 816,341 kg/yr over 342 batches x 107 m3 final broth = 22.3 kg/m3 (audit R6-m1). low = Table 1 basal medium 38 g/L in the 41.5 m3 initial volume per 107 m3 final (14.7); high = Table 1 applied to the final broth (38, the v1 value)"}
  salts_price_usd_kg: {value: 0.20, low: 0.15, high: 0.40, unit: $/kg, grade: B, source: "intelligen_ovalbumin2025 Table 3 'Basal Salts' $0.200/kg"}
  h3po4_kg_per_kg_cells: {value: 0.047, grade: B, source: "intelligen Eq.(1): 1.87 H3PO4 per 40 cells"}
  h3po4_price_usd_kg: {value: 0.85, grade: B, source: "intelligen Table 3: H3PO4 (85%) $0.850/kg"}
  antifoam_kg_per_m3: {value: 0.2, low: 0.02, high: 1.0, unit: kg/m3, grade: B,
    source: "Behm 2022 Table 2: antifoam 0.2 g/L (T. reesei BLG); US 5,260,202 (Delta Biotechnology): 'Typical total usage rates ... 0.02-0.2 g per liter' in sensor-controlled yeast fed-batch (low); high = NREL 2011 corn oil 0.1% v/v, ~1.0 kg/m3 (P-420 13.4 kg/h over ~12.9 m3/h broth, derived)"}
  antifoam_price_usd_kg: {value: 1.12, low: 0.5, high: 2.0, grade: C,
    source: "prices.yaml: Voutilainen 2021 design value EUR 1,000/t x 1.12 (no market price found); range is a guess"}
  methanol_kg_per_kg_product: {value: 0.0, note: "methanol-free base; Intelligen uses 0.28 kg/kg (Table 3: 280 t per 1,000 t). Cost only: its O2 and heat are not added to the stoichiometry"}
  methanol_price_usd_kg: {value: 0.91, grade: B, source: "intelligen_ovalbumin2025 Table 3: $0.910/kg"}

dsp:
  # a. cell removal (two-stage disk-stack centrifugation with re-dilution; plant.py block 2a)
  dilution_to_g_L_cells: {value: 45, grade: B, source: "intelligen p.7: broth diluted to 45 g/L biomass before centrifugation; the first underflow is re-diluted to 45 g/L"}
  centrifuge_stages: {value: 2, grade: B, source: "intelligen p.7"}
  paste_extracellular_frac: {value: 0.5, low: 0.4, high: 0.6, grade: B,
    source: "Petrides 2015 s.11.3.1 p.11-11: 'the centrifuge paste contains 40 to 60% v/v extracellular liquid' (dsp.yaml centrifuge_paste_liquid_fraction). Wet cells taken as 30% dry matter (Humbird A.1!C67)"}
  recovery_cell_removal_override: {value: null, note: "calibration anchors only: fixes the cell-removal recovery instead of the paste model"}
  centrifuge_kWh_m3: {value: 1.35, unit: kWh/m3 feed, grade: B, source: "Humbird SI Equip!AB40 'Power demand 1.35 kWh/m3' (dsp.yaml); Westfalia HSB400 ~1.4 (Milledge & Heaven 2011, C)"}
  # b. microfiltration polish
  mf_flux_LMH: {value: 20, low: 10, high: 50, unit: L/m2/h, grade: D,
    source: "no primary-clarification MF flux on file for yeast broth: EVERY US2025/0134130's 10 +/- 2 LMH is a final bioburden filtration (audit R6-M1, low); microalgae MF 20-100 (Slegers, D)"}
  mf_recovery: {value: 0.975, grade: B,
    source: "Behm 2022 (T. reesei BLG design): 'microfiltration assuming 100% fungus rejection and 97.5% permeate recovery' (dsp.yaml mf_permeate_recovery_fungal_behm)"}
  # c. ultrafiltration and diafiltration
  uf_flux_LMH: {value: 30, low: 20, high: 50, unit: L/m2/h, grade: B, source: "intelligen p.8: 30 L/m2/h concentration flux; Petrides 20-50"}
  uf_rejection: {value: 0.995, grade: B, source: "intelligen p.8: rejection 0.995 for rOvalbumin"}
  diafiltration_conc_g_L: {value: 50, grade: B, source: "EVERY US2025/0134130: diafiltration of rOVA at 50 g/L (dsp.yaml); the protein is diafiltered at this concentration, then concentrated further"}
