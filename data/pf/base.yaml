# pf-tea v1 base case: every model parameter, with value/low/high, unit, evidence grade and source.
# Grades (docs/SCOPE.md): A measured/official data; B published design basis (NREL, Intelligen,
# Humbird) or patent example; C company claim or survey; D analogy; E guess (listed in
# docs/VALIDATION.md). Money is 2025 US$ unless a `year` is given. Scenario files in data/pf/
# override the `strain` and `plant` blocks; everything else is shared.

plant:
  product: {value: blg, note: "blg | ova"}
  spec: {value: concentrate, note: "concentrate (GRN 1056-type, UF/DF + dry) | isolate (adds precipitation)"}
  annual_target_protein_t: {value: 10000, low: 1000, high: 100000, unit: t/yr, grade: C,
    source: "gfi2025costs Table 2: private-sector volumes 2,500-25,000+ t/yr; SCOPE base"}
  operating_days: {value: 330, low: 320, high: 350, unit: d/yr, grade: B,
    source: "NREL 2011 uses 8,410 h/yr (96%); Humbird A.1 350 d; Intelligen ~342 batches x 24 h; 330 d allows for campaigns and cleaning"}
  location: {value: us_midwest, note: "us_midwest | eu_nw"}

strain:                      # base = 'industry-benchmark' K. phaffii process (overridden by scenarios)
  host: {value: kphaffii}
  titer_g_L: {value: 30, low: 5, high: 60, unit: g/L, grade: B,
    source: "intelligen_ovalbumin2025 design basis 30 g/L; Every2024-HY ovomucoid 30.19 g/L (patent Ex. 9); gfi2025costs public avg 24, private avg 42"}
  t_prod_h: {value: 72, low: 48, high: 120, unit: h, grade: B,
    source: "intelligen_ovalbumin2025 p.6: expression phase 72 h; NREL 2011: 96 h production"}
  X_prod_g_L: {value: 80, low: 40, high: 150, unit: g DCW/L, grade: B,
    source: "intelligen_ovalbumin2025 p.7: 92 g/L DCW at harvest; K. phaffii glucose fed-batch 93-169 g/L (Shemesh 2024, A); patents 100-200 (Every2024-HY, B). data/evidence/hosts.yaml"}
  X_max_g_L: {value: 150, low: 100, high: 200, unit: g DCW/L, grade: A,
    source: "K. phaffii glucose fed-batch 93-169 g/L (Shemesh 2024); typical 150; patents up to 200 (hosts.yaml). Growth stops here"}
  mu_prod_per_h: {value: 0.01, low: 0.0, high: 0.02, unit: 1/h, grade: D,
    source: "K. phaffii production-phase growth rates (evidence: data/evidence/hosts.yaml); Intelligen expression phase makes 8 g cells per 28 g product"}
  Y_ps_g_g: {value: 0.28, low: 0.20, high: 0.45, unit: g protein/g glucose, grade: B,
    source: "intelligen_ovalbumin2025 Eq.(2): 100 glucose -> 28 rOVA (+8 cells, 4 HCP); NREL 2011 cellulase: 90% of carbon via protein reaction, 0.24 g/g overall"}
  X0_g_L: {value: 5, low: 2, high: 15, unit: g DCW/L, grade: D,
    source: "inoculum ~5% v/v from seed at ~100 g/L (Intelligen: 5% inoculum, 3 seed stages); Humbird A.1 starts at 15 g/L"}

hosts:
  kphaffii:
    biomass_formula: {value: {C: 1, H: 1.665, O: 0.602, N: 0.134}, grade: A,
      source: "Carnicer et al. 2009 Microb Cell Fact 8:65, Table 4: Fab-producing K. phaffii CH1.665N0.134O0.602S0.0039 (evidence hosts.yaml; re-check table cell)"}
    mu_max_per_h: {value: 0.20, low: 0.15, high: 0.25, unit: 1/h, grade: A,
      source: "hosts.yaml: mu_max ~0.2 1/h on sugar vs 0.11-0.12 on methanol"}
    temperature_C: {value: 30, unit: C, grade: B, source: "intelligen_ovalbumin2025 p.6: 30 C"}
    maint_factor: {value: 1.0, low: 0.2, high: 1.7, grade: A,
      source: "multiplier on Tijhuis 1993 maintenance (= 0.0176 g/g/h, Humbird A.1 method); measured K. phaffii m_s 0.0023-0.029 g/g/h (Nieto-Taype 2020, Rebnegger 2016, Maurer; hosts.yaml)"}
    kla_factor: {value: 1.0, grade: B, source: "yeast broth treated as non-coalescing water-like (Humbird Fig1.3)"}
    cell_removal: {value: centrifuge}
  treesei:
    biomass_formula: {value: {C: 1, H: 1.645, O: 0.445, N: 0.205}, grade: B,
      source: "humbird2011 p.38: T. reesei cell mass CH1.645O0.445N0.205S0.005"}
    mu_max_per_h: {value: 0.1, low: 0.05, high: 0.2, unit: 1/h, grade: E, source: "no sourced T. reesei mu_max found (hosts.yaml gap entry); fungi grow slower than yeast"}
    temperature_C: {value: 28, unit: C, grade: B, source: "humbird2011 Table 19: 28 C"}
    maint_factor: {value: 1.0, low: 0.5, high: 2.0, grade: D, source: "as for yeast"}
    kla_factor: {value: 0.5, low: 0.3, high: 0.8, grade: D,
      source: "viscous mycelial broth lowers kLa vs water-like correlations (humbird2011 used a fungal-specific correlation); evidence file"}
    cell_removal: {value: filter_press}

fermenter:
  volume_m3: {value: 200, low: 100, high: 500, unit: m3, grade: B,
    source: "engineering.yaml: industrial aerobic vessels 200-1,000 m3 (Humbird, B), lysine 500 m3 (B), baker's yeast 200 m3 (B); PF designs 136 m3 (Intelligen, B), 150 m3 (Liberation Labs, C), 80-120 m3 culture volume (GFI Europe, C); Humbird STRFERM quotes to 196 m3 (larger sizes extrapolate the cost curve)"}
  h_to_d: {value: 2.0, grade: B, source: "Humbird Equip Table10 STRFERM 200,000: 196.5 m3, D 5 m"}
  fill_max: {value: 0.8, grade: B, source: "Humbird Fig1.3!C8; NREL 2011 80%"}
  pv_max_W_m3: {value: 5000, low: 2000, high: 5000, unit: W/m3, grade: B,
    source: "engineering.yaml: Humbird 2021 p.5 'agitation rate up to ~5,000 W/m3' design limit in high-density fermentation (B); NREL 300 m3 T. reesei max 600 kW (~2,000 W/m3)"}
  us_max_m_s: {value: 0.10, low: 0.05, high: 0.15, unit: m/s, grade: D, source: "flooding/foaming limit (evidence file)"}
  otr_cap_mol_m3_h: {value: 150, low: 100, high: 200, unit: mol/m3/h, grade: B,
    source: "engineering.yaml: Humbird A.1!C93 design cap 150 (B); '200 mol O2/m3-h is about as high as it gets' (Humbird 2021 p.10, B); >120 needed by new processes (Takors, A); 100 industrial experience (C)"}
  heat_removal_max_kW_m3: {value: 25, low: 15, high: 40, unit: kW/m3, grade: D,
    source: "engineering.yaml: no source gives a production-scale ceiling. At OTR 150 the load is 19.2 kW/m3 metabolic (460 kJ/mol O2, A) + ~1.2 kW/m3 agitation (Humbird 200 m3 model, B); P. pastoris on methanol released 19.2 W/L at lab scale (A); jackets are insufficient above ~114 m3, so external chilled-water exchangers are assumed (C; U ~1.4 kW/m2/K, B). 25 = 1.2 x the OTR-150 load"}
  turnaround_h: {value: 12, low: 8, high: 48, unit: h, grade: B,
    source: "intelligen_ovalbumin2025 (5 fermenters, 24 h cycle, 108 h culture -> ~12 h); Humbird A.1 8 h; NREL 48 h"}
  feed_glucose_wt: {value: 0.5, grade: B, source: "intelligen_ovalbumin2025 p.6: 500 g/L glucose solution"}
  seed_ratio: {value: 0.1, grade: B, source: "NREL 2011 p.39: seed vessels 10% of the next; Intelligen 5% inoculum"}
  seed_time_h: {value: 24, low: 15, high: 36, unit: h, grade: B, source: "intelligen 15 h per seed step; NREL 2-day seed cycle incl. cleaning"}
  seed_final_X_g_L: {value: 60, grade: D, source: "seed grown to high density before transfer"}

media:                        # kg per kg of dry cells made, or per m3 of broth
  salts_kg_per_m3: {value: 38.0, low: 20, high: 50, unit: kg/m3 final broth, grade: B,
    source: "intelligen_ovalbumin2025 Table 1 basal medium: CaSO4 0.93 + MgSO4.7H2O 14.9 + KOH 4.13 + K2SO4 18.2 g/L (+H3PO4) = 38 g/L"}
  salts_price_usd_kg: {value: 0.20, low: 0.15, high: 0.40, unit: $/kg, grade: B, source: "intelligen_ovalbumin2025 Table 3 'Basal Salts' $0.200/kg"}
  h3po4_kg_per_kg_cells: {value: 0.047, grade: B, source: "intelligen Eq.(1): 1.87 H3PO4 per 40 cells"}
  h3po4_price_usd_kg: {value: 0.85, grade: B, source: "intelligen Table 3: H3PO4 (85%) $0.850/kg"}
  antifoam_kg_per_m3: {value: 0.5, low: 0.1, high: 1.0, unit: kg/m3, grade: E, source: "no dose found; NREL corn oil 0.1% v/v (~0.9 kg/m3) as the high end; guess"}
  antifoam_price_usd_kg: {value: 1.12, low: 0.5, high: 2.0, grade: C,
    source: "prices.yaml: Voutilainen 2021 design value EUR 1,000/t x 1.12 (no market price found); range is a guess"}
  methanol_kg_per_kg_product: {value: 0.0, note: "methanol-free base; Intelligen uses 0.28 kg/kg (Table 3: 280 t per 1,000 t). Cost only: its O2 and heat are not added to the stoichiometry"}
  methanol_price_usd_kg: {value: 0.91, grade: B, source: "intelligen_ovalbumin2025 Table 3: $0.910/kg"}

dsp:
  recovery_cell_removal: {value: 0.97, low: 0.93, high: 0.99, grade: B,
    source: "intelligen_ovalbumin2025: two disk-stack centrifuges + MF with retentate recycle; overall train 0.857 incl. 0.884 purification (A1_SOLUTION 2.1) -> clarification ~0.97"}
  dilution_to_g_L_cells: {value: 45, grade: B, source: "intelligen p.7: broth diluted to 45 g/L biomass before centrifugation"}
  centrifuge_stages: {value: 2, grade: B, source: "intelligen p.7"}
  centrifuge_hours_per_batch: {value: 22, grade: B, source: "intelligen p.8: centrifugation 22 h (semi-continuous)"}
  mf_flux_LMH: {value: 10, low: 8, high: 50, unit: L/m2/h, grade: B, source: "dsp.yaml: EVERY US2025/0134130 MF polishing 'Average flux (expected) 10 +/- 2 LMH' (B); microalgae MF 20-100 (Slegers, D)"}
  mf_recovery: {value: 0.98, grade: D, source: "retentate recycled (intelligen p.7)"}
  uf_flux_LMH: {value: 30, low: 5, high: 50, unit: L/m2/h, grade: B, source: "intelligen p.8: 30 L/m2/h; Petrides 20-50; EVERY patent DF at 50 g/L '5 +/- 2 LMH' (dsp.yaml)"}
  uf_rejection: {value: 0.995, grade: B, source: "intelligen p.8: rejection 0.995 for rOvalbumin"}
  uf_end_g_L: {value: 150, low: 50, high: 250, unit: g/L, grade: D,
    source: "BLG: whey UF routinely concentrates to high solids; OVA capped at 50 g/L practical solubility (intelligen p.8)"}
  diafiltration_volumes: {value: 3, low: 2, high: 6, grade: D, source: "salt and sugar washout to meet the protein spec (evidence file)"}
  membrane_price_usd_m2: {value: 150, low: 50, high: 200, unit: $/m2, grade: B, source: "dsp.yaml: Petrides 2015, industrial-biotech membranes 'under $200/m2'"}
  membrane_life_y: {value: 0.5, low: 0.25, high: 2, unit: yr, grade: B, source: "dsp.yaml: Petrides 2015, industrial membranes last >2000 operating hours (lower bound)"}
  membrane_skid_usd_m2: {value: 1200, low: 500, high: 3000, unit: $/m2 (2018$), grade: E, source: "PENDING evidence (dsp.yaml)"}
  membrane_kWh_m3_permeate: {value: 5.0, low: 1.0, high: 13.0, unit: kWh/m3, grade: D, source: "dsp.yaml: UF ~13 kWh/m3 permeate (A, upper end); typical crossflow UF lower"}
  precip_recovery: {value: 0.891, grade: B, source: "intelligen p.8: 90% precipitated x 99% retained by basket centrifuges"}
  ammonium_sulfate_kg_per_m3: {value: 350, grade: B, source: "intelligen p.8: 350 g/L"}
  ammonium_sulfate_usd_kg: {value: 0.18, low: 0.18, high: 0.33, grade: B, source: "intelligen Table 3: $0.180/kg; EU import UV 2025 EUR 0.19 (A); US import UV $0.33 (A, high)"}
  ammonium_sulfate_recycled_frac: {value: 0.0, note: "Intelligen sells it on as fertiliser; base assumes no recovery credit"}
  dryer_inlet_solids: {value: 0.0, note: "dryer is fed the UF retentate as is (no evaporator); dairy WPC80 feeds ~36% solids after evaporation (Tetra Pak, dsp.yaml), EVERY ~5%"}
  dryer_MJ_per_kg_water: {value: 4.87, low: 3.4, high: 6.0, unit: MJ/kg water, grade: A, source: "dsp.yaml: Baker & McKenzie survey average 4.87 GJ/t water evaporated; milk powder 3.4 (3-stage) to 4.9 (1-stage), Ramirez et al."}
  dryer_recovery: {value: 0.98, grade: D, source: "cyclone + bag filter losses (evidence file)"}
  concentrate_target_frac_dry: {value: 0.85, low: 0.70, high: 0.92, grade: D,
    source: "target protein share of dry powder after UF/DF of a secreted protein; GRN 1056 minimum is 0.56 (0.70 x 0.80)"}
  isolate_target_frac_dry: {value: 0.97, grade: B, source: "intelligen p.9: 99% purity (dry basis)"}
  powder_moisture: {value: 0.05, grade: B, source: "intelligen p.9: 5% moisture; GRN 1056 max 7%"}
  wet_cells_solids: {value: 0.25, grade: D, source: "centrifuge sludge ~25% dry solids"}

utilities:                    # 2025$ unless noted; US Midwest base, EU variant
  electricity_usd_kWh: {us_midwest: 0.0862, eu_nw: 0.1456, low: 0.072, high: 0.1014, grade: A,
    source: "prices.yaml: EIA industrial average 2025 US 8.62 c/kWh (Iowa 7.20 = low, Illinois 10.14 = high); EU = Eurostat nrg_pc_205 NL band IF (70-150 GWh/yr, the size of a 10 kt plant) 2025 mean EUR 0.1289/kWh excl. VAT x ECB 1.13"}
  natural_gas_usd_GJ: {us_midwest: 4.78, eu_nw: 16.13, low: 3.34, high: 6.38, grade: A,
    source: "prices.yaml: EIA US industrial 2025 $5.23/Mcf / 1.036 MMBtu/Mcf (low = Henry Hub $3.52/MMBtu, high = Illinois $7.05/Mcf); EU = Eurostat nrg_pc_203 EU27 band I4 (0.1-1 PJ/yr) 2025 mean EUR 14.27/GJ GCV x 1.13"}
  glucose_usd_kg: {us_midwest: 0.40, eu_nw: 0.65, low: 0.26, high: 0.61, grade: B,
