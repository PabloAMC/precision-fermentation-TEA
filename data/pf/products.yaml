# Product base cases: what each product changes in data/pf/base.yaml before any scenario applies.
# base.yaml is written around Intelligen's ovalbumin design (30 g/L in 72 h, UF/DF concentrate,
# 10 kt/yr), which serves BLG and OVA unchanged. Lactoferrin's base case is its own design report
# (Intelligen's lactoferrin design) on its own purification route, at a plant size that fits its
# market. Albumin (cell-culture media) is on the cation-exchange route with its own column data and a
# 1 kt/yr plant. Scenario files (academic, industry, physical_limit) are applied on top of these blocks
# (scenarios.scenario_params). Leaves replace the base.yaml leaf's value, range and source; a null
# low/high removes the range (no sampling or tornado bar).
blg: {}
ova: {}
ovd:                        # ovomucoid: base.yaml's design point as BLG and OVA; its own purity from the cleared product
  dsp.concentrate_target_frac_dry:
    value: 0.76
    low: 0.72
    high: 0.81
    grade: A
    source: "FDA GRN 967 amendment Table 1 (EVERY): '% OVD in powder determined by HPLC 66 68 74' at 8.4-9.0% moisture = 0.72-0.81 of dry matter (derived); host protein 7-12% (ovomucoid.yaml ovd_spec_grn967_batches). The cleared route is UF/DF only, 'centrifugation followed by micro-filtration ... pH adjustments and ultra-filtration, before a drying step' (GRN 967 Sect. 2.4.3)"
cas:                        # beta-casein: base.yaml's design point (titer, time, 10 kt/yr) as for BLG; its own route
  plant.spec: {value: acid, note: "isoelectric precipitation of the MF permeate, decanter washes, sodium caseinate, spray dryer (the dairy acid-casein line; Formo GRN 1312 precipitates at pH 4). UF/DF only (Eden Brew, FSANZ A1342) is the variant scenarios/casein.yaml cas_ufdf_edenbrew"}
lf:
  plant.spec: {value: cex, note: "cation exchange between MF and UF/DF (the dairy route and every commercial PF route: TurtleTree GRN 1219, All G GRN 1284, Helaina; data/evidence/lactoferrin.yaml). UF/DF only (Intelligen case a) is the optimistic route variant (scenarios/lactoferrin.yaml lf_ufdf_only)"}
  plant.annual_target_protein_t:
    value: 250
    low: null
    high: null
    unit: t/yr
    grade: B
    source: "Intelligen's lactoferrin design makes 251 t/yr of 90% powder (David 2026 Table 2; GFI 2025 App. 2: 251.304 t), inside the world bovine-lactoferrin market of >300 t (2021; Mao 2023) to 1,588 t (GFI Europe 2025): the two sources disagree ~5x (lactoferrin.yaml). A 10 kt/yr plant would exceed the market; the report shows one at 10 kt/yr for comparison with BLG and OVA only"
  strain.titer_g_L:
    value: 10
    low: 2.8
    high: 42
    unit: g/L
    grade: B
    source: "Intelligen's lactoferrin design: 'a titre of 10 g/L achieved over a 5-day fermentation period' (David 2026 Sect. 2.1; Feb 2026 report p.4; lactoferrin.yaml lf_intelligen_design_basis). Their design induces with methanol; this methanol-free base (as FDA GRN 1219 and 1284) borrows the titer. low = best public methanol-free secreted LF (Yen 2024, porcine, 2.8 g/L; academic scenario); high = GFI 2025 private-sector average over unspecified proteins (42 g/L; industry scenario, C)"
  strain.t_prod_h:
    value: 83
    low: 48
    high: 120
    unit: h
    grade: B
    source: "Intelligen's 5-day lactoferrin batch (p.4) less the model's 37 h growth phase (audit R10-1); range as base.yaml"
alb:                        # serum albumin for cultivated-meat media: base.yaml's design point (30 g/L, 72 h, glucose); its own route and plant
  plant.spec: {value: cex, note: "cation-exchange capture at pH 4.5 straight from the clarified broth, eluted at pH 5.5, then an anion-exchange polish (dsp.polish_columns), UF/DF and spray drying: the minimal two-column train claimed in US 6,638,740 (Delta/Recombumin; albumin.yaml hsa_delta_cex_capture_conditions, hsa_delta_aex_polish). Pharma trains add affinity and gel filtration for >=99.9%; whether two columns reach the cell-culture grade (>=96%) is a judgment (D); capture only is the optimistic variant scenarios/albumin.yaml alb_capture_only"}
  plant.annual_target_protein_t:
    value: 1000
    low: null
    high: null
    unit: t/yr
    grade: D
    source: "design choice: the size of today's whole human-albumin market (~0.5 to >1 kt/yr, poorly sourced, albumin.yaml plasma_hsa_tonnage_shortage, C) and ~28% of GFI's low 2030 cultivated-meat demand scenario (3.6 kt/yr; 100 kt/yr high, gfi2023_albumin_demand_2030, C). The scale curve runs 0.1-10 kt/yr and the physical limit 100 kt/yr (GFI's high scenario)"
  dsp.polish_columns: {value: 1, grade: D, note: "anion-exchange polish after the capture: the minimal two-column train claimed in US 6,638,740 ('cation exchange chromatography ... and then anion exchange chromatography'), where the capture eluate still holds the 45 kDa fragment, yeast antigens and pigment that US 5,728,553 removes downstream. Whether two columns reach the cell-culture grade is a judgment (D; audit R12-H1); capture only is the optimistic variant scenarios/albumin.yaml alb_capture_only"}
  dsp.cex_dbc_g_L:
    value: 40
    low: 30
    high: 50
    unit: g protein/L resin
    grade: B
    source: "US 5,728,553 Ex. 2 (Delta, rHA on S-Sepharose FF): 'a column loading of 40+/-10 g rHA/L matrix' (an operating load, not a measured dynamic capacity; albumin.yaml hsa_delta_cex_capture_conditions)"
  dsp.cex_cv_per_cycle:
    value: 34
    low: 16
    high: 34
    grade: B
    source: "US 5,728,553 Table 4: equilibration 4 + wash 11.5 + elution 2 + eluate 6.5 + 2 M NaCl strip 3.5 + NaOH 3 + storage 3 + 0.5 = 34 CV per cycle (hsa_delta_cex_step_table, derived). low = EVERY's lactoferrin table (16 CV, base.yaml)"
  dsp.cex_elution_cv: {value: 8.5, grade: B, source: "US 5,728,553 Table 4: elution 2 CV + eluate collection 6.5 CV (hsa_delta_cex_step_table)"}
  dsp.cex_elution_nacl_kg_m3: {value: 13.6, grade: D, source: "elution is a pH step in ~0.1 M acetate, not 1 M NaCl: 'sodium acetate trihydrate 13.6 g/L' at pH 5.5 (US 5,728,553 recipe 2; hsa_delta_cex_step_table). Priced as NaCl (no acetate leaf): about $1/kg albumin at the NaCl price, so a few $/kg at an acetate price; the acetic acid for the pH-4.5 load and the octanoate of the pharma recipe are not costed (audit R12-L3)"}
  dsp.cex_cip_cv: {value: 3, grade: B, source: "US 5,728,553 Table 4: NaOH 3 CV"}
  dsp.cex_cip_naoh_kg_m3: {value: 20.0, grade: B, source: "0.5 M NaOH = 20.0 kg/m3 (US 5,728,553 Table 4 recipe 4; hsa_delta_cex_step_table)"}
  dsp.cex_regen_cv: {value: 3.5, grade: B, source: "US 5,728,553 Table 4: the 2 M NaCl strip after elution, 3.5 CV"}
  dsp.cex_regen_nacl_kg_m3: {value: 117, grade: B, source: "2 M NaCl: 'NaCl 117 g/L' (US 5,728,553 recipe 3)"}
  dsp.cex_regen_etoh_kg_m3: {value: 0.0, grade: B, source: "no ethanol in the rHA cycle: storage is 20 mM NaOH (US 5,728,553 Table 4)"}
  dsp.cex_resin_life_cycles:
    value: 1000
    low: 125
    high: 1000
    unit: cycles
    grade: D
    source: "no albumin-specific lifetime is published: borrowed from industrial whey lactoferrin CEX ('After over a thousand cycles, the column must be replaced', Pires 2025; base.yaml, grade A there), the favourable end for a column fed pigmented yeast broth (audit R12-H2, R13-M2). low = Petrides' biopharma 50-200 cycles (midpoint)"
  dsp.cex_recovery:
    value: 0.56
    low: 0.40
    high: 0.86
    grade: B
    source: "US 6,638,740 (Delta): 'the anticipated recovery of rHA monomer is between 46 and 66%' over the CEX capture (midpoint 0.56; US 5,728,553 Table 4: '>40%', with different assays in and out); every public rHSA train recovers 0.46-0.68 overall (Zhu 2018 58%, Zhu 2021 67.5%, rice 46-56%). low = Table 4's >40%; high = Zhu 2021 Table 1: one capture step (dye affinity, load pH 5.0) recovered 86.25% at 96.4% purity (zhu2021_purification, A; another chemistry, so an analogy for the CEX step)"
  dsp.cex_target_frac_dry:
    value: 0.96
    low: 0.90
    high: 0.99
    grade: C
    source: "cell-culture rHSA specs: InVitria Cellastim S 'Purity >=96.0%'; Healthgen OsrHSA >=99% (albumin.yaml spec_invitria_cellastim_s, spec_healthgen_osrhsa_cell_culture). No food- or media-grade spec exists (media_or_food_grade_albumin_spec). low = 0.90 (judgment, D)"
