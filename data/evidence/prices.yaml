- key: "cepci_2025_vs_2024"
  value: 1.016
  unit: "ratio CEPCI 2025 annual / 2024 annual"
  year: 2025
  grade: "A"
  source: "Jenkins S. 'Inflationary pressures push 2025 CEPCI annual average higher than 2024'. Chemical Engineering, 2 Apr 2026 (free lead paragraph)"
  doi_or_url: "https://www.chemengonline.com/inflationary-pressures-push-2025-cepci-annual-average-higher-than-2024/?printmode=1"
  locator: "lead paragraph (rest paywalled)"
  quote: "Boosted by inflationary pressures, the 2025 annual average value for the Chemical Engineering Plant Cost Index® edged 1.6% higher than the previous year’s annual average, reversing the past two years of decreases."
  read: "html"
  note: "Publisher statement. 'reversing the past two years of decreases' implies CEPCI 2024 < 797.9 (2023). With Jan-Jun 2024 monthly 795.4-800.7, 2024 is plausibly ~790-797.9, so 2025 ~= 1.016 x that = ~803-811 (my inference, grade E for the number). Implied 2018->2025 ~x1.331-1.345; 2007->2025 ~x1.528-1.544. The Manchester '800' for 2024 is an estimate and conflicts with the publisher statement."

