# data/evidence/prices.yaml - Phase B price, utility, labour and cost-index evidence (2026-09-26).
# Format: see data/evidence/README.md. Extra fields used here: `year` (year of `value`), `values` (series map),
# `csv` (companion time series in data/prices/). All web sources accessed 2026-09-26.
# `read: html` covers HTML pages and online tables/JSON APIs read in memory (nothing downloaded).
# Conversions: 1 lb = 0.45359237 kg; 1 short ton = 907.18474 kg; 1 MMBtu = 1.055056 GJ; EUR->USD at ECB annual averages.
# Trade unit values (UN Comtrade, Eurostat Comext) are official statistics but only PROXIES for product prices.


# ---------------- 1. Incumbent product prices ----------------

