  high: 1.34
  unit: "% w/w MC in burger (derived)"
  grade: A
  source: "Penaranda I, et al. Plant-Based Burgers with Reduced Texture Additives: A Comparative Study of Methylcellulose and Sodium Alginate. Foods 14(8):1373 (2025)"
  doi_or_url: 10.3390/foods14081373
  locator: "Section 2 (methylcellulose solution); Table 1 (formulation, g); Conclusions"
  quote: "These results promote using a 3 g/100 g methylcellulose solution as the sole binding agent in soybean burgers to achieve a product with reduced additives."
  read: fulltext
  note: "DERIVED (mine): Table 1 uses 50 g of the 3 g/100 g MC solution (1.5 g MC) in 112 g (no starch, 'M') or 117 g (with starch, 'M+S') of burger = 1.34% or 1.28% MC. Soy-protein burger, lab scale. Local: references/inbox/protein_survey_2026-10-01/PMC12026432.xml."

