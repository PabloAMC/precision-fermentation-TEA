- key: binder_rova_vs_mc_burger_every_us12096784
  value: 5
  unit: "% w/w rOVA powder (92% protein) vs MC 0.7% and natural egg white 25%"
  values: {dose_pct: {mc: 0.7, natural_egg_white: 25, nOVA: 5, rOVA: 5}, cooked_hardness1_g: {mc: 281.73, natural_egg_white: 390.33, nOVA: 617.07, rOVA: 922.0}, cooked_chewiness: {mc: 76.03, natural_egg_white: 178.07, nOVA: 285.5, rOVA: 398.13}}
  grade: B
  source: "Clara Foods Co. (The EVERY Company). US 12,096,784 B2 (2024), Example 45 'Burger Binding'"
  doi_or_url: "https://patents.google.com/patent/US12096784B2/en"
  locator: "Example 45, Tables 70 and 73 (cooked TPA)"
  quote: "Findings for cooked binding: rOVA exhibited significantly higher hardness values than methylcellulose and natural egg white. All the samples were similar to each other in terms of cohesiveness."
  read: fulltext
  note: "The only like-for-like binder test found (n=3, 5 g mini-burgers, extruded soy). Doses are NOT equal: rOVA 5% vs MC 0.7%. rOVA at 5% gave ~3.3x the cooked hardness of MC at 0.7% and more chewiness; MC and natural egg white did not differ significantly (letters 'a'). So 5% rOVA is >= MC 0.7% in binding; the dose of rOVA that just matches MC is not measured (below 5%). 'Natural egg white' at 25% replaces 24.3 points of water (54.8 -> 30.5), so it is LIQUID egg white (my inference; ~10.9% protein, milk_egg.yaml egg_white_protein_fdc_sr_legacy), i.e. ~2.7% egg-white protein vs ~4.6% rOVA protein. Patent claims rOVA 2-15% w/w in meat analogs (binder_rova_meat_analog_claim_every_us12096784). Local: references/text/Every_US12096784_ovalbumin-protein-compositions.txt (l.8035-8200)."

