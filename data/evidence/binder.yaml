# data/evidence/binder.yaml: binders for plant-based meat analogues, for the cost-in-use note (report sec. 'Ovalbumin as a binder')
# (PF ovalbumin / egg-white protein against methylcellulose (MC) and dried egg white), gathered 2026-10-06 by a research pass; spot-checked and moved here the same day.
# Format: data/evidence/README.md (plus `year` and `values` as in prices.yaml). Read by data/pf/scenarios/binder.yaml (by key).
# Local copies: references/text/binder/ (git-ignored) unless a path under references/inbox/ or references/reports/ is named.
# All web sources accessed 2026-10-06. `read: html` = HTML page or JSON API record read via curl (raw text, not a summary).
# Conversions (mine, in notes only): EUR->USD at ECB annual averages (prices.yaml eurusd_annual_average: 2024 1.0824, 2025 1.13).
#
# Already elsewhere, not duplicated here: dried egg white prices (prices.yaml egg_albumin_dried_eu_export_unit_value,
# egg_albumin_dried_us_export_unit_value, egg_white_price_range_gfi2025, egg_white_powder_price_intelligen2025);
# pea/soy protein prices (prices.yaml pea_protein_price_range_gfi2025, soy_protein_price_range_gfi2025);
# egg-white protein content (milk_egg.yaml egg_white_protein_fdc_*).
#
# NOT FOUND: (1) a bulk food-grade MC price quote or index (ChemAnalyst's methyl cellulose page is behind Cloudflare, HTTP 403;
# IMARC prices only 'cellulose ether', mixed); the best proxy is India's tariff line 39123912, the only official line found
# that isolates methylcellulose (US HTS 3912.39.00, EU CN 3912 39 85 and HS 391239 mix MC with HPMC, MHEC, HEC, EC).
# (2) a peer-reviewed head-to-head of egg white (or OVA) vs MC at equal dose in a meat analogue; the only like-for-like
# test found is a patent example (EVERY US12096784 B2, Example 45). (3) any tonnage of egg white used by the
# meat-analogue/vegetarian sector, or by Quorn (only a 2011 'three million fewer eggs a year' reduction). (4) a credible
# bulk potato protein (patatin) price; only a relative claim (2-3x pea protein). (5) Impossible/Beyond MC levels beyond
# '<2% of weight' (the Impossible ground-meat patent US10172380B2 lists MC only qualitatively).


# ---------------- 1. Methylcellulose use level in meat analogues ----------------

- key: binder_mc_use_level_bakhsh2021
  value: 3.0
  low: 1.5
  high: 4.0
  unit: "% w/w of patty formulation"
  grade: A
  source: "Bakhsh A, Lee S-J, Lee E-Y, Sabikun N, Hwang Y-H, Joo S-T. Foods 10(3):560 (2021)"
  doi_or_url: 10.3390/foods10030560
  locator: "Table 1 (formulations); Conclusions"
  quote: "Using beef as a control, it can be concluded that C-TVP with a 3% MC (binding agent) is recommended to prepare acceptable PBMA patties with good physicochemical, textural, and sensory acceptability."
  read: fulltext
  note: "Lab study, soy TVP (C-TVP) and textured isolated soy protein (T-ISP) patties, MC tested at 1.5, 3 and 4% of formulation (Table 1 lists 'Methylcellulose 1.5 3.00 4.00'). Sensory panel preferred 3%; 4% firmer but disliked. Upper end of what industry uses (see binder_mc_commercial_burgers_lt2pct_today2020). Local: references/inbox/protein_survey_2026-10-01/PMC8000783.xml."

- key: binder_mc_use_level_penaranda2025
