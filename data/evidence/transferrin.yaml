    ~1.5 kg of iron (as a soluble ferric salt) per tonne of fully loaded product - chemically
    trivial in cost, but it is an extra unit operation plus a CO2/carbonate requirement, and the
    saturation state is a product spec: InVitria ships Optiferrin "approximately 20-30% iron-
    saturated" (tf_invitria_optiferrin_spec_and_price), and E8 specifies "Holo-transferrin". The
    model should assume a conditioning/loading step after the AEX polish, before final UF/DF.

