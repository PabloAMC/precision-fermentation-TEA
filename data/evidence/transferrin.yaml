    File references/text/transferrin/PMC2926268.txt. This is the Optiferrin platform (ExpressTec).
    DSP numbers: extract flour 1:10 (w/v) in 25 mM Tris-HCl pH 7.5, 0.2 um filter, load DEAE-
    Sepharose FF directly with no buffer exchange, elute with 40 mM NaCl, >95% pure by SDS-PAGE;
    "we purified rhTF with four batches of 100 g seed flour and each batch consistently yielded the
    recovery rate of rhTF to 60% calculated on the basis of protein mass as determined by ELISA".
    Q Sepharose binds too strongly (needs more salt, co-elutes rice protein); Phenyl Sepharose HIC
    reaches only 90% and needs an ammonium sulfate cut. Also the measured pI: "The isoelectric point
    (pI) of rice-derived rhTF was shown to be 6.3, which is same as the pI of yeast-derived
    aglycosylated rhTF but one unit higher than the pI of the native hTF (5.3)" - the sialic-acid
    difference, and the measured anchor for htf_theoretical_pi_and_charge. A 2026 rice-CELL-culture
    route (Plant Biotechnol, PMC13170787) gives 97 mg/L secreted into the medium, IMAC + AEX,
    ">99.5%" pure but "The overall purification yield of rhTF was 8.4%" - interesting biology,
    useless economics.

