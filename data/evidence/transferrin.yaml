# data/evidence/transferrin.yaml: evidence for a COST-IN-USE NOTE on recombinant SEROTRANSFERRIN for cultivated-meat
# (CM) cell-culture media, made by precision fermentation on the model's albumin-like chromatography
# route (research pass 2026-10-06; spot-checked by the main session and moved here the same day; read by
# data/pf/scenarios/transferrin.yaml and data/products/tf.yaml).
# Format: data/evidence/README.md. Grades: A measured/official; B published design basis or patent
# example; C company claim/trade press/survey; D analogy or derived-from-derived; E guess.
# Read as raw text: UniProt REST JSON (downloaded), local files under ~/Developer/pf-tea/references
# (text/, papers/, reports/, inbox/protein_survey_2026-10-01/), the Humbird 2021 SI workbook
# (openpyxl), Europe PMC / NCBI full-text XML, patents.google.com, vendor HTML, SEC EDGAR.
# Saved copies: references/text/transferrin/ (git-ignored, as intended) - filenames in each note.
# Items computed here are "Derived (mine)", quote: null. No key here duplicates data/evidence/*.yaml
# (checked: no existing key contains "transferrin"; lactoferrin.yaml covers LACTOtransferrin only).

# =======================================================================================
# 1. Identity, sequence, mass balance
# =======================================================================================

- key: htf_uniprot_mature_chain
  value: "P02787 chain 20-698 (679 aa)"
  unit: residue range of the mature secreted chain (precursor numbering)
  grade: A
  source: "UniProtKB P02787 (TRFE_HUMAN), Serotransferrin, Homo sapiens; entry version 271, sequence version 5, last annotation update 2026-09-02"
  doi_or_url: https://rest.uniprot.org/uniprotkb/P02787.json
  locator: "features: Signal 1-19; Chain 20-698 'Serotransferrin'; 19 'Disulfide bond'; Glycosylation 432, 491, 630; sequence.molWeight 77064 (698-aa precursor)"
  quote: "{\"type\":\"Chain\",\"description\":\"Serotransferrin\",\"location\":{\"start\":{\"value\":20},\"end\":{\"value\":698}}}"
  read: fulltext
  note: >-
    File references/text/transferrin/P02787.json (+ .fasta). 19-aa signal peptide, no propeptide, so
    the mature chain is 679 aa starting VPDKTVRWCAVS and ending CTFRRP. 38 Cys = 19 disulfides and NO
    free thiol (contrast albumin's Cys34), so the folding burden is higher than HSA's 17 S-S: this is
    the single biggest biological difference for the PF route. 9 Met, 8 Trp. Two canonical N-X-S/T
    sequons in the mature chain (mature Asn413 and Asn611 = precursor 432 and 630), both annotated
    "N-linked (GlcNAc...) (complex) asparagine" with experimental evidence, plus a third "atypical;
    partial" site at precursor 491 and an O-linked Ser at precursor 51 (mature Ser32). UniProt also
    lists 8 Fe(3+) binding sites (4 per lobe: precursor 82, 114, 207, 268 and 411, 445, 536, 604) and
    8 hydrogencarbonate sites: two Fe per molecule, each with a synergistic carbonate.

- key: btf_uniprot_mature_chain
  value: "Q29443 chain 20-704 (685 aa)"
  unit: residue range of the mature chain
  grade: A
  source: "UniProtKB Q29443 (TRFE_BOVIN), Serotransferrin, Bos taurus; entry version 130, sequence version 1, last annotation update 2026-09-02"
  doi_or_url: https://rest.uniprot.org/uniprotkb/Q29443.json
  locator: "features: Signal 1-19; Chain 20-704; 18 'Disulfide bond'; Glycosylation 514; sequence.molWeight 77753"
  quote: "{\"type\":\"Chain\",\"description\":\"Serotransferrin\",\"location\":{\"start\":{\"value\":20},\"end\":{\"value\":704}}}"
  read: fulltext
  note: >-
    File references/text/transferrin/Q29443.json (+ .fasta). 685 aa, N-terminus DPERTVRWCTIS. 36 Cys
    = 18 disulfides, no free Cys. ONE N-X-S/T sequon in the mature chain (mature Asn495 = precursor
    514), annotated by sequence analysis only (ECO:0000255), and the whole bovine entry is
    PE=2/inferred: all 16 Fe/carbonate sites and all 18 disulfides carry ECO:0000255, i.e. they are
    transferred from the human entry, not measured. One fewer disulfide than human is therefore an
    annotation artefact, not established biology (flag for Pablo). Bovine is the species a CM medium
    would match, and it carries half as many glycosylation sites to engineer out.

- key: htf_mature_formula_and_mw
  value: {C: 3306, H: 5096, N: 912, O: 1002, S: 47}
  unit: atoms per molecule of the mature chain (19 disulfides, apo, no glycan)
  grade: A
  source: "Derived (mine) from UniProtKB P02787 mature chain 20-698 (679 aa, 19 disulfide features)"
  doi_or_url: https://rest.uniprot.org/uniprotkb/P02787.json
  locator: "computed by references/text/transferrin/tf_calc.py (output tf_calc_output.txt)"
  quote: null
  read: fulltext
  note: >-
    Derived (mine) - check the arithmetic. Residue sums + H2O, minus 2H per disulfide (19): average
    MW 75,156 Da for the aglycosylated apo protein; 52.83 wt% C, 17.00 wt% N, 2.01 wt% S;
    protein/N = 5.883 (N x 6.25 overstates by 6.2%). Cross-check: the same method gives 77,063.1 Da
    for the 698-aa precursor vs UniProt molWeight 77,064 (rounding) - the method is right. Bovine
    (Q29443, 18 S-S): C3311 H5124 N918 O1033 S46, MW 75,792.6, 52.47 wt% C, 16.96 wt% N, 1.95 wt% S.
    Native plasma transferrin is ~79-80 kDa because of the two complex N-glycans (~2 kDa each plus
    sialic acid); the yeast product that industry actually sells is the non-glycosylated ~75 kDa
    form, so 75.2 kDa is the right mass for the model. Sulfate demand 2.0 wt% S, essentially the
    same as albumin's 1.98%, so the sulfate-assimilation term can be reused.

- key: htf_theoretical_pi_and_charge
  value: 7.22
  unit: theoretical pI of mature aglycosylated human transferrin (EMBOSS pKa set, no free Cys); bovine 6.98
  grade: A
  source: "Derived (mine) from UniProtKB P02787/Q29443 mature sequences, same pKa set as hsa_theoretical_pi_and_charge in albumin.yaml"
  doi_or_url: https://rest.uniprot.org/uniprotkb/P02787.json
  locator: "computed by references/text/transferrin/tf_calc.py (human D45 E42 K58 R26 H19 Y26)"
  quote: null
  read: fulltext
  note: >-
    Derived (mine) - check. Net charge of mature human transferrin ~+37 at pH 4.5, +17 at pH 5.5,
    +1.6 at pH 7.0, -2.9 at pH 8.0 (sequence-based, ignoring burial, bound Fe and carbonate).
    Measured values: rice- and yeast-derived aglycosylated rhTF focus at pI 6.3, native plasma hTF at
    5.3, the difference being sialic acid (Zhang 2010, entry tf_rice_expression_and_dsp). So the
    aglycosylated PF product is ~1 pI unit more basic than the plasma protein - nearly neutral.
    Physics (mine): this is exactly why the Novozymes process (tf_novozymes_sp_ff_capture) loads a
    CATION exchanger at pH 4.5-5.1 (protein strongly positive, yeast acidic proteins flow through)
    and then polishes on an ANION exchanger at pH 8.8-9.2 (protein just negative). Same two-step
    CEX->AEX logic as the model's albumin route, but both steps sit ~1-2 pH units higher than for
    albumin (pI 5.8), and the AEX step needs borate (next entries).

# =======================================================================================
# 2. Use level in serum-free / CM media and per kg of cultivated meat
# =======================================================================================

- key: tf_e8_use_level
  value: 10.7
  unit: mg/L transferrin in Essential 8 (hiPSC medium; the basis of Humbird 2021)
  grade: A
  source: "Chen G, Gulbranson DR, Hou Z, et al. Chemically defined conditions for human iPSC derivation and culture. Nat Methods 8:424-429 (2011)"
  doi_or_url: 10.1038/nmeth.1593
  locator: "Online Methods, 'E8 media composition' (PMC3084903 full text via NCBI efetch)"
  quote: "E8 media composition: Media contained DMEM/F12, L-ascorbic acid-2-phosphate magnesium (64 mg/l), sodium selenium (14 ug/l), FGF2 (100 ug/l), insulin (19.4 mg/l), NaHCO3 (543 mg/l) and transferrin (10.7 mg/l)"
  read: fulltext
  note: >-
    File references/text/transferrin/PMC3084903.txt (Europe PMC refuses the XML; NCBI efetch served
    it). The reagent list names "Holo-transferrin (Sigma)", i.e. plasma-derived and iron-loaded at
    the bench. Same paper: transferrin was added because it "further increased" cloning efficiency
    together with a ROCK inhibitor - a clonality aid, not a core component. Note E8 dropped albumin
    but KEPT transferrin, so transferrin is the one carrier protein that survived the E8 reduction.

- key: tf_b8_use_level_and_reducibility
  value: 20
  low: 5
  high: 20
  unit: mg/L recombinant transferrin in B8 (low-cost hiPSC medium); 5 mg/L still works
  grade: A
  source: "Kuo H-H, Gao X, DeKeyser J-M, et al. Negligible-cost and weekend-free chemically defined human iPSC culture. Stem Cell Reports 14:256-270 (2020)"
  doi_or_url: 10.1016/j.stemcr.2019.12.007
  locator: "Results, medium optimization (Figs. 1G, 3D) and Discussion (PMC7013200 full text)"
  quote: "Transferrin was also not essential to the medium formula, but improved growth in a dose-dependent manner, with 20 ug mL-1 exhibiting sufficient growth while maintaining cost efficiency"
  read: fulltext
  note: >-
    File references/text/transferrin/PMC7013200.txt. The Discussion is the key cost sentence: the B8
    recipe "leaves insulin and transferrin as the major remaining reagent costs, although the
    concentrations of these components can be reduced to 5 ug mL-1 with only minor impact on growth
    rate ... reducing reagent costs to ~$11 per liter" (from ~$16/L). So the dose is price-elastic
    down to 5 mg/L, and transferrin is one of the top two protein costs in the cheapest published
    stem-cell medium. Kuo also could not reproduce Chen 2011's clonality benefit.

- key: tf_beefy9_use_level_and_price
  value: 20
  unit: mg/L recombinant human transferrin in Beefy-9 (bovine satellite-cell CM medium)
  grade: A
  source: "Stout AJ, Mirliani AB, Rittenberg ML, et al. Simple and effective serum-free medium for sustained expansion of bovine satellite cells for cell cultured meat. Commun Biol 5:466 (2022), Supplementary Materials"
  doi_or_url: 10.1038/s42003-022-03423-8
  locator: "Supplementary Table 1 (B8 formulation) and Supplementary Table 3 (component sourcing and pricing)"
  quote: "Transferrin (human, recombinant) 20 ug/mL InVitria 777TRF029"
  read: fulltext
  note: >-
    File references/text/transferrin/Beefy9_MOESM1.pdf/.txt (Springer static-content ESM; the main
    text and the Europe PMC XML never mention transferrin - it is only in the SI, which is why the
    earlier albumin pass missed it). Supplementary Table 3 prices the same line twice: "Transferrin
    mg 20 inVitria 777TRF029 1000 260.5 5.21" (research scale: $260.50 per 1 g, $5.21 per L) and
    "Transferrin mg 20 inVitria 777TRF029 10000 1823 3.65" (bulk column: $1,823 per 10 g, $3.65/L).
    Derived (mine): $260.5/g = $260,500/kg; $182.3/g = $182,300/kg. Against Beefy-9's $188.82/L
    (this-study) and $46.28/L (bulk) totals, transferrin is 2.8% and 7.9% of medium cost - small
    next to rAlbumin ($86.40 and $24.56/L) but the second-largest protein line in the bulk column
    after albumin and FGF-2. Beefy-9 = B8 + 0.8 g/L rAlbumin, so the transferrin dose is B8's.

- key: tf_humbird2021_fedbatch_demand
  value: 171
  unit: g transferrin per fed-batch batch (Humbird's 20 m3 CM base case)
  grade: B
  source: "Humbird D. Scale-up economics for cultured meat. Biotechnol Bioeng 118:3239-3250 (2021), Table 4.4"
  doi_or_url: 10.1002/bit.27848
  locator: "Table 4.4 'Variable operating cost summary for the fed-batch process', Micronutrients block (local Humbird2021_cultured_meat.txt l.3452)"
  quote: "Transferrin 9,258 g 171 $12 $1,989 $1.08"
  read: fulltext
  note: >-
    Columns are: global demand 9,258 kg/y (at 100 kTA of CM), per batch 171 g, unit cost $12/g,
    $1,989 per batch, $1.08 per kg of wet cell mass. Derived (mine): batch output = 1,989/1.08 =
    1,842 kg cell mass, so 171 g / 1,842 kg = 0.093 g transferrin per kg CM, and the medium volume
    implied by 10.7 mg/L is 15,981 L per batch = 8.7 L per kg - consistent with GFI's "efficient"
    8-13 L/kg. The $12/g comes from Humbird's own price-volume regression (Eq. 3.4,
    log P = -0.861 log V + 4.90) evaluated at 9.3 t/y, NOT from a quote. Transferrin is 34% of
    Humbird's $3.13/kg micronutrient bill and 2.9% of his $36.79/kg total.

- key: tf_humbird2021_perfusion_demand
  value: 0.0756
  unit: g transferrin per kg wet cell mass (Humbird's perfusion case)
  grade: B
  source: "Humbird 2021, Table 4.11 'Variable operating cost summary for the perfusion process'"
  doi_or_url: 10.1002/bit.27848
  locator: "Table 4.11, Micronutrients block (local Humbird2021_cultured_meat.txt l.3864)"
  quote: "Transferrin kg 7,538 $13.9k 520 $6,603,000 $0.96"
  read: fulltext
  note: >-
    Global demand 7,538 kg/y, price $13.9k/kg from Eq. 3.4, plant demand 520 kg/y, $6.60M/y,
    $0.96 per kg. Derived (mine): plant output = 6,603,000/0.96 = 6.88 kt/y (matches the paper's
    "6.9 kTA"), so 520 kg / 6.88e6 kg = 0.0756 g/kg - about 20% below the fed-batch figure because
    perfusion reaches 195 g/L retained cell density and so turns over less medium per kg (26 vs
    45 L of raw water per kg). Range to carry: 0.075-0.093 g transferrin per kg CM in Humbird's
    E8-based medium at 10.7 mg/L.

- key: tf_gfi2023_volume_share_and_current_production
  value: 2.42
  unit: "% of 2030 recombinant-protein production volume attributable to transferrin; current global output 0.2-0.3 t/yr"
  grade: C
  source: "GFI (Swartz E et al.). Anticipated growth factor and recombinant protein costs and volumes for cost-competitive cultivated meat (2023)"
  doi_or_url: references/reports/GFI_2023_growth_factor_recombinant_protein_costs_cultivated_meat.pdf
  locator: "Executive summary p.3; p.11 (local text l.391-417); Discussion p.37 (l.1371-1378)"
  quote: "albumin is anticipated to make up approximately 96.6% of production volume, with transferrin making up 2.42%, insulin making up 0.97% ... production volume of transferrin is only 0.2 to 0.3 metric tons annually (Negulescu et al. 2022)"
  read: fulltext
  note: >-
    Same report, Discussion: "the production volume range of transferrin detailed in this analysis is
    estimated to be 300 to 8200 times larger than its current estimated global production capacity".
    Derived (mine): 0.2-0.3 t x 300-8,200 = 60-2,460 t/y, which cross-checks the share arithmetic in
    tf_gfi2023_derived_demand_and_use_level below. GFI's prose for insulin+transferrin says "dozens
    to hundreds of metric tons per year", which is only consistent with the low end - flag the
    internal tension. 0.2-0.3 t/y is the whole world's recombinant transferrin output today: this is
    a ~$50-70M specialty market (see tf_market_size_segment), not a commodity.

- key: tf_gfi2023_derived_demand_and_use_level
  value: 0.37
  low: 0.23
  high: 1.19
  unit: g transferrin per kg cultivated meat (GFI 2023 scenarios, low / medium / high media use)
  grade: D
  source: "Derived (mine) from GFI 2023: volume shares 96.6%/2.42% (p.3), albumin 3,600-100,000 t/y (p.11), media use 8/13/42 L per kg (Box 2 p.7-8), and gfi2023_implied_albumin_concentration in albumin.yaml (1.13 g/L)"
  doi_or_url: references/reports/GFI_2023_growth_factor_recombinant_protein_costs_cultivated_meat.pdf
  locator: "p.3, p.7-8 Box 2, p.11"
  quote: null
  read: fulltext
  note: >-
    Derived (mine), two steps, so grade D - check. (i) Transferrin tonnage = albumin tonnage x
    2.42/96.6 = 90 t/y (low scenario) to 2,505 t/y (high). (ii) Implied average concentration =
    1.13 g/L x 2.42/96.6 = 0.0283 g/L = 28 mg/L, which sits above E8's 10.7 and B8's 20 mg/L and is
    presumably an average over literature formulations (the exact number is in GFI's supplementary
    spreadsheet Tab 1, not obtained - gap). (iii) Per kg CM: 0.0283 g/L x 8 / 13 / 42 L/kg = 0.23 /
    0.37 / 1.19 g per kg CM, i.e. 4,400 / 2,700 / 840 kg of CM enabled per kg of transferrin. This is
    4-5x Humbird's 0.075-0.093 g/kg because GFI assumes a 2.6x higher concentration. Recommended
    range for the note: 0.08-1.2 g/kg CM, central 0.2-0.4.

- key: tf_gfi2023_cost_target_and_extrapolation
  value: 1000
  unit: $/kg transferrin (GFI's tier-2 production-cost target)
  grade: C
  source: "GFI 2023, Executive summary p.3 and Table 1 p.15"
  doi_or_url: references/reports/GFI_2023_growth_factor_recombinant_protein_costs_cultivated_meat.pdf
  locator: "p.3 (local text l.117-126); Table 1 p.15 (l.535)"
  quote: "Transferrin $642.98/kg $1,639.22/kg to $94.30/kg"
  read: fulltext
  note: >-
    Table 1 row: GFI's assumed cost is $1,000/kg (tier 2, "scaled based on the order of magnitude
    difference in their anticipated production volumes compared to albumin"), while Humbird's Eq. 3.4
    extrapolated at GFI's own volumes gives $642.98/kg average and $1,639.22 to $94.30/kg across
    scenarios A-F. The report also warns that this is where the whole budget breaks: "costs are above
    this threshold if media is not used efficiently ... as the costs for transferrin alone are higher
    than the 10% of the total production costs for cultivated meat in the high media use scenario"
    (p.15). Derived (mine): at $1,000/kg and 0.23/0.37/1.19 g per kg CM, transferrin costs
    $0.23/$0.37/$1.19 per kg of CM - i.e. the whole $1/kg recombinant-protein budget in the high
    case, on its own. At Humbird's $12/g it is $0.90-$1.12/kg CM (his own tables) and at today's
    catalogue $218/g it is $50-$259/kg CM.

- key: tf_cedelft2021_price_used
  value: 246
  unit: $/g transferrin (= $246,000/kg; Dec 2020 catalogue price used in a CM TEA)
  grade: C
  source: "Sinke P, Vergeer R, Odegard I (CE Delft). TEA of cultivated meat: future projections of different scenarios - corrigendum (Nov 2021)"
  doi_or_url: https://cedelft.org/en/publications/tea-of-cultivated-meat/
  locator: "Table 3 p.14 'Prices for cost drivers of medium' (local inbox/protein_survey_2026-10-01/cedelft.txt l.695) and footnote 10"
  quote: "Transferrin 246 Northwestern Medicine & Specht (2020)"
  read: fulltext
  note: >-
    Footnote 10 traces the number to the "Feinberg School of Medicine, Paul Burridge Lab: B8 index",
    i.e. the B8 authors' own price index, not a vendor quote. CE Delft models only three recombinant
    proteins (albumin, insulin, transferrin) plus two growth factors, and its Annex B gives total
    recombinant protein of 1.0 / 7.1 / 50.0 g per kg CM with ">95% of the recombinant proteins is
    albumin" in the mid and high cases and "around 80%" in the low case (p.19). Derived (mine):
    the non-albumin remainder (transferrin + insulin) is thus ~0.2 g/kg (low) to ~2.5 g/kg (high) -
