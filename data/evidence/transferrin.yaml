# 3. Titers of secreted recombinant transferrin
# =======================================================================================

- key: tf_scerevisiae_best_titer_finnis2010
  value: 2.29
  low: 2.25
  high: 2.33
  unit: g/L in the supernatant (fed-batch, S. cerevisiae, average of 2 fermentations)
  grade: A
  source: "Finnis CJA, Payne T, Hay J, et al. High-level production of animal-free recombinant transferrin from Saccharomyces cerevisiae. Microb Cell Fact 9:87 (2010) - Novozymes Biopharma UK"
  doi_or_url: 10.1186/1475-2859-9-87
  locator: "Table 1 'rTf production titers in high cell density fed-batch fermentations', strain DYB7 [pDB3237]; Results, 'For the commercial production of rTf' paragraph"
  quote: "Fermentation of the resultant strain, DYB7 [pDB3237], under optimized conditions gave an average rTf titer of 2.29 g/L (Table 1). ... * Supernatant concentrations determined by HPLC."
  read: fulltext
  note: >-
    VERIFIED: this is the primary source for the 2.29 g/L in docs/PROTEIN_CANDIDATES.md.
    File references/text/transferrin/Finnis2010_PMC3000842.xml/.txt (also inbox .../finnis.txt).
    Full Table 1 ladder, all SUPERNATANT (not whole broth), HPLC, at pH 6.2-6.5 and mu 0.06-0.07/h:
    DYB7[pDB2536] 0.17; DP9[pDB2536] 0.39, 0.31; DYB7[pDB2711] 1.48, 1.52; DYB7[pDB3235] 0.24, 0.13;
    DYB7[pDB3237] 2.25, 2.33. Scale: "Fed-batch fermentations were carried out in a 10 L Braun
    Biostat C fermenter at 30 C" (Methods) - 10 L, so a scale-up risk for the model, though the host
    is the Recombumin rHA platform (same strains, same scale-up history). Carbon source: "a
    chemically defined medium consisting of only salts, trace elements, sucrose, vitamins and
    ammonia" - SUCROSE, methanol-free, constitutive (PRB1 promoter), which is the main economic
    contrast with K. phaffii rHSA at 17 g/L on methanol. The product is engineered aglycosylated:
    N413Q/N611Q in the research strains, S415A/T613A plus codon optimization and an invertase leader
    in the commercial strain (DYB7[pDB3237]), sold as Novozymes CellPrime rTransferrin AF; the
    O-glycan is also removable (S32A). Enabling trick: PDI1 (protein disulfide isomerase)
    overexpression on the 2um plasmid raised titer ~12-fold in fermentation - expected for 19
    disulfides. Conclusion sentence: "The high expression level (> 2 g/L) achieved in high cell
    density fed-batch fermentation has enabled an economically viable process to be developed".

- key: tf_kphaffii_titers
  value: 30
  low: 20
  high: 30
  unit: mg/L secreted recombinant human transferrin in K. phaffii (Pichia), shake flask / small scale
  grade: A
  source: "Mizutani K, Hashimoto K, Takahashi N, et al. Structural and functional characterization of recombinant human serum transferrin secreted from Pichia pastoris. Biosci Biotechnol Biochem 74:309-315 (2010); Bobik TV, Popov RY, Aliev TK, et al. Bull Exp Biol Med 167:364 (2019)"
  doi_or_url: 10.1271/bbb.90635
  locator: "abstracts (Europe PMC search epmc_tf_yeast.json, saved abstracts_tf_yeast.txt)"
  quote: "Using the signal sequence of the alpha factor of the yeast Saccharomyces cerevisiae, high-level secretion was obtained, up to 30 mg/l of culture medium."
  read: abstract
  note: >-
    Bobik 2019 (doi:10.1007/s10517-019-04521-0, abstract): "The use of constitutive GAP promoter and
    maintenance of medium pH at 6.5 allows attaining maximum level of transferrin expression
    (20 mg/liter)." Popov 2025/2026 (doi:10.1007/s10517-026-06547-7, abstract) continues the same
    strain (N413D/N611D, pPIC9pGAPZalpha) and reports purification only: "a multi-step protocol for
    isolation and purification ... achieving the target protein yield of 70.29% and a purity of at
    least 95%" - no titer given. So public Pichia transferrin is 20-30 mg/L, ~100x below the
    S. cerevisiae figure and ~600x below K. phaffii rHSA (17 g/L): for transferrin the host ranking
    is INVERTED relative to albumin, and the model should use the S. cerevisiae/sucrose route.
    Fission yeast S. pombe is worse: Mukaiyama 2009 (doi:10.1007/s00253-009-2130-5) and 2010
    (doi:10.1007/s00253-009-2393-x) report only fold-improvements (7x with dextran sulfate +
    casamino acids; ~30x with PDI overexpression), no absolute titer - "the productivity of secreted
    hTF was low" (2010 abstract). No filamentous-fungal (Trichoderma, Aspergillus) transferrin titer
    found in Europe PMC; Dyadic's C1 (Thermothelomyces) transferrin is commercial but unquantified
    (tf_dyadic_bovine_cm_orders).

