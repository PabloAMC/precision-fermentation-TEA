- key: tf_iron_loading_requirement
  value: 2
  unit: mol Fe(3+) (plus 2 mol carbonate) bound per mol transferrin when fully loaded (holo form)
  grade: A
  source: "Finnis et al. Microb Cell Fact 9:87 (2010), Background and Methods; UniProtKB P02787 binding-site features"
  doi_or_url: 10.1186/1475-2859-9-87
  locator: "Background, para 1; Methods, 'Urea gel electrophoresis'"
  quote: "It is a monomeric glycoprotein (~80 kDa) with the capacity to bind two ferric ions very tightly, but reversibly."
