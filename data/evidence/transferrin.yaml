- key: tf_note_recommended_inputs
  value: {mw_kda: 75.16, titer_g_L: 2.29, dsp_recovery: 0.65, use_g_per_kg_cm: 0.37, use_low: 0.075, use_high: 1.19, incumbent_price_usd_kg: 217716, gfi_target_usd_kg: 1000}
  unit: "MW kDa; supernatant titer g/L; overall DSP recovery; g transferrin per kg CM (central, low, high); incumbent catalogue price $/kg; GFI target $/kg"
  grade: D
  source: "Derived (mine) from the entries above: htf_mature_formula_and_mw, tf_scerevisiae_best_titer_finnis2010, tf_novozymes_sp_ff_capture x tf_novozymes_aex_borate_polish, tf_humbird2021_perfusion_demand / tf_gfi2023_derived_demand_and_use_level, tf_invitria_optiferrin_spec_and_price, tf_gfi2023_cost_target_and_extrapolation"
  doi_or_url: null
  locator: null
  quote: null
  read: fulltext
  note: >-
    Derived (mine) - the main session should accept or move each piece. Model the HUMAN protein
    (P02787 mature 679 aa, 19 S-S, 2 N-sequons engineered out, 75.16 kDa, theoretical pI 7.2) in
    S. cerevisiae on SUCROSE, methanol-free, 2.29 g/L in the supernatant (10 L scale - the main
    scale-up risk), then CEX (SP-FF, load pH 5.1, 25-40 g/L resin, elute pH 7.0, recovery 0.70) ->
    AEX (Capto Q with 5 mM potassium tetraborate, pH 9.0, 30-40 g/L resin, elute 150 mM tetraborate,
    recovery 0.93) -> iron loading (2 Fe + 2 carbonate per molecule, 1.5 kg Fe per tonne) -> UF/DF,
    overall ~0.65. Cost in use: at 0.37 g per kg CM (GFI mid) the note's bottom-up $/kg transferrin
    multiplies by 3.7e-4; the brackets that matter are $1.19/kg CM at $1,000/kg in GFI's high-media
    case (= GFI's entire recombinant-protein budget), $0.37/kg in the mid case, and $0.04-0.09/kg if
    the model's PF cost lands near Humbird's extrapolated $12-14/kg... note the units: at a PF cost
    of $100/kg, 0.37 g/kg CM costs $0.037 per kg of CM, i.e. transferrin stops mattering well before
    albumin does. That is the headline: transferrin's dose is ~40x smaller than albumin's, so even a
    10x worse $/kg leaves it a rounding error in the meat price - the reason to model it is that it
    rides free on the albumin plant (same CEX->AEX route, same host family), not that it moves the
    CM cost.
