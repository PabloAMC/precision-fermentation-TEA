# 4. Downstream processing at scale (the model's CEX -> AEX route)
# =======================================================================================

- key: tf_novozymes_sp_ff_capture
  value: 0.76
  low: 0.675
  high: 0.94
  unit: fraction of transferrin recovered in the eluate over the SP-FF cation-exchange capture step
  grade: B
  source: "Novozymes Biopharma DK A/S (Blackwell L, Cameron J, Morton PH). Purification process. EP 2 393 834 B1 (2013; priority 2009-02-06), Example 1"
  doi_or_url: https://patents.google.com/patent/EP2393834B1/en
  locator: "Example 1, Tables 2-4 (SP-Sepharose Fast Flow, nine pH/NaCl wash combinations) and Example 5, Table 8"
  quote: "These data (Table 2) show that, of the conditions tested, pH 4.5 at any sodium chloride concentration gives the best recoveries and that at pH 4.5, 2.0 M sodium chloride is the optimum."
  read: fulltext
  note: >-
    File references/text/transferrin/gp_EP2393834B1.html/.txt. This is the industrial transferrin
    analogue of the Delta albumin patents already in albumin.yaml, and the same company. Conditions:
    load is the culture supernatant (or a 3.7 mg/mL transferrin solution) conditioned to pH 5.1 and
    3.5 mS/cm with acetic acid; column equilibrated pH 5.0-5.2; LOADING 25-40 mg transferrin per mL
    matrix (Example 1a 25, Example 5 40; the description prefers "from about 30 to about 50 mg.mL-1")
    - so dsp cex_dbc_g_L ~ 25-40 for transferrin vs 40 for albumin. Elution: 50 mM sodium phosphate,
    25 mM NaCl pH 7.0 (or 150 mM NaCl pH 6.0), i.e. a pH step UP, the mirror image of albumin's
    pH 4.5 -> 5.5 step. Recoveries: Table 2 best 94.0% (pH 4.5, 2 M NaCl wash), 87.2 and 82.1% at
    0.25 M; Table 4 three-wash regime 67.5% with 30.1-fold yeast-antigen clearance, two-wash 70.9%
    (27.6-fold), one-wash 72.1% (16.8-fold); Example 5's 15-run DoE spans 21.9-81.9% recovery with
    208-383-fold HCP clearance, and the claimed design space is ">=60% recovery and >=275-fold"
    clearance. value = mean of the three Table 4 production-like regimes (0.675/0.709/0.721 -> 0.70,
    rounded here to the 0.76 midpoint of the 0.675-0.94 span; main session should pick: I recommend
    0.70 as the design basis, high 0.87). Buffer use, Capto Q step: 10 CV + 11 CV wash (Example 4).

- key: tf_novozymes_aex_borate_polish
  value: 0.932
  low: 0.536
  high: 0.932
  unit: fraction of transferrin recovered over the anion-exchange polish (Capto Q); low = no borate, high = with borate
  grade: B
  source: "EP 2 393 834 B1, Examples 2-4 (Q-FF and Capto Q, with and without potassium tetraborate in the load)"
  doi_or_url: https://patents.google.com/patent/EP2393834B1/en
  locator: "Table 6 (Capto Q, 0 vs 825 mol borate per mol rTf) and Table 7 (5 mM tetraborate load, low- then high-concentration wash)"
  quote: "the loading of transferrin in the presence of tetraborate, followed by and low concentration wash and a high concentration wash results in ... a very high level of transferrin (93.2 % recovery) in the eluate"
  read: fulltext
  note: >-
    The invention: transferrin binds an anion exchanger poorly at the pH where yeast impurities are
    removed, and adding borate (which complexes the protein, raising its effective negative charge)
    fixes it. Without borate 53.6% eluate recovery and 31.3% in the flow-through; with borate
    80.6% (Table 6) and 93.2% in the optimized Table 7 run. Conditions: load pH 8.8-9.2, conductivity
    2.6-3.5 mS/cm, 5-15.7 mM potassium tetraborate, 30-40 mg transferrin per mL matrix; wash 5 then
    15.7 mM tetraborate (10 + 11 CV); elute 150 mM potassium tetraborate pH 9.4; regenerate 1 M NaCl
    + 0.5 M NaOH, 1 h sanitization in 1 M NaOH. Q-FF behaves the same (49.8% -> 75.3%). Implication
    for pf-tea (mine): the transferrin AEX polish needs a borate salt the albumin route does not -
    an extra consumable (and a food-grade question, since borates are NOT permitted food additives
    in the EU; for a media-grade product it must be removed in the final UF/DF. FLAG for Pablo).
    Derived (mine): train recovery = 0.70 (CEX) x 0.93 (AEX) = 0.65, close to the 0.55-0.65 band the
    albumin work settled on, so the model's albumin DSP recovery can be reused for transferrin.
    Process claim is CEX (bind) then AEX (bind), with no affinity step - i.e. exactly the model's
    two-column route; the patent also lists optional preceding steps "fermentation, primary
    separation, centrate conditioning ... ultrafiltration".

