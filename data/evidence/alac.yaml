- key: alac_eu_novel_food_pf_pipeline_2026
  value: "no precision-fermented dairy protein is authorised in the EU as of Q1 2026; no alpha-lactalbumin application found. Helaina's human-equivalent lactoferrin alpha was validated 2026-03-25 (lactoferrin, not alpha-lac)"
  unit: regulatory status
  grade: C
  source: "CIRS Group, 'EU Novel Food Application Updates in Q1 2026' (web page, read 2026-10-02); corroborated by trade coverage of the Perfect Day (invalidated 2024) and Remilk (withdrawn) BLG dossiers"
  doi_or_url: https://www.cirs-group.com/en/food/eu-novel-food-application-updates-in-q1-2026
  locator: "Q1 2026 application table"
  quote: "Human-equivalent lactoferrin alpha (heqLFα)"
  read: html
  note: >-
    The quote is the only PF dairy-protein entry in that table; no alpha-lactalbumin entry exists, which is
    the negative result I can actually source (the broader 'zero PF proteins authorised' claim is trade
    press, C). So for the report: a PF alpha-lac would need a Reg. (EU) 2015/2283 novel-food authorisation
    (Art. 3(2)(a)(ii), food from microorganisms) even though the dairy molecule is pre-1997, and the first
    PF dairy dossier to clear EFSA validation is a lactoferrin, not a whey protein. Infant formula adds
    Reg. (EU) 2016/127 and an EFSA suitability assessment on top (not checked in this pass).

- key: alac_carbon_source_and_feed_rates_wang2025
  value: {growth: "40 g/L glycerol batch + 250 mL of 50% w/v glycerol fed at 18 mL/(h L)", production: "ethanol fed at 3 -> 7.3 -> 10.9 mL/(h L) for >90 h"}
  unit: feed strategy (3 L bioreactor, 0.9 L charge)
  grade: A
  source: "Wang 2025 (10.1021/acs.jafc.5c01338), Methods 'Production of Human alpha-LA in a 3 L Bioreactor', p.9251"
  doi_or_url: 10.1021/acs.jafc.5c01338
  locator: "Methods p.9251"
  quote: "ethanol supplemented with 1.2% (v/v) PTM1 was supplied at a rate of 3 mL·(h·L)-1 for 1 h to adapt the cells to the ethanol. The feeding rate was then subsequently accelerated and added to 7.3 mL·(h·L)-1 ... the ethanol feeding rate was increased to approximately 10.9 mL·(h·L)-1 and maintained at this level for the remainder of the fermentation process."
  read: fulltext
  note: >-
    The production phase runs on ETHANOL, not glucose or methanol. For pf-tea: the model can run methanol
    (Deng 2022's route) or price ethanol as glucose and flag it, as the repo already does for the
    ethanol-induced BLG row (Yao 2026). Derived (mine), rough: 10.9 mL/(h L) x 90 h = 981 mL ethanol per
    litre of initial charge = ~774 g/L at 0.789 g/mL, plus ~139 g/L glycerol (250 mL of 50% w/v into
    0.9 L), so ~0.9 kg of carbon substrate fed per litre of initial volume for 0.6 g/L of product: a yield
    on substrate of order 7e-4 g/g, against the GFI archetype's assumed 0.13 g/g (~180x). Treat this as an
    order-of-magnitude figure only: the paper reports no feed totals, no final volume and no yield, and
    nearly a litre of feed per litre of charge means the broth was diluted or partly evaporated in ways
    the text does not describe. It is still the most honest statement available of how far the academic
    process is from the archetype, and it is why alpha-lac belongs in the required-titer analysis.

