# ---- 1b. Glycosylation (identity, continued) ----

- key: alac_bovine_milk_glycosylation_occupancy
  value: {asn45_occupancy: 0.35, asn74_occupancy: 0.04, older_literature_glycoprotein_frac: 0.10}
  unit: fraction of molecules glycosylated at each site (bovine colostrum and milk, days 0-28, 4 cows)
  grade: A
  source: "Gazi I, Reiding KR, Groeneveld A, Bastiaans J, Huppertz T, Heck AJR. LacdiNAc to LacNAc: remodelling of bovine alpha-lactalbumin N-glycosylation during the transition from colostrum to mature milk. Glycobiology 34(9) cwae062 (2024)"
  doi_or_url: 10.1093/glycob/cwae062
  locator: "abstract; Introduction (older literature, ~10%)"
  quote: "We found similar glycan profiles in all four cows, with partial site occupancies, averaging at 35% and 4% for Asn45 and Asn74, respectively."
  read: fulltext
  note: >-
    Full text read (PMC11319639). Milk alpha-lac is partly glycosylated with complex, fucosylated,
    sialylated glycans that yeast cannot make; the older literature says ~10% of alpha-lac is a
    glycoprotein. So 'nature-identical' already means a mixture, and a non-glycosylated PF product is within
    the natural range for the dominant form. A yeast high-mannose glycoform would be NEW; a sequon knock-out
    (N45D, see Saito 2002) would change the sequence. Both are regulatory-identity questions, not mass
    balance (glycan mass is ignored in the model).

- key: alac_pichia_glycosylation_limits_secretion
  value: "goat alpha-lac in P. pastoris: wild type secreted partly N-glycosylated and at very low amount; N45D mutant (sequon removed) secreted mostly non-glycosylated and 'greatly enhanced'"
  unit: qualitative (no titer in abstract)
  grade: A
  source: "Saito A, Usui M, Song Y, Azakami H, Kato A. Secretion of glycosylated alpha-lactalbumin in yeast Pichia pastoris. J Biochem 132(1):77-82 (2002)"
  doi_or_url: 10.1093/oxfordjournals.jbchem.a003202
  locator: abstract
  quote: "The total secreted amount of mutant N45D was greatly enhanced, while the secreted amounts of the wild-type and mutant D46N were very low"
  read: abstract
  note: >-
    Goat, not bovine (same sequons N45-D-S, N74-I-S as bovine). Suggests ER quality control degrades
    glycosylated alpha-lac in yeast, a plausible reason why every public K. phaffii alpha-lac titer is
    <=0.6 g/L. Bears on the academic-titer gap and on product identity (a sequon-free mutant is not
    nature-identical). Full text paywalled.

