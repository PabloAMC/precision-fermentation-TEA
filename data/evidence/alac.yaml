    Promoter and secretion: alpha-mating-factor promoter and prepro leader, correctly cleaved (N-terminal
    sequence identical to whey alpha-lac). Constitutive-type expression 'occurs in the log phase during
    cell growth and does not increase during stationary phase', so there is no induction step. Culture:
    shake flask, 300 mL YPD with 50 mM MES pH 7, 28 C, 72 h sampling (Fig. 4). BASIS: supernatant,
    quantified by RADIOIMMUNOASSAY against commercial bovine alpha-lac (so a specific immunoassay, not
    Bradford on a purified fraction); 'More than 95% of the total production was found in the medium'.
    Purification was affinity chromatography on immobilised anti-alpha-lac antibodies (not a food route),
    and the product was 'enzymatically active and in all respects identical to the whey protein, as
    confirmed by SDS/PAGE, IEF, ultraviolet and CD spectral analysis'. KEY PROCESS CONSTRAINT: 'This had
    to be buffered at pH 7, as below pH 5.5 no soluble a-lactalbumin could be detected' - at the pH yeast
    drives itself to, apo alpha-lac unfolds, turns hydrophobic and sticks to the cell wall (50-60% of
    spiked protein recovered on titrating back to neutral). Note the direct conflict with Wang 2025, which
    got its best result at pH 3 to stop proteolysis: the pH optimum for alpha-lac solubility and for
    protease suppression pull in opposite directions, and nobody has reconciled them. No DCW, no yield on
    substrate. Takeda 1990 (goat, S. cerevisiae, GPD promoter) is reported here as '< 0.1 mg/l'.

