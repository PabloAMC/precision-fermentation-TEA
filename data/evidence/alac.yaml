    BLG dryer feed (0.30 dry matter, 0.27-0.37) carries over as the base (analogy, D). Two process caveats
    I did NOT find a source for: (i) alpha-lac is 14.2 kDa, so a UF/DF step needs a tighter membrane
    (~5-10 kDa) than BLG's 18.4 kDa, which costs flux - the model's membrane flux leaf should probably get
    a sensitivity, and no alpha-lac-specific flux datum was found (epmc4 search: only 2 hits, both
    paywalled); (ii) apo alpha-lac (Ca stripped at low pH) is a molten globule and aggregates, so the
    dairy literature keeps Ca2+ in and the pH near neutral (Viaene 1991 also needed neutral pH for
    secretion). Both are judgment calls for Pablo, grade E as stated.

