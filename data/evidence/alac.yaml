- key: alac_price_points_gfieurope2025
  value: 25
  low: 25
  high: 129
  year: 2025
  unit: US$/kg alpha-lac (derived from GFI's ingredient prices, divided by the ingredient's alpha-lac purity)
  grade: C
  source: "GFI Europe / Arthur D. Little 2025, Appendix 'Market size and prices' (alac_market_price_gfieurope2025) and cost-in-use table p.33"
  doi_or_url: references/reports/GFIEurope_2025_pathfinding_precision_fermentation_viability.pdf
  locator: pp.47-48 (alpha-lactalbumin rows); p.33 cost-in-use table (references/text/GFIEurope_2025_*.txt l.1028-1066)
  quote: "α-lactalbumin (food-grade) P2 Protein 462 31,828 15 24 ... α-lactalbumin (high purity) P6 Protein 462 3,740 123 100"
  read: fulltext
  note: >-
    Derived (audit R14-H2): the appendix column says "USD/kg molecule", but GFI's own cost-in-use arithmetic (p.33) works
    only per kg of INGREDIENT: general food 3.6% alpha-lac / 0.60 purity = 60 g ingredient per kg, x $15 = $0.9 as printed;
    sports nutrition 25% / 0.80 = 313 g x $29 = $9. So $15/kg is a ~60%-alpha-lac ingredient (15 / 0.60 = $25/kg alpha-lac)
    and $123/kg a 95% one (123 / 0.95 = $129/kg). The two rows share one $462 M market value, so they are two cuts of one
    market, not independent observations. Listing-based prices (C at best); the year is not stated, 2025 assumed.
