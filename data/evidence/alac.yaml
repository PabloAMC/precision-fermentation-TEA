- key: alac_grn763_agropur_dairy_isolate_spec
  value: {protein_dry_min: 0.95, alac_of_protein_min: 0.90, blg_of_protein_typ: "0.03-0.05", fat_max: 0.005, ash_max: 0.035, lactose_max: 0.002, moisture_max: 0.06}
  unit: mass fractions (protein N x 6.25 on dry basis; alpha-lac as fraction of protein, HPLC)
  grade: A
  source: "FDA GRN 763 (Agropur Inc., alpha-lactalbumin from bovine whey), notice Table 1 and FDA response letter (closed 2018-12-10, no questions)"
  doi_or_url: "https://www.fda.gov/media/125931/download (notice with amendments); letter https://www.fda.gov/media/120297/download"
  locator: "notice Sect. II.B Table 1 'Compositional Specifications', p.8; FDA letter p.2"
  quote: "Food-grade a -lactalbumin contains a minimum of 95.0% (w/w basis) protein; with a minimum of 90.0% (w/w basis) of that protein comprised of a -lactalbumin."
  read: fulltext
  note: >-
    DAIRY isolate, not PF. Typical protein composition 'is 90-96% alpha-lactalbumin, 3-5% beta-lactoglobulin,
    0-5% bovine serum albumin, and 0-2%, and immunoglobulin G 0-2%'. Agropur confirms it meets the Food
    Chemicals Codex (FCC 11, 2016) alpha-lactalbumin monograph (FDA letter: FCC limits lead <=0.5 mg/kg and
    'beta-lactoglobulin (NMT 6.5% of protein)'; FCC calcium NMT 1 mg/g, Agropur batches 0.85-2.38 mg/g).
    Product is the holo (Ca-bound) form, pI 4.2-4.5, ~14 kDa. Uses: up to 20% w/w in powdered nutritional
    and sports beverages, 25% in bars, 10% in milk products. This is the only high-purity (>=90%)
    alpha-lac isolate spec in the GRAS inventory; FCC 11's monograph is the natural spec for a PF isolate
    (FCC text itself is paywalled, not read). FDA URLs from the GRAS inventory page
    (notice saved as .preview/alac/FDA_GRN763_b.pdf, letter as FDA_GRN763_a.pdf).

- key: alac_grn763_agropur_dairy_process
  value: "sweet whey -> clarify/skim -> HTST -> ion exchange + membrane filtration -> pH/ionic-strength adjustment -> selective (salt) precipitation of other proteins + centrifugation -> UF/DF -> spray dry"
  unit: process route (dairy fractionation)
  grade: A
  source: "FDA GRN 763 (Agropur), notice Sect. II.A 'Manufacturing Process' and Figure 1; FDA letter p.1-2"
  doi_or_url: "https://www.fda.gov/media/125931/download (notice with amendments); letter https://www.fda.gov/media/120297/download"
  locator: "notice pp.6-7, Figure 1; FDA letter pp.1-2"
  quote: "The whey is then subjected anion exchange chromatography to remove lactose, minerals, and certain proteins (e.g., lactoferrin, lactoperoxidase). a -Lactalbumin is further purified by selective precipitation with a salt solution followed by removal of extraneous proteins (e.g., -lactoglobulin) by centrifugation."
  read: fulltext
  note: >-
    In dairy the hard separation is alpha-lac from a ~3x excess of BLG; it needs ion exchange plus a
    selective precipitation. In a PF broth BLG is absent: the contaminants are host proteins, glycans and
    pigment, so the dairy route says little about how much DSP a PF product needs (D at best). Agropur
    claims alpha-lac's selling points over WPC/WPI are heat stability and Trp ('rich in the amino acid
    tryptophan'), FDA amendment letter of 2018-08-21, p.2-3.

- key: alac_grn809_arla_alpha10_infant_spec
  value: {protein_min: 0.81, protein_max: 0.87, alac_of_protein_min: 0.41, blg_of_protein_max: 0.23, lactose_max: 0.10, ash_max: 0.05, moisture_max: 0.055, fat_max: 0.02}
  unit: mass fractions of powder (alpha-lac and BLG as fraction of protein)
  grade: A
  source: "FDA GRN 809 (Arla Foods Ingredients, Lacprodan ALPHA-10, fractionated WPC with 41% alpha-lactalbumin, for term infant formula up to 8.3 g/L; closed 2019-05-06, no questions)"
  doi_or_url: "https://www.fda.gov/media/135322/download (notice); letter https://www.fda.gov/media/130248/download"
  locator: "notice Table 3 'Food-Grade Specifications and Analytical Results for Lacprodan ALPHA-10', p.14; FDA letter p.2"
  quote: "Arla provides specifications for fractionated WPC (41% ALA), including levels of protein (81.0-87.0%), ALA as a percent of protein (~41.0%), ash (<=5.0%), moisture (<=5.5%), lactose (<=10.0%), fat (<=2.0%)"
  read: fulltext
  note: >-
    DAIRY. The infant-formula alpha-lac ingredient is an ENRICHED WPC, not an isolate: 5-lot means protein
    83.4%, alpha-lac 48.1% of protein (old SEC-HPLC method, which Arla says overestimates by 10-15%; the
    corrected method reads ~11% lower, Table 4: 43.0-44.9%), so alpha-lac is ~0.33-0.40 of the powder.
    Other proteins (FDA letter): 'beta-lactoglobulin (~19%), casein glycomacropeptide (~16%), and minor
    amounts of beta-casein-derived peptides'. Lactose is ADDED back ('food-grade lactose (VARIOLAC 992)
    can be added to achieve the desired protein percentage'). Infant-formula micro limits: Cronobacter
    absent/10 g, Salmonella absent/25 g. Implication for pf-tea: a PF alpha-lac sold into infant formula
    competes with a ~40%-alpha-lac WPC on price per kg alpha-lac, and a PF product of ~80% protein, >90%
    alpha-lac would already beat the spec's purity; purity is not what limits the PF route here.

