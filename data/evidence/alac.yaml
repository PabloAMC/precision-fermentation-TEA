- key: alac_base_species_recommendation
  value: bovine
  unit: recommended base product (UniProt P00711, mature 123 aa, unglycosylated, holo)
  grade: E
  source: "Judgement (mine) from this file: identity, GRAS, company and market sections"
  doi_or_url: null
  locator: null
  quote: null
  read: fulltext
  note: >-
    Why bovine: (i) it keeps whey parity, so the incumbent is a priced dairy ingredient (GRN 763 isolate,
    Arla ALPHA-10/Alpha-50) and the benchmark can be the whey band the model already has; (ii) the only
    company program is 21st.BIO/Novonesis on BOVINE alpha-lac; (iii) EU/US precedent exists for the dairy
    protein, so the PF novel-food case is 'same molecule, new process'. Human alpha-lac (P00709) is worth a
    SCENARIO, not the base: all three K. phaffii titers are human alpha-lac (Deng 2022/2023, Wang 2025),
    the premium is infant formula (GFI's $123/kg high-purity price), and human milk has ~2x the Trp and Cys
    of bovine (Layman 2018). Elementally the two are within 0.5% on C and 3% on N, so the choice does not
    change the mass balance (see the formula entries); it changes the price benchmark and the purity spec.

- key: alac_plant_size_recommendation
  value: 1000
  unit: t alpha-lac/yr (recommended plant.annual_target_protein_t for product alac)
  grade: D
  source: "Judgement (mine) from the market entries: GFI Europe 2025 gives 3,740 t/yr high purity and 31,828 t/yr food grade (both C); the ADL design plant is ~226 t/yr (derived)"
  doi_or_url: references/reports/GFIEurope_2025_pathfinding_precision_fermentation_viability.pdf
  locator: "pp.30, 47-48"
  quote: null
  read: fulltext
  note: >-
    1 kt/yr is ~27% of the high-purity market and ~3% of the food-grade market: the same reasoning as
    albumin's 1 kt/yr, and it avoids BLG's 10 kt/yr plant exceeding the whole alpha-lac market. Show
    10 kt/yr only for comparability with BLG and OVA (as the report does for lactoferrin). The scale curve
    0.1-10 kt/yr then spans the ADL design plant (0.23 kt) to the food-grade market.

- key: alac_academic_scenario_titer_recommendation
  value: 0.60
  unit: g/L (recommended strain.titer_g_L for the academic scenario, K. phaffii; see the note on the whole-broth basis)
  grade: A
  source: "Wang 2025 (10.1021/acs.jafc.5c01338), full text read: 0.6 g/L in the supernatant of a 3 L bioreactor at pH 3, ethanol-fed"
  doi_or_url: 10.1021/acs.jafc.5c01338
  locator: "Results p.9257, Fig. 5E"
  quote: "this approach resulted in a substantial improvement in the α-LA titer, achieving a maximum expression level of 0.6 g·L-1 (Figure 5E)"
  read: fulltext
  note: >-
    Recommendation (the number is grade A; the choice is mine). 0.60 g/L is the best public alpha-lac titer
    in any host, in the model's host, and methanol-free. BASIS: it is a SUPERNATANT concentration measured
    on a Ni-NTA-purified fraction by Bradford. For a whole-broth basis the model needs to discount the cell
    volume: Wang 2025 reports only OD600 (no DCW), and at pH 3 biomass was explicitly 'suboptimal', so no
    clean conversion exists. The only cell-density anchor in the pair of papers is Deng 2022's 137 g DCW/L
    in the same 3 L setup; converting that to a cell volume fraction (and so to a whole-broth discount)
    needs the model's own wet/dry and density convention, which I have not applied here - no number of mine
    should be read into it. Practical recommendation: run the academic scenario at 0.60 g/L on the model's
    whole-broth basis and call it slightly optimistic, noting that the authors' own assay underestimates
    the titer because of proteolysis, which pushes the other way; do not stack both corrections. Second number, if a bovine case is wanted:
    0.002 g/L (Viaene 1991, S. cerevisiae) - the only bovine yeast titer, 300x lower. Either way alpha-lac
    is a REQUIRED-TITER case (0.6 g/L is 1/33 of the GFI archetype's 20 g/L and 1/50 of base.yaml's 30 g/L).

- key: alac_t_prod_recommendation
  value: 90
  unit: h (production phase after the growth phase)
  grade: A
  source: "Wang 2025 (10.1021/acs.jafc.5c01338), Methods p.9251: the ethanol-fed induction phase; cross-check Deng 2022 (methanol phase from 30 h)"
  doi_or_url: 10.1021/acs.jafc.5c01338
  locator: "Methods 'Production of Human alpha-LA in a 3 L Bioreactor', p.9251; Results p.9256 (end of fermentation at 108 h)"
  quote: "The entire ethanol-fed batch phase was sustained for over 90 h."
  read: fulltext
  note: >-
    Replaces the earlier 'no source' entry. t_prod = 90 h for the recommended academic case: the glycerol
    growth phase ends when 250 mL of 50% glycerol has been fed at 18 mL/(h L), and the run that is
    described in time terms ends 'at 108 h', so the growth phase is ~18 h and the ethanol phase >=90 h
    (Derived (mine) from those two numbers; the paper does not state the switch time directly). Deng 2022's
    methanol phase starts at 30 h and the text says '108 h after induction', which is either a 138 h run or
    a 108 h run (ambiguous; Fig. 5's axis would settle it) - so 78-108 h is the methanol-route range.
    Recommended: value 90, low 72 (base.yaml's design point), high 108. Both papers are far longer than
    base.yaml's 72 h, which matters: at 0.6 g/L over 90 h the volumetric productivity is 6.7 mg/L/h, about
    1/60 of the model's BLG design point (Derived (mine)).

- key: alac_spec_recommendation
  value: {plant_spec: concentrate, concentrate_target_frac_dry: 0.90, low: 0.70, high: 0.96}
  unit: route and target protein share of dry powder
  grade: C
  source: "FDA GRN 763 (Agropur): protein >=95% of dry matter with >=90% of that protein alpha-lac; Arla Alpha-50 at 90% of protein (trade press); GFI Europe 2025 food-grade case '~95% +/-10%' purity on a membrane-only route"
  doi_or_url: "https://www.fda.gov/media/125931/download"
  locator: "GRN 763 Table 1; GFI Europe p.30"
  quote: "Food-grade a -lactalbumin contains a minimum of 95.0% (w/w basis) protein; with a minimum of 90.0% (w/w basis) of that protein comprised of a -lactalbumin."
  read: fulltext
  note: >-
    Recommendation: run alac on the same UF/DF membrane route as BLG (plant.spec: concentrate), because
    both the dairy high-purity isolate and the GFI food-grade archetype reach ~95% protein without
    chromatography, and the PF broth has no BLG to separate from. Target 0.90 of dry matter (0.95 protein
    x 0.95 alpha-lac of protein = 0.90, derived) rather than base.yaml's 0.85; low 0.70 keeps base.yaml's
    floor, high 0.96 is the Agropur isolate's upper typical composition. The chromatography variant is the
    GFI high-purity case (>99%, DSP yield 0.70 vs 0.87): worth a scenario named like albumin's
    alb_capture_only, i.e. alac_high_purity_column, since the high-purity market is the one that pays
    $123/kg.

