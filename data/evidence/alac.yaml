# 2. Titers (every public recombinant alpha-lac titer found; searches saved as epmc1-4.json)
# =======================================================================================

- key: alac_titer_wang2025_kphaffii_ethanol
  value: 0.60
  unit: g/L in the culture supernatant (3 L bioreactor, 0.9 L BSM charge, human alpha-lac, ethanol-induced, methanol-free)
  grade: A
  source: "Wang X, Zhang X, Mao Y, Wu Y, Lv X, Liu L, Han W, Yin S, Wu R, Chen J, Liu Y. Ethanol-Inducible Bioproduction of Human alpha-Lactalbumin in Komagataella phaffii. J Agric Food Chem 73(15):9246-9260 (2025)"
  doi_or_url: 10.1021/acs.jafc.5c01338
  locator: "Results, 'Reducing Acetic Acid Accumulation...' p.9257 and Fig. 5E; Methods 'Production of Human alpha-LA in a 3 L Bioreactor' p.9251"
  quote: "this approach resulted in a substantial improvement in the α-LA titer, achieving a maximum expression level of 0.6 g·L-1 (Figure 5E)"
  read: fulltext
  note: >-
    FULL TEXT READ (replaces the abstract-only entry). Strain: K. phaffii GS115-ICL1-LM background,
    LA-3C (3 genomic copies of codon-optimised human hLALBA behind 5x lacO + core PAOX1 driven by the
    LacI-Mit1AD ethanol-induced transcriptional signal amplification device, ESAD) plus ADH2-SePPK
    integrated at Int6 for ATP regeneration; HUMAN alpha-lac, His-tagged, secreted with a hybrid P4
    signal peptide (OST1-type pro-region on the alpha-factor pre-region). Vessel 3 L, 0.9 L BSM; 100 mL
    YPD seed grown 14 h and inoculated whole; DO >20% at 300-1200 rpm and 2-5 vvm; pH 5.0 (ammonium
    hydroxide) in the growth phase, 30 C; then 28 C in the ethanol phase, and in the best run the pH was
    'adjusted to 3 using a 2 M mixture of HCl and H2SO4 after the glycerol feeding' to suppress
    extracellular proteases. Feeding: 40 g/L glycerol batch, 50% w/v glycerol at 18 mL/(h L) until 250 mL
    total, then ethanol at 3 -> 7.3 -> 10.9 mL/(h L); 'The entire ethanol-fed batch phase was sustained for
    over 90 h', and the earlier (acetic-acid-limited) run ran to 'the end of fermentation at 108 h'.
    Titer ladder in the same 3 L vessel: 0.16 g/L (50 g/L SHMP fed), 0.19 g/L (+1 mM CaCl2), 0.11 g/L
    (protease inhibitors), 0.6 g/L (pH 3). BASIS: supernatant, Ni-NTA-purified from 50 mL of centrifuged
    culture and quantified by BRADFORD against a BSA standard, divided by a 10x concentration factor; the
    authors warn 'the detectable protein titers likely underestimate the actual titer' because of
    proteolysis. Biomass: OD600 only, NO DCW and no OD-to-DCW conversion; at pH 3 'the acidic conditions
    inhibited cell growth, reducing biomass to suboptimal levels', and in the earlier run biomass halved
    after acetic acid reached 134.77 g/L. No yield on substrate is reported, and no glycosylation,
    identity (MS) or purity analysis of the product is given. Glucose/glycerol-derepressed PAOX1 variants
    of the same strain made only 0.73-2.2 mg/L in shake flask, so ethanol is doing real work here.

