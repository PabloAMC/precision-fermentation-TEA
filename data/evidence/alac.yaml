    caption): 50% w/v glycerol at 8 mL/(L h) from 16 to 28 h; glycerol feed stopped at 28 h; 'the
    methanol-feeding cultivation phase started at 30 h when the residual glycerol was consumed', with
    methanol held at 2% (v/v) by an online control station; DCW and titer sampled every 12 h. TIME IS
    AMBIGUOUS in the text: 'At 108 h after induction' with induction starting at 30 h would mean a 138 h
    run, but Fig. 5's axis (not legible in the text layer) is more likely a 108 h total run, i.e. a 78 h
    methanol phase - check the figure before setting t_prod. Final titer 56.3 mg/L, '9.4-fold of that in
    the shaking flask', at DCW 137 g/L ('12.3-fold of that in the shaking flask'). BASIS: supernatant,
    Ni-NTA-purified from 50 mL of 72 h supernatant and quantified by BRADFORD; identity confirmed by
    MALDI-TOF on the 14.1 kDa band (plus a 28.2 kDa band the authors read as a dimer). 14.1 kDa is the
    unglycosylated mass, so no hyper-mannosylated glycoform was reported; glycosylation is not discussed.
    No yield on substrate. Derived (mine): 56.3 mg/L / 137 g DCW/L = 0.41 mg alpha-lac per g DCW, i.e.
    about 0.0004 g/g biomass - this is the clearest statement in the literature that alpha-lac, not the
    host, is the bottleneck. This is the paper GFI Europe 2025 cites for 'Extracellular' secretion in its
    alpha-lac archetype (p.30), whose 20 g/L is ~355x this titer.

