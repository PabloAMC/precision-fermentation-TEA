# alac.yaml: evidence for adding ALPHA-LACTALBUMIN (alpha-lac; bovine LALBA, UniProt P00711; human P00709
# for infant formula) as a product in pf-tea (research pass 2026-10-02; AI research agent, to be checked by
# the main session). Format: data/evidence/README.md. Grades: A measured/official; B published design
# basis or patent example; C company claim/trade press/survey; D analogy; E guess.
# Read as raw text: UniProt REST JSON, FDA GRAS notices (pdftotext), Europe PMC full-text XML/abstract JSON,
# GFI Europe 2025 (references/reports, pdftotext), web pages. Items computed here are "Derived (mine)", quote: null.
# Written incrementally (one block per source) so an interrupted pass loses nothing.

# =======================================================================================
# 1. Identity, sequence, mass balance
# =======================================================================================

- key: alac_bovine_uniprot_mature_chain
  value: "P00711 chain 20-142 (123 aa)"
  unit: residue range of the mature secreted chain (precursor numbering)
  grade: A
  source: "UniProtKB P00711 (LALBA_BOVIN), Alpha-lactalbumin, Bos taurus; entry version 193, last annotation update 2026-09-02"
  doi_or_url: https://rest.uniprot.org/uniprotkb/P00711.json
  locator: "features: Signal 1-19; Chain 20-142; Disulfide bond 25-139, 47-130, 80-96, 92-110; Ca(2+) binding 98,101,103,106,107; Glycosylation 64 (ECO:0000255, sequence analysis); sequence.molWeight 16247 (142-aa precursor)"
  quote: "{\"type\":\"Chain\",\"description\":\"Alpha-lactalbumin\",\"location\":{\"start\":{\"value\":20},\"end\":{\"value\":142}}}"
  read: fulltext
  note: >-
    19-aa signal leaves the 123-aa mature chain EQLTKCEVFR... (Arg at mature 10 = genetic variant B, the
    common one; UniProt natural variant R29Q (precursor) = variant A, 'in an allele of Droughtmaster
    cattle'). 8 Cys = 4 disulfides (mature 6-120, 28-111, 61-77, 73-91), no free thiol. One high-affinity
    Ca2+ site (the 'calcium-binding elbow', ligands Lys79 carbonyl, Asp82/84/87/88 side chains, mature
    numbering); apo (Ca-free) alpha-lac is the molten-globule paradigm, so Ca2+ in the medium/buffers
    matters for folding and for the product's heat stability. 4 Trp (5.3 wt%, see formula entry), the
    nutritional selling point. Two N-X-S/T sequons in the mature chain (my scan): N45-D-S (UniProt
    glycosylation at precursor 64, only 'by similarity/sequence analysis' for bovine) and N74-I-S. Milk
    alpha-lac is mostly unglycosylated (a minor glycoform exists; literature, not checked here). In
    K. phaffii/K. lactis the sequons could be N-glycosylated with high-mannose glycans: a product-identity
    risk the GRAS notices must address (see section 3).

- key: alac_human_uniprot_mature_chain
  value: "P00709 chain 20-142 (123 aa)"
  unit: residue range of the mature chain
  grade: A
  source: "UniProtKB P00709 (LALBA_HUMAN), Alpha-lactalbumin, Homo sapiens; entry version 214, 2026-09-02"
  doi_or_url: https://rest.uniprot.org/uniprotkb/P00709.json
  locator: "features: Signal 1-19; Chain 20-142; Disulfide bond 25-139, 47-130, 80-96, 92-110; Ca(2+) 57,58,98,100-103,106,107; Zn(2+) 68,135; Glycosylation 64 (ECO:0000269, experimental) and 90 ('atypical; partial'); molWeight 16225"
  quote: "{\"type\":\"Glycosylation\",\"location\":{\"start\":{\"value\":90 ... \"description\":\"N-linked (GlcNAc...) asparagine; atypical; partial\""
  read: fulltext
  note: >-
    123 aa, mature N-terminus KQFTKCELSQ..., same 4-disulfide map and Ca2+ elbow as bovine. One canonical
    sequon (N45-E-S, experimentally glycosylated in human milk) plus an atypical partial site. Human milk
    alpha-lac is ~70+% identical to bovine (literature figure; identity not computed here). 3 Trp, 2 Met.
    Infant formula makers enrich formula with BOVINE alpha-lac (e.g. Arla Lacprodan ALPHA) to approach
    the human-milk whey/amino-acid profile, so 'human' alpha-lac is a premium, not a requirement.

- key: alac_bovine_mature_formula_and_mw
  value: {C: 626, H: 958, N: 162, O: 196, S: 9}
  unit: atoms per molecule of the mature chain (4 disulfides, unglycosylated, apo)
  grade: A
  source: "Derived (mine) from UniProtKB P00711 mature chain 20-142 (123 aa, 4 disulfide features)"
  doi_or_url: https://rest.uniprot.org/uniprotkb/P00711.json
  locator: "computed from the sequence (script .preview/alac/uniprot_calc.py)"
  quote: null
  read: fulltext
  note: >-
    Derived (mine) - check the arithmetic. Residue formulas summed + H2O, minus 2 H per disulfide (4):
    average MW 14,177.9 Da (literature value for bovine alpha-lac B is 14,178 Da: consistent); per C:
    CH1.5304 N0.2588 O0.3131 S0.01438; 53.03 wt% C, 16.00 wt% N, 2.04 wt% S; protein/N = 6.248 (N x
    6.25 is exact for bovine alpha-lac). Trp 4 residues = 5.25 wt% (residue mass 186.21 / MW).
    Cross-check: the same residue-sum method gives 16,246.4 Da for the 142-aa precursor (no disulfides)
    vs UniProt molWeight 16,247 (rounding). One bound Ca2+ (+40.08 Da, 0.28 wt%) is not in the formula.
    Elementally almost identical to BLG (both ~16% N), so the model's per-C stoichiometry from BLG would
    be within ~2% on every element except S (alpha-lac 2.04% vs BLG ~1.6%; BLG value not recomputed here).

