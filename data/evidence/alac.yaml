  read: fulltext
  note: >-
    Open-access review (PMC5934683), full text read. Also: alpha-lac is '15% to 20% of total protein' in
    WPC/WPI, '~3.5% of total protein and ~17% of whey proteins in bovine milk' and '~22% of total protein
