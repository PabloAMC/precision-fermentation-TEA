  value: "secreted UF/DF concentrate (OVA route, K. phaffii) at public heme titers, 72 h production, 70% dry-matter concentrate target"
  unit: recommended modelling approach
  grade: D
  source: "Derived (mine): read-only runs of pf-tea v4 via .preview/heme/run_bound.py (PYTHONPATH=src, scenarios.base_params('ova', overrides))"
  doi_or_url: null
  locator: ".preview/heme/bound_runs.json"
  quote: null
  read: fulltext
  note: >-
    Derived (mine) - all numbers below are model output, not sourced data. MSP (cost-and-capital
    floor, msp_ccf, USD/kg protein), glucose vs 100% methanol in production:
    titer 1.0 g/L: 150 t/yr 668/718, 1 kt 583/637, 10 kt 569/622
    titer 3.5 g/L: 150 t/yr 251/267, 1 kt 175/192, 10 kt 164/180
    titer 6.0 g/L: 150 t/yr 180/190, 1 kt 109/119, 10 kt 96/107
    titer 10.1 g/L: 150 t/yr 135/142, 1 kt 71/77, 10 kt 58/65
    All runs feasible, no flags. Vessel sizing picks 50-200 m3. Interpretation: at the two
    plausible commercial titers (3.5-6 g/L secreted) and a heme-sized plant (150-1,000 t/yr), the
    bound is $110-270/kg of protein; the ADL mid ($78/kg) corresponds to ~6 g/L at 1 kt/yr or
    ~10 g/L at 150-1,000 t/yr. Methanol costs only 4-8% more than glucose here, so the
    methanol-free argument for K. marxianus is about food-grade acceptability, not cost.
    Caveats: (i) this is a SECRETED route applied to an intracellular product, so it omits lysis
    and debris removal and overstates recovery - it is a floor, not an estimate; (ii) it prices a
    dry protein basis, whereas the commercial product is a 5-7% frozen liquid, which adds
    formulation, freezing and cold-chain cost per kg of LegH; (iii) titers are measured on
    globin, not holoprotein, and loading is 22-93%, so cost per kg of FUNCTIONAL heme protein
    could be up to ~4x the figures above.

