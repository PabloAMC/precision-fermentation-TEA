# 2. Myoglobin: Motif FoodWorks GRN 1001 (bovine myoglobin preparation)
# =======================================================================================

- key: mb_motif_use_levels
  value: 1.125
  low: 1.0
  high: 2.0
  unit: "% myoglobin protein in ground meat / poultry analogue (typical 1-1.25%, max 2%)"
  grade: B
  source: "FDA response letter to GRN 1001 (Motif FoodWorks, myoglobin preparation from P. pastoris expressing Bos taurus myoglobin), 3 Dec 2021"
  doi_or_url: https://www.fda.gov/media/155001/download
  locator: "letter p.3 (saved .preview/heme/grn1001_letter.txt)"
  quote: "Motif states that the typical use levels of myoglobin preparation are 1 to 1.25%"
  read: fulltext
  note: >-
    Value = Derived (mine) midpoint of 1-1.25. Max: "providing levels up to 2% myoglobin protein to
    impart flavor and aroma" (p.3). FDA: response "is not an approval for use as a color additive"
    (p.4). Letter only; full notice not read (not on disk).

- key: mb_motif_prep_spec
  value: 3
  unit: "% myoglobin protein (w/w) in the frozen-liquid preparation, minimum; purity >=65% w/w"
  grade: B
  source: "FDA response letter to GRN 1001"
  doi_or_url: https://www.fda.gov/media/155001/download
  locator: "letter p.2"
  quote: "Motif provides specifications for myoglobin preparation that include myoglobin protein (≥ 3%) at a purity of ≥ 65% w/w."
  read: fulltext
  note: >-
    Also total organic solids <=7.5%, moisture >=92.5%, ash <=1.5%, pH 6.5-8.5. Derived (mine):
    >=3% Mb in <=7.5% organic solids -> Mb >=40% of organic dry matter, similar to LegH Prep.

- key: mb_motif_process_and_strain
  value: "P. pastoris t838417 (from NRRL Y-11430 lineage, same host as GRN 737); 8 native heme-pathway enzymes overexpressed + extra native transcription factor; fed-batch; wash, mechanical lysis, phosphate buffer, centrifugation, MF, UF; frozen liquid at -20 C"
  unit: process description
  grade: B
  source: "FDA response letter to GRN 1001"
  doi_or_url: https://www.fda.gov/media/155001/download
  locator: "letter p.2 and footnote 1"
  quote: "After fermentation, the P. pastoris cells are washed and lysed by mechanical shearing and the insoluble material is removed by treating the cells with sodium phosphate buffer to clear the cell debris, followed by centrifugation and microfiltration."
  read: fulltext
  note: >-
    Intracellular, same downstream as LegH Prep. Induction not stated in the letter (the
    "transcription factor native to P. pastoris" parallels Impossible's Mxr1, suggesting a
    methanol/AOX-type promoter system, not confirmed). No titer disclosed. Shelf life 12 months at
    -20 C, <=7 days thawed. Myoglobin "begins to unfold at 40 C".

# =======================================================================================
# 3. EU: EFSA FAF (food additive) and GMO Panel opinions on LegH Prep (strain MXY0541)
# =======================================================================================

- key: legh_eu_max_use_level
  value: 8000
  unit: "mg soy leghemoglobin per kg meat imitate (FC 12.9, only meat imitates), proposed maximum"
  grade: B
  source: "EFSA FAF Panel (2024). Safety of soy leghemoglobin from genetically modified Komagataella phaffii as a food additive. EFSA Journal 22(6):e8822 (adopted 15 May 2024)"
  doi_or_url: 10.2903/j.efsa.2024.8822
  locator: "§3.2, Table 2 (PMC11211803 text, inbox faf.txt)"
  quote: "Only meat imitates Soy leghemoglobin ■■■■■ 8000 LegH Prep ■■■■■ 118,700–200,000"
  read: fulltext
  note: >-
    The typical use level is redacted (■■■■■). LegH Prep at 118,700-200,000 mg/kg = 11.9-20% of the
    food, because the preparation is only 4-6.74% LegH (Derived (mine): 8000/0.0674 = 118,700;
    8000/0.04 = 200,000). So the "ingredient" added is mostly water. Conclusion (Summary): "does not
    raise a safety concern at the proposed use in food category 12.9 and maximum use level"; no
    numerical ADI.

- key: legh_eu_typical_use_level_derived
  value: 0.45
  unit: "% LegH in meat imitate (EU typical use level, derived)"
  grade: D
  source: "Derived (mine) from EFSA FAF 2024 exposure results: typical-use mean 4.1 vs maximum-use mean 7.3 mg/kg bw/d (toddlers and children), maximum use 8000 mg/kg"
  doi_or_url: 10.2903/j.efsa.2024.8822
  locator: "Summary; §3.3.2 and Table 4"
  quote: null
  read: fulltext
  note: >-
    Derived (mine) - check: exposure is linear in use level for the same food codes, so typical ~
    8000 x 4.1/7.3 = 4,490 mg/kg = 0.45%. Supporting quote (Summary): "At the proposed typical use
    levels, the mean exposure to soy leghemoglobin from the use of LegH Prep as a food additive was
    up to 4.1 mg/kg bw per day in toddlers and children." Rounding of 4.1 and 7.3 gives +-2%.
    Agrees with FSANZ A1186's 0.45% for beef analogue (below).

- key: legh_eu_spec_assay_and_composition
  value: 4
  unit: "% LegH protein in LegH Prep, minimum (EU specification); purity >=65% of total protein; solids <=26%; moisture <=90%"
  grade: B
  source: "EFSA FAF Panel 2024, Table 1 (proposed and revised specifications)"
  doi_or_url: 10.2903/j.efsa.2024.8822
  locator: "§3.1.2, Table 1; text after Table 1"
  quote: "Assay ≥ 4% soy leghemoglobin protein ≥ 4% soy leghemoglobin"
  read: fulltext
  note: >-
    Measured (text after Table 1): "The content of soy leghemoglobin ranged from 4.5 to 6.7%,
    corresponding to 68%–82% of the total protein fraction" (samples from the final and two related
    strains); moisture 79.7-87.5%. Molecular weight 16 kDa; CAS 2411761-31-2. No upper limit on LegH
    content (applicant may concentrate further). Rat-study dried batches: 47.6-48.82% LegH in dry
    LegH Prep.

- key: legh_eu_process_heat_treatment
  value: "lysis (mechanical shearing / high-pressure homogenisation) -> centrifugation -> concentration (e.g. UF) -> heat treatment -> formulation -> frozen liquid"
  unit: process description
  grade: B
  source: "EFSA FAF Panel 2024, §3.1.3 Manufacturing process"
  doi_or_url: 10.2903/j.efsa.2024.8822
  locator: "§3.1.3"
  quote: "The resulting concentrate undergoes heat treatment to ensure microbial stability and is then formulated with other ingredients."
  read: fulltext
  note: >-
    Also: "no detectable levels of methanol (a component in the fermentation media) are present"
    in five batches (§3.1.3.1). Confirms methanol is used in fermentation. The heat step (not in
    GRN 737's 2017 description) is a pasteurisation-type hold on the concentrate, cheap relative to
    lysis; temperature not stated (LegH denatures above ~62 C per §3.1.5, so it must be mild).

- key: legh_eu_strain_mxy0541
  value: "K. phaffii MXY0541: Bg11 (aox1 deleted, Mut-s) + Mxr1 overexpression + native heme-pathway upregulation + 3 LGB2 cassettes (one replacing AOX2, PAOX2-LGB2-TAOX2)"
  unit: strain description
  grade: B
  source: "EFSA GMO Panel (2024). Assessment of soy leghemoglobin produced from genetically modified Komagataella phaffii, under Regulation (EC) No 1829/2003 (EFSA-GMO-NL-2019-162). EFSA Journal 22:e9060 (adopted 3 Oct 2024)"
  doi_or_url: 10.2903/j.efsa.2024.9060
  locator: "§3.1 (recipient), §3.3.1, §3.4.1 (inbox efsa_gmo.txt)"
  quote: "Bg11 is a commercial strain that grows more slowly on methanol-­containing induction media, which is a desirable trait for industrial fermentation."
  read: fulltext
  note: >-
    §3.1: Aox1 deleted "resulting in a decreased ability to metabolise methanol" (EFSA calls Aox1
    "alcohol dehydrogenase"; it is alcohol oxidase). §3.4.1: "three cassettes designed to express
    the LGB2 gene in three loci". Promoter names partly redacted. Survey's description is correct.
    Implication for pf-tea: commercial LegH is methanol-induced (Mut-s), so the methanol cost and
    O2/heat terms apply.

- key: legh_eu_mxy0541_batches
  value: 4.65
  low: 4.5
  high: 4.8
  unit: "% LegH in LegH Prep, three MXY0541 batches (68-77% of total protein)"
  grade: B
  source: "EFSA GMO Panel 2024, §3.7.3"
  doi_or_url: 10.2903/j.efsa.2024.9060
  locator: "§3.7.3 (p.~10)"
  quote: "Based on analytical re- sults from three batches coming from the MXY0541 strain, the content of soy leghemoglobin ranged from 4.5% to 4.8%, corresponding from 68% to 77% of the total protein fraction."
  read: fulltext
  note: >-
    Value = Derived (mine) midpoint. Lower LegH concentration than the 2016 MXY0291 batches
    (6.3-7.0%). GMO Panel §3.8.3 assumes 4% LegH for the 0.8% max case. Recombinant DNA present
    in the product (§3.6.2), which is why Reg. 1829/2003 applies.

- key: legh_eu_flavour_mechanism
  value: "flavour from heme B released on denaturation during cooking"
  unit: mode of action
  grade: B
  source: "EFSA GMO Panel 2024, §3.7.2 Intended use and mode of action"
  doi_or_url: 10.2903/j.efsa.2024.9060
  locator: "§3.7.2"
  quote: "This flavouring effect is achieved through dena- turation of soy leghemoglobin and release of the haem B moiety during the preparation process of the meat analogue products."
  read: fulltext
  note: >-
    Applicant's claim relayed by EFSA (no sensory data assessed). FAF §3.1.5: denatures "above
    approximately 62°C". Relevant to question 6: the heme effect is aroma chemistry (Maillard /
    lipid oxidation catalysis), which a heme-free formulation must replace with flavours.

