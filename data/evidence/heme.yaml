# 4. FSANZ A1186 (Impossible's application, 2019): actual use levels; heme iron per serving
# =======================================================================================

- key: legh_actual_use_level_beef
  value: 0.45
  unit: "% LegH in beef analogue (actual use level)"
  grade: B
  source: "Impossible Foods Inc. (2019). Application A1186 to amend the Australia New Zealand Food Standards Code to allow the use of soy leghemoglobin (FSANZ)"
  doi_or_url: https://www.foodstandards.gov.au/food-standards-code/applications/a1186-soy-leghemoglobin-meat-analogue-products
  locator: "§D (exposure), inbox a1186.txt l.1858-1863; also §A.9 l.459-460"
  quote: "soy leghemoglobin is added at use levels of 0.45% in beef analogue products and 0.25% in pork analogue products."
  read: fulltext
  note: >-
    Preceding sentence: "in practice, the soy leghemoglobin will be added only at levels that would
    be needed to recreate the flavour and aroma contributed by heme proteins". The most direct
    public statement of in-market use. Singapore SFA (2019) list, quoted in A1186 l.466-468: "may
    be used in plant-based meat analogues at levels up to 0.45% w/w". Consistent with EFSA-derived
    0.45% typical; GRN 737 (2017) assumed 0.6% average.

- key: legh_actual_use_level_pork
  value: 0.25
  unit: "% LegH in pork analogue (actual use level)"
  grade: B
  source: "FSANZ application A1186 (Impossible Foods, 2019)"
  doi_or_url: https://www.foodstandards.gov.au/food-standards-code/applications/a1186-soy-leghemoglobin-meat-analogue-products
  locator: "inbox a1186.txt l.459-460 and l.1862-1863"
  quote: "soy leghemoglobin would be added to beef analogue products at up to 0.45%, and to pork analogue products at up to 0.25%."
  read: fulltext
  note: "Same document; pork analogue = Impossible Pork (ground)."

- key: legh_heme_iron_per_serving
  value: 2
  unit: "mg heme iron per 113 g serving of Impossible Burger (approximately)"
  grade: B
  source: "FSANZ application A1186, §E.1.1 and Table E.1.1-1"
  doi_or_url: https://www.foodstandards.gov.au/food-standards-code/applications/a1186-soy-leghemoglobin-meat-analogue-products
  locator: "inbox a1186.txt l.1937-1941"
  quote: "the amount of haem iron present is nearly the same at approximately 2 mg per serving"
  read: fulltext
  note: >-
    Derived (mine) - check: Impossible's LegH is Lbc2 (UniProt P02236, below), mature apoprotein
    ~15.39 kDa; 0.45% x 113 g = 0.509 g -> 33.0 umol -> 1.84 mg Fe at 1 heme per globin. "About 2
    mg" therefore implies near-stoichiometric heme loading in the commercial product (the rounding
    does not allow a sharper number). Total iron 4.2 mg/serving (2.4 mg non-heme).

# =======================================================================================
# 5. Identity and heme mass fraction (UniProt)
# =======================================================================================

- key: legh_lbc2_uniprot
  value: "P02236 (LGB4_SOYBN, Leghemoglobin C2, gene LBC2/GLB2-5), 145 aa precursor, chain 2-145"
  unit: identity
  grade: A
  source: "UniProtKB P02236 (LGB4_SOYBN), Glycine max; entry version 141, 2026-09-02"
  doi_or_url: https://rest.uniprot.org/uniprotkb/P02236.json
  locator: "proteinDescription.alternativeNames; features Initiator methionine 1, Chain 2-145; sequence.molWeight 15525"
  quote: "\"alternativeNames\": [... \"Hemoglobin 2-5\" ... \"Leghemoglobin C2\"], genes synonyms [\"GLB2-5\", \"LBC2\"]"
  read: fulltext
  note: >-
    EFSA FAF Table 1 trivial name: "Leghemoglobin C2 (Lbc2)", 16 kDa; Impossible's gene name
    "LGB2" is its own label. The academic K. marxianus work expresses LBA (leghemoglobin A =
    P02238, LGB3_SOYBN, 144 aa, 15,374 Da precursor), a different isoform ~93% identical (my
    alignment by eye, not computed). Myoglobins: bovine P02192 (154 aa, 17,078 Da, chain 2-154;
    the GRN 1001 protein) and porcine P02189 (154 aa, 17,085 Da).

- key: heme_mass_fraction_of_holoprotein
  value: 3.85
  unit: "% of holo-LegH mass that is heme b (at 1 heme per globin)"
  grade: A
  source: "Derived (mine) from UniProt P02236 molWeight and heme b formula C34H32FeN4O4 (616.5 g/mol)"
  doi_or_url: https://rest.uniprot.org/uniprotkb/P02236.json
  locator: "computed"
  quote: null
  read: fulltext
  note: >-
    Derived (mine) - check: apoprotein without Met1 = 15,525 - 131.2 = 15,394 Da; holo = 16,010
    Da; heme share = 616.5/16,010 = 3.85%. For bovine Mb: (17,078-131.2) = 16,947; 616.5/17,563 =
    3.5%. So 1 g/L holo-globin needs ~38 mg/L heme: heme synthesis is a small carbon sink but a
    real pathway-flux problem (it is the reported bottleneck), and hemin feeding at 150 mg/L (Mb
    285 mg/L, below) is a ~15x excess over full loading.

# =======================================================================================
# 6. Public titers (every LegH / Mb / plant-Hb titer found). Abstract-only unless noted.
# =======================================================================================

- key: titer_legh_kphaffii_shao2022
  value: 3.5
  unit: g/L secreted LegH (LBC2), 10 L bioreactor
  grade: A
  source: "Shao et al. (2022). High-level secretory production of leghemoglobin in Pichia pastoris through enhanced globin expression and heme biosynthesis. Bioresour Technol 363:127884"
  doi_or_url: 10.1016/j.biortech.2022.127884
  locator: abstract
  quote: "whose maximal leghemoglobin titer and heme binding ratio reached as high as 3.5 g/L and 93 %, respectively. This represents the highest secretory production of heme-containing proteins ever reported."
  read: abstract
  note: >-
    Secreted, heme binding 93%, native heme pathway consolidated (no hemin stated in the abstract).
    "A combination of inducible expression and constitutive expression" (abstract), so partly
    methanol-induced; the methanol regime, batch time and yield are in the paywalled full text.
    Confirmed as 3.5 g/L secretory by the K. marxianus 2023 paper's introduction (secondary).

- key: titer_legh_kphaffii_chen2025
  value: 6.0
  unit: g/L secreted LegH, 5 L fermenter (double-copy cassette, mu-STAT methanol feeding + 50 g/L sorbitol)
  grade: A
  source: "Chen HT, Niu YH, Zhang LX, et al. (2025). The optimized signal peptide and feeding strategy to enhance secretory expression of LegH in Komagataella phaffii. Process Biochem 156:255-262"
  doi_or_url: 10.1016/j.procbio.2025.06.005
  locator: "publisher abstract/highlights page (paywalled; read via search-result summary, not the article)"
  quote: null
  read: abstract
  note: >-
    NOT verified against the publisher's own page (ScienceDirect blocked; Elsevier API returned no
    abstract). From a web-search summary of the highlights: alpha-Mat V50A signal peptide +150%
    secretion; methanol feeding optimisation 1.1 g/L; mu-STAT with 50 g/L sorbitol 4.5 g/L;
    double-copy 6.0 g/L in a 5 L fermenter. Treat as grade C until the abstract is read directly:
