# heme.yaml: evidence for a HEME-PROTEIN COST-IN-USE NOTE in pf-tea (soy leghemoglobin, LegH; bovine
# and other myoglobins). Research pass 2026-10-02 (AI research agent; to be checked by the main session).
# Format: data/evidence/README.md. Grades: A measured/official; B published design basis, regulatory
# dossier or patent example; C company claim/trade press/survey; D analogy; E guess.
# Read as raw text: local files under ~/Developer/pf-tea/references (reports/, text/,
# inbox/protein_survey_2026-10-01/), eCFR XML, Europe PMC abstracts / full text, web pages.
# Items computed here are "Derived (mine)", quote: null. Model runs: .preview/heme/run_bound.py
# (read-only use of src/pftea; outputs in .preview/heme/bound_runs.json).

# =======================================================================================
# 1. US regulatory definition and specifications: soy leghemoglobin (LegH Prep)
# =======================================================================================

- key: legh_us_color_additive_max_use
  value: 0.8
  unit: "% soy leghemoglobin protein by weight of uncooked ground-beef analogue (maximum)"
  grade: A
  source: "21 CFR 73.520 Soy leghemoglobin, para (c) Uses and restrictions [84 FR 37576, Aug. 1, 2019]"
  doi_or_url: https://www.ecfr.gov/current/title-21/chapter-I/subchapter-A/part-73/subpart-A/section-73.520
  locator: "21 CFR 73.520(c) (eCFR XML, saved .preview/heme/cfr73520.xml)"
  quote: "the amount of soy leghemoglobin protein does not exceed 0.8 percent by weight of the uncooked ground beef analogue product"
  read: fulltext
  note: >-
    Official regulation (grade A for the legal limit). Ground-beef analogues only; the petition to
    extend to other analogues is not reflected in the current eCFR text.

- key: legh_us_color_additive_purity_spec
  value: 65
  unit: "% LegH protein on protein basis (w/w), minimum, by SDS-PAGE"
  grade: A
  source: "21 CFR 73.520(b)(1)"
  doi_or_url: https://www.ecfr.gov/current/title-21/chapter-I/subchapter-A/part-73/subpart-A/section-73.520
  locator: "21 CFR 73.520(b)(1)"
  quote: "Soy leghemoglobin protein purity on protein basis (weight/weight), not less than 65 percent, as determined by sodium dodecyl sulfate-polyacrylamide gel electrophoresis."
  read: fulltext
  note: >-
    Identity (a)(1) calls it "a stabilized product of controlled fermentation" of Pichia pastoris;
    the regulation sets no LegH concentration in the preparation and no heme-loading requirement.
    Heavy-metal limits: Pb <=0.4, As <=0.05, Hg <=0.05, Cd <=0.2 mg/kg.

- key: legh_prep_legh_content_spec
  value: 6
  low: 6
  high: 9
  unit: "% LegH protein (w/w) in LegH Prep (frozen liquid concentrate)"
  grade: B
  source: "Impossible Foods Inc., GRAS Notice GRN 737 'Soy leghemoglobin protein preparation derived from Pichia pastoris' (notice, 2017; FDA no-questions letter 23 Jul 2018)"
  doi_or_url: https://www.fda.gov/media/124351/download
  locator: "§2.5 Specifications for food grade material and Table 1, notice pp.8-9 (inbox grn737_notice.txt l.320-375)"
  quote: "LegH Prep, the ingredient used in Impossible Foods's ground beef analogue, is standardized to contain at least six percent (6%) soy leghemoglobin protein."
  read: fulltext
  note: >-
    Table 1 spec "6-9%"; footnote 1: LegH may exceed 9% if more water is removed in the
    concentration step. Five 2016 batches: 6.74, 6.39, 6.28, 6.74, 6.95% LegH (OCR-checked).
    Stabilised with NaCl and sodium ascorbate; stored at -20 C as a frozen liquid >=12 months.

- key: legh_prep_purity_batches
  value: 80
  low: 71
  high: 86
  unit: "% LegH of total protein (w/w), five 2016 production batches"
  grade: B
  source: "GRN 737 notice, Table 1"
  doi_or_url: https://www.fda.gov/media/124351/download
  locator: "Table 1, notice p.9; footnote 2 (inbox grn737_notice.txt l.355-368)"
  quote: "The balance of the proteins in the preparation is residual Pichia proteins."
  read: fulltext
  note: >-
    Batch purities 82, 71, 85, 77, 86% (spec >=65%); value 80 = Derived (mine) mean of the five
    (80.2). Measured by SDS-PAGE densitometry. So LegH Prep is a crude lysate concentrate with
    ~15-30% host protein; not a purified protein.

- key: legh_prep_solids_batches
  value: 15.6
  low: 12.55
  high: 18.44
  unit: "% total solids (w/w) of LegH Prep; spec <=24%"
  grade: B
  source: "GRN 737 notice, Table 1"
  doi_or_url: https://www.fda.gov/media/124351/download
  locator: "Table 1, notice p.9, row 'Solids (w/w)'"
  quote: "Percent solids specification is based on the sum of the maximum concentrations of total protein, fat, carbohydrates and ash."
  read: fulltext
  note: >-
    Batches 14.85, 12.55, 14.92, 17.31, 18.44% solids; value = Derived (mine) mean 15.6.
    Derived (mine): LegH as a share of dry solids = 6.74/14.85 = 45%, 6.39/12.55 = 51%,
    6.28/14.92 = 42%, 6.74/17.31 = 39%, 6.95/18.44 = 38%, i.e. ~38-51% of dry matter is LegH; the
    rest is host protein, carbohydrate (1-2.7%), ash (0.7-2.7%, incl. added NaCl) etc.

- key: legh_prep_process_route
  value: "intracellular; bead-mill lysis -> centrifugation + microfiltration -> UF concentration -> NaCl + ascorbate -> frozen liquid"
  unit: process description
  grade: B
  source: "GRN 737 notice §2.6.3 Recovery Process and Figure 1"
  doi_or_url: https://www.fda.gov/media/124351/download
  locator: "§2.6.3, notice pp.10-11 (inbox grn737_notice.txt l.448-470)"
  quote: "The P. pastoris cells in the fermentation broth are lysed by bead mill mechanical shearing. Insoluble material within the lysate is removed by centrifugation and microfiltration."
  read: fulltext
  note: >-
    Next sentence: "Ultrafiltration is used to concentrate soy leghemoglobin protein." No
    chromatography, no drying. Figure 1: fermentation, cell lysis, solid separation, concentration,
    freezing. Fermentation (§2.6.2) is "submerged fed-batch"; methanol and glycerol concentrations
    are monitored. No titer, yield or batch size disclosed.

- key: legh_grn737_strain_and_induction
  value: "P. pastoris MXY0291 (from Bg11/MXY0051); LGB2 + extra native heme-pathway enzymes + modified Mxr1, all under pAOX1; methanol induction after glycerol growth"
  unit: strain description
  grade: B
  source: "GRN 737 notice §2.7.1 Production Strain"
  doi_or_url: https://www.fda.gov/media/124351/download
  locator: "§2.7.1, notice p.11 (inbox grn737_notice.txt l.478-490)"
  quote: "all expressed under the strong native Pichia pastoris alcohol oxidase promoter (pAOXI). This promoter has been demonstrated to produce high levels of recombinant proteins after producing biomass on glycerol, and inducingpAOXI with methanol"
  read: fulltext
  note: >-
    Quote OCR as on disk ("pAOXI" = pAOX1). The survey's "MXY0541" is the later strain in the EFSA
    dossier (see efsa entries below); GRN 737 (2017-18) is MXY0291. Heme is made natively by the
    host (overexpressed pathway enzymes), no hemin feed.

- key: legh_grn737_typical_use
  value: 0.6
  unit: "% LegH protein in ground-beef analogue, average anticipated use (max 0.8%)"
  grade: B
  source: "GRN 737 notice §3.1.1 and Table 2"
  doi_or_url: https://www.fda.gov/media/124351/download
  locator: "notice p.17, Table 2 (inbox grn737_notice.txt l.798-830)"
  quote: "Impossible Foods anticipates the soy leghemoglobin protein to constitute, on average, 0.6% of the ground beef analogue product by mass."
  read: fulltext
  note: >-
    2017 dossier figure. FSANZ A1186 (2019) gives "up to 0.45%" for beef analogue (entry below), so
    the in-market level fell or the 0.6% was an exposure-assessment assumption. Both bracket the
    cost-in-use table (0.45 central, 0.6 alternative, 0.8 legal max).

- key: legh_grn737_typical_analogue_composition
  value: {protein_pct: "10-25", oils_pct: "0-25", misc_pct: 2, water_pct: "50-75"}
  unit: "% w/w of a typical ground-beef analogue"
  grade: B
  source: "GRN 737 notice §2.3"
  doi_or_url: https://www.fda.gov/media/124351/download
  locator: "notice p.6 table 'Component / Ground Beef Analogue'"
  quote: "LegH Prep will function to catalyse flavor chemistry and contribute to the nutritional quality of ground beef analogue products."
  read: fulltext
  note: >-
    Derived (mine): at 0.45% LegH and 10-25% total protein, LegH is 1.8-4.5% of the analogue's
    protein. §2.3.1: use above 0.8% is "self-limiting based on unacceptable organoleptic properties".

