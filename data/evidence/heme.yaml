- key: titer_legh_kphaffii_chen2025_fulltext
  value: 6.0
  unit: g/L secreted LegH in the supernatant, 5 L fermenter, 102 h total
  grade: A
  source: "Chen H, Niu Y, Wang Y, Zhang L, Dai Z, Luo A, Du G, Zhao X (2025). The optimized signal peptide and feeding strategy to enhance secretory expression of LegH in Komagataella phaffii. Process Biochem 156:255-262"
  doi_or_url: 10.1016/j.procbio.2025.06.005
  locator: "§3.4, p.260 (and Conclusion p.260; Fig. 4c,d)"
  quote: "the secretory titer of LegH reached 6.0 g/L in 102 h (Fig. 4c, d), which is the highest value for LegH secretory expression to date."
  read: fulltext
  note: >-
    UPGRADES the earlier grade-C entry (titer_legh_kphaffii_chen2025) to A. Full-text process:
    host K. phaffii X33 lineage, strain P1H9-V50A-LegH with cn=2 (P1 = enhanced heterologous
    expression, P1H9 = additionally enhanced heme supply, from Adv Sci 2023 doi:10.1002/advs.202302826),
    alpha-Mat signal peptide with the V50A pro-region mutation (+151% secretion), two copies of the
    LegH cassette; pAOX1, so METHANOL-INDUCED ("K. phaffii X33 has been widely applied to express
    heterologous proteins for the robust methanol-inducible promoter (pAOX1)", §3.3).
    Vessel 5 L with 2.7 L BSM (40 g/L glycerol), 30 C, 1 vvm, 400-1200 rpm; glycerol fed-batch of
    50% glycerol at 30 mL/h to ~300 g/L wet cell weight; induction pH 6.5 (pH 5.5 gave 2.15 g/L vs
    4.26 g/L at 6.5, §3.4); methanol by mu-STAT exponential feed (mu = 0.012, F0 = 13.5) with
    50 g/L sorbitol co-fed; the methanol feed carries 12 mL/L PTM1 and 100 mg/L hemin (§2.4).
    Titer ladder in the SAME vessel: constant feed 10 mL/h 420 mg/L; 20 mL/h 504 mg/L; methanol
    controller at 0.5% 403.3 mg/L; DO-STAT 656.5 mg/L; mu-STAT 1.1 g/L; mu-STAT with P1-LegH
    1.50 g/L and P1H9-LegH 1.78 g/L; +V50A 2.15 g/L; pH 6.5 4.26 g/L; +50 g/L sorbitol 4.5 g/L;
    +second copy 6.0 g/L. Assay: supernatant on 10% SDS-PAGE, total protein by Bradford, LegH
    share by Image Lab densitometry (§2.6) - a densitometry titer, so +-20-30%.
    HEME LOADING IS NOT REPORTED in this paper (only peroxidase activity), so 6.0 g/L is TOTAL
    secreted globin, not holoprotein. Derived (mine): 6 g/L of 16.0 kDa holo-LegH needs 231 mg/L
    heme b, while only 100 mg/L hemin (153 umol/L) is fed, so at most ~41% of the globin could be
    loaded from the feed; the rest must come from the P1H9 strain's own pathway or stay apo.
    This is the central weakness of using 6.0 g/L as the commercial-proxy titer.

- key: titer_legh_kphaffii_shao2022_fulltext
  value: 3.5
  unit: g/L secreted LegH in the supernatant, 10 L bioreactor, 93% heme-binding ratio
  grade: A
  source: "Shao Y, Xue C, Liu W, Zuo S, Wei P, Huang L, et al. (2022). High-level secretory production of leghemoglobin in Pichia pastoris through enhanced globin expression and heme biosynthesis. Bioresour Technol 363:127884"
  doi_or_url: 10.1016/j.biortech.2022.127884
  locator: "Table 2 (strain HA-KU70) and §3.4, p.8"
  quote: "The strain HA-KU70 expressed the largest amount of LegH and showed the highest heme-binding ratio, reaching 3.5 g/L and 93 %, respectively"
  read: fulltext
  note: >-
    Confirms the abstract and adds the basis. Table 2 (p.8) gives the full ladder with growth
    rates: GS115-HIS4 mu_gly 0.177 / mu_MeOH 0.032, no LegH; L10A1T-HIS4 1.5 g/L at 45% heme
    binding; HA 2.0 g/L at 91%; HA-KU70 3.5 g/L at 93% (mu_gly 0.169, mu_MeOH 0.018 h^-1).
    So the 93% loading is for the best strain only, and multi-copy strains without the heme-pathway
    overexpression sit at 45%. Heme-binding ratio method (§2.7): QuantiChrom heme assay on the
    PURIFIED protein, ratio of molar heme to molar LegH - a real holoprotein measurement, unlike
    Chen 2025. Titer basis: supernatant, Bradford plus Quantity-One densitometry (§2.5).
    Process (§2.4): 10 L bioreactor, 5.0 L WZI medium, 400 mL seed, pH 6.5, 30 C, four phases -
    glycerol batch; glycerol fed-batch (63% w/v glycerol + 12 mL/L PTM1) to 200 g/L wet cell
    weight; a 3 h transition with the glycerol rate ramped down; then methanol fed to keep DO
    above 10%. AOX1 promoter with Delta-ku70 host (ku70 disruption was needed for high-density
    fed-batch; the authors note methanol accumulation and cell lysis in the HA strain). Total
    fermentation time is only in Fig. 6 and is not stated numerically in the text.
    Earlier flask stage: best broth titer 529 mg/L (strain HA); 10 uM hemin raised activity in
    flasks, but the bioreactor process does NOT feed hemin - heme comes from the overexpressed
    native pathway. That makes Shao 2022 the better model basis for a food process (no
    animal-derived hemin) even though its titer is lower than Chen's.

