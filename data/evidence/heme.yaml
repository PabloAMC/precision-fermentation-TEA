# =======================================================================================
# 9. Can pf-tea model heme proteins? Route gap and the recommended bound (question 5)
# =======================================================================================

- key: pftea_route_gap_intracellular
  value: "yes - both commercial preparations are intracellular lysate concentrates; pf-tea has no lysis/clarification route"
  unit: model-scope finding
  grade: B
  source: "GRN 737 notice §2.6.3 and FDA GRN 1001 letter p.2 (process quotes above); pf-tea src/pftea/dsp.py route set (read-only inspection, 2026-10-02)"
  doi_or_url: https://www.fda.gov/media/124351/download
  locator: "see legh_prep_process_route and mb_motif_process_and_strain"
  quote: null
  read: fulltext
  note: >-
    Commercial route: bead-mill (or HPH) lysis -> centrifugation -> microfiltration -> UF ->
    stabilisers -> frozen liquid (plus a heat hold in the EU spec). pf-tea's existing routes are
    secreted-protein routes (membrane concentrate / spray-dried / resin capture). Missing unit
    operations: homogeniser (energy ~ a few kWh/kg wet cells and a major CAPEX item at scale),
    debris removal (disc-stack centrifuge + MF with a real yield loss, typically 10-30%), and
    cold-chain frozen liquid product instead of powder. Adding them is a new DSP module, not a
    parameter swap: that is the scope decision.

