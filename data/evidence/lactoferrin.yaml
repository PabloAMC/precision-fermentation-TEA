- key: lf_intelligen_derived_checks
  value: {broth_m3_per_batch: 82.3, fermenters_100m3: 9, powder_kg_per_batch: 765, dsp_recovery: 0.837, glucose_per_kg_lf: 25.7, methanol_per_kg_lf: 4.2, glucose_to_lf_yield_g_g: 0.039}
  unit: derived quantities, glucose scenario
  grade: B
  source: "Derived from David LH et al. Int J LCA 31:96 (2026) Tables 1-2 and the stated 251 t/yr output"
  doi_or_url: 10.1007/s11367-026-02671-8
  locator: "Tables 1 and 2 plus Sect. 2.1"
  quote: null
  read: fulltext
  note: >-
    CORRECTED 2026-09-27 against the primary report (lf_cost_intelligen2026_case_a_ufdf; review L):
    the design has 6 staggered 100 m3 fermenters, not ~9 (the 216 h below is the ~9-day overall batch
    time; one fermenter's cycle is 132.6 h), 78.18 m3 of broth per batch at 10.03 g/L, overall
    recovery 0.882 (case a) and 0.793 (case b), and glycerol, not glucose, in the growth phase
    (Table 1; David 2026's glucose column is his own variant). The derivation as first written:
    (1) 822.6 kg LF per batch at 10 g/L implies 82.26 m3 of broth, i.e. 82% working volume in the
    stated 100 m3 fermenter. (2) 328 batches x 216 h = 70,848 fermenter-hours, so the plant needs
    ~8.1 vessels at 8,760 h/yr or ~9 at 7,920 h/yr: a 9 x 100 m3 train, close to the pf-tea base
    of 5 x 136 m3 for ovalbumin. (3) 251 t/yr / 328 = 765 kg powder per batch; at 90% purity that
    is 688.7 kg LF recovered from 822.6 kg made, so OVERALL DSP RECOVERY = 0.837 for the UF/DF +
    spray-dry case. (4) The Table 1 inventory reconciles: (23.1 + 3.8 + 9.0) kg/kg x 765 kg =
    27.5 t/batch vs the stated "total feedstock 28,392.8 kg/batch", within 3%. (5) Per kg of LF
    (not powder): 25.7 kg glucose + 4.2 kg methanol, i.e. an overall sugar-to-product yield of
    0.039 g/g, SEVEN TIMES WORSE than the 0.28 g/g in the ovalbumin base case - because the
    titer is 10 g/L against 116 g/L of biomass, and because the product carbon comes from
    methanol. This single ratio is why lactoferrin costs ~$300/kg in the same modelling framework
    that gives ~$39/kg for ovalbumin, and it is the number to attack with a higher titer.

