# data/evidence/lactoferrin.yaml: evidence for the lactoferrin contrast case (research pass 2026-09-26):
# product definition, specifications, titers, the Intelligen 2024 design basis, downstream route and prices.
# Format: data/evidence/README.md. 'Derived' numbers are our arithmetic and say so.
#
# data/evidence/ candidate entries for LACTOFERRIN (research output, 2026-09-26).
# Format: data/evidence/README.md. Grades: A measured/official; B published design basis;
# C company claim/survey/trade press; D analogy; E guess.
# Everything below was read as raw text (UniProt REST JSON, FDA PDFs -> pdftotext/page images,
# EUR-Lex HTML, publisher HTML read in the browser pane). No summarising web-fetch tool was used
# for any number or quote. Items marked `read: none` are leads with no verified number.

# =======================================================================================
# 1. Product identity, sequence, mass balance
# =======================================================================================

- key: blf_uniprot_mature_chain
  value: "P24627 chain 20-708"
  unit: residue range of the mature secreted chain (precursor numbering)
  grade: A
  source: "UniProtKB P24627 (TRFL_BOVIN), Lactotransferrin, Bos taurus; entry version 220, sequence version 2, last annotation update 2026-09-02"
  doi_or_url: https://rest.uniprot.org/uniprotkb/P24627.json
  locator: "features: Signal 1-19; Chain 20-708 'Lactotransferrin'"
  quote: "{\"type\":\"Signal\",\"location\":{\"start\":{\"value\":1},\"end\":{\"value\":19}}} ... {\"type\":\"Chain\",\"description\":\"Lactotransferrin\",\"location\":{\"start\":{\"value\":20},\"end\":{\"value\":708}}}"
  read: fulltext
  note: >-
    689 residues after signal-peptide removal, matching the "689 amino acids" in the EU novel-food
    specification and in FDA GRN 1219/1284. Mature sequence starts APRKNVRWCT and ends LLEACAFLTR.
    CAS 146897-68-9 (GRN 1219/1284). Mature-chain residue i (literature/regulatory numbering)
    = precursor residue i+19: this off-by-19 trap bites on the glycosylation sites (next entry).

- key: blf_mature_formula_and_mw
  value: {C: 3358, H: 5251, N: 945, O: 1002, S: 38}
  unit: atoms per molecule of apo, unglycosylated mature bovine lactoferrin
  grade: A
  source: "Derived from UniProtKB P24627 mature chain 20-708 (689 aa, 16 disulfides listed in the entry)"
  doi_or_url: https://rest.uniprot.org/uniprotkb/P24627.json
  locator: "computed from the sequence; UniProt lists 16 'Disulfide bond' features"
  quote: null
  read: fulltext
  note: >-
    Computed here (residue sums + H2O, minus 2H per disulfide): average MW 76,111 Da;
    CH1.564N0.281O0.298S0.0113; 52.99 wt% C, 17.39 wt% N (so N x 5.75 = protein, vs the
    N x 6.38 dairy factor used in the GRAS specs - the specs therefore overstate protein by ~11%).
    UniProt's own "molWeight" for the 708-aa precursor is 78,056 Da. Glycans are NOT included:
    5 high-mannose/hybrid N-glycans add roughly 4-8 kDa, which is why measured masses are
    80-87 kDa (GRN 1219: 84 kDa for rbLf; 80-87 kDa for dairy bLf).

- key: blf_glycosylation_sites
  value: 5
  unit: N-linked sites (Asn252, Asn300, Asn387, Asn495, Asn564 in precursor numbering)
  grade: A
  source: "UniProtKB P24627 features; cross-checked against All G GRAS Notice GRN 1284 (mature numbering)"
  doi_or_url: https://rest.uniprot.org/uniprotkb/P24627.json
  locator: "5 'Glycosylation' features: 252 (high mannose), 300 (complex), 387 (complex/high-mannose/hybrid), 495 (complex/high-mannose/hybrid), 564 (high mannose)"
  quote: "bLF from mature bovine milk can have glycans located at Asn233, Asn281, Asn368, Asn476, and Asn545, of which Asn281 is found without glycans 85% of the time"
  read: fulltext
  note: >-
    The quote is GRN 1284 p.10 (mature numbering); UniProt's 252/300/387/495/564 are the same
    sites in precursor numbering (i_mature + 19). Sequon scan of the mature chain confirms exactly
    these five N-X-S/T motifs and no others. K. phaffii puts oligomannose glycans on 4 of the 5
    sites (GRN 1284: "ALLGLF is glycosylated at Asn233, Asn368, Asn476, and Asn545"), with
    7-13 mannoses, 23.73% of glycans carrying one phosphate. Human LF (P02788) has only
    3 sites (Asn156, Asn497, Asn642, precursor numbering) plus an O-GlcNAc at Ser10.

- key: hlf_uniprot_mature_chain
  value: "P02788 chain 20-710"
  unit: residue range of the mature secreted chain (precursor numbering)
  grade: A
  source: "UniProtKB P02788 (TRFL_HUMAN), Lactotransferrin, Homo sapiens; entry version 270, sequence version 6, last annotation update 2026-09-02"
  doi_or_url: https://rest.uniprot.org/uniprotkb/P02788.json
  locator: "features: Signal 1-19; Chain 20-710; Glycosylation 156, 497, 642"
  quote: "{\"type\":\"Chain\",\"description\":\"Lactotransferrin\",\"location\":{\"start\":{\"value\":20},\"end\":{\"value\":710}}}"
  read: fulltext
  note: >-
    691 residues, matching Helaina's "Composed of 691 amino acids" and "TRFL_HUMAN (P02788)".
    Computed formula C3338H5201N957O1013S37, average MW 76,132 Da apo/unglycosylated
    (CH1.558N0.287O0.304S0.0111; 52.66 wt% C, 17.61 wt% N). 16 disulfides. Only ~69% sequence
    identity to bovine LF (GRN-cited figure), so the two are different products, not variants.

- key: lf_iron_binding_capacity
  value: 1.4
  unit: mg Fe(3+) per g lactoferrin at 100% saturation
  grade: A
  source: "All G Co Holdings Pty Ltd. GRAS Notice (GRN) 1284: Recombinant bovine lactoferrin produced by a modified strain of Komagataella phaffii (2025/2026)"
  doi_or_url: https://downloads.regulations.gov/FDA-2025-N-1928-0051/attachment_1.pdf
  locator: "Section 2.1.3.4, p.12"
  quote: "Theoretically one lactoferrin molecule can bind two Fe3+ ions and therefore lactoferrin can bind a maximum of 1.4mg Fe3+ / g lactoferrin (Groves, 1960; Foley and Bates, 1987; Majka et al., 2013)."
  read: fulltext
  note: >-
    Cross-check: 2 x 55.845 / 76,111 = 1.47 mg/g from the computed mature MW, i.e. All G rounds
    down (they divide measured Fe by 140 mg/100 g). For the mass balance this means iron is
    <0.15 wt% of the protein even when fully loaded - negligible in the elemental balance, but it
    sets the iron specification and it is a real raw-material line (FeSO4.7H2O appears in
    TurtleTree's raw-material table, GRN 1219 Table 11).

- key: lf_iron_saturation_states
  value: 0.15
  low: 0.019
  high: 0.876
  unit: fraction of the two iron sites occupied (dairy native ~0.10-0.20)
  grade: A
  source: "FDA GRAS Notices GRN 1219 (TurtleTree) Table 7 and GRN 1284 (All G) Table 2/Table 5; Lu X et al. Analyst 149:3636-3650 (2024) for Helaina rhLF"
  doi_or_url: https://downloads.regulations.gov/FDA-2025-N-1927-0062/attachment_1.pdf
  locator: "GRN 1219 Table 7 p.26; GRN 1284 Table 2 p.12; Lu 2024 sec 3.4.2"
  quote: "Generally, lactoferrin derived from dairy is a mix of apo and holo lactoferrin, where there is 15-20% iron saturation. This state is called native-lactoferrin."
  read: fulltext
  note: >-
    The three commercial PF products land in completely different places: TurtleTree rbLf isolate
    87.6 +/- 1.5% saturated (holo; Table 7 also gives 96.7 mg Fe/100 g product), All G ALLGLF
    1.89-7.04% (apo-like, spec <20%), Helaina rhLF 54 +/- 4% ("ranged between 50% and 60%").
    Iron state is a product choice, not a process constant: it changes thermostability
    (Tm ~68 C apo vs ~92 C holo) and the iron spec, and it decides whether an iron salt has to
    be dosed. Relevant to the model only via the FeSO4 line and the powder composition.

# =======================================================================================
# 2. Incumbent product specification (what a PF product must match)
# =======================================================================================

- key: blf_spec_eu_novel_food
  value: {protein_min_frac: 0.93, lf_frac_of_protein_min: 0.95, moisture_max: 0.045, ash_max: 0.015, iron_max_mg_kg: 350}
  unit: mass fractions of the powder (iron in mg/kg)
  grade: A
  source: "Commission Implementing Decision 2012/725/EU of 22 November 2012 authorising the placing on the market of bovine lactoferrin as a novel food ingredient (Morinaga), OJ L 327, 27.11.2012, p.46; identical Annex I in 2012/727/EU (FrieslandCampina), OJ L 327 p.52"
  doi_or_url: https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32012D0725
  locator: "Annex I, 'Physical-chemical properties of bovine lactoferrin'"
  quote: "Moisture less than 4,5 % | Ash less than 1,5 % | Arsenic less than 2 mg/kg | Iron less than 350 mg/kg | Protein more than 93,0 % | of which bovine lactoferrin more than 95,0 % | of which other proteins less than 5,0 % | pH (2 % solution, 20 C) 5,2 to 7,2"
  read: fulltext
  note: >-
    This is the cleanest public incumbent spec and it is EU law. Same Annex describes the
    incumbent process: "bLF is isolated from skimmed milk via ion exchange and subsequent
    ultra-filtration steps. Finally it is dried by spraying and large particles are sieved out."
    Use levels (Annex II): infant/follow-on formula 100 mg/100 mL; dairy-based foods for young
    children 200 mg/100 g; processed cereal food 670 mg/100 g. The two EFSA opinions behind these
    decisions are EFSA Journal 2012;10(5):2701 (FrieslandCampina) and 2012;10(7):2811 (Morinaga).

- key: blf_spec_fda_grn669_dairy
  value: {protein_min_frac: 0.95, lf_frac_of_protein_min: 0.95, moisture_frac: 0.045, ash_frac: 0.013, iron_max_mg_kg: 200, iron_saturation_max: 0.20}
  unit: mass fractions of the powder
  grade: A
  source: "US FDA. Agency response letter, GRAS Notice No. GRN 000669 (cow's milk-derived lactoferrin, Synlait Milk Ltd), 9 March 2017"
  doi_or_url: https://www.fda.gov/media/104116/download
  locator: "p.2"
  quote: "Synlait provides specifications for cMDLf expressed on a weight percent basis that include a minimum of 95.0% protein (of which >=95% is bLf), 4.5% moisture, and 1.3% ash. The iron content is <=200 mg/kg, and calculated iron saturation is <=20%."
  read: fulltext
  note: >-
    Same letter gives the incumbent dairy process: "raw skim milk is chilled to below 8 C ...
    clarified and microfiltered ... cMDLf is isolated from the filtrate using ion-exchange
    chromatography and eluting of bound material with sodium chloride. The isolated cMDLf is then
    desalted, ultrafiltered, pasteurized, and microfiltered prior to evaporation and spray drying."
    Morinaga's GRN 464 spec is >=94.5% protein and <=1.3% ash (quoted in the GRN 1219 amendments).

- key: rblf_spec_fda_grn1284_allg
  value: {protein_min_frac: 0.90, lf_frac_of_protein_min: 0.95, moisture_max: 0.045, ash_max: 0.035, iron_max_mg_kg: 200, iron_saturation_max: 0.20}
  unit: mass fractions of the powder
  grade: A
  source: "All G Co Holdings Pty Ltd. GRAS Notice (GRN) 1284, Table 4 'Product specifications for ALLGLF'; FDA 'no questions' letter 25 March 2026"
  doi_or_url: https://downloads.regulations.gov/FDA-2025-N-1928-0051/attachment_1.pdf
  locator: "Table 4, p.23 (batch data Table 5, p.24)"
  quote: "Total Protein (N x 6.38) (%) >90 % | Purity (Lactoferrin) (%) >95 % (as % of the total protein) | Moisture <4.5 % | Ash (%) <3.5 % | Iron content <200 mg/kg | Iron Saturation <20 %"
  read: fulltext
  note: >-
    The only precision-fermentation LF product whose full dossier is public. Three batches:
    protein 93.6-95.2%, LF purity 95.7-99.4% of protein, moisture 1.76-3.52%, ash 1.7-2.8%,
    iron 24.4-92.0 mg/kg. So a PF product CAN meet the dairy-incumbent spec almost exactly.
    Process (Sect. 2.2.2, p.21-22): fed-batch K. phaffii "Ppas_337" (parent BG11), secreted and
    soluble; biomass removed by filtration; "The lactoferrin is separated and purified from the
    media via chromatography step"; then UF/DF, sterile MF, drying. FDA letter (media/191907)
    adds "microfiltered using sterile membrane filters ... before drying".

- key: rblf_spec_fda_grn1219_turtletree
  value: {protein_min_frac: 0.80, lf_frac_of_protein_min: 0.95, moisture_max: 0.085, ash_max: 0.095, carbohydrate_max: 0.05, fat_max: 0.02, iron_max_mg_kg: 1200}
  unit: mass fractions of the powder
  grade: A
  source: "TurtleTree Labs Inc. GRAS Notice (GRN) 1219, Table 8 'Physical and Microbiological Specifications of rbLf Isolate'; FDA 'no questions' letter 7 May 2025"
  doi_or_url: https://downloads.regulations.gov/FDA-2025-N-1927-0062/attachment_1.pdf
  locator: "Table 8, pp.27-28; batch results Table 9, pp.29-30"
  quote: "Protein content (% total weight) >= 80% | Intact (full length) lactoferrin purity (% total protein) >= 95% | pH 5.6 - 7.2 | Fat < 2% | Iron <= 120 mg/100g | Total carbohydrates <= 5% | Water content <= 8.5% | Water activity < 0.6 aw | Total ash <= 9.5%"
  read: fulltext
  note: >-
    A LOOSER spec than the dairy incumbent, and the amendments say why: "The rbLf isolate has a
    higher ash content (<=9.5%) compared to GRN 464 (<=1.3%) which reflects the use of salts
    (sodium and phosphates) in the final buffer step of the production process." Residual
    carbohydrate is yeast mannan: ">90% total hydrolysed monosaccharides identified as mannose ...
    The <5% residual carbohydrates remaining after chromatography purification of the rbLf are
    likely mannose-based polysaccharides". Batches: protein 80.5-83.5%, ash 6.84-9.11%,
    moisture 6.3-8.0%, carbohydrate 3.3-4.7%, iron 94-98 mg/100 g. For a cost model this is the
    key spec insight: 80% protein with ~9% ash and ~4% mannan is what a CEX+UF/DF+spray-dry PF
    train actually delivers, not 95%.

# =======================================================================================
# 3. Process and titer evidence
# =======================================================================================

- key: lf_intelligen_design_basis
  value: 10
  unit: g/L lactoferrin titer, fed-batch, 5 days
  grade: B
  source: "David LH, Wollborn D, Ferreira RG, Juliano P, Ridoutt B. Ex-ante life cycle assessment of recombinant human lactoferrin produced via precision fermentation. Int J Life Cycle Assess 31, article 96 (2026), reporting the SuperPro model of Ferreira RG, Misailidis N, Petrides D (2024), Intelligen Inc."
  doi_or_url: 10.1007/s11367-026-02671-8
  locator: "Sect. 2.1 and Table 2"
  quote: "The baseline scenario assumes a titre of 10 g/L achieved over a 5-day fermentation period."
  read: fulltext
  note: >-
    Table 2 (glucose / glycerol columns) gives the whole design basis of the Intelligen 2024
    lactoferrin TEA without needing the ResearchGate file: batches/yr 328/328;
    lactoferrin 822.6 / 784.7 kg per batch; total feedstock 28,392.8 / 26,403.6 kg per batch;
    titre 10 g/L; final DCW 116.3 / 105.9 g/L; biomass yield on substrate 0.50 / 0.60 g/g;
    lactoferrin yield on methanol 0.33 g/g; aeration 1 vvm; fermenter 100 m3; 216 h/batch; 30 C;
    cooling duty 74,283.7 / 67,647.4 kWh per batch. Host is stated as Pichia pastoris, growth on
    glycerol/glucose then methanol induction. DERIVED: 822.6 kg at 10 g/L implies 82.3 m3 of
    broth (82% of the 100 m3 vessel); 328 x 822.6 kg = 269.8 t LF/yr in broth vs "approximately
    251 tonnes of lactoferrin powder at 90% purity" produced, i.e. an overall DSP recovery of
    ~84% (251 x 0.9 / 269.8). CHECK THIS ARITHMETIC before using it.

- key: lf_intelligen_inventory_per_kg
  value: {glucose_kg: 23.1, methanol_kg: 3.8, ammonia30_kg: 2.2, other_chemicals_kg: 9.0, electricity_kWh: 66.8, cooling_MJ: 237.6, steam_kg: 25.6, ultrapure_water_kg: 245.5, di_water_kg: 67.1, biowaste_kg: 13.0, wastewater_kg: 377.0}
  unit: per kg of spray-dried lactoferrin powder at 90% purity (glucose scenario)
  grade: B
  source: "David LH et al. Int J Life Cycle Assess 31:96 (2026), Table 1 (foreground LCI from the SuperPro model)"
  doi_or_url: 10.1007/s11367-026-02671-8
  locator: "Table 1"
  quote: "Carbon source kg 23.1 | Methanol kg 3.8 | Ammonia (30% w/w) kg 2.2 | Other chemicals* kg 9.0 | Electricity kWh 66.8 | Cooling energy MJ 237.6 | Steam (chemical industry) kg 25.6 | Ultrapure water kg 245.5 | Deionised water kg 67.1"
  read: fulltext
  note: >-
    Glycerol scenario: 18.4 kg glycerol, 4.0 methanol, 2.4 ammonia, 10.2 other, 70.6 kWh.
    This is the best public per-kg inventory for a lactoferrin PF plant and a direct cross-check
    on the pf-tea mass/energy model: 23.1 kg glucose per kg of 90%-pure powder is ~20.8 kg
    glucose per kg LF, i.e. an overall glucose-to-product yield of only 0.048 g/g, an order of
    magnitude worse than the 0.28 g/g used for ovalbumin - because the titer is 10 g/L, the
    biomass is 116 g/L, and methanol (not glucose) carries the product-forming carbon.
    Electricity is dominated by air compression: "Fermentation dominated electricity consumption
    in all scenarios, contributing more than 90% of total demand" and within it air compression
    is "~63%".

- key: lf_titer_hlf_kphaffii_liu2026
  value: 2.214
  unit: g/L secreted intact human lactoferrin, 5-L bioreactor
  grade: A
  source: "Liu K, Fan X, Tong Z, Zhang J, Zhao M, Chen Y, Wu C, Wang T, Wei S, Liu Y, Xue Z, Zheng Y. Reprogrammed Komagataella phaffii for enhanced secretory expression of human lactoferrin. J Biotechnol 419:1-10 (2026)"
  doi_or_url: 10.1016/j.jbiotec.2026.07.011
  locator: "sect. 3.5, Fig. 5 (5 L bioreactor); intact hLF by ELISA (sect. 2)"
  quote: "The optimized three-phase fermentation strategy (growth-starvation-induction) achieved maximum intact hLF production at 115 h, yielding 2214 mg/L with concurrent biomass accumulation (OD600 294)"
  read: fulltext
  note: >-
    AOX1 promoter with alpha-MF signal, dual expression cassette at three loci, ER expansion plus
    vacuolar protease knockouts; "0.1 g/L FeCl3 was added to the medium to reduce the toxicity of
    hLF and improve its stability" - i.e. iron is a process additive, not just a product
    attribute. Highest peer-reviewed SECRETED lactoferrin titer found in any food-grade host.
    Full text read 2026-10-06 (references/papers/Liu2026_lactoferrin.pdf): 3 L BSM start, 40 g/L glycerol,
    26 h growth, 7 h starvation, methanol DO-stat (DO > 20%) over 135 h; specific productivity 7.52 mg/L/OD600;
    "approximately 44% loss at 115 h and exceeding 60% by fermentation termination (168 h)" to degradation;
    substantial non-target protein in the supernatant (Fig. S5). Supernatant titer.

- key: lf_titer_rblf_kphaffii_iglesias2016
  value: 3.5
  unit: g/L recombinant bovine lactoferrin (1-L batch culture)
  grade: A
  source: "Iglesias-Figueroa B, Valdiviezo-Godina N, Siqueiros-Cendon T, Sinagawa-Garcia S, Arevalo-Gallegos S, Rascon-Cruz Q. High-level expression of recombinant bovine lactoferrin in Pichia pastoris with antimicrobial activity. Int J Mol Sci 17(6):902 (2016)"
  doi_or_url: 10.3390/ijms17060902
  locator: "Sect. 2.3 and 4.5-4.6 (PMC4926436 full text)"
  quote: "After 72 h of induction, cell lysis, and purification from 1 L of culture medium, we obtained an expression yield of 3500 mg/L"
  read: fulltext
  note: >-
    TREAT WITH CARE. This is the number every review repeats (Mao 2023 Table 1, Shukla 2026) as
    "3.5 g/L bovine lactoferrin in P. pastoris", but the methods say: 200 mL YPD seed into a
    fermentor holding "1000 mL of BMMY induction media", "5% methanol each 24 h during 72 h",
    then "cell lysis" and purification by ammonium-sulfate precipitation + Sephacryl S-200.
    It is therefore a 1-L flask-scale, lysate-inclusive yield quantified after purification, not
    a secreted broth titer at bioreactor scale. Do not use it as a design titer.

- key: lf_titer_hlf_aspergillus_ward1995
  value: 2
  unit: g/L recombinant human lactoferrin, Aspergillus awamori
  grade: A
  source: "Ward PP, Piddington CS, Cunningham GA, Zhou X, Wyatt RD, Conneely OM. A system for production of commercial quantities of human lactoferrin: a broad spectrum natural antibiotic. Nature Biotechnology 13:498-503 (1995)"
  doi_or_url: 10.1038/nbt0595-498
  locator: "abstract p.498; Results p.498; Discussion p.501; Methods p.501 (culture conditions)"
  quote: "initial rounds of mutagenesis have resulted in the generation of transformants secreting in excess of 2 g/l of intact recombinant lactoferrin into the growth medium"
  read: fulltext
  note: >-
    Full text read 2026-11-03 (OCR prints "g/1"). SECRETED, intact, ELISA on Miracloth-filtered
    medium. The only cultivation described is shake flasks (30 mL CSM in 250 mL flasks, 30 C,
    6 days, p.501); no fermenter is mentioned, so the 2 g/L is most likely a shake-flask value
    (inference: the paper does not say). Discussion: from "~20 mg/l to >2 g/l". One-step
    CM-Sepharose CEX recovery ">85%" (lab, p.499). The authors' projection of 10-20 g/L at
    "~5-10 cents per gram" (p.501) is a company claim (C), context only.
    Glucoamylase fusion processed by an endogenous KEX-2 peptidase. The 1992 precursor in
    A. oryzae reached "levels up to 25 mg/l" (10.1038/nbt0792-784). These two are the only
    filamentous-fungal lactoferrin data points of any size; both are >30 years old and paywalled.

- key: lf_titer_hlf_treesei_hu2025
  value: 1.3495
  unit: g/L recombinant human lactoferrin, 5-L fermenter, Trichoderma reesei
  grade: A
  source: "Hu C, Shen W, Xia Y, Zhou L, Yang H, Chen X. Efficient production of the recombinant human lactoferrin in an engineered Trichoderma reesei. J Agric Food Chem 73:32795-32806 (2025)"
  doi_or_url: 10.1021/acs.jafc.5c11534
  locator: "Results, 'Production of rhLF in a 5 L Fermenter', Fig. 6C"
  quote: "The titer of rhLF reached its maximum value of 1349.5 mg/L at 144 h (Figure 6C)"
  read: fulltext
  note: >-
    First lactoferrin in T. reesei, the host of the VTT/Onego BLG-OVA lineage already in this
    repo. Strain CJ2095 dpea1::pdi1. Full text read 2026-10-06 (references/papers/Hu2025_lactoferrin_treesei.pdf):
    fed-batch on MICROCRYSTALLINE CELLULOSE + bran + peptone (not sugar; cellulose induces the cbh1 promoter),
    2.5 L start, 30 C, pH 5, 2 vvm, 7 days, feeds every 24 h from 48 h; quantified by an in-house indirect ELISA.

- key: lf_titer_porcine_kphaffii_yen2024
  value: 2.8
  unit: g/L recombinant porcine lactoferrin, 5-L fed-batch
  grade: A
  source: "Yen CC, Wu PY, Ou-Yang H, Chen HL, Chong KY, Chang RL, Chen CM. Production of bioactive porcine lactoferrin through a novel glucose-inducible expression system in Pichia pastoris. Int J Mol Sci 25(3):1818 (2024)"
  doi_or_url: 10.3390/ijms25031818
  locator: "Sects. 2.1-2.2 (PMC10855427)"
  quote: "Scaling up production transpired in a 5 L fermenter, yielding an estimated rpLF productivity of approximately 2.8 g/L by the conclusion of glycerol-fed fermentation. A three-step purification process involving tangential-flow ultrafiltration yielded approximately 6.55 g of rpLF crude (approximately 85% purity)."
  read: fulltext
  note: >-
    Porcine LF, so grade D as an analogy for bovine, but it is the only public MEASURED
    membrane-only purification of a recombinant lactoferrin: 2.9 L of supernatant, 0.45 um hollow
    fibre gives "2.4 L filtrate with rpLF at 4.3 g/L and approximately 52% purity", 100 kDa
    cassette "increasing rpLF concentration to 7.3 g/L and purity to nearly 68%" with 5% loss,
    then 30 kDa cassette to "approximately 23 g/L and purity to 85%" but "nearly half of the rpLF
    protein was lost during this step". Methanol-free (glucose-inducible G1 promoter), 144 h,
    OD600 ~350 at harvest.

- key: lf_helaina_industrial_scale_and_dsp
  value: 45000
  unit: L fermentation scale (industrial, human lactoferrin)
  grade: C
  source: "Lu X, Cummings C, Osuala A, ... (Helaina Inc.). Characterization of recombinant human lactoferrin expressed in Komagataella phaffii. Analyst 149:3636-3650 (2024)"
