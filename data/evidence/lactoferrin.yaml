# =======================================================================================
# 4. Downstream: the incumbent (and PF) cation-exchange route
# =======================================================================================

- key: blf_incumbent_cex_operating_window
  value: null
  unit: qualitative (pH and NaCl concentrations for dairy lactoferrin CEX)
  grade: A
  source: "Mao R, Ma X, Hao Y, Yang N, Teng D, Wang J. Perspective: A proposal on solutions of modern supply chain construction for lactoferrin. J Dairy Sci 106(11):7329-7335 (2023). Open access CC-BY"
  doi_or_url: 10.3168/jds.2023-23328
  locator: "Section 'Current processing technology of LF from whey and skim milk'"
  quote: "(1) First, microfiltration (1-2 um) is used to remove the microorganism and particulate matter and fat. (2) Subsequently, the filtrate is put through a cation-exchange column with a pH of 6.3 to 6.8. Impurities are washed from the column with a low-salt buffer (1.5-2% sodium chloride), and the target bLF is eluted with a high-salt buffer (10-15% sodium chloride). (3) The purified liquid is concentrated in an ultrafiltration step, followed by desalting via diafiltration. After pasteurization and spray or freeze drying, the final powdered product, with a protein content >90% and purity >95%, is obtained"
  read: fulltext
  note: >-
    The elution salt load is the cost driver a chromatography step adds: 10-15% NaCl (1.7-2.6 M)
    in the eluate, which the following DF step has to wash out. Same paper: "cation-exchange
    purification has been the most widely used process for the production of bLF by major
    manufacturers since the 1980s, including Royal Friesland Campina, MILEI, and Synlait Milk
    Ltd." For a PF broth the LF is already at 2-10 g/L rather than 0.1 g/L in milk, so the
    column is loaded ~20-100x more concentrated - the binding capacity, not the feed volume,
    becomes the sizing constraint.

- key: blf_cex_resin_industrial_lifetime
  value: 1000
  unit: cycles before column replacement (lower bound)
  grade: A
  source: "Pires MC, Jungbauer A, Lau D, Young C, Hoffmann P, de Padua TF, Gerstweiler L. Column ageing of agarose-based chromatography in industrial lactoferrin purification. J Chromatogr A 1760:466274 (2025). CC-BY"
  doi_or_url: 10.1016/j.chroma.2025.466274
  locator: abstract
  quote: "Commercial lactoferrin is extracted from bovine milk using cation exchange chromatography with agarose-based Sepharose SP Big Beads. After over a thousand cycles, the column must be replaced due to backpressure exceeding operational limits."
  read: abstract
  note: >-
    Already in data/evidence/dsp.yaml as iex_resin_lifetime_industrial_lactoferrin; repeated here
    because it is the single most useful chromatography parameter for a lactoferrin model and it
    is 5-20x the biopharma replacement frequency Petrides quotes (50-200 cycles). Ageing
    mechanism is CIP chemistry (NaOH, acetic acid, NaClO) degrading the agarose backbone, not
    fouling; "equilibrium binding capacity remained stable, ionic capacity declined by 23%, and
    dynamic binding capacity increased by 31%". ABSOLUTE DBC VALUES ARE IN THE FULL TEXT, WHICH
    IS CC-BY BUT BOT-WALLED AT ELSEVIER - worth one manual download (see report item E).

- key: blf_cex_resin_cost_lever
  value: 18
  unit: ratio of the price of DoWex to the price of the '732' resin
  grade: A
  source: "Wang et al. Comparative study of cation-exchange resins for high-efficiency preparation of bovine lactoferrin and its N-glycomic analysis by HILIC-MS/MS. J Agric Food Chem 74(7):6488-6504 (2026)"
  doi_or_url: 10.1021/acs.jafc.5c12835
  locator: "abstract; sect. 3.3 p.6499 (prices in Table S1, not on disk)"
  quote: "Notably, the price of 732 resin is only one-18th that of DoWex, representing a significant reduction in production costs and making it promising in future large-scale manufacturing."
  read: fulltext
  note: >-
    Full text read 2026-11-03. Both resins are sulfonated styrene-divinylbenzene strong-acid
    resins (DoWex 50WX8, Sigma; 732, Aladdin): the 18x is a LAB-CATALOGUE price ratio between two
    resins of the same chemistry, not agarose vs polymer. Body p.6499: "preparing approximately
    10 mg of bLf with 732 resin was nearly 18-fold less expensive than with DoWex". Purity 96%
    (DoWex) vs ~86% (732). Preparative yields 8.92 and 10.5 mg bLf from 2 g whey powder on 100 g
    resin (~0.5% of the load, mine; the abstract's 4.46%/5.25% basis is unclear). Static
    recovery ~66% for both. Load ~0.1 mg bLf per g resin (mine), far below process loadings, so
    nothing here bears on cex_dbc_g_L or cex_resin_life_cycles; reuse was not measured ("remain
    to be investigated", p.6501). Elution 1.5 M NaCl in 20 mM phosphate pH 7.5.

- key: lf_ufdf_only_purity_claim
  value: 0.90
  unit: mass fraction lactoferrin in the powder, UF/DF + spray drying only (no chromatography)
  grade: B
  source: "Intelligen Inc. SuperPro Designer Example Process Files, lactoferrin entry, cases a and b; corroborated by David LH et al. Int J LCA 31:96 (2026) Sect. 2.1"
  doi_or_url: https://www.intelligen.com/static/SPDDownloadCenter/Latest/Example_Process_Files.htm
  locator: "Nutraceuticals examples, 'Lectoferrin' [sic] entry"
  quote: "In case a (this model), the biomass is removed by centrifugation and crossflow microfiltration/diafiltration; then, the protein is partially purified and concentrated by crossflow ultrafiltration/diafiltration; and finally spray-dried. A total of 249 tons of lactoferrin powder is produced per year in this scenario."
  read: html
  note: >-
    DESIGN ASSUMPTION, NOT A MEASUREMENT, and the one number in the lactoferrin literature I would
    challenge. David 2026 describes the same case-a model as producing "approximately 251 tonnes
    of lactoferrin powder at 90% purity" whose downstream is "sequential centrifugation,
    microfiltration, and ultrafiltration/diafiltration steps ... with spray drying". Case b adds
    "cation-exchange chromatography" and drops output to 213 t/yr (0.855 of case a).
    Evidence against reaching 90% by membranes alone: all three commercial PF producers
    (TurtleTree GRN 1219, All G GRN 1284, Helaina) use ion exchange; the only measured
    membrane-only recombinant-LF purification (Yen 2024, porcine) plateaus at 85% purity with
    ~50% loss in the last step; and TurtleTree, which DOES use chromatography, still specifies
    only >=80% protein with <=9.5% ash. A UF/DF-only case should be modelled as the optimistic
    bound, with CEX as the base case.

