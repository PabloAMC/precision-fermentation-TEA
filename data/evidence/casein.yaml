    monomer/dimer mixture is a real product-quality question, not a settled fact. Computed here:
    C1083H1707N287O338S6, 24,349 Da unphosphorylated, 25,228 Da with 11 P; 16.51 wt% N,
    N x 6.06 = protein. Mature sequence:
    KNTMEHVSSSEESIISQETYKQEKNMAINPSKENLCSTFCKEVVRNANEEEYSIGSSSEESAEVATEEVKITVDDKHYQKALNEINQFYQKFPQYLQYLYQGPIVLNPWDQVKRNAVPITPTLNREQLSTSEENSKKTVDMESTEVFTKKTKLTEEEKNRLNFLKKISQRYQKFALPQYLKTVYQHQKAMKPWIQPKTKVIPYVRYL

- key: casein_kappa_uniprot_mature_chain
  value: "P02668 chain 22-190"
  unit: residue range of the mature secreted chain (precursor numbering)
  grade: A
  source: "UniProtKB P02668 (CASK_BOVIN), Kappa-casein, Bos taurus; entry version 175, sequence version 1, last annotation update 2026-09-02"
  doi_or_url: https://rest.uniprot.org/uniprotkb/P02668.json
  locator: "features: Signal 1-21; Chain 22-190; Site 126-127 'Cleavage; by chymosin/rennin'; Disulfide bond 32-109 (plus interchain forms); 8 'Glycosylation' O-linked (GalNAc) at 142, 152, 153, 154, 157, 163, 170, 186; Modified residue Phosphoserine 148, 170, 187 and Phosphothreonine 166"
  quote: "Kappa-casein stabilizes micelle formation, preventing casein precipitation in milk"
  read: fulltext
  note: >-
    169 residues and the odd one out in every respect. 21-residue signal peptide (not 15). The
    N-terminal Gln22 is a pyrrolidone carboxylic acid (cyclised Gln) in the mature protein.
    ONE INTRACHAIN DISULFIDE Cys32-Cys109 (mature 11 and 88), and UniProt also lists both cysteines
    as INTERCHAIN disulfides "in linked form", i.e. kappa-casein polymerises through them.
    EIGHT O-GalNAc sites, all in the C-terminal macropeptide region (mature 121-165), one of them
    (Ser170 / mature 149) alternately phosphorylated or glycosylated: no microbial host reproduces
    this mucin-type glycosylation. Only 1-2 phosphates. Chymosin cuts between precursor 126 and 127
    (mature Phe105-Met106), releasing glycomacropeptide - the reaction all rennet cheese depends on.
    Computed here: C849H1323N223O262S4, 18,974 Da unphosphorylated and unglycosylated
    (glycans add ~0.6-2 kDa per site in milk); 16.46 wt% N, N x 6.07 = protein. Mature sequence:
    QEQNQEQPIRCEKDERFFSDKIAKYIPIQYVLSRYPSYGLNYYQQKPVALINNQFLPYPYYAKPAAVRSPAQILQWQVLSNTVPAKSCQAQPTTMARHPHPHLSFMAIPPKKNQDKTEIPTINTIASGEPTSTPTTEAVESTVATLEDSPEVIESPPEINTVQVTSTAV

- key: casein_signal_peptides_confirmed_by_patent
  value: {as1: 15, as2: 15, beta: 15, kappa: 21}
  unit: signal-peptide length (residues) removed to give the mature chain
  grade: B
  source: "Standing Ovation. US 2024/0251812 A1, 'Method for producing casein and uses thereof', Table 1; Perfect Day US 11,457,649 B2 Example 1"
  doi_or_url: https://patents.google.com/patent/US20240251812A1/en
  locator: "US20240251812A1 Table 1 'Sequences of natural caseins (precursors) and of the related recombinant proteins'; US11457649 Example 1 'Vectors'"
  quote: "removed 15 or 21-residue signal peptide from N-terminal end; added XhoI (CTC GAG) endonuclease recognition sequence and KEX endopeptidase recognition sequence (AAA AGA) to 5' end of DNA"
  read: fulltext
  note: >-
    Independent confirmation that industry uses exactly the UniProt chain boundaries: the quote is
    Perfect Day (K. lactis, alpha-MF fusion, KEX2 processing), and Standing Ovation's Table 1 shows
    the same mature sequences with a single added N-terminal Met for cytoplasmic E. coli expression
    (MRELEELN... for beta, MRPKHPIK... for alpha-s1, MKNTMEHV... for alpha-s2). Eden Brew's K.
    phaffii product instead carries a four-residue EAEA extension from incomplete signal cleavage
    (see casein_beta_eden_brew_identity), and Formo's E. coli product carries the extra Met
    (200 aa instead of 199).

- key: casein_shares_of_total_casein
  value: {as1: 41.9, as2: 13.5, beta: 34.4, kappa: 10.2}
  unit: "% of total casein (w/w), derived from g/100 g true protein"
  grade: A
  source: "Heck JML, van Valenberg HJF, Dijkstra J, van Hooijdonk ACM. Seasonal variation in the Dutch bovine raw milk composition. J Dairy Sci 92(10):4745-4755 (2009), Table 3"
  doi_or_url: 10.3168/jds.2009-2146
  locator: "Table 3 (already in data/evidence/milk_egg.yaml as milk_blg_ala_share_true_protein_heck2009)"
  quote: "alpha_s1_cn 33.5, alpha_s2_cn 10.8, beta_cn 27.5, kappa_cn 8.2 (g/100 g of true protein)"
  read: fulltext
  note: >-
    DERIVED (mine): the four caseins sum to 80.0 g/100 g true protein, so within total casein
    alpha-s1 41.9%, alpha-s2 13.5%, beta 34.4%, kappa 10.2%. Cross-checks: Eden Brew's dossier says
    "Beta-casein, as a family, makes up approximately 35% of the total casein content in bovine
    milk" (FSANZ A1342 Application p.42) and FSANZ SD1 says beta-casein is "approximately 30% of
    the total milk protein content" (that second figure is too high - 27.5/100 of true protein is
    the measured value). Absolute concentrations, using 26 g total casein/kg milk (Tetra Pak, in
    milk_egg.yaml): alpha-s1 10.9, alpha-s2 3.5, beta 8.9, kappa 2.7 g/kg milk (mine). A1/A2 is a
    beta-casein allele, not a quantity: variant frequency does not change the share.

- key: casein_a1_a2_variant_site
  value: 67
  unit: mature-chain residue where A1 (His) and A2 (Pro) differ
  grade: A
  source: "FSANZ. Supporting document 1 - Risk and technical assessment, Application A1342 (Eden Brew), 9 July 2026, sect. 5.2"
  doi_or_url: https://www.foodstandards.gov.au/sites/default/files/2026-07/A1342%20Supporting%20document%201_Risk%20and%20technical%20assessment.pdf
  locator: "sect. 5.2 'Bovine beta-casein', p.14"
  quote: "Among its naturally occurring variants, A1 and A2 are most common and differ by a single amino acid at position 67 (Cieslinska et al 2022)."
  read: fulltext
  note: >-
    Mature residue 67 = precursor residue 82, the UniProt Natural variant "P -> H in variants A1,
    B, C, F and G". UniProt's reference sequence is therefore A2. Eden Brew's dossier adds the
    commercial logic: "A2 Beta-casein is one of two naturally occurring genetic variants, the other
    being A1 that is the predominant form found in milk produced in Australia. Due to its
    prevalence and consumer preference, the A2 variant was selected" and claims A2 is "commonly
    associated with improved coagulation properties and firmer curd formation". For the model this
    is a labelling/price-premium question, not a process parameter: the two sequences differ by one
    residue and 40 Da.

# =======================================================================================
# 2. Commercial PF casein: who makes what, in which host, with what regulatory document
# =======================================================================================

- key: casein_beta_eden_brew_process
  value: null
  unit: qualitative process train (commercial PF beta-casein, K. phaffii, methanol-free)
  grade: A
  source: "FSANZ Application A1342 (Eden Brew Pty Ltd), 'Beta-casein Protein Preparation Produced via Precision Fermentation'; Supporting document 1, sect. 2.1; Application sect. B.1"
  doi_or_url: https://www.foodstandards.gov.au/food-standards-code/applications/a1342-beta-casein-protein-preparation-gm-komagataella-phaffii
  locator: "SD1 sect. 2.1 p.5; Application sect. B.1 p.38 (Figure 1 flow chart)"
  quote: "The expressed beta-casein protein is secreted into the fermentation medium in soluble form. Fermentation medium containing the beta-casein protein is separated from the yeast biomass by centrifugation and then subjected to micro-filtration, pH adjustment and heat treatment prior to concentration by ultrafiltration, and diafiltration to exchange the fermentation medium for water. In the final step, the pH is adjusted and the preparation dried."
  read: fulltext
  note: >-
    THE KEY DOCUMENT for a methanol-free, secreted, UF/DF-only casein route, and the first
    PF-casein dossier anywhere with a public risk assessment. Flow sheet: seed -> production
    fermenter -> centrifuge -> microfiltration -> pH adjust + heat treat -> UF -> DF (into water)
    -> pH adjust -> dry. NO chromatography and NO isoelectric precipitation. Strain EB-ST-537 from
    K. phaffii NRRL Y-7556: one copy of bovine CSN2 "under the control of a synthetic promoter that
    is activated under methanol free conditions", one S. cerevisiae helper gene, two synthetic
    transcription modulators, and two endogenous protease ORFs deleted. Assessed under the General
    Procedure; call for submissions 9 July - 20 August 2026; FSANZ accepted it in Dec 2025 as
    Australia's first PF novel-food application. Titer, batch size above 500 L, feed composition
    and recoveries are all Confidential Commercial Information.

- key: casein_beta_eden_brew_spec
  value: {protein_frac: 0.2245, beta_casein_frac_of_protein: 0.25, beta_casein_frac_powder: 0.055, carbohydrate_frac: 0.683, ash_frac: 0.021, moisture_frac: 0.054, fat_frac: 0.0165}
  unit: mass fractions of the spray-dried powder (means of 4 commercial 500 L batches)
  grade: A
  source: "FSANZ A1342 (Eden Brew), Application Table 3 'Proximate and sugar analysis of BCPP1 from EB-ST-537' and sect. B.5; FSANZ SD1 Table 1 (proposed Code specification)"
  doi_or_url: https://www.foodstandards.gov.au/sites/default/files/2026-07/A1342%20Application.pdf
  locator: "Application Table 3, p.24 and sect. B.5 p.47 (Table 12); SD1 Table 1, pp.7-8"
  quote: "Beta-casein comprised approximately 5-6 % of the total weight in each sample, with Beta-casein purity, expressed as a proportion of total protein, ranging from 22-28 %. Total protein content across the three batches was consistent, measuring at 22.7 %, 21.6 %, and 22.5 % respectively."
  read: fulltext
  note: >-
    THE SINGLE MOST IMPORTANT SPEC FINDING FOR THE MODEL, and it cuts against the lactoferrin
    analogy: the first commercial PF casein going through a regulator is NOT a purified protein.
    It is 22% protein, of which only ~25% is beta-casein (so ~5.5 wt% product), 68% yeast-derived
    carbohydrate ("presumed to be fermentation-derived mannans, beta-glucans and chitin fragments
    originating from the host organism's cell wall"), 2.1% ash, 5.4% moisture. FSANZ's proposed
    Code specification is deliberately loose: total protein 20-24%, carbohydrate <=70%, fat <=3%,
    ash <=3%, moisture <=6%, total sugars <=1%, beta-casein ">4% of BCPP1" (the applicant had asked
    for ">20% of total protein"), residual host DNA <10 ng/g, Pb/As/Hg/Cd each <=0.05 mg/kg.
    Energy 1602 kJ/100 g; PDCAAS 0.46-0.61 across batches. Consequence for pf-tea: a UF/DF-only
    train on a K. phaffii broth co-concentrates mannan with the product, and the achievable powder
    purity is ~25% of protein, not the >90% of the lactoferrin CEX train. Reaching a dairy-casein
    spec (>=90% protein) needs a capture step this process does not have.

- key: casein_beta_eden_brew_identity
  value: null
  unit: qualitative (PTMs and N-terminus of commercial K. phaffii beta-casein)
  grade: A
  source: "FSANZ A1342 (Eden Brew), SD1 sects. 5.2.1-5.2.2; Application sect. B.6"
  doi_or_url: https://www.foodstandards.gov.au/sites/default/files/2026-07/A1342%20Supporting%20document%201_Risk%20and%20technical%20assessment.pdf
  locator: "SD1 pp.14-15; Application pp.50-51 (Table 14)"
  quote: "In contrast, O-linked glycosylation was consistently observed at five distinct serine (S) or threonine (T) residues (Table 14). ... The glycan structures identified at these positions were simple mannose-based units typical of glycosylation patterns in K. phaffii-derived proteins."
  read: fulltext
  note: >-
    Two deviations from native beta-casein, both disclosed: (i) N-terminus - LC-MS/MS and Edman
    both find a predominant form with a four-residue EAEA extension from the alpha-MF-type signal,
    plus a minor species lacking the initial Arg; (ii) five O-linked mannose glycans and NO
    credible N-glycosylation. PHOSPHORYLATION IS NOT REPORTED ANYWHERE IN THE DOSSIER - the
    applicant describes the native protein as "23.6 kDa for the primary structure prior to
    post-translational phosphorylation, and 24.0 kDa following phosphorylation of 5 Ser residues"
    but gives no phospho-analysis of its own product, and FSANZ does not ask for one. Treat Eden
    Brew's beta-casein as of UNKNOWN phosphorylation (most likely low), and note that the dossier
    cites Choi & Jimenez-Flores 2001 for the claim that K. phaffii glycosylates up to 30% of
    beta-casein - the same paper that reports normal phosphorylation in that host.

- key: casein_as1_formo_newmilkbuzz_process
  value: null
  unit: qualitative process train (commercial PF alpha-s1-casein, E. coli, isoelectric precipitation)
  grade: A
  source: "Formo Foods GmbH & NewMilkBuzz BV. FDA GRAS Notice GRN 1312, 'Recombinant alphaS1-casein from Bos taurus produced by Escherichia coli DSM 35603', 19 December 2025; sect. 2.3.1 and Figure 6"
  doi_or_url: https://downloads.regulations.gov/FDA-2026-N-1832-0021/attachment_1.pdf
  locator: "sect. 2.3.1 'Description of the method of manufacture', p.20; Figure 6 flow chart p.21"
  quote: "The downstream processing begins with harvesting the fermentation broth under controlled conditions, followed by washing the biomass using microfiltration to reduce impurities, with the pH adjusted to 5.5. Proteins are then extracted through acid extraction and heat treatment, where the pH is lowered to 1.8 before heating. After biomass removal via centrifugation, lipopolysaccharides (LPS) are precipitated by raising the pH to 10.5 using sodium hydroxide (NaOH). The stream is then clarified through filtration. The target protein is precipitated by lowering the pH to 4 using phosphoric acid and recovered using filtration or decanting equipment. Finally, the recovered solids are dried to achieve the desired moisture content."
  read: fulltext
  note: >-
    THE REFERENCE PRECIPITATION ROUTE, and the answer to "does any PF dossier precipitate at the
    isoelectric point?": yes - pH 4 with phosphoric acid, recovered by filtration or DECANTING,
    i.e. the dairy acid-casein unit operations applied to a fermentation broth. Flow: inoculation
    -> fermentation -> whole-cell-broth harvest -> biomass washing (MF, pH 5.5) -> acid + heat
    extraction at pH 1.8 -> biomass removal (centrifuge) -> LPS precipitation at pH 10.5 (NaOH) ->
    polishing filtration -> casein precipitation at pH 4 (H3PO4) -> drying. No chromatography, no
    UF/DF. The chemical bill is therefore acid down to 1.8, NaOH up to 10.5, H3PO4 down to 4 -
    three large pH swings on the whole broth, which in a cost model is a reagent and
    salt/wastewater line, not a membrane line. Host is engineered E. coli Nissle 1917 (strain
    F1238 = DSM 35603), arabinose-induced, chemically defined medium, no antibiotics. FDA letter
    still "Pending" (page last updated 24 Sep 2026); the joint Formo/Those Vegan Cowboys filing was
    submitted Dec 2025 and published for review in 2026.

- key: casein_as1_formo_spec
  value: {protein_min_frac: 0.90, as1_min_frac_of_protein: 0.97, moisture_max: 0.05, fat_max: 0.02, ash_max: 0.05}
  unit: mass fractions of the powder
  grade: A
  source: "FDA GRAS Notice GRN 1312 (Formo Foods / NewMilkBuzz), Table 3 'Specifications for aS1-CN' and Table 4 batch analysis"
  doi_or_url: https://downloads.regulations.gov/FDA-2026-N-1832-0021/attachment_1.pdf
  locator: "Table 3, p.24; Table 4, pp.26-27; Appendix I CoAs"
  quote: "Moisture <= 5 g/100g | Crude protein >= 90 g/100g | as1-casein % of protein > 97 g/100g | Total fat <= 2 g/100g | Ash < 5 g/100g"
  read: fulltext
  note: >-
    This is the spec a precipitation route CAN hit, and it is close to the dairy acid-casein
    standard (Southward: 85.4% protein as-is, i.e. ~96% dry basis; Tetra Pak extra grade: 95%
    protein dry basis, <=10% moisture, <=2.2% ash). Three non-consecutive batches: crude protein
    (N x 6.25) 93.16 / 96.54 / 95.31 g/100 g, moisture 1.0 / 0.8 / 0.3 g/100 g, pH 3.68-4.18 (the
    product is left at its precipitation pH, acid casein - NOT a caseinate), all heavy metals
    below LOQ. Endotoxin 6-105 EU/mg is the price of an E. coli host (the dossier devotes several
    pages to it). Use level sought: up to 25 g/100 g in cheese analogues. CONTRAST WITH EDEN BREW:
    same product class, 90% vs 22% protein, because one precipitates and the other only ultrafilters.

- key: casein_as1_formo_no_phosphorylation
  value: 0
  unit: phosphorylation sites detected in the commercial recombinant alpha-s1-casein
  grade: A
  source: "FDA GRAS Notice GRN 1312 (Formo Foods / NewMilkBuzz), sect. 2.1.2.1 peptide fingerprinting by LC-MS/MS"
  doi_or_url: https://downloads.regulations.gov/FDA-2026-N-1832-0021/attachment_1.pdf
  locator: "sect. 2.1.2.1, p.14 (Figure 7)"
  quote: "No phosphorylation was detected in the recombinant aS1-casein protein across any of the analyzed batches of aS1-CN. In contrast, in native bovine aS1-casein, phosphorylation was observed at three of the reported phosphorylation sites"
  read: fulltext
  note: >-
    The cleanest public statement that a commercial PF casein is completely unphosphorylated, from
    the notifier's own mass spectrometry. Note the comparison is unflattering to the method as well:
    only 3 of 8-9 sites were seen even in the native dairy control, so "no phosphorylation" means
    none detected by trypsin/AspN peptide fingerprinting, and the company nevertheless sells it for
    cheese analogues at up to 25%. Together with casein_function_phosphorylation_needed below, this
    is the central scientific tension in the whole product category.

- key: casein_beta_fermify_grn1228_withdrawn
  value: null
  unit: qualitative (withdrawn GRAS notice; inclusion-body route; liquid product)
  grade: A
  source: "Fermify GmbH. FDA GRAS Notice GRN 1228, 'beta-casein produced by E. coli DSM 35048', 14 October 2024; FDA cease-evaluation letter, 13 June 2025"
  doi_or_url: https://downloads.regulations.gov/FDA-2025-N-1927-0069/attachment_1.pdf
  locator: "GRN 1228 sects. 2.1, 2.3.1, 2.4 (pp.12-17); FDA letter https://www.fda.gov/media/192477/download"
  quote: "The cells harvested by centrifugation at the end of the fermentation are disrupted by high pressure homogenization and subsequently washed by resuspension in fresh buffer. ... Centrifugation is then performed to separate and remove cell debris and obtain inclusion bodies (IBs). The IBs separated from cell debris are solubilized to yield crude, soluble beta-casein. The solution is subjected to sequential precipitation and flocculation steps for the removal of impurities ... Tangential flow filtration is performed to adjust protein titer and for final product formulation."
  read: fulltext
  note: >-
    The third public PF-casein route, and the only INCLUSION-BODY one: homogenise, wash, recover
    IBs, solubilise, precipitate/flocculate impurities, UF to concentration. The product is a
    LIQUID at min 2% protein (1.5-4% w/w) in sodium phosphate buffer, pH 6.5-7.5, >=75% of protein
    being beta-casein, stored at <=4 C - i.e. Fermify did not dry it, and the dossier even says
    "Users may therefore need to concentrate beta-casein produced by E. coli stF_24_139 to reach
    the desired use level". That is exactly what killed the notice: FDA's cease letter says "the
    sodium level in the ingredient is high and the levels of sodium and heavy metals will be
    substantially increased if the beta-casein is to be further concentrated" and asked for
    information on the concentrating process; Fermify requested withdrawal 3 June 2025. Endotoxin
    up to 660,000 EU/g dry matter. T7lac promoter, IPTG/lactose-inducible. Unphosphorylated.
    LESSON FOR THE MODEL: for a bacterial intracellular route the salt load of the formulation
    buffer is a product-quality constraint, not just a cost.

