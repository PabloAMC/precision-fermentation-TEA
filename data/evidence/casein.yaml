  grade: A
  source: "Choi BK, Jimenez-Flores R. Study of putative glycosylation sites in bovine beta-casein introduced by PCR-based site-directed mutagenesis. J Agric Food Chem 44:358-364 (1996)"
  doi_or_url: 10.1021/jf950339i
  locator: "Results 'Production of Mutant Bovine beta-Casein in P. pastoris', p.361; abstract p.358; Methods 'Culture Conditions' p.359"
  quote: "The production of beta-casein was in the range of 15-18% of total soluble proteins, and the estimated beta-casein was approximately 0.7-1.0 g/L."
