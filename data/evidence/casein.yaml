    as Standing Ovation's 3 g/L. NO titer above 1 g/L exists in Table 2 for ANY yeast or fungus; the
    whole-casein maximum in yeast is Choi's intracellular 0.7-1.0 g/L, and the only >1 g/L
    yeast-secreted number in the review is 2.5 g/L of human CMP, a kappa-casein fragment, which the
    authors use as evidence that hydrophobicity is what blocks casein secretion. Their explanation
    for the failure to secrete: unfolded, hydrophobic chains that never release their chaperones,
    triggering UPR/ERAD, possibly with intracellular micelle-like assemblies too large for the yeast
    secretory pathway. DSP, directly relevant to the model's two route variants: "Caseins present
    specific opportunities for downstream processing. They precipitate near pH 4.6 and this behavior
    can be exploited as a simple and cost-effective separation strategy", and affinity tags "are
    generally less suitable for industrial food applications" - so precipitation, not chromatography,
    is the field's expected casein route, as pf-tea assumes. It also warns about scale, the right
    way: "industrial precision fermentation processes can show reduced yields as compared to
    lab-scale processes". Phosphorylation: "phosphorylation is a critical requirement for both casein
    micelle formation and proper acid and rennet coagulation", but it is application-dependent, with
    recombinant non-phosphorylated alpha-s1 shown to stabilise emulsions and foams (Mortes et al.
    2026), and in vitro enzymatic phosphorylation in DSP dismissed as adding "additional unit
    operations, further complicating the workflow and increasing costs". Bovine milk casein total:
    "the average total casein concentration in milk typically ranges from 35 to 40 g/L".

