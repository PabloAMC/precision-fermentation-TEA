- key: kappa_ecoli_periplasmic_oh1991
  value: 0.002
  unit: g/L kappa-casein in the medium-equivalent (periplasmic, E. coli AR68)
  grade: A
  source: "Oh S, Richardson T. Genetic engineering of bovine kappa-casein to improve its nutritional quality. J Agric Food Chem 39:422-427 (1991)"
  doi_or_url: 10.1021/jf00002a040
  locator: "Results 'Quantitation of Expressed K-Casein' and 'Localization of Recombinant K-Casein in E. coli', printed p.426, Fig. 7 (local references/text/Oh1991_kappa_casein_ecoli.txt)"
  quote: "Most of the K-casein was detected in the periplasmic space, and less than 15% of the K-casein was detected in the cytoplasm"
  read: fulltext
  note: >-
    Full text read 2026-10-02; the titer row in titers_rows.csv is now verified. Three points matter
    for pf-tea. (1) The protein is NOT wild-type kappa: three methionines were inserted between
    Ala167 and Thr168 to raise the sulfur-amino-acid score, so this cannot support a bio-identical
    product. (2) The 2 mg/L comes from laser densitometry of a western blot against a bovine
    kappa-casein standard curve, on the extract of 1 mL of an IPTG-induced LB culture harvested 4 h
    after induction at OD600 0.25 - one measurement, no replicates, no cell density at harvest.
    (3) Compartment: periplasm via the OmpA signal, with under 15% cytoplasmic and none detected in
    the membrane; nothing is reported secreted into the medium, and a second cytoplasmic band of
    lower mobility suggests unprocessed signal peptide. The authors close by saying the expression
    level needs improving. This remains the only peer-reviewed bacterial kappa number, and it is
    roughly 2 mg/L against a 10 g/L design basis (DERIVED, mine: a factor of about 5,000).
