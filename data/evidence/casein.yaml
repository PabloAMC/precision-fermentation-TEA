# data/evidence/casein.yaml: evidence for adding CASEIN as a pf-tea product (research pass 2026-10-01).
# Format: data/evidence/README.md. Grades: A measured/official; B published design basis or patent
# example; C company claim/survey/trade press; D analogy; E guess.
# Everything below was read as raw text: UniProt REST JSON, FSANZ and FDA PDFs via pdftotext,
# Europe PMC full-text XML, publisher HTML read in the browser pane, Google Patents description HTML,
# the Internet Archive scan of the Tetra Pak Dairy Processing Handbook, UN Comtrade JSON.
# No summarising web-fetch tool supplied any number or quote. Items with `quote: null` are leads.
# Downloads kept in references/inbox/casein/ (git-ignored): FSANZ A1342 (application, CfS, SD1, SD2,
# admin assessment, executive summary), FDA GRN 1312 and GRN 1228 + cease letter, Mora Vasquez 2025,
# Biermann 2025, Southward NZIC 'Casein products', Tetra Pak handbook OCR text, Standing Ovation PR.
#
# Titer rows live in the companion file (scratchpad) casein_titers.csv, in data/titers.csv format.
# Prices are NOT re-done here: see data/evidence/prices.yaml (casein_acid_us_dmn_annual,
# casein_rennet_us_dmn_annual, casein_food_eu_export_unit_value, casein_price_range_gfi2025) and
# data/evidence/milk_egg.yaml (milk_casein_tetrapak, milk_casein_share_heck2009).

# =======================================================================================
# 1. Product identity: the four bovine caseins, sequences, PTMs, variants, shares
# =======================================================================================

- key: casein_beta_uniprot_mature_chain
  value: "P02666 chain 16-224"
  unit: residue range of the mature secreted chain (precursor numbering)
  grade: A
  source: "UniProtKB P02666 (CASB_BOVIN), Beta-casein, Bos taurus; entry version 195, sequence version 2, last annotation update 2026-09-02"
  doi_or_url: https://rest.uniprot.org/uniprotkb/P02666.json
  locator: "features: Signal 1-15; Chain 16-224 'Beta-casein'; 5 'Modified residue' = Phosphoserine at 30, 32, 33, 34, 50; comment POLYMORPHISM"
  quote: "Leu-152 is present in the variants F and G; Gln-190 and Glu-210 are present in the variant H. The sequence shown is the A2 variant"
  read: fulltext
  note: >-
    209 residues after the 15-residue signal peptide. UNIPROT CARRIES A2: the A1/A2 site is
    precursor residue 82 (mature 67), listed as a Natural variant "P -> H in variants A1, B, C, F
    and G", so the reference sequence (Pro82) is A2 - exactly what Eden Brew expresses and what
    Fermify's withdrawn dossier used. 5 phosphoserines (mature numbering 15, 17, 18, 19, 35; the
    first four are the phosphate centre). NO cysteine, so no disulfides, and no N-glycosylation
    sequon. Computed here from the mature chain: C1080H1692N268O310S6, average MW 23,583 Da
    unphosphorylated and 23,983 Da with 5 phosphates (+79.97 Da each); 15.92 wt% N, so N x 6.28 =
    protein (the dairy factor N x 6.38 overstates beta-casein protein by ~1.6%, much less than for
    lactoferrin); 35 prolines = 16.7% of residues, which is why it has almost no secondary
    structure and is protease-sensitive. Mature sequence (becomes data/products/casein_beta.yaml):
    RELEELNVPGEIVESLSSSEESITRINKKIEKFQSEEQQQTEDELQDKIHPFAQTQSLVYPFPGPIPNSLPQNIPPLTQTPVVVPPFLQPEVMGVSKVKEAMAPKHKEMPFPKYPVEPFTESQSLTLTDVENLHLPLPLLQSWMHQPHQPLPPTVMFPPQSVLSLSQSKVLPVPQKAVPYPQRDMPIQAFLLYQEPVLGPVRGPFPIIV

- key: casein_as1_uniprot_mature_chain
  value: "P02662 chain 16-214"
  unit: residue range of the mature secreted chain (precursor numbering)
  grade: A
  source: "UniProtKB P02662 (CASA1_BOVIN), Alpha-S1-casein, Bos taurus; entry version 178, sequence version 2, last annotation update 2026-09-02"
  doi_or_url: https://rest.uniprot.org/uniprotkb/P02662.json
  locator: "features: Signal 1-15; Chain 16-214; 9 'Modified residue' = Phosphoserine at 56, 61, 63, 79, 81, 82, 83, 90, 130; Natural variant 29-41 'in variant A'"
  quote: "{\"type\":\"Signal\",\"location\":{\"start\":{\"value\":1},\"end\":{\"value\":15}}} ... {\"type\":\"Chain\",\"description\":\"Alpha-S1-casein\",\"location\":{\"start\":{\"value\":16},\"end\":{\"value\":214}}}"
  read: fulltext
  note: >-
    199 residues. UniProt lists NINE phosphoserines (mature 41, 46, 48, 64, 66, 67, 68, 75, 115),
    whereas FDA GRN 1312 and Farrell et al. 2004 describe the mature protein as phosphorylated at
    EIGHT sites with a ninth (Ser115, "alpha-s1-casein 9P") only in a minor species - use 8 for the
    mass balance and say so. No cysteine. The B variant is the reference; variant A lacks precursor
    residues 29-41 (mature 14-26), the 13-residue deletion that Mortes et al. 2026 show changes the
    interfacial configuration and foam stability; variant C is Glu192->Gly (mature 177). Computed
    here: C1035H1587N265O317S5, 22,975 Da unphosphorylated, 23,615 Da with 8 phosphates (GRN 1312
    quotes 22.98 kDa and 23.6 kDa, which matches); 16.16 wt% N, N x 6.19 = protein. Mature sequence:
    RPKHPIKHQGLPQEVLNENLLRFFVAPFPEVFGKEKVNELSKDIGSESTEDQAMEDIKQMEAESISSSEEIVPNSVEQKHIQKEDVPSERYLGYLEQLLRLKKYKVPQLEIVPNSAEERLHSMKEGIHAQQKEPMIGVNQELAYFYPELFRQFYQLDAYPSGAWYYVPLGTQYTDAPSFSDIPNPIGSENSEKTTMPLW

