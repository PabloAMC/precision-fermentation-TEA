    casein_as1_variant_a_secretion_kphaffii) and Biermann's B. subtilis (56.9 mg/L). Precipitation
    pH: measured pI 5.2 (IEF) vs commercial pH 4.0 vs model's 4.5 for beta; no recovery or
    solubility-vs-pH curve for recombinant alpha-s1 is public, so dsp.acid_precip_recovery (0.95,
    D) carries over by analogy (D). No crude-extract mass is given for the 10 L run, so no titer.
    JUDGEMENT: for an intracellular E. coli alpha-s1 case the honest DSP is "cas acid route + an
    intracellular front end" (homogeniser or acid-heat lysis, centrifuge); whether pf-tea's existing
    intracellular/lysis unit operations (if any) can be bolted on is a modelling question for Pablo.

