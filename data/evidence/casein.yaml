  unit: kt/yr global casein market volume, 2025
  grade: C
  source: "IMARC Group. Casein Market Report by Product Type (Rennet Casein, Acid Casein), End Use, and Region 2026-2034, report SR112026A708, last updated 23 April 2026"
  doi_or_url: https://www.imarcgroup.com/casein-market
