  doi_or_url: https://patents.google.com/patent/US11457649B2/en
  locator: "US11457649 col. 57-58 (OCR, two-column interleaved); formulas.txt"
  quote: "Kappa-casein is inherently hydrophilic and purification of the K-caseins involves the change in pH of the solution to 4.6, followed by centrifugation at 10,000 rcf"
  read: fulltext
  note: >-
    Quote de-interleaved from the OCR columns (wording otherwise verbatim; check against the PDF).
    No public source gives a measured solubility curve or a recovery for ISOLATED (or recombinant)
    kappa-casein at pH 4.5-4.6; Perfect Day's sentence is a generic patent description with no
    number. What is known: (1) in milk, kappa precipitates WITH the other caseins at pH 4.6 (it is in
    acid casein; Hill-1963 kappa preparations start from acid casein); (2) kappa is
    calcium-insensitive (kappa_calcium_insensitive_raynes2024), so it is the casein LEAST likely to
    be pulled down by calcium; (3) computed pI (mine, Henderson-Hasselbalch on the mature sequence):
    unphosphorylated, unglycosylated kappa 5.85 (net charge +4.4 at pH 4.6), 1P 5.36; native
    literature 5.4-5.6. Recombinant alpha-s1 measured 5.2 (as1_recombinant_isoelectric_point_ief)
    and recombinant beta 5.5 by zeta-potential yet least soluble at pH 4.5 (Chezan 2026); so a
    recombinant kappa would likely need precipitation at pH ~5.5-6, NOT 4.5, if it precipitates
    cleanly at all. The C-terminal third (macropeptide, pI ~3.7 computed, ~4 measured for GMP per
    Thoma 2006 cited in Neelima et al. 2013, PMC3567326) is highly soluble; New Culture saw that
    removing 16 C-terminal residues raised the micelle pI so acidification had to stop at ~pH 5.8.
    JUDGEMENT (D): the acid route is plausible for kappa only as part of an alpha-s1 + kappa
    co-precipitate (kappa as ~10-15% of the casein, as in milk) at a pH between 4.5 and 5.5; a
    stand-alone kappa product should be modelled with a chromatographic capture (e.g. the existing
    'cex' route: kappa carries net positive charge below pH ~5.8, computed) or left as a
    required-titer analysis. Recovery for kappa on the acid route: no data; use the cas
    dsp.acid_precip_recovery low value (0.78) at best, graded E.

