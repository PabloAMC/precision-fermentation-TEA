- key: as1_kappa_formula_crosscheck_uniprot
  value: {as1_mature: "C1035H1587N265O317S5", as1_mature_MW_Da: 22974.6, as1_8P_MW_Da: 23614.3, kappa_mature_SS: "C849H1321N223O262S4", kappa_mature_SS_MW_Da: 18972.2, kappa_mature_noSS: "C849H1323N223O262S4", kappa_mature_noSS_MW_Da: 18974.2}
  unit: elemental formula and average mass of the unphosphorylated, unglycosylated mature chain
  grade: A
  source: "UniProtKB P02662 (CASA1_BOVIN, entry v178, seq v2) and P02668 (CASK_BOVIN, entry v175, seq v1), last annotation update 2026-09-02; arithmetic mine"
  doi_or_url: "https://rest.uniprot.org/uniprotkb/P02662.json ; https://rest.uniprot.org/uniprotkb/P02668.json"
  locator: "sequence.molWeight (precursor): P02662 24529, P02668 21269; features Signal, Chain, Disulfide bond, Modified residue, Glycosylation"
  quote: null
  read: fulltext
  note: >-
    Derived (mine). Method check: the same residue table applied to the FULL PRECURSOR gives 24528.6 Da
    (P02662) and 21269.1 Da (P02668), matching UniProt's molWeight 24529 and 21269 to <1 Da, so the
    mature-chain formulas in casein.yaml are confirmed. alpha-s1 (mature 16-214, 199 aa, B variant): 0 Cys,
    5 Met, 2 Trp, 17 Pro; 16.16 wt% N (N x 6.19). With 8 phosphates (+79.966 Da each, GRN 1312 convention)
    23,614 Da; with 9, 23,694. kappa (mature 22-190, 169 aa, UniProt reference = variant A; B differs at
    precursor 157 and 169): 2 Cys (mature 11 and 88), 2 Met, 1 Trp, 20 Pro; 16.46 wt% N (N x 6.07). The
    model's convention (as for lactoferrin) should subtract 2 H per disulfide: casein.yaml lists H1323 (no
    disulfide); with the one intrachain Cys11-Cys88 bond it is H1321 (18,972.2 Da). In milk only ~10% of
    kappa is that monomer (Iaria 2026, below); the rest is disulfide-linked oligomers, which have the SAME
    formula per monomer (one S-S per chain on average), so H1321 is right for both. The N-terminal Gln is
    cyclised to pyroglutamate in milk (-NH3): C849H1318N222O262S4, 18,955 Da; whether a microbial host
    cyclises it is unknown (spontaneous at low pH and heat; not measured for any recombinant kappa found).
    Chymosin site Phe105-Met106 (precursor 126-127): para-kappa (1-105) 12,285 Da and caseinomacropeptide
    (106-169, 64 aa) 6,707 Da, i.e. the CMP is 35.3% of the unglycosylated kappa mass (mine). Mass of PTMs
    ignored in the formula: alpha-s1 8 P = 2.8% of mass; kappa 1 P + up to 8 GalNAc-based glycans in milk
    (none expected from bacteria; yeast adds O-mannose instead).

