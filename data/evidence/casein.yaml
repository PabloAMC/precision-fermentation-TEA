  unit: residue range of the mature secreted chain (precursor numbering)
  grade: A
  source: "UniProtKB P02663 (CASA2_BOVIN), Alpha-S2-casein, Bos taurus; entry version 159, sequence version 2, last annotation update 2026-09-02"
  doi_or_url: https://rest.uniprot.org/uniprotkb/P02663.json
  locator: "features: Signal 1-15; Chain 16-222; 13 'Modified residue' = Phosphoserine at 23, 24, 25, 28, 46, 71, 72, 73, 76, 144, 146, 150, 158; comment POLYMORPHISM"
