  read: html
  note: >-
    A paywalled market report's public teaser, hence grade C, but it is the only world PRODUCTION-
    scale figure found and it is consistent with the trade data (443 kt made, 208-282 kt crossing a
    border). It segments by rennet vs acid casein but gives NO public split. Earlier survey figure
    in docs/PROTEIN_CANDIDATES.md ("ADL: 486 kt at $7/kg") is the same order. On the acid/rennet
    question the only sourced qualitative statements I found are Tetra Pak's "Acid casein dominates
    the world markets" (ch.20, 'Uses of caseins and caseinates') and Southward's note that lactic
    acid casein is the usual NZ product while HCl dominates in Australia and Europe and H2SO4 in
    New Zealand (because HCl is expensive there and H2SO4 is a fertiliser-industry by-product).
    A QUANTITATIVE ACID-VS-RENNET SPLIT WAS NOT FOUND - see the E-list in the report.
    SCALE CHECK (mine): 443 kt/yr of casein at 26 g casein per kg milk implies ~17 Mt of skim milk
    per year, ~2% of world milk; and a single 100 m3 PF plant at 10 g/L, 328 batches/yr and 85%
    recovery would make ~0.28 kt/yr, i.e. 0.06% of the casein market - the market is not the
    constraint, cost is.

- key: casein_pf_use_level_cheese_analogue
  value: 0.25
  unit: mass fraction of recombinant casein in a cheese analogue (maximum intended use)
  grade: A
  source: "FDA GRAS Notice GRN 1312 (Formo Foods / NewMilkBuzz), intended use; GRN 1228 (Fermify) intended use"
  doi_or_url: https://www.hfpappexternal.fda.gov/scripts/fdcc/index.cfm?set=GRASNotices&id=1312
  locator: "FDA GRAS inventory entry for GRN 1312; GRN 1228 sect. 3.1 p.19"
  quote: "Intended for use as an ingredient at up to 25g per 100g in cheese analogs (excluding use in infant formula and products under the jurisdiction of the U.S. Department of Agriculture)."
  read: html
  note: >-
    Sets the cost-in-use arithmetic: at 25% inclusion, 1 kg of PF casein makes 4 kg of cheese
    analogue, so a 10 USD/kg casein contributes 2.5 USD/kg to the analogue. Fermify's withdrawn
    notice sought up to 15 g/100 g in cheese and cheese analogues and 3.8 g/100 g in beverages,
    dairy analogues, frozen desserts, milk products and plant-protein products; Eden Brew seeks a
    general permission for "a wide range of foods" with no numeric maximum (FSANZ assessed a mean
    dietary intake rather than a use level). Note the exclusion of infant formula in GRN 1312 -
    the high-value application lactoferrin enjoys is explicitly NOT on the table for casein yet.
