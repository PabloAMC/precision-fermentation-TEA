# =======================================================================================
# 4. Downstream physics: pI, solubility, and the incumbent acid-casein process with numbers
# =======================================================================================

- key: casein_isoelectric_point
  value: 4.6
  low: 4.0
  high: 4.8
  unit: pH of the isoelectric point of whole casein (precipitation pH)
  grade: A
  source: "Tetra Pak. Dairy Processing Handbook, chapter 20 'Casein' (Internet Archive scan of the printed edition); Southward CR, 'Casein products', New Zealand Institute of Chemistry, III-Dairy-E"
  doi_or_url: "https://archive.org/download/DairyProcessingHandbookTetrapak/Dairy-Processing-Handbook-Tetrapak_djvu.txt ; https://nzic.org.nz/unsecure_files/book/3E.pdf"
  locator: "Tetra Pak ch.20 'Acid casein'; Southward 'Introduction' and 'Extraction of casein from milk'"
  quote: "The milk is acidified to the isoelectric point of casein, which is usually reckoned to be pH 4.6, but it is shifted by the presence of neutral salts in solution and may be anywhere within a range extending from pH 4.0 to pH 4.8."
  read: fulltext
  note: >-
    Whole casein, as precipitated industrially. Per-protein values differ and the phosphates are
    why: computed here from the mature sequences (Henderson-Hasselbalch, standard pKa, phosphoserine
    as a diprotic group pKa ~1.5/6.0) - alpha-s1 pI 4.69 unphosphorylated and 4.18 with 8 P;
    beta 4.94 and 4.42 with 5 P; alpha-s2 8.45(!) unphosphorylated and 4.70 with 11 P; kappa 5.88
    and 5.42 with 1 P. CHECK THESE: they are my arithmetic, not measured, and the alpha-s2 result
    is the one to look at twice - without its phosphates alpha-s2 is a BASIC protein, so an
    unphosphorylated recombinant alpha-s2 would not co-precipitate with the others at pH 4.6 at all.
    Published measured ranges (WAO guidance, quoted by secondary sources): alpha-s1 4.9-5.0,
    alpha-s2 5.2-5.4, beta 5.1-5.4, kappa 5.4-5.6; Sigma's sheet gives alpha-s1 4.2-4.7 and
    beta 4.6-5.1. The practical consequence is the same in all accounts: an UNPHOSPHORYLATED
    recombinant casein has a pI 0.3-0.5 units LOWER than its native counterpart, so an isoelectric
    precipitation step must be tuned to the recombinant protein, and Formo's pH 4 (not 4.6) is
    consistent with that.

- key: casein_solubility_vs_ph_and_calcium
  value: null
  unit: qualitative (solubility of casein vs pH; the acid-vs-caseinate distinction)
  grade: A
  source: "Southward CR, 'Casein products', New Zealand Institute of Chemistry, Table 1 and 'Properties of casein products'; FDA GRN 1312 sect. 6.1"
  doi_or_url: https://nzic.org.nz/unsecure_files/book/3E.pdf
  locator: "Southward Table 1 'Composition of casein and caseinates' and section 'Solubility'; GRN 1312 p.49"
  quote: "Acid and rennet casein are insoluble in water. Virtually all applications of casein products require them to be dissolved first. Consequently, before use, acid casein must be dissolved using an alkali to produce a solution with a pH of 6.5 or higher."
  read: fulltext
  note: >-
    The physics the whole product choice rests on. Table 1: solubility in water 0% for acid casein
    and 0% for rennet casein, 100% for sodium caseinate, 90-98% for calcium caseinate. GRN 1312
    states it compactly: "Caseins are heat-stable but precipitate at their isoelectric point
    (pH ~4.6) at 20 C (Farrell et al., 2004)" and are insoluble at pH 4.6 while whey proteins stay
    soluble. Calcium: the calcium-sensitive caseins (alpha-s1, alpha-s2, beta) are precipitated by
    Ca2+ in the millimolar range THROUGH their phosphoserine clusters; kappa-casein is not
    calcium-sensitive and protects the others. I did NOT find a quantitative solubility-vs-pH or
    solubility-vs-[Ca2+] curve for UNPHOSPHORYLATED recombinant casein in any public source -
    that is a genuine gap (see the E-list in the report). The closest public statements are
    (i) Eden Brew's product claim: "It tolerates a pH range of approximately 4.0 to 7.0 ... In
    refrigerated storage (up to 6 weeks at 4 C), no precipitation, sedimentation, or visible phase
    separation has been observed" and "Formulation trials with pH endpoints between 4.2 and 4.5
    confirmed that the ingredient does not precipitate" (FSANZ A1342 Application pp.28-29) - note
    this is a 22%-protein, mannan-rich powder, not pure casein; and (ii) Standing Ovation's patent,
    which precipitates recombinant beta-casein fully only by combining pH 4 WITH heat (below).

- key: casein_pf_patent_acid_precipitation_and_neutralisation
  value: 4
  unit: pH used to precipitate recombinant beta-casein from a clarified E. coli lysate
  grade: B
  source: "Standing Ovation. US 2024/0251812 A1, 'Method for producing casein and uses thereof', Example 7"
  doi_or_url: https://patents.google.com/patent/US20240251812A1/en
  locator: "Example 7 'Purification of Recombinant Beta Casein by Heating and Acid Precipitation'"
  quote: "the pH of the supernatant was decreased to pH 4 with a solution of 0.1 M of HCl and then heated at 40 C or 90 C for 20 min. The suspension was then centrifuged for 20 min at 3220 g ... heating in such acidic conditions resulted in partial precipitation of casein beta at 40 C and full precipitation at 90 C."
  read: fulltext
  note: >-
    The most useful single experiment in any PF-casein document for parameterising a precipitation
    route, and a warning: at 40 C precipitation at pH 4 is only PARTIAL; full precipitation needed
    90 C for 20 min. Dairy practice agrees - Tetra Pak holds mineral-acid curd at 40-45 C after
    acidifying at ~82 C. The same example gives the complete caseinate finish: "the pellet
    containing the precipitated casein was washed once with a solution of H2SO4 pH 4, once with
    sterile water, and resuspended in sterile H2O and the pH adjusted to 7 with 1 M Ca(OH)2,
    resulting in a calcium caseinate suspension", i.e. ONE acid wash + ONE water wash + lime
    neutralisation. Upstream of it, Examples 4-5 replace mechanical lysis with THERMAL lysis:
    95 C for 30-90 min on a water-resuspended cell slurry both lyses the cells and denatures/removes
    host protein, after which "about 3 g of recombinant protein per liter of culture could be
    observed" and the 0.2 um filtrate is "significantly enriched in recombinant protein, which
    eventually represented most of the protein in the preparation" (23% of the dried solids was
    beta-casein in Example 6). Caseins are intrinsically disordered and heat-stable, so heat is a
    purification step for them in a way it is not for BLG or lactoferrin. Also: "Heating in acidic
    conditions is known to promote DNA degradation" - the same step clears host DNA.

- key: casein_dairy_acid_process_tetrapak
  value: null
  unit: qualitative + numbers for the incumbent acid-casein line
  grade: A
  source: "Tetra Pak. Dairy Processing Handbook, chapter 20 'Casein' (printed edition, Internet Archive scan)"
  doi_or_url: https://archive.org/download/DairyProcessingHandbookTetrapak/Dairy-Processing-Handbook-Tetrapak_djvu.txt
  locator: "ch.20, sections 'Mineral acidification - acid casein', 'Continuous washing', 'Sodium caseinate', Table 20.1"
  quote: "The milk is heated to the required temperature, approx. 82 C. Mineral acid is then added to bring the pH of the milk to 4.3 - 4.6. Following the pH check, the milk is heated to 40 - 45 C in a plate heat exchanger and held for about two minutes, when smooth aggregates of casein are formed. To remove as much as possible of the whey before washing starts, the whey/casein mixture is passed through a decanter."
  read: fulltext
  note: >-
    The incumbent design basis, with the numbers the model needs:
    ACID: HCl or H2SO4 to pH 4.3-4.6 (Southward: dilute 0.25 mol/L acid at ~20 C to pH 4.6);
    PRECIPITATION TEMPERATURE: acidify at ~82 C then hold 40-45 C for ~2 min (lactic route: 50-55 C
    after a 14-16 h fermentation at 22-28 C);
    SEPARATION: decanter centrifuge for dewheying and between washes, "either on inclined static
    strainers or in decanters";
    WASHES: "Washing takes place in two or three stages at a temperature between 45 and 60 C",
    countercurrent, fresh water in the last stage only, minimum two stages;
    WASH WATER: "The latter system uses one litre of water per litre of skimmilk, whereas only about
    0.3 - 0.4 litre of water per litre of skimmilk is needed in countercurrent washing";
    CURD SOLIDS: "After washing, the casein is dewatered in a decanter to a DM content of 45-40%"
    (Southward: "about 55% moisture", i.e. 45% DM - the two agree);
    DRYING: to 10-12% moisture (rennet route quoted as 12%; two-stage air 50-55 C then ~65 C);
    MILLING: 40/60/80 mesh (40 mesh = 0.64 mm);
    SPEC: Table 20.1 acid casein extra grade - moisture <=10%, fat <=1.5%, ash <=2.2%, protein
    95% dry basis, plate count <=30,000/g.
    CASEINATE: NaOH 2.5 M (10%), "The quantity of NaOH required is generally 1.7 - 2.2% by weight
    of the casein solids in order to reach a final pH, generally about 6.7" (Southward: ~2% w/w);
    dissolve at 60-75 C, 30-60 min batch; colloid-mill the curd BEFORE adding alkali; curd dewatered
    to ~45% solids then rediluted to 25-30% solids for milling.
    SPRAY-DRYER FEED SOLIDS: "The very high viscosity of sodium caseinate solutions of moderate
    concentration limits their solids content for spray drying to about 20%", preheated to 90-95 C
    just before atomisation to cut viscosity (Southward: ">15% solids ... are very viscous", and
    the economic pull is to the maximum achievable). USE 20% w/w AS THE CASEINATE DRYER FEED, versus
    the 12-32% range dsp.yaml carries for MPC/WPC.

- key: casein_dairy_yield_from_skim_milk
  value: 3
  unit: kg commercial casein per 100 kg skim milk
  grade: A
  source: "Southward CR, 'Casein products', New Zealand Institute of Chemistry, section 'Yield'"
  doi_or_url: https://nzic.org.nz/unsecure_files/book/3E.pdf
  locator: "section 'Yield' (III-Dairy-E-Casein-6)"
  quote: "The yield of commercial casein is about 3 kg/100 kg skim milk."
  read: fulltext
  note: >-
    Commercial casein at 10-12% moisture, so ~2.65-2.70 kg dry casein per 100 kg skim milk.
    Against 26 g total casein per kg milk (Tetra Pak, milk_egg.yaml), that is a RECOVERY of
    ~102-104% of the casein nitrogen on an as-is basis and ~97-102% on a dry basis - i.e. the
    dairy acid-casein process recovers essentially all the casein, with the moisture and the small
    residual fat/lactose/ash (Southward Table 1: acid casein 85.4% protein, 11.4% moisture, 1.8%
    ash, 1.3% fat, 0.1% lactose as sold) making up the difference. CROSS-CHECK from an independent
    source (mine): the Nestle continuous process patent US4075196A Example 1 runs 10,000 L/h skim
    milk and discharges "613 kg/h of a washed curd with a TC of approximately 45%", i.e. 276 kg/h
    dry casein = 2.67 kg per 100 kg milk - the same number. For pf-tea the usable conclusion is
    that the incumbent's protein recovery is ~95-100% and a PF precipitation route should be
    modelled at NO BETTER than that, with 90-95% a defensible assumption and the true figure for a
    broth (where the protein is 100x more dilute than the curd) unverified.

- key: casein_dairy_acid_and_wash_water_per_kg
  value: {hcl_100pct_kg_per_kg_dry_casein: 0.065, wash_water_L_per_kg_dry_casein_concurrent: 36, wash_water_L_per_kg_dry_casein_countercurrent: 11, wash_water_L_per_L_skim_milk_countercurrent: 0.35}
  unit: per kg of dry casein unless stated
  grade: B
  source: "Nestec/Societe d'Assistance Technique pour Produits Nestle. US 4,075,196 'Production of casein and caseinates', Example 1; wash-water ratio from Tetra Pak Dairy Processing Handbook ch.20"
  doi_or_url: https://patents.google.com/patent/US4075196A/en
  locator: "US4075196A Example 1; Tetra Pak ch.20 'Continuous washing'"
  quote: "An acid injector positioned at the output end of the cooling tube introduces approximately 180 kg/h of 10% hydrochloric acid into the skimmed milk whose pH falls to 4.6 ... approximately 670 kg/h of curd with a TC of approximately 45% to which 10,000 l/h of water at 50 C are added ... 613 kg/h of a washed curd with a TC of approximately 45%."
  read: fulltext
  note: >-
    DERIVED (mine), and the only quantitative acid dose I could find anywhere: 180 kg/h of 10% HCl
    = 18 kg/h of HCl (100% basis) for 276 kg/h of dry casein = 0.065 kg HCl per kg dry casein
    (0.49 kg of 10% acid per kg casein; 1.8 g HCl per L of skim milk = 0.049 mol/L, which is the
    buffering capacity of milk between pH 6.6 and 4.6 and is the number to sanity-check).
    Wash water in that example is 10,000 L/h for 10,000 L/h of milk = 1 L/L milk = 36 L/kg dry
    casein for a SINGLE concurrent wash; Tetra Pak's countercurrent figure of 0.3-0.4 L/L milk
    gives 11-15 L/kg dry casein, so use ~11 L/kg (2-3 stages, countercurrent, 45-60 C) and
    36 L/kg as the sloppy bound. Equivalent NaOH for sodium caseinate: 0.017-0.022 kg NaOH per kg
    casein solids (Tetra Pak) or ~0.02 (Southward). CHECK THIS ARITHMETIC before use; the acid
    figure in particular is from one patent example on one milk composition, and a PF broth has a
    completely different buffering capacity (phosphate medium, ammonia titrant), so the dairy
    number is a floor, not a design value. Energy duties are NOT given in either source.

- key: casein_broth_ph_precipitation_risk
  value: null
  unit: qualitative (does fermentation at pH 4-6 precipitate secreted casein?)
  grade: C
  source: "FSANZ A1342 (Eden Brew) SD1 sect. 2.1 and Application sect. A.6; Perfect Day US 11,457,649 B2 Example 1 'Casein Protein Purification'"
  doi_or_url: https://www.foodstandards.gov.au/sites/default/files/2026-07/A1342%20Application.pdf
  locator: "A1342 SD1 p.5; Application pp.28-29; US11457649 col.57-58"
  quote: "The following casein proteins a-s1casein, a-s2casein, and B-casein are inherently hydrophobic, which precipitate out when secreted from the yeast and come into contact with water. Purification from the reactor media involves collection of the protein from the surface of the media, followed by drying to isolate pure protein."
  read: fulltext
  note: >-
    DIRECT ANSWER TO THE QUESTION, and the two public sources disagree. Perfect Day's patent says
    the calcium-sensitive caseins precipitate IN THE REACTOR (K. lactis, pH not stated) and makes
    that the recovery mechanism - skim the floating/precipitated protein and dry it; only
    kappa-casein, "inherently hydrophilic", needs pH 4.6 + centrifugation. Eden Brew's dossier says
    the opposite for its own strain: the beta-casein "is secreted into the fermentation medium in
    soluble form" and the biomass is removed by centrifugation with the product in the supernatant,
    and the product tolerates pH 4.0-7.0 in use. NO patent or dossier found states a fermentation
    pH set-point for a casein process, nor any pH-control measure taken to avoid in-fermenter
    precipitation. So for a K. phaffii casein base case the honest position is: Eden Brew
    demonstrates that a secreted, soluble casein at K. phaffii broth pH is achievable (their broth
    pH is CCI), while Perfect Day warns that the same proteins can precipitate on contact with
    water - the difference is probably glycosylation, pH, ionic strength and the absence of
    calcium. For T. reesei (pH 4-5 in the Aro2023 process already in this repo) the risk is higher
    because that is at or just below the recombinant pI, and NO casein has ever been reported from
    T. reesei. Grade C and flagged: this is a judgement from two conflicting company documents.

# =======================================================================================
# 5. Function: do you need micelles and phosphorylation?
# =======================================================================================

- key: casein_function_phosphorylation_needed
  value: null
  unit: qualitative (is phosphorylation required for micelles and cheese?)
  grade: A
  source: "Antuma LJ, Steiner I, Garamus VM, Boom RM, Keppler JK. Engineering artificial casein micelles for future food: Is casein phosphorylation necessary? Food Res Int 173:113315 (2023)"
  doi_or_url: 10.1016/j.foodres.2023.113315
  locator: abstract
  quote: "dephosphorylated casein was hardly incorporated into artificial casein micelles ... the presence of increasing amounts of dephosphorylated casein resulted in increasingly poor rennet coagulation behaviour ... Therefore, phosphorylation of future recombinant casein is essential to allow its use in the production of animal-free dairy products."
  read: abstract
  note: >-
    The strongest published "yes". Mechanism: the phosphoserine clusters are what bind the
    amorphous calcium phosphate nanoclusters that hold a micelle together, so without them the
    protein adsorbs onto the nanocluster surface instead of being incorporated, giving larger,
    less hydrated particles and a gel network that rennet cannot build. Supporting structural work
    (Raynes JK et al., J Struct Biol X 8:100096, 2024, abstract read) adds that kappa-casein is
    distributed THROUGHOUT the micelle rather than forming a surface coat, "in quantitative
    agreement with the multivalent-binding model" - i.e. a cheese micelle needs kappa AND
    phosphorylated calcium-sensitive caseins AND calcium phosphate, not just a shell.

- key: casein_function_phosphorylation_workarounds
  value: null
  unit: qualitative (what the companies and the newest work say instead)
  grade: A
  source: "Mora Vasquez S et al. Heterologous caseins: the role of phosphorylation in their functionality and how to achieve it. Biomolecules 15:1031 (2025); Balasubramanian S et al. Production of phosphorylated and functional alphas1-casein in Escherichia coli. Trends Biotechnol 43:2304-2322 (2025); New Culture US 2023/0404098 A1 Example 6; GFI 2026 State of the Industry (Fermentation)"
  doi_or_url: "10.3390/biom15071031 ; 10.1016/j.tibtech.2025.05.015"
  locator: "Mora Vasquez sects. 2, 4.1, 5 (PMC12292773); Balasubramanian abstract; US20230404098A1 Tables 4-5; GFI 2026 SOTI 'Casein structure-function advances'"
  quote: "We successfully phosphorylated alphas1-casein in Escherichia coli using bacterial kinases, achieving phosphorylation at all native sites. To complement this approach, we developed an alternative phosphomimetic strategy by substituting serine residues with aspartate to mimic phosphorylation."
  read: abstract
  note: >-
    Four public routes around the Fam20C problem, in increasing order of evidence:
    (1) THE CAUSE. Mora Vasquez (open access, full text read): "the absence of the mammalian-specific
    kinase Fam20C in plant and yeast systems and the broader lack of secretory kinase machinery in
    bacteria ... collectively contribute to impaired phosphorylation fidelity". Fam20C is the Golgi
    secretory-pathway kinase identified in 2012 as the real casein kinase.
    (2) KINASE CO-EXPRESSION. Works for HUMAN beta-casein with CK2 (500 mg/L, Thurmond 1997), but
    "bovine beta-casein co-expressed with CK2 achieved a much lower phosphorylation level compared
    to the fully phosphorylated 5P state" because only some bovine sites are canonical CK2 motifs.
    Balasubramanian 2025 (DTU/Wageningen) instead uses the B. subtilis kinases PrkD and YabT in
    E. coli and reports ALL native alpha-s1 sites phosphorylated with native-like calcium binding,
    digestibility and structure - no titer reported. Nobell/Mozza patent the plant equivalent with
    Fam20C itself.
    (3) PHOSPHOMIMETIC Ser->Asp substitution (same paper) - but that is no longer bio-identical,
    which is a regulatory and labelling problem, not a technical one.
    (4) GIVE UP MICELLES. New Culture's patent measures it: hybrid micelles of UNPHOSPHORYLATED
    recombinant bovine alpha-s1 with recombinant goat kappa give mozzarella yields of 156% vs 135%
    for dairy kappa, and hypophosphorylated (2-3 P) alpha + kappa gives 173-184% vs 175-187% for
    native alpha, i.e. "reduced phosphorylation on alpha-casein has only a slight effect on cheese
    yields ... within 10% of the control value", although "reduced phosphorylation on alpha-casein
    leads to larger micelle size" and the hypophosphorylated curd was "weaker/partially shattered".
    GFI 2026 reports Fermify + BOKU finding that non-phosphorylated beta-casein forms STRONGER
    acid-induced gels than native casein (good for drinks and yoghurt) and selling cheese made by
    "a patent-pending enzymatic process rather than full replication of casein micelles".
    MY READ (judgement, not a sourced claim): phosphorylation is required for a classical
    rennet-coagulated micellar cheese, and is avoidable for acid gels, beverages and
    engineered-structure cheese analogues - which is exactly the application Formo's GRN 1312 asks
    for (25% in cheese ANALOGUES) with a completely unphosphorylated protein.

- key: casein_function_kappa_requirement
  value: null
  unit: qualitative (is kappa-casein needed?)
  grade: B
  source: "New Culture Inc. US 2023/0404098 A1, 'Dairy-like compositions and related methods', Examples 6-11"
  doi_or_url: https://patents.google.com/patent/US20230404098A1/en
  locator: "Examples 6-9 (hybrid micelles, Tables 2-5); Example 11 and claim-support paragraph [0407]"
  quote: "10.4 mg/ml of alpha-casein was mixed with 3.6 mg/ml kappa casein, and micelles were induced using phosphate, citrate and calcium salts at the following final concentrations: phosphate 12.4 mM, citrate 6.15 mM, calcium 18.5 mM."
  read: fulltext
  note: >-
    The most quantitative public recipe for an artificial casein micelle, and it answers "which
    caseins do I actually have to make?": a 2.9:1 alpha:kappa mass ratio (Perfect Day's patent
    claims 2.0:1 to 5.5:1 beta:kappa) plus calcium phosphate/citrate salts was enough for curds
    that pass a tube-inversion test, melt and stretch. Cheese was made by citric-acid
    acidification to pH 5.0-5.2 then 0.15% rennet at room temperature, curds spun at 1000 x g,
    stretched at 65 C. Truncated kappa (C-terminal 16 aa removed, i.e. part of the macropeptide)
    raises the micelle pI so acidification "had to be set at higher pH (~5.8) during the
    acidification step to prevent protein precipitation", and that cheese melted but did not
    stretch. So: kappa-casein (or a kappa surrogate) IS needed for a stretching cheese, at roughly
    a quarter of the alpha/beta mass - which is awkward, because kappa is the one casein with a
    disulfide, O-glycans, a pyroglutamate N-terminus and essentially no public recombinant titer
    (0.24 mg/L in A. oryzae). A pf-tea casein product is therefore honestly a SINGLE-CASEIN
    ingredient (beta or alpha-s1) sold into blends, not a drop-in cheese system.

