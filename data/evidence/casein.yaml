- key: kappa_casein_price_lab_reagent
  value: 1080
  unit: USD per g (Sigma C0406, 1 g pack, >=70% PAGE, bovine kappa-casein; catalogue list price 2026)
  grade: C
  source: "Krackeler Scientific catalogue page for Sigma C0406 'kappa-Casein from bovine milk' (fetched 2026-10-02)"
  doi_or_url: https://www.krackeler.com/catalog/sigma/SIGMA/C0406
  locator: "price table"
  quote: "1 g $1080.00 1/EA"
  read: html
  note: >-
    NOT A BENCHMARK - recorded to show that no commodity kappa-casein market exists. Kappa from milk
    is a laboratory fractionation product (100 mg $215, 250 mg $360, 1 g $1,080 = $1.08 M/kg), and it
    is impure: All G measured Sigma's kappa at 52% kappa by CE-SDS (kappa_free_micelles_allg). The
    nearest bulk ingredient is caseinomacropeptide (CMP/GMP, kappa residues 106-169) recovered from
    sweet whey for PKU medical foods (Arla Lacprodan CGMP-10/-20/-30, Agropur BiPRO GMP); no public
    per-kg price was found (one market report sizes the whole CGMP market at USD 126.4 M in 2025,
    Fact.MR, C, not read). For pf-tea: kappa should be costed only INSIDE a casein blend priced
    against the casein band (benchmarks.yaml casein: acid casein USD 8.6/kg product 2025 US imports,
    rennet 8.0, EU export EUR 6.9/kg; GFI 2025 USD 9.6-12.2/kg protein), never against a
    kappa-specific price.

- key: as1_kappa_ratio_fully_recombinant_cheese
  value: {as1_to_kappa_tested: ["3:1", "4:1", "5:1"], kappa_frac_of_casein: [0.25, 0.20, 0.167], total_casein_pct: 2.8, Ca_mM: 26, Pi_mM: 20, citrate_mM: 12}
  unit: alpha-s1:kappa mass ratios that formed micelles and rennet-set cheese with BOTH proteins recombinant and PTM-free
  grade: B
  source: "New Culture Inc. US 2023/0404098 A1 'Dairy-like compositions and related methods', Example 9 (hybrid micelles, Fig. 6-7, Table 10) and Example 2 (L. lactis)"
  doi_or_url: https://patents.google.com/patent/US20230404098A1/en
  locator: "Example 9 and Figs. 6-7 (local .preview/casein2/patents/US20230404098A1.txt); Example 2 'Expression in L. lactis'"
  quote: "FIG. 7 shows that cheese yields were increased and driven by the amount (proportion) of alpha-S1-casein used, while the total casein concentration was fixed in the experiment across all casein ratios."
  read: html
  note: >-
    THE DIRECT ANSWER TO "unphosphorylated recombinant caseins form curd?" - yes, in a patent example:
    recombinant bovine alpha-s1 "(lacking PTMs)" + recombinant ovine or caprine kappa "(lacking PTMs)"
    at 21/7, 22.4/5.6 and 23.4/4.6 mg/mL (3:1, 4:1, 5:1; kappa 25%, 20%, 16.7% of casein, mine)
    formed micelles (sheep kappa: 190-320 nm per Fig. 7 text, 500-900 nm main population per the DLS
    text - the patent states both) and were acidified with citric acid to pH ~5, renneted (0.15%
    rennet), stretched at 70 C; yield rose as kappa fell. So the lowest kappa share demonstrated with
    recombinant proteins is 1/6 (16.7%); nothing below was tested. Note the kappa was SHEEP/GOAT, not
    bovine, in the fully recombinant runs. Same patent, Example 2 (L. lactis): "Alpha-S1-casein
    secreted poorly, whereas kappa casein showed near-complete secretion of protein produced" -
    western blot only, no titer; Examples 3-4 B. subtilis and E. coli, no titers found in the text.
    For a required-titer analysis: a casein-for-rennet-cheese blend needs kappa at 1/6 to 1/4 of
    the alpha-s1 mass (recombinant evidence) or ~1/9 (milk, 10-12%).

