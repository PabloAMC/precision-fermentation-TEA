    numbers. Its Table 2 agrees with data/titers.csv on every row the two share, with ONE conflict
    (Chung 1991 = 0.05 mg/L here vs 10 mg/L in Mora Vasquez 2025; three full texts back 0.05, see
    casein_titers_update.csv) and one framing difference: it calls Wang 2021's 1.45 g/L "the highest
