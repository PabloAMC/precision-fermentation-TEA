  read: fulltext
  note: >-
    Settles the question in the brief: GRN 1104 is NOT an egg-white protein mixture and contains no
    ovomucoid - it is recombinant ovalbumin with the same EAEA extension (389 aa, 43.15 kDa,
    pI 4.84; amendment answer 1 corrects the sequence length from 385 to 389). Strain DFB-004 adds
    only HAC1 copies, with no EndoH, so the ovalbumin carries full yeast high-mannose glycans
    ("a range of 8 to 14 mannose residues, with the highest percentage being 10 mannoses").
    Spec (Table 3, p.27): protein >75% w/w, moisture <=10%, carbohydrate <=10%, ash <=5%, fat <0.4%;
