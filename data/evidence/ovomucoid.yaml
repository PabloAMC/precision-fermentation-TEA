# data/evidence/ovomucoid.yaml: evidence for adding OVOMUCOID (hen egg-white ovomucoid, Gal d 1) and
# the EVERY egg-white protein products as a product in pf-tea (research pass 2026-10-01).
# Format: data/evidence/README.md. Grades: A measured/official; B published design basis or patent
# example; C company claim/trade press/survey; D analogy; E guess.
# Everything below was read as raw text: UniProt REST JSON, FDA GRAS PDFs (GRN 967 notice + its
# April 2021 amendment + the agency letter; GRN 1104 with amendments + letter) converted with
# pdftotext -layout, EVERY/Clara Foods patent full texts on disk, Europe PMC full-text XML,
# FAOSTAT and UN Comtrade bulk data, USDA NASS PDF. One figure (US 2024/0209383 FIG. 22) was read
# as a rendered page image. Items computed here are labelled "Derived (mine)" and carry quote: null.
#
# NOTE ON NAMING. Ovomucoid is abbreviated OVD by Clara Foods/EVERY and by FDA, OVM in the academic
# literature, and "Gal d 1" in allergen nomenclature. EVERY's two FDA-cleared products are easy to
# confuse: GRN 967 ("soluble egg-white protein", NSEWP, strain GSD-1209/DFB-003) is OVOMUCOID, and
# GRN 1104 ("egg-white protein", NEWP, strain GSD-1235/DFB-004) is OVALBUMIN. Both are described by
# FDA as "egg-white protein"; neither is a mixture of the two.

# =======================================================================================
# 1. Product identity, sequence, mass balance
# =======================================================================================

- key: ovd_uniprot_mature_chain
  value: "P01005 chain 25-210"
  unit: residue range of the mature secreted chain (precursor numbering)
  grade: A
  source: "UniProtKB P01005 (IOVO_CHICK), Ovomucoid, Gallus gallus; entry version 173, sequence version 1, last annotation update 2026-09-02"
  doi_or_url: https://rest.uniprot.org/uniprotkb/P01005.json
  locator: "features: Signal 1-24; Chain 25-210 'Ovomucoid'; Domain 25-88, 89-153, 156-210 'Kazal-like 1/2/3'"
  quote: "{\"type\":\"Chain\",\"description\":\"Ovomucoid\",\"location\":{\"start\":{\"value\":25},\"end\":{\"value\":210}}} ... {\"type\":\"Domain\",\"description\":\"Kazal-like 1\"} ... \"Avian ovomucoid consists of three homologous, tandem Kazal family inhibitory domains\""
  read: fulltext
  note: >-
    186 residues after removal of the 24-residue signal peptide, matching every secondary source
    ("Its polypeptide chain consists of 186 amino acids", GRN 967 p.6; Beck 2025 Table 1).
    Mature sequence (put here so the product file can be built from this entry):
    AEVDCSRFPNATDKEGKDVLVCNKDLRPICGTDGVTYTNDCLLCAYSIEFGTNISKEHDGECKETVPMNCSSYANTTSEDGKVMVLCNRAFNPVCGTDGVTYDNECLLCAHKVEQGASVDKRHDGGCRKELAAVSVDCSEYPKPDCTAEDRPLCGSDNKTYGNKCNFCNAVVESNGTLTLSHFGKC
    Mature residue i = precursor residue i+24 (the usual off-by-n trap: UniProt's glycosylation
    sites 34/77/93/99/199 are mature 10/53/69/75/175). Function: "Serine protease inhibitor.
    Inhibits trypsin" (inhibits BOVINE, not human, trypsin: GRN 967 p.11, Travis 1971).
    UniProt also lists a natural variant at precursor 158-159 "due to an ambiguous intron excision"
    - ovomucoid from pooled egg white is a mixture of isoforms, which is one reason the native
    protein runs as a smear on SDS-PAGE.

- key: ovd_mature_formula_and_mw
  value: {C: 840, H: 1306, N: 240, O: 292, S: 20}
  unit: atoms per molecule of the unglycosylated mature chain (9 disulfides)
  grade: A
  source: "Derived (mine) from UniProtKB P01005 mature chain 25-210 (186 aa, 9 disulfide features)"
  doi_or_url: https://rest.uniprot.org/uniprotkb/P01005.json
  locator: "computed from the sequence; UniProt lists 9 'Disulfide bond' features and 18 cysteines"
  quote: null
  read: fulltext
  note: >-
    Derived (mine) - check the arithmetic. Residue sums + H2O, minus 2H per disulfide: average MW
    20,080 Da; CH1.555N0.286O0.348S0.0238; 50.24 wt% C, 16.74 wt% N (so N x 5.97 = protein, while
    the GRAS specs use the AOAC combustion factor N x 6.25, which overstates protein by ~4.7%).
    Cross-checks: (a) my residue-sum method reproduces UniProt's own molWeight for the 210-aa
    precursor, 22,591 Da, to 0.4 Da; (b) adding EVERY's EAEA N-terminal extension gives
    C856H1330N244O300S20 = 20,480 Da, and GRN 967's amendment Table 3 states recombinant OVD is
    "20.5 kDa" against native mature "20 kDa". So the sequence, the disulfide count and the
    extension are all mutually consistent. Composition notes for the mass balance: NO tryptophan,
    only 2 methionines, 18 cysteines (9 S-S) - ovomucoid is the most disulfide-dense food protein
    in this repo (1 S-S per 20.7 residues vs 1 per 43 for bovine LF and 1 per 385 for OVA), which
    is why hosts need folding help (see ovd_kphaffii_strain_engineering).

- key: ovd_disulfides_and_domains
  value: 9
  unit: disulfide bonds in the mature chain (3 per Kazal domain)
  grade: A
  source: "UniProtKB P01005 features; corroborated by Beck F et al. BMC Biotechnol 25:1002 (2025) Table 1"
  doi_or_url: 10.1186/s12896-025-01002-3
  locator: "UniProt: Disulfide bond 29-68, 46-65, 54-86, 94-133, 111-130, 119-151, 162-192, 170-189, 178-210 (precursor numbering); Beck Table 1 row 'Ovomucoid'"
  quote: "Ovomucoid 28 186 4.1 77 9 - N-glycosylated No Yes"
  read: fulltext
  note: >-
    The Beck quote is the Table 1 row: MW 28 kDa (glycosylated), 186 aa, pI 4.1, denaturation
    temperature 77 C, 9 disulfide bonds, N-glycosylated, no genetic polymorphism listed, allergenic.
    Beck's review also flags the disulfides as the reason E. coli is a poor host: "Chaperones (Dsb
    system), trxB/gor mutants ... e.g. ovotransferrin (15 bridges), ovomucoid (9 bridges)".
    Each of the three Kazal domains carries 3 disulfides; the trypsin-reactive bond is at
    precursor 113-114 (mature 89-90, domain 2).

- key: ovd_glycosylation_sites_native
  value: 5
  low: 4
  high: 5
  unit: N-linked sites (precursor Asn34, 77, 93, 99, 199 = mature Asn10, 53, 69, 75, 175)
  grade: A
  source: "UniProtKB P01005 features; Benedé S et al. PLoS ONE 8(11):e80810 (2013) for occupancy"
  doi_or_url: 10.1371/journal.pone.0080810
  locator: "UniProt: 5 'Glycosylation' features, Asn199 annotated 'N-linked (GlcNAc...) asparagine; partial'; Benedé Introduction"
  quote: "One particular characteristic of OM is its high carbohydrate content, which is between 20-25%, with two carbohydrate chains on each of the first and second domains and one chain present on about 50% of the third domain"
  read: fulltext
  note: >-
    A sequon scan of the mature chain (mine) finds exactly six N-X-S/T motifs - mature 10, 53, 69,
    75, 158, 175 - of which UniProt annotates five as used (mature 158 NKT is not annotated;
    mature 69 is the unusual N-C-S sequon). Benedé's "two + two + one partial" matches
    5 sites with the fifth ~50% occupied, i.e. 4.5 glycans per molecule on average. This is the
    key physical difference from ovalbumin (2 sites, 1 usually occupied): ovomucoid is a heavily
    glycosylated protein and the glycan is 20-25% of its mass.

- key: ovd_carbohydrate_mass_fraction_native
  value: 0.225
  low: 0.20
  high: 0.25
  unit: mass fraction carbohydrate of native hen ovomucoid
  grade: A
  source: "Benedé S, Lopez-Exposito I, Molina E, Lopez-Fandino R. Influence of the carbohydrate moieties on the immunoreactivity and digestibility of the egg allergen ovomucoid. PLoS ONE 8(11):e80810 (2013)"
  doi_or_url: 10.1371/journal.pone.0080810
  locator: "Introduction, paragraph 2"
  quote: "One particular characteristic of OM is its high carbohydrate content, which is between 20-25%"
  read: fulltext
  note: >-
    Corroborated independently: "OVM possesses high thermal stability and limited denaturation as
    the structure is made up of nine disulfide bonds and 25% carbohydrate" (Yang et al., Foods
    11(2):238 (2022), PMC8774878, Discussion, A); "its high carbohydrate proportion (approximately
    20-25%)" (Nam et al., Food Sci Anim Resour 46 (2026), PMC12995051, A); Beck 2025 gives the
    composition as "sialic acid, ~4.5% mannose, and ~1.5% galactose". Derived (mine): at 22.5%
    glycan the native glycoprotein mass is 20,080 / 0.775 = 25.9 kDa, consistent with the
    "approximately 28.0 kDa" and "28-37 kDa" figures quoted for native OVD. THIS MATTERS FOR THE
    MODEL: the K. phaffii product is NOT this molecule (next entry) - EVERY trims the glycan to a
    single GlcNAc, so a kg of PF ovomucoid carries ~20% more polypeptide than a kg of native
    ovomucoid, and the elemental balance must use the unglycosylated formula.

- key: ovd_kphaffii_glycoform_endoh
  value: 1
  unit: GlcNAc residues left per occupied site in EVERY's K. phaffii product (vs branched glycans in native OVD)
  grade: A
  source: "Clara Foods Co. GRAS Notice (GRN) 967, 'Non-Animal Soluble Egg White Protein produced by Pichia pastoris', August 2020; FDA 'no questions' letter 9 Sep 2021"
  doi_or_url: https://www.fda.gov/media/147830/download
  locator: "Sect. 2.1.3, p.7 (glycosylation form); Sect. 2.2.2.2, pp.14-15 (EndoH-OCH1 fusion)"
  quote: "The production organism has been modified by adding a glycohydrolase enzyme (EndoH, see Section 2.2.2.2) that cleaves the glycan form down to the core protein/glycan structure. The resulting protein as expressed in DFB-003, i.e. NSEWP, contains only the core glycosylation moiety, i.e. one N-acetylglucosamine unit"
  read: fulltext
  note: >-
    This is a real process decision with mass-balance consequences. Without EndoH the same host
    hyper-mannosylates: EVERY's own patent reports "eight different N-glycan structures ...
    Man9GlcNAc2 ... Man9GlcNAc2Hex7" on untreated rOVD (US 12,096,784 B2 Ex. 2, Table 2, B).
    The EndoH is expressed as a fusion to the first 48 residues of Pichia OCH1, which anchors it in
    the Golgi so it is removed with the cells ("the fusion protein being intracellular and anchored
    to cell components that are removed by the initial centrifugation purification step", GRN 967
    p.19). Derived (mine): 4 occupied sites x 203.2 Da (GlcNAc residue) = 813 Da, i.e. ~3.8% of the
    21.3 kDa glycoprotein - so EVERY's ovomucoid is ~96% polypeptide by molecule, against ~78% for
    the native protein. The powder still tests 11-15.5% total carbohydrate (ovd_spec_grn967_batches),
    which must therefore be mostly residual yeast-derived carbohydrate, not product glycan.

- key: ovd_recombinant_identity_grn967
  value: "mature OVD + EAEA N-terminal extension, 190 aa, 20.5 kDa, pI 4.36"
  unit: identity of the recombinant protein in EVERY's GRN 967 product
  grade: A
  source: "Clara Foods Co. GRN 967 amendment, 'Response to Technical Review Questions', 2 April 2021, Table 3"
  doi_or_url: https://www.fda.gov/media/152292/download
  locator: "Response to Question 10, Table 3 'Physical characteristics of native and recombinant OVD', p.12-13"
  quote: "Native OVD (mature form) ... 20 kDa ... 4.47 ... 5 ... N-acetyl glucosamine, mannose, galactose | Recombinant OVD ... 20.5 kDa ... 4.36 ... 4 ... N-acetyl glucosamine"
  read: fulltext
  note: >-
    Columns are: amino-acid sequence of mature protein without glycosylation | molecular mass |
    calculated isoelectric point without glycosylation | number of residues glycosylated |
    carbohydrate identities. Confirms (a) the recombinant molecule is the 186-aa mature chain with
    four extra residues EAEA from imprecise Kex2/Ste13 processing of the S. cerevisiae alpha-factor
    pre-pro leader, (b) a minor fraction carries the longer extension EEGVSLEKREAEA (GRN 967 p.9),
    (c) only 4 of the 5 sites carry the GlcNAc stub, (d) pI ~4.4 unglycosylated. My computed MW for
    EAEA+mature is 20,480 Da, matching their 20.5 kDa. The same amendment corrects a common error:
    "ovomucoid is listed at 28 kDa due to the presence of a secretion signal that is present in a
    pro+mature form but removed during secretion to generate the mature only form with a molecular
    weight of ~20 kDa" - the 28 kDa in the literature is the glycosylated native protein, not the
    polypeptide.

- key: ovd_share_of_egg_white_protein
  value: 0.11
  low: 0.095
  high: 0.11
  unit: mass fraction of total egg-white protein
  grade: A
  source: "Clara Foods Co. GRN 967, Sect. 2.1.2 p.6 and Part 3 p.27; corroborated by Li Z et al. Foods 11(16):2434 (2022) Table 1 (already in data/evidence/milk_egg.yaml ova_share_li2022) and Beck 2025"
  doi_or_url: https://www.fda.gov/media/147830/download
  locator: "GRN 967 Sect. 2.1.2, p.6"
  quote: "Hen egg ovomucoid (OVD) is located in the egg white, comprises approximately 11% of the egg white protein, and has been consumed for as long as eggs have been used as a food source."
  read: fulltext
  note: >-
    Three independent statements of 11%: GRN 967, Li 2022 Table 1 (in the repo already), and Beck
    2025 ("Ovomucoid (OVM) is a glycoprotein that constitutes ~ 11% of egg white protein"). The
    lower bound is from the 2025 purification review: "ovomucoid, OVM, makes up 9.5-11% of egg
    white" (Foods 14:1944, PMC12154507, A). Derived (mine): at 3.64 g egg-white protein per US
    large egg (milk_egg.yaml derived_protein_per_litre_and_per_egg), one large egg contains
    0.40 g of ovomucoid, against 1.96 g of ovalbumin.

# =======================================================================================
# 2. Commercial PF products: EVERY (Clara Foods) GRN 967 and GRN 1104
# =======================================================================================

- key: ovd_grn967_product_definition
  value: "single protein (ovomucoid) preparation, K. phaffii GSD-1209, methanol-induced"
  unit: product definition of EVERY's GRN 967 ingredient
  grade: A
  source: "FDA. Agency response letter, GRAS Notice No. GRN 000967 (Clara Foods Co.), 9 September 2021"
  doi_or_url: https://www.fda.gov/media/152289/download
  locator: "p.1-2"
  quote: "Clara describes soluble egg-white protein as a glycoprotein containing predominantly recombinant ovomucoid. Soluble egg-white protein is a white to off-white amorphous powder."
  read: fulltext
  note: >-
    So GRN 967 is a SINGLE-PROTEIN product, not an egg-white mix: the only recombinant protein
    expressed is ovomucoid. FDA's inventory entry names it "Soluble egg-white protein produced by
    Komagataella phaffii strain GSD-1209", intended "as a substitute for egg-white protein in foods
    containing eggs; and as a source of protein in nutritional powders and drinks; bars; and certain
    snack foods", closed 9 Sep 2021 (hfpappexternal.fda.gov GRAS Notices id=967, read as HTML).
    Commercially this is the product EVERY launched as EVERY ClearEgg and now sells as EVERY
    Protein: "bio-identical to a glycoprotein contained in egg white ... a glycoprotein containing
    predominantly recombinant ovomucoid", "highly soluble", "exclusively sold by Ingredion"
    (FoodNavigator, 5 Oct 2021, read via web-fetch summary, C - not a verbatim-checked quote).
    Strain lineage: NRRL Y-11430 -> BioGrammatics BG08 -> BG10 -> Clara's DFB-001 (mutS,
    "methanol-utilization slow") -> DFB-003 = ATCC deposit GSD-1209.

- key: ovd_grn967_strain_engineering
  value: {ovd_copies: 11, hac1_copies: 3, endoh_och1_copies: 1}
  unit: integrated expression cassettes in production strain DFB-003 (GSD-1209)
  grade: A
  source: "Clara Foods Co. GRAS Notice (GRN) 967, Sect. 2.2.2.3 'Genome Sequence of the Production Strain DFB-003'"
  doi_or_url: https://www.fda.gov/media/147830/download
  locator: "Sect. 2.2.2.3, p.17"
  quote: "11 copies of OVD coding sequence were integrated into the genome as cassettes of methanol-inducible promoter :: ScAlphaFactor :: OVD :: AOX1term ... 3 copies of methanol-inducible promoter :: HAC1 :: AOX1term ... 1 copy of methanol-inducible promoter :: EndoH-OCH1 :: AOX1term"
  read: fulltext
  note: >-
    All three cassettes are METHANOL-INDUCIBLE, and the strain is mutS. This is directly relevant
    to the model's methanol switch: the public commercial ovomucoid process is a methanol process
    (unlike Eden Brew's methanol-free casein). EVERY's later patent work moves away from it - the
    30 g/L strain (next section) uses "late firing" / catabolite de-repression promoters (TLR1) and
    the patent explicitly builds strains "that express goi's without the need for methanol as a
    carbon source (in certain procedures, a small amount of methanol may be included as an inducer
    molecule)" (US 2024/0209383 A1 [0359], B). US 12,096,784 B2 Ex. 2 describes the GRN 967-type
    process as a glucose batch -> glucose-limited fed-batch -> "glucose and methanol" co-feed with
    "methanol ... fed to maintain the methanol concentration at 1%".

- key: ovd_spec_grn967
  value: {protein_min_frac_powder: 0.75, protein_min_frac_dry: 0.80, moisture_max: 0.10, carbohydrate_max: 0.20, ash_max: 0.02, fat_max: 0.001}
  unit: mass fractions of the powder as is (protein_min_frac_dry = % of dry weight)
  grade: A
  source: "Clara Foods Co. GRAS Notice (GRN) 967, Table 3 'Specification for non-animal soluble egg white protein (NSEWP) produced by P. pastoris DFB-003'"
  doi_or_url: https://www.fda.gov/media/147830/download
  locator: "Table 3, p.24"
  quote: "Protein > 75% | Moisture Maximum 10.0% | Carbohydrate Maximum 20% | Ash Maximum 2.0% | Fat by Acid Hydrolysis < 0.1% | Hg < 1 ppm | Pb < 1 ppm | As < 1 ppm | Cd < 1 ppm"
  read: fulltext
  note: >-
    FDA's letter restates it: "protein (> 75%), carbohydrate (<= 20%), fat (< 0.1%), moisture
    (<= 10%), ash (<= 2%)". Specification basis is the Food Chemicals Codex 11th ed. Enzyme
    Preparations monograph (there is no monograph for this product; GRN 967 amendment, answer 13).
    The 2% ash ceiling is notable and is the strongest evidence for the downstream route: a
    chromatographic elution in 1 M NaCl or an ammonium-sulfate precipitation leaves far more ash
    than 2% unless it is diafiltered out (compare TurtleTree's lactoferrin isolate at <=9.5% ash).

- key: ovd_spec_grn967_batches
  value: {protein_frac: [0.7531, 0.7506, 0.7994], ovd_frac_of_protein: [0.876, 0.906, 0.926], moisture: [0.084, 0.09, 0.09], carbohydrate: [0.1553, 0.1528, 0.1106], ash: [0.0076, 0.0066, 0.004]}
  unit: three production lots (SOL19303, SOL19317, SOL19351), mass fractions of the powder
  grade: A
  source: "Clara Foods Co. GRN 967 Table 4 (QC results) and the GRN 967 amendment Table 1 (% ovomucoid in total protein)"
  doi_or_url: https://www.fda.gov/media/152292/download
  locator: "GRN 967 Table 4, p.26; amendment Table 1 (Response to Question 9), p.8"
  quote: "% Protein by combustion 75.31 75.06 79.94 | % OVD in powder determined by HPLC 66 68 74 | % OVD as % of protein (calculated) 87.6 90.6 92.6"
  read: fulltext
  note: >-
    THE SINGLE MOST USEFUL NUMBER FOR THE MODEL: the delivered powder is 66-74% ovomucoid by HPLC,
    i.e. 87.6-92.6% of the protein is product and ~7-12% is K. phaffii host protein (the amendment
    states "Analysis of NSEWP lots showed that they contained ~7 to 12% host protein, w/w"). The
    balance of the powder is 11-15.5% carbohydrate, 8.4-9% moisture and <0.8% ash. A UF/DF-only
    route therefore delivers a CONCENTRATE (66-74% target protein in the powder), not an isolate -
    strictly weaker than Intelligen's assumed 99% OVA after ammonium-sulfate precipitation and
    weaker than the 90-94% that a CEX route gives for lactoferrin. Note the ash is very low
    (0.4-0.76%), consistent with extensive diafiltration and with no salt-eluted chromatography.

- key: ovd_dsp_route_grn967
  value: "centrifugation -> microfiltration -> pH adjustment + ultrafiltration -> spray drying"
  unit: downstream route of the commercial ovomucoid product
  grade: A
  source: "Clara Foods Co. GRN 967 Sect. 2.4.3; confirmed in FDA's response letter and in the GRN 967 amendment (answer 11)"
  doi_or_url: https://www.fda.gov/media/147830/download
  locator: "Sect. 2.4.3 'Purification', p.22; Figure 5 p.22"
  quote: "The NSEWP was purified by separating the cells from the liquid medium by centrifugation followed by micro-filtration. Further purification is accomplished using pH adjustments and ultra-filtration, before a drying step to produce the final protein product."
  read: fulltext
  note: >-
    NO CHROMATOGRAPHY AND NO PRECIPITATION in the cleared commercial ovomucoid process. The
    amendment adds the dryer: "The NSEWP preparation is then centrifuged, washed and filtered ...
    The purified preparation is then spray dried", and the quantitation method: "The concentration
    of recombinant ovomucoid in the preparation is quantified using HPLC". Contrast GRN 1104
    (ovalbumin), where a chromatography step is added: "Further purification is accomplished using
    ultra-filtration, chromatography, and pH adjustments before a drying step" (GRN 1104 Sect.
    2.4.3, p.23, A). This difference is the central modelling result of this pass: the ovomucoid
    product is made with the model's 'concentrate' (UF/DF) route, the ovalbumin product is not.

- key: ovd_dsp_route_patent_precipitation
  value: "AS precipitation at 65% saturation, pH 4.0-4.1, redissolve, diafilter, 0.2 um, spray dry"
  unit: alternative (patent) downstream route for rOVD
  grade: B
  source: "Clara Foods Co. (The EVERY Co.). Protein compositions and consumable products thereof. US 12,096,784 B2 (2024), Example 19 'Fermentation and Purification of rOVD'"
  doi_or_url: https://patents.google.com/patent/US12096784B2/en
  locator: "Example 19"
  quote: "Fermentation broth was first brought to pH 3 and diluted with DI water. Cells were removed using bucket centrifugation. The collected supernatant was brought to pH 7 ... The permeates of the 0.2 μm were adjusted to pH 5 and then concentrated via 5 kDa TFF membrane. The 5 kDa retentate was precipitated using 65% saturation ammonium sulfate."
  read: fulltext
  note: >-
    Full sequence: acidify broth to pH 3 and dilute -> centrifuge -> neutralise to pH 7 -> 0.2 um
    filtration + 5 diavolumes of DI water -> pH 5 -> 5 kDa UF -> ammonium sulfate to 65% saturation,
    pH adjusted to 4-4.1 with phosphoric acid, overnight at room temperature -> centrifuge ->
    redissolve in DI water at pH 5 -> diafilter -> 0.2 um -> "A spray dryer was used to dehydrate
    the rOVD solution into rOVD powder". Example 20 adds a bleaching step: concentrate to
    "50-60 g/L using a 5 kDa TFF membrane", add H2O2 to 10% v/v for 1.5 h (the broth is
    "a dark green-brown color" before treatment), then DF with 5 volumes, then the same AS
    precipitation. So the model's 'isolate' route is also documented for ovomucoid - but it is NOT
    the route FDA was shown for the commercial product, and EVERY's own recovery patent says
    acidifying DURING salt precipitation gives "under 10% recovery" (dsp.yaml
    acid_plus_salt_precipitation_recovery_every) while here they acidify to pH 4-4.1 after adding
    the salt. Treat the patent's AS route as a variant, not the base case.

- key: ovd_dsp_route_patent_cex
  value: "SP400 cation exchange at pH 3.5 after 5 kDa UF to >30 g/L"
  unit: alternative (patent) capture step for ovomucoid
  grade: B
  source: "Kale A, Patnaik R (Clara Foods Co. / The EVERY Co.). Purified protein compositions and methods of production. US 2024/0083940 A1 (2024), Example 2"
  doi_or_url: https://patents.google.com/patent/US20240083940A1/en
  locator: "Example 2, paras [0702]-[0706]"
  quote: "transformations to express an illustrative protein, here ovomucoid ... The protein solution was then concentrated using a 5 kDa ultrafiltration membrane to over 30 g/L protein and diafiltered extensively ... adjusted to pH 3.5 using citrate and loaded on to a chromatography column. This column was packed with Cation exchange resin (SP400, Mitsubishi Chemicals, Japan)."
  read: fulltext
  note: >-
    This is the ovomucoid example behind the CEX parameters already in dsp.yaml
    (iex_binding_capacity_cex_every 50-100 g/L resin, iex_column_volumes_per_cycle_every, the
    25 mM citrate / 1 M NaCl buffers in Table 4). Same example gives the fermentation conditions
    quoted under ovd_fermentation_conditions_patent below. The patent's reason for chromatography
    is not purity of the protein but removal of an "extracellular polysaccharide" (EPS): Table 1
    reports the concentrate as 53% protein / 47% EPS w/w and the purified product as "98" % protein,
    and Table 2 notes the EPS actually HELPS gelation ("removing the recombinant cell byproduct
    (e.g., EPS) reduced the gel hardness and chewiness"). An anionic Capto Q variant is given in
    Example 3 with "the feed is not pH modified here simplifying the process significantly".

- key: ovd_fermentation_conditions_patent
  value: {growth_h: 36, growth_pH: 5, induction_pH: 6}
  unit: fermentation conditions for the ovomucoid example
  grade: B
  source: "Kale A, Patnaik R (Clara Foods Co. / The EVERY Co.). US 2024/0083940 A1 (2024), Example 2 [0703]"
  doi_or_url: https://patents.google.com/patent/US20240083940A1/en
  locator: "Example 2, para [0703]"
  quote: "The resulting strain was grown in fermentation conditions in high-density growth conditions at about pH 5. After about 36 hours of growth under fermentation conditions, the pH was raised to about pH 6, and expression of the illustrative protein was induced by the addition of methanol to the culture."
  read: fulltext
  note: >-
    Already in data/titers.csv as a conditions-only row (source_key Every2024-purif). 36 h growth
    matches Intelligen's OVA design basis (36 h growth + 72 h induction) and EVERY's generic
    bioreactor recipe in US 2024/0209383 A1 [0298]: "the culture may be grown for 24 hrs until all
    glucose is consumed ... fed glucose at a glucose-limiting rate for 12 hours ... co-feed of
    glucose and methanol for 96 hours" (24 + 12 = 36 h growth, then 96 h induction = 132 h total,
    consistent with FIG. 22 running to 140 h EFT). Note the strain in this example is "mutM"
    (non-methanol-utilising), not the mutS of GRN 967.

