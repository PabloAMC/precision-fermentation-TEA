  value: "ovalbumin (Gal d 2), single protein, K. phaffii DFB-004 / ATCC GSD-1235"
  unit: identity of the GRN 1104 product
  grade: A
  source: "Clara Foods Co. DBA The EVERY Company. GRAS Notice (GRN) 1104 with amendments, September 2022; FDA 'no questions' letter 17 October 2023"
  doi_or_url: https://www.fda.gov/media/170789/download
