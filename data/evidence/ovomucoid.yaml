  doi_or_url: 10.1016/j.ijbiomac.2025.145813
  locator: "abstract"
  quote: "the highest concentration of ovomucoid, 23 mg/L, was obtained when a signal peptide derived from EPX1 ... and the GCW14 promoter were employed along with ... HAC1, and a protein disulfide isomerase, PDI1 ... Finally, the extracellular production of ovomucoid under high-cell density cultivation was maximized to 929 mg/L."
