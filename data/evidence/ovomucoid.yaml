  doi_or_url: https://www.fda.gov/media/147830/download
  locator: "Sect. 1.4 p.5; Part 4 'Self-limiting Levels of Use' p.30"
  quote: "It's intended uses include but are not limited to protein fortification of conventional foods such as sports drinks, protein supplement powders, and nutritional bars ... The use of NSEWP is limited by the functionality of the protein in the food matrix, e.g. the solubility of the protein may limit the use in Ready to Drink Sports Drink"
  read: fulltext
  note: >-
    Ovomucoid is sold for its SOLUBILITY AND CLARITY, not for foaming or gelling: clear high-protein
    beverages, protein powders, bars, fruit snacks. The GRN 967 amendment gives maximum use levels
    per serving: protein and nutritional powders 25 g, protein and nutritional drinks 30 g
    (240 g serving = 12.5% w/w), protein cookies and bars 20 g per 40 g RACC, protein-supplemented
    chips 19 g per 30 g, fruit snacks 3.2 g per 30 g (amendment Table 1, p.2). The cumulative
    estimated intake FDA accepted is "21.5 g/p/d at the mean and 47.9 g/p/d at the 90th percentile".
    EVERY's beverage patent claims rOVD "comprises less than about 3% w/w or w/v" as a wine/juice
    fining agent (US 2024/0315285 A1, B). Contrast GRN 1104's ovalbumin, which is sold for
    "foaming, gelation, and binding" at 2-25% inclusion in bakery, prepared foods and meat
    analogues (GRN 1104 Table 5) - the two products do not compete for the same slot.

- key: ovd_digestibility_and_trypsin_inhibition
  value: 0.93
  unit: in-vitro digestibility of the recombinant ovomucoid product (fraction)
  grade: A
  source: "Clara Foods Co. GRN 967, Tables 1 and 2"
  doi_or_url: https://www.fda.gov/media/147830/download
  locator: "Sect. 2.1.3, Table 1 (trypsin inhibition) and Table 2 (digestibility), pp.11-12"
  quote: "SOL19303 8190 TIU / g | SOL19317 8180 TIU / g | SOL19351 8469 TIU / g | Native chicken OVD 13721 TIU / g ... SOL19303 93% | SOL19317 93% | SOL19351 93% | Native chicken OVD 92%"
  read: fulltext
  note: >-
    Two product-quality facts that matter commercially rather than for cost. (1) The product retains
    60% of native trypsin-inhibitor activity, lower "due to their lower glycosylation"; ovomucoid
    inhibits BOVINE but not human trypsin (GRN 967 p.11, citing Travis 1971), which is why FDA
    accepted it as a food protein. (2) In-vitro digestibility 93% vs 92% native. (3) The product
    must still be labelled "Contains egg" (FALCPA) - a marketing constraint on an "animal-free"
    ingredient that applies to every PF egg protein.

# =======================================================================================
# 7. Animal-welfare arithmetic (all derived; inputs are A-grade)
# =======================================================================================

- key: ovd_eggs_per_kg_egg_white_protein
  value: 275
  low: 256
  high: 303
  unit: US large eggs per kg of egg-white protein (derived)
  grade: A
  source: "Derived (mine) from data/evidence/milk_egg.yaml egg_white_protein_fdc_foundation and egg_large_white_mass_fdc_foundation"
  doi_or_url: "https://api.nal.usda.gov/fdc/v1/foods?api_key=DEMO_KEY&fdcIds=747997&format=full"
  locator: "milk_egg.yaml derived_protein_per_litre_and_per_egg: egg_white_protein_g_per_large_egg 3.64 (low 3.3, high 3.9)"
  quote: null
  read: fulltext
  note: >-
    Derived (mine) - check: 1000 g / 3.64 g per egg = 275 eggs per kg of egg-white protein
    (low 1000/3.9 = 256, high 1000/3.3 = 303). On an ovomucoid basis, 1 kg of ovomucoid is the
    ovomucoid content of 2,500 eggs (0.40 g per egg). Note which basis the model should use: a PF
    ovomucoid or egg-white-protein product displaces egg-WHITE protein, so 275 eggs/kg is the right
    figure; the whole-egg basis used in docs/PROTEIN_CANDIDATES.md (7.9 kg egg per kg protein at
    12.6%) corresponds to 160 eggs per kg of whole-egg protein and understates the egg count by
    ~1.7x for a white-protein product.

- key: ovd_hen_years_per_tonne
  value: 950
  low: 950
  high: 1340
  unit: laying-hen-years per tonne of egg-white protein displaced (derived)
  grade: A
  source: "Derived (mine) from USDA NASS, Chickens and Eggs 2024 Summary (February 2025) and FAOSTAT 2023 world yield"
  doi_or_url: https://esmis.nal.usda.gov/sites/default/release-files/1v53jw96n/4b29d373g/4455b918n/ckegan25.pdf
  locator: "NASS 2024 Summary, 'United States Average Layers Down 2 Percent', p.5; FAOSTAT item 'Hen eggs in shell, fresh', Element Yield, World 2023"
  quote: "Layers during 2024 averaged 375 million, down 2 percent from the year earlier. The annual average production per layer on hand in 2024 was 290 eggs, up 1 percent from 2023."
  read: fulltext
  note: >-
    Derived (mine) - check: at the US rate of 290 eggs per layer-year, 275 eggs = 0.95 hen-years per
    kg, i.e. 950 hen-years per tonne of egg-white protein. At the FAO world average of 205 eggs per
    hen per year (ovd_world_egg_and_egg_white_protein_volume) it is 1.34 hen-years per kg, i.e.
    1,340 per tonne. A 1,000 t/yr PF plant at s = 1 would therefore displace the output of roughly
    0.95-1.34 million laying hens - about 0.011-0.016% of the world laying flock (8.53 billion).
    For the lives-based comparison in docs/PROTEIN_CANDIDATES.md: 275 eggs = 15.6 kg of in-shell egg
    (at 56.7 g), so at the Faunalytics/OWID rates of 0.163 lives per kg (total) and 0.0546 (direct)
    one kg of egg-white protein embodies ~2.5 lives total / 0.85 direct - about twice the
    whole-egg-protein figure quoted in that document, because the yolk protein is a co-product that
    a white-protein replacement does not displace. All of this assumes a replacement sold as
    egg-white protein; a product sold only as an ovomucoid fraction displaces nothing unless the
    rest of the white is also replaced.
