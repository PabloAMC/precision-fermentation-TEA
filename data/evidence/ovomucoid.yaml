# =======================================================================================
# 4. Downstream physics: solubility, heat stability, dryer feed
# =======================================================================================

- key: ovd_solubility_practical
  value: 300
  low: 200
  high: 300
  unit: g/L in water (w/v basis on protein), clear solution
  grade: B
  source: "Clara Foods Co. US 12,096,784 B2 (2024), Examples 3-5 and 13"
  doi_or_url: https://patents.google.com/patent/US12096784B2/en
  locator: "Example 4 (30% w/v at pH 4.06 and 6.3); Example 3 (4.23% w/v); Example 13 (species comparison)"
  quote: "The rOVD was surprisingly soluble in deionized water at 30% (w/v based on protein amount) at either pH 4.06 or pH 6.3."
  read: fulltext
  note: >-
    This is the most important downstream fact about ovomucoid and it breaks the 50 g/L
    "practical solubility" that Intelligen assumes for ovalbumin. The same examples show the
    solutions stay CLEAR (OD600 0.047 at 4.23% w/v vs 0.037 for water) and survive heat:
    pasteurisation (72 C, 1 min) and hot fill (85 C, 30 s) leave OD600 essentially unchanged at
    30% w/v, pH 4.06 or 6.3; only retorting (121 C, 15 min) coagulates it at pH 4 or 6. The
    turkey-vulture and hummingbird orthologues dissolve to 20% and 10% w/v respectively
    (Example 13), so 30% is specific to the chicken protein. For the model: ovomucoid's solubility
    is NOT a constraint anywhere in the train - not at the UF retentate, not at the dryer feed.
    A caveat: these are purified-powder redissolution experiments at low ionic strength, not
    process streams, and EVERY nonetheless operates its own UF/DF at 50 g/L (dsp.yaml
    df_flux_10kda_at_50gpl_every), presumably for viscosity/flux reasons rather than solubility.

- key: ovd_heat_stability
  value: 77
  unit: C, denaturation temperature of native ovomucoid
  grade: A
  source: "Beck F et al. BMC Biotechnol 25:1002 (2025) Table 1"
  doi_or_url: 10.1186/s12896-025-01002-3
  locator: "Table 1 'Physicochemical properties of egg white and yolk proteins', row Ovomucoid"
  quote: "Ovomucoid 28 186 4.1 77 9"
  read: fulltext
  note: >-
    Columns: MW (kDa) | amino acids | pI | denaturation temperature Td (C) | disulfide bonds. For
    comparison the same table gives ovalbumin Td 84 C and ovotransferrin 61 C; the 2025 isolation
    review puts it differently - "OVM has the highest heat, acid, and enzymatic hydrolysis
    stabilities of the four, making it the most allergenic" (Foods 14:1944, A). Note Td is not the
    same as "survives boiling in solution": in the dilute, low-ionic-strength conditions of EVERY's
    beverage tests it survives 85 C, and it is the protein that remains soluble when the rest of
    egg white has set. Process consequences: (i) a heat step can be used for microbial reduction
    before drying ("the resulting mixture is either microfiltered or heat treated for the final
    microbial reduction step pre drying", US 2024/0083940 A1 Ex. 5-7, B); (ii) heat-denature-the-
    host-protein polishing is an obvious option for this protein but NO PF example of it was found
    (see ovd_heat_purification_egg_route).

- key: ovd_heat_purification_egg_route
  value: 65
  unit: C for 20 min, heat polishing of ovomucoid in the classical egg-white fractionation route
  grade: A
  source: "Petrenko V et al. (eds). Insights into Isolation and Purification Strategies of Egg Allergens. Foods 14(11):1944 (2025), review of egg-protein fractionation"
  doi_or_url: 10.3390/foods14111944
  locator: "Section on co-purification of OVM and OVT (citing ref [59])"
  quote: "OVM and OVT were sequentially separated through precipitation with a high concentration of ethanol (61%) and salts (2.5% ammonium sulfate and 2.5% citric acid). OVM was further purified by heating at 65 °C for 20 min to remove the impurities, yielding > 96% for OVM and >92% for OVT, both with purity levels above 88%"
  read: fulltext
  note: >-
    FROM EGG WHITE, NOT FROM BROTH (grade A as data, grade D as an analogy for a PF train). The
    classical ovomucoid route is exactly the one the physics suggests: precipitate the other
    proteins with ethanol or TCA and leave ovomucoid in the supernatant, then heat to denature what
    is left. The same review lists "OVA was precipitated with 5% trichloroacetic, and OVM was
    isolated from the supernatant by ethanol precipitation. Yields for LYS, OVM, and OVA were 77%,
    94%, and 98%", and a cation-exchange route (CM-Sepharose after pH 3.8 adjustment) giving 60.0%
    OVM yield. None of these has been published for a fermentation broth, and ethanol or TCA at
    these volumes would be a new unit operation in the model. If a cheaper-than-UF/DF polishing
    step is ever wanted for ovomucoid, heat denaturation of K. phaffii host protein (which is what
    the 7-12% host protein in GRN 967 consists of) is the first thing to cost - but it is at
    present an unevidenced idea, not a route.

- key: ovd_dryer_feed_solids
  value: 0.05
  low: 0.05
  high: 0.30
  unit: mass fraction dry matter in the spray-dryer feed
  grade: C
  source: "Clara Foods Co. US 12,096,784 B2 Ex. 20 and US 2024/0083940 A1 Ex. 8 (EVERY's own practice); upper bound by analogy with egg white and WPC80"
  doi_or_url: https://patents.google.com/patent/US12096784B2/en
  locator: "US 12,096,784 Ex. 20 ('50-60 g/L'); US 2024/0083940 Ex. 8 [0717] (drying conditions)"
  quote: "Liquid rOVD was concentrated to 50-60 g/L using a 5 kDa TFF membrane ... The diafiltered retentate is then sterile filtered using a 0.2 um MF filter and spray dried with inlet temp around 165° C. and outlet temp not exceeding 80° C."
  read: fulltext
  note: >-
    value = EVERY's documented practice, ~50-60 g/L protein, i.e. about 5-6% dry matter, which is
    the SAME low feed concentration the repo already flags for rOVA (dsp.yaml
    spray_dryer_feed_solids_wpc note: at 5% solids about 19 kg water is evaporated per kg solids,
    against 1.8 kg at 36%). high = 0.30 by analogy with the repo's dryer_feed_solids_ova
    (egg white is industrially ultrafiltered to 23% solids) and with WPC80 at ~36%; ovomucoid's
    300 g/L solubility (ovd_solubility_practical) means there is no physical reason it cannot be
    concentrated as far as flux and viscosity allow, so the high case is a process-design choice,
    not a property limit. Drying energy is therefore the largest single modelling lever on this
    product, and EVERY's own 5% feed is the pessimistic end. The 165 C inlet / <=80 C outlet pair
    is a usable dryer specification.

- key: ovd_host_protein_removal_by_ufdf
  value: 0.10
  low: 0.074
  high: 0.124
  unit: fraction of the powder's protein that is K. phaffii host protein after the UF/DF route
  grade: A
  source: "Clara Foods Co. GRN 967 amendment (2 April 2021), Response to Question 9 and Table 1"
  doi_or_url: https://www.fda.gov/media/152292/download
  locator: "Response to Question 9, p.7-8"
  quote: "Analysis of NSEWP lots showed that they contained ~7 to 12% host protein, w/w"
  read: fulltext
  note: >-
    Derived (mine) from the same table: OVD is 87.6/90.6/92.6% of the protein in the three lots, so
    host protein is 7.4-12.4%, and the lots list 26 identified K. phaffii proteins (superoxide
    dismutase, endochitinase, Kar2p, PDI, glucanases, cell-wall proteins). This is the quantitative
    statement of what the 'concentrate' route cannot remove. GRN 1104's ovalbumin route, which adds
    chromatography, reports that most host proteins are gone after the column (Table 2: 10 of 12
    host proteins "Post-purification: No"), which is presumably why the column is there. For the
    model: target_frac_of_protein ~0.90 for the UF/DF route, ~0.97+ for the chromatographic route.

