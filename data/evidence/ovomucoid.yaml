- key: ovd_titer_every_patent_30g_L
  value: 30.19
  unit: g/L broth titer, K. phaffii, fed-batch bioreactor
  grade: B
  source: "Clara Foods Co. (The EVERY Co.). Systems and methods for high yielding recombinant microorganisms and uses thereof. US 2024/0209383 A1 (2024), Example 9 'Highly Productive Strains for Ovomucoid'"
  doi_or_url: https://patents.google.com/patent/US20240209383A1/en
  locator: "Example 9, paras [0376]-[0377]; FIG. 22 (Sheet 24 of 24)"
  quote: "Strain 110 showed an average broth titer of 30.19 g/L EWP4, while strain 111 showed an average broth titer of 22.17 g/L and was unsuccessful"
  read: fulltext
  note: >-
    VERIFIED AND EXTENDED in this pass. (a) EWP4 is ovomucoid: the example is titled "Highly
    Productive Strains for Ovomucoid" and the enclosing patent uses EWP4 only in that example.
    (b) FIG. 22 was read as a rendered page image: y-axis "Broth Titer (g/L)", x-axis "EFT (hrs)"
    to 140 h, two runs per strain; strain 110 rises from ~0 at 18 h to ~8 (50 h), ~17.5 (72 h),
    ~22 (90 h), ~28.5 (120 h) and ~30.2 at 140 h - so 30.19 g/L is an END-OF-RUN value at about
    140 h elapsed fermentation time, and the curve has NOT plateaued. Strain 111 peaks ~24.5 at
    120 h and falls to 22-23 at 140 h with "some cellular damage ... apparent by SDS-PAGE".
    (c) Strain 110 is the parent strain 106 plus "4xTLR1-EWP4 inserted into chromosome 1" (one copy
    truncated), under "late firing"/de-repression promoters, and it "performed better (5.8% better
    broth titer) than the parental strain 106 using a standard fermentation process".
    (d) NOT STATED ANYWHERE: vessel size, cell density, assay method, and whether methanol was fed
    in this run. The bioreactors used elsewhere in the patent are "duplicate DASGIP 2 L reactors"
    (Example 3), so 2 L is a plausible but unverified scale. (e) 30.19 g/L at ~140 h is
    0.22 g/L/h average, and the model's OVA design basis (Intelligen, 30 g/L in 4.5 d) is the same
    number at a shorter time. This is the single best public titer for any egg protein and it is
    for OVOMUCOID, not ovalbumin - Intelligen's OVA TEA borrows it.

