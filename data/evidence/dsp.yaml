- key: mf_clarification_volume_reduction_every
  value: 7.5
  low: 6
  high: 9
  unit: volume concentration factor of the 0.2 um MF retentate (x)
  grade: B
  source: "Kale A, Patnaik R (Clara Foods Co. / The EVERY Co.). Purified protein compositions and methods of production. US 2024/0083940 A1 (2024)"
  doi_or_url: https://patents.google.com/patent/US20240083940A1/en
