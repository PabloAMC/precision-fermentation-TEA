# Downstream processing (DSP) evidence: design and cost data per unit operation.
# Phase B research output, 2026-09-26. Format and grades: see README.md in this folder.
#
# Conventions used in this file (read before using any value):
# - quote: verbatim text. Where the source is a table or spreadsheet, the needed cell or
#   column texts are joined with " | " in reading order (other cells may be omitted);
#   nothing inside a cell is changed. Superscript footnote markers and printed page
#   numbers at page breaks are dropped. PDF ligatures (fi, fl) are written as plain letters.
# - value: the number stated by the source. Where the source gives only a range, value is
#   the midpoint and the note says so. Where it gives only a bound ("under", "more than"),
#   value is that bound and the note says which kind.
# - Cost year: stated in unit or note. No escalation has been applied anywhere.
# - Any number in a note that is not in the quote is either a conversion or derivation
#   done here (marked "derived"), or is quoted in the note itself.
# - Grade D is used when the source is sound but the parameter depends on the product or
#   organism and the source studies a different one (dairy whey, microalgae, E. coli).

# ---------------------------------------------------------------------------------------
# 1. Cell removal: disk-stack centrifuges
# ---------------------------------------------------------------------------------------

- key: centrifuge_disk_stack_cost_coeff_2018usd
  value: 68407.88
  unit: "USD2018 purchased; cost = value x (feed flow in gpm)^0.52"
  grade: B
  source: "Humbird D. Scale-up economics for cultured meat. Biotechnol Bioeng 118:3239-3250 (2021), SI workbook"
  doi_or_url: 10.1002/bit.27848
  locator: "SI workbook, sheet Equip, cells AB1, AB2, AB3:AC3, AB19:AD21"
  quote: "Centrifuge, disk stack | From Couper et al 3rd ed. | max capacity (gpm) | 150 | Power fit, 2018$ | Exponent | 0.52 | A | 68407.87631591759"
  read: fulltext
  note: >-
    Power-law fit (exponent 0.52) to Couper et al. data points of 10 to 150 gpm (2.3 to
    34 m3/h; 1 gpm = 0.2271 m3/h). Check against the data: cell AE6 gives "226519.7680273211"
    (2018$) at 10 gpm, which the fit reproduces. Cell AB15: "Factor of 2.2 applied to scale
    Couper from CS (presumably) to 316". Bare purchased cost; installation is applied
    separately. A plant larger than 150 gpm per machine needs parallel units.

- key: centrifuge_disk_stack_power_kwh_per_m3
  value: 1.35
  unit: kWh per m3 feed
  grade: B
  source: "Humbird D. Scale-up economics for cultured meat. Biotechnol Bioeng 118:3239-3250 (2021), SI workbook"
  doi_or_url: 10.1002/bit.27848
  locator: "SI workbook, sheet Equip, cells AB40, AD40, AE40"
  quote: "Power demand | 1.35 | kWh/m3"
  read: fulltext
  note: >-
    Humbird's design value for disk-stack centrifuge electricity. BioSTEAM's SolidsCentrifuge
    (a solids-discharge centrifuge, not a disk stack) sets "kWhr_per_m3 = 1.40" without
    stating its source; its capital cost cites Seider et al. 2017. Milledge & Heaven report
    about 1.4 kWh/m3 for a Westfalia disk clarifier (key
    centrifuge_disk_specific_energy_hsb400).

- key: centrifuge_disk_stack_flow_per_machine_yeast
  value: 131.27
  unit: gpm per machine (derived 29.8 m3/h)
  grade: B
  source: "Humbird D. Scale-up economics for cultured meat. Biotechnol Bioeng 118:3239-3250 (2021), SI workbook"
  doi_or_url: 10.1002/bit.27848
  locator: "SI workbook, sheet A.1 (baker's yeast), row 169 (A169:K169); sizing in row 149"
  quote: "Centrifuge, disk stack | 2 | 2 | 131.27231958371843 | gpm | 864000 | 1728000 | Couper"
  read: fulltext
  note: >-
    Baker's yeast broth (Humbird's calibration case), 2 machines per train. Row 149 reads
    "Centrifuge: prod volume in | 2 | h/train | 59623.887554924906 | kg/h capacity | 2 |
    req/train | 0.2 | solids", i.e. each production batch is dewatered in 2 h to 20% solids.
    Unit conversion here: 131.27 gpm x 0.2271 = 29.8 m3/h.

- key: centrifuge_disk_stack_cost_each_yeast_plant
  value: 864000
  unit: USD2018 purchased, per machine (131 gpm)
  grade: B
  source: "Humbird D. Scale-up economics for cultured meat. Biotechnol Bioeng 118:3239-3250 (2021)"
  doi_or_url: 10.1002/bit.27848
  locator: "Appendix A, Table A.1, p.93 (printed)"
  quote: "Centrifuge 2 $864,000 $1,728,000"
  read: fulltext
  note: >-
    Two disk-stack centrifuges for a 6 x 200 m3 baker's yeast plant. The value comes from
    the Couper fit in key centrifuge_disk_stack_cost_coeff_2018usd evaluated at 131 gpm.
    The same table lists "RVF 2 $326,000 $652,000". Humbird applies a Lang factor of 4.5 to
    the total purchased equipment cost.

- key: centrifuge_disk_max_hydraulic_capacity_hsb400
  value: 95
  low: 35
  unit: m3/h per machine
  grade: C
  source: "Milledge JJ, Heaven S. Disc stack centrifugation separation and cell disruption of microalgae: a technical note. Environ Nat Resour Res 1(1):17 (2011)"
  doi_or_url: 10.5539/enrr.v1n1p17
  locator: "p.18"
  quote: "a Westfalia HSB400 disc-bowl centrifuge with intermittent self-cleaning bowl centrifugal clarifier has a maximum capacity of 95 m3 h-1, but is limited to 35 m3 h-1 for algae harvesting"
  read: fulltext
  note: >-
    Vendor figure (GEA Westfalia personal communication, reported in the paper). The
    usable throughput depends on the feed: small cells or high solids reduce it (35 m3/h
    for algae). High-density yeast broth is also solids-limited, so plan below the
    hydraulic maximum.

- key: centrifuge_disk_specific_energy_hsb400
  value: 1.4
  unit: kWh per m3 feed
  grade: C
  source: "Milledge JJ, Heaven S. Disc stack centrifugation separation and cell disruption of microalgae: a technical note. Environ Nat Resour Res 1(1):17 (2011)"
  doi_or_url: 10.5539/enrr.v1n1p17
  locator: "p.18"
  quote: "The maximum power of the motor is 75 kW, but normal operating demand is probably around 50 kW, giving an energy cost for separation of 1.4 kWh m-3"
  read: fulltext
  note: "Vendor estimate (GEA Westfalia, personal communication, 2009). Consistent with Humbird's 1.35 kWh/m3."

- key: centrifuge_cell_loss_fraction
  value: 0.03
  low: 0.01
  high: 0.05
  unit: fraction of cells lost to the centrate
  grade: B
  source: "Petrides D. Bioprocess Design and Economics. Intelligen web version (Mar 2015) of ch.11 in Harrison RG, Todd PW, Rudge SR, Petrides DP. Bioseparations Science and Engineering, 2nd ed., Oxford University Press (2015)"
  doi_or_url: https://www.intelligen.com/wp-content/uploads/2020/05/BioProcessDesignAndEconomics_March_2015.pdf
  locator: "Section 11.3.1, Cell harvesting, p.11-8"
  quote: "Cell loss during centrifugation is typically 1 to 5%."
  read: fulltext
  note: >-
    value is the midpoint of the stated range. This is solids that escape to the liquid
    phase, so it matters for clarification (MF load) rather than product loss when the
    product is secreted. Product loss comes from liquid trapped in the paste (next key).

- key: centrifuge_paste_liquid_fraction
  value: 0.5
  low: 0.4
  high: 0.6
  unit: volume fraction of extracellular liquid in centrifuge paste
  grade: B
  source: "Petrides D. Bioprocess Design and Economics. Intelligen web version (Mar 2015) of ch.11 in Harrison et al., Bioseparations Science and Engineering, 2nd ed. (2015)"
  doi_or_url: https://www.intelligen.com/wp-content/uploads/2020/05/BioProcessDesignAndEconomics_March_2015.pdf
  locator: "Section 11.3.1, Recovery of extracellular products, Centrifugation, p.11-11"
  quote: "In general, the centrifuge paste contains 40 to 60% v/v extracellular liquid. To recover the product dissolved in that liquid, the paste is usually washed and re-centrifuged."
  read: fulltext
  note: >-
    value is the midpoint. This is the physical basis for dilution and two-stage
    centrifugation. At 92 g/L dry cells (Intelligen OVA) the wet cell volume is a large
    share of the broth, so the product trapped in an unwashed paste is a first-order loss.

- key: centrifuge_feed_biomass_dilution_intelligen
  value: 45
  unit: g/L dry biomass in centrifuge feed (after in-line dilution)
  grade: B
  source: "Da Gama Ferreira R, Misailidis N, Parisis V, Petrides D. Egg white protein (ovalbumin) production via precision fermentation: process modeling and cost analysis using SuperPro Designer. Intelligen Inc. (Sep 2025)"
  doi_or_url: 10.13140/RG.2.2.29080.87048
  locator: "Clarification section, p.7 (printed)"
  quote: "the broth is in-line diluted to 45 g/L biomass using a custom mixer (P-27 / MX-202) and subjected to two sequential centrifugation steps"
  read: fulltext
  note: >-
    The harvest broth holds 92 g/L dry cells, so dilution roughly doubles the centrifuge
    hydraulic load. The first-stage underflow is re-diluted to 45 g/L and centrifuged again.
    The MF retentate is recycled to the start of clarification. Design assumption, not a
    measurement.

- key: centrifuge_feed_pcv_dilution_every
  value: 25
  unit: "% v/v packed cell volume in centrifuge feed"
  grade: B
  source: "Kale A, Patnaik R (Clara Foods Co. / The EVERY Co.). Purified protein compositions and methods of production. US 2024/0083940 A1 (2024)"
  doi_or_url: https://patents.google.com/patent/US20240083940A1/en
  locator: "Example 8, para [0717], p.33-34"
  quote: "Prior to centrifugation, the broth was diluted to reach a packed cell volume of 25% v/v."
  read: fulltext
  note: >-
    K. phaffii, large-scale preparation. The same paragraph specifies a disc-stack
    centrifuge and a supernatant OD600 "preferably <0.9 AU", with the broth chilled to 8 C.
    Patent example (company process description).

- key: centrifuge_underflow_solids_yeast
  value: 0.20
  unit: mass fraction solids in centrifuge underflow (cream yeast)
  grade: B
  source: "Humbird D. Scale-up economics for cultured meat. Biotechnol Bioeng 118:3239-3250 (2021)"
  doi_or_url: 10.1002/bit.27848
  locator: "Appendix A (baker's yeast analysis), p.90 (printed)"
  quote: "centrifuged to a cream yeast consistency of 20% solids. To make compressed yeast, the solids are further dewatered by rotary vacuum filter (RVF) to ~33%."
  read: fulltext
  note: "Baker's yeast. The RVF cake value (~33% solids) comes from the same quote."

- key: installation_factor_solids_handling_nrel
  value: 1.7
  unit: installed cost / purchased cost
  grade: B
  source: "Humbird D, Davis R, Tao L, et al. Process design and economics for biochemical conversion of lignocellulosic biomass to ethanol. NREL/TP-5100-47764 (2011)"
  doi_or_url: https://docs.nrel.gov/docs/fy11osti/47764.pdf
  locator: "Table 25, p.59"
  quote: "Skidded equipment 1.8 Solids handling equipment (incl. filters) 1.7"
  read: fulltext
  note: >-
    NREL's individual installation factors. Solids handling and filters use 1.7. Skidded
    equipment (a candidate for membrane skids) uses 1.8. Only needed if the model uses
    item-by-item installation factors instead of a Lang factor.

