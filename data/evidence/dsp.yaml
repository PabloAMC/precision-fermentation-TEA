# ---------------------------------------------------------------------------------------
# 3. Microfiltration, ultrafiltration, diafiltration
# ---------------------------------------------------------------------------------------

- key: uf_flux_intelligen
  value: 30
  unit: L/m2/h (average over the concentration step)
  grade: B
  source: "Da Gama Ferreira R, Misailidis N, Parisis V, Petrides D. Egg white protein (ovalbumin) production via precision fermentation: process modeling and cost analysis using SuperPro Designer. Intelligen Inc. (Sep 2025)"
  doi_or_url: 10.13140/RG.2.2.29080.87048
  locator: "Purification & Drying section, p.8 (printed)"
  quote: "the average filtrate flux was assumed to be 30 L/m2/h"
  read: fulltext
  note: >-
    UF of the clarified, diluted K. phaffii harvest, concentrated to 50 g/L. Derived: at
    about 5x, the UF feed is about 10 g/L OVA, well below the 30 g/L titer, because of the
    centrifuge dilution and MF recycle. This is an assumption. Compare the DF flux of 5 +/- 2 LMH at 50 g/L in EVERY's scale-up example
    (key df_flux_10kda_at_50gpl_every). UF membrane area in the model is very sensitive
    to this choice.

- key: uf_rejection_ova_intelligen
  value: 0.995
  unit: rejection coefficient (ovalbumin)
  grade: B
  source: "Da Gama Ferreira R, Misailidis N, Parisis V, Petrides D. Egg white protein (ovalbumin) production via precision fermentation: process modeling and cost analysis using SuperPro Designer. Intelligen Inc. (Sep 2025)"
  doi_or_url: 10.13140/RG.2.2.29080.87048
  locator: "Purification & Drying section, p.8 (printed)"
  quote: "the membrane rejection coefficient was assumed to be 0.995 for rOvalbumin; 0.60 for HCP; and 0.80 for nucleic acids."
  read: fulltext
  note: >-
    Assumed values. HCP rejection of 0.60 means UF alone removes only part of the host
    protein. OVA is 45 kDa. BLG is an 18 kDa monomer and a 36 kDa dimer, so it needs a
    tighter cut-off (5 to 10 kDa in the patents).

- key: uf_final_protein_conc_intelligen
  value: 50
  unit: g/L protein in UF retentate
  grade: B
  source: "Da Gama Ferreira R, Misailidis N, Parisis V, Petrides D. Egg white protein (ovalbumin) production via precision fermentation: process modeling and cost analysis using SuperPro Designer. Intelligen Inc. (Sep 2025)"
  doi_or_url: 10.13140/RG.2.2.29080.87048
  locator: "Purification & Drying section, p.8 (printed)"
  quote: "the target concentration was set to 50 g/L of rOvalbumin, which corresponds to its practical solubility limit. This setting is equivalent to a concentration factor of approximately 5×."
  read: fulltext
  note: >-
    EVERY also concentrates to about 50 g/L. Whey UF reaches much higher solids (27 to 32%
    for WPC80, key uf_retentate_solids_wpc80). The 50 g/L limit is specific to OVA
    precipitation feed or solubility and should not be applied to BLG without checking.

- key: uf_flux_range_petrides
  value: 35
  low: 20
  high: 50
  unit: L/m2/h
  grade: B
  source: "Petrides D. Bioprocess Design and Economics. Intelligen web version (Mar 2015) of ch.11 in Harrison et al., Bioseparations Science and Engineering, 2nd ed. (2015)"
  doi_or_url: https://www.intelligen.com/wp-content/uploads/2020/05/BioProcessDesignAndEconomics_March_2015.pdf
  locator: "Section 11.3.2, Product concentration, Ultrafiltration, p.11-12"
  quote: "The typical operating transmembrane pressure is 2 to 5 bar and the average flux is 20 to 50 L m−2 h−1."
  read: fulltext
  note: "value is the midpoint. General protein UF heuristic from a textbook chapter."

- key: df_flux_10kda_at_50gpl_every
  value: 5
  low: 3
  high: 7
  unit: L/m2/h
  grade: B
  source: "Kale A (Clara Foods Co. / The EVERY Co.). Recombinant protein recovery methods and uses thereof. US 2025/0134130 A1 (2025)"
  doi_or_url: https://patents.google.com/patent/US20250134130A1/en
  locator: "Example 6 (illustrative process scale-up), Table 8 '10 kDa parameters', p.20"
  quote: "Concentration | At 50 g/L | Average Flux | 5 ± 2 LMH"
  read: fulltext
  note: >-
    Diafiltration of resuspended rOVA precipitate at 50 g/L. The same table gives a PES
    hollow-fibre or spiral-wound membrane, "10° C. ± 5", a TMP of "Up to 2 bar" and
    retentate conductivity "<1 mS/cm". low and high are 5 -/+ 2. This is the most specific
    public flux for a PF egg protein at high concentration, and it is 6x below the 30 LMH
    Intelligen assumes for the dilute concentration step. The on-disk OCR renders it
    "5 = 2 LMH"; the Google Patents text reads "5 ± 2 LMH".

- key: mf_polishing_flux_every
  value: 10
  low: 8
  high: 12
  unit: L/m2/h (expected)
  grade: B
  source: "Kale A (Clara Foods Co. / The EVERY Co.). Recombinant protein recovery methods and uses thereof. US 2025/0134130 A1 (2025)"
  doi_or_url: https://patents.google.com/patent/US20250134130A1/en
