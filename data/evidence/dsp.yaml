  unit: "USD2010 purchased for 2 filters x 384 m2; scaling basis 31,815 kg/h; exponent 0.80"
  grade: B
  source: "Humbird D, Davis R, Tao L, et al. Process design and economics for biochemical conversion of lignocellulosic biomass to ethanol. NREL/TP-5100-47764 (2011)"
  doi_or_url: https://docs.nrel.gov/docs/fy11osti/47764.pdf
  locator: "Appendix A, Area 500 equipment list, item S-505, p.100"
  quote: "S- 505 Pressure Filter Larox 384 sq. m fitration area ea incl packing SS316 2 $3,294,700 2010 strm.a500.evap.571 31815 kg/hr 0.80 1.7"
  read: fulltext
  note: >-
    Row fields: vendor Larox, 384 m2 of filtration area each including packing, SS316,
    2 units, $3,294,700 quoted in 2010, scaled on stream flow 31,815 kg/h with exponent
    0.80, installation factor 1.7. This filter presses lignin-rich stillage, not fungal
    broth. The price per m2 of area should transfer to a T. reesei filter press. The
    filtration rate per m2 must come from fungal data. The auxiliary compressors (M-505,
    M-507) are costed separately in the report.

