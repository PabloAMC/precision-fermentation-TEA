# 5. RECOMMENDATION
# ===========================================================================

- key: recommendation_qp_max_kinetic_upper_bound
  value: 40
  low: 15
  high: 80
  unit: mg product/g DCW/h
  grade: D
  host: kphaffii
  source: "Derived (mine): allocation factor x translational capacity, cross-checked against the measured frontier"
  doi_or_url: null
  locator: null
  quote: null
  read: html   # derived; inputs read as html (schema needs a value)
  note: >
    RECOMMENDED REPLACEMENT TEXT FOR data/pf/base.yaml q_p_max_mg_g_h. The judgment of 40
    survives, but it can now be DERIVED rather than asserted, and its status changes from
    "a physiological ceiling" to "a feasibility ceiling about 2.5x above anything ever
    demonstrated for a secreted protein".
    DERIVATION CHAIN (every input traceable above):
      (i)   protein = 0.37 g/g DCW [A, Carnicer 2009, K. phaffii chemostat]
      (ii)  gamma = 3.0 1/h, r = 0.08 + mu/gamma [A, Metzl-Raz 2017 growth law]
      (iii) translational throughput at mu = 0.2 1/h: 74 mg/g DCW/h with active ribosomes,
            up to 163 if the idle reserve is recruited [D, derived; corrected 2026-10-05]
      (v)   maximum share one HETEROLOGOUS protein has ever taken: ~20-25% of output
            [A, Metzl-Raz mCherry 25%; Pakula 2016 lipase 20%] - homologous proteins reach
            60-90% but that is not the case here
      (vi)  0.25 x 74-163 = 18-41 mg/g/h  ->  VALUE = 40, the generous top of the bracket.
    LOW = 15 mg/g/h: the best specific secretion rate of one protein we found published for any
      industrial microbe (A. niger glucoamylase, 15-16.4, Withers/Swift 1998, grade A),
      with T. reesei fed-batch at 5.5-11.5 and K. phaffii at 0.7-2.1. If the model wants a
      bound that no real organism has ever beaten, 15 is that number.
    HIGH = 80 mg/g/h: half the translational throughput at mu_max, i.e. an allocation
      factor of 0.5 (the homologous-enzyme regime). The ABSOLUTE physical ceiling is
      ~330 mg/g/h (derived_scerevisiae_translational_throughput_mg_g_h) and E. coli has
      reached 170 mg/g/h for an intracellular product, so 80 is not the physics limit -
      it is the physics limit discounted for being a secreted, heterologous protein.
    HONEST CAVEAT, as asked: the literature does NOT support a bound tighter than the total
      synthesis capacity on physical grounds. Everything between 15 and 80 is an
      allocation judgment. The one genuinely hard statement is that q_p cannot exceed
      the cell's translational capacity, ~74-163 mg/g/h in K. phaffii at mu = 0.2 1/h, and that
      the gap between that and the 2.1 mg/g/h actually demonstrated on glucose is a factor of ~35-75 - i.e. the binding
      constraint in a real process is strain and secretory engineering, not physics.
    WHAT WOULD TIGHTEN IT: a measured ER-export flux per cell in K. phaffii (mass units),
      or a genome-scale secretory model reporting a maximum secretion flux in mg/gDCW/h.
      Neither exists in the open literature as of this search.

