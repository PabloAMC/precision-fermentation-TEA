- key: treesei_heterologous_protein_share_pakula2016
  value: 20
  unit: "% of proteins produced (heterologous lipase)"
  grade: A
  host: treesei
  source: "Pakula TM, et al. Biotechnol Biofuels 9:132 (2016)"
  doi_or_url: 10.1186/s13068-016-0547-5
  locator: "Results, 'Description of strains'"
  quote: "D. capitatus lipase is readily produced by T. reesei, reaching almost 20 % of the proteins produced at early stages of cultivations in the study"
  read: html
  note: >
    THE HETEROLOGOUS PENALTY, measured in the same paper and the same strains as the 60-90%
    homologous shares. A foreign protein got to 20%, a native cellobiohydrolase to 60%. In
    the same study a C. cinerea cutinase was "hardly detectable". BLG and OVA are
    heterologous: use 20-25%, not 60%, as the allocation factor for this model.

- key: pcsecyeast_proteome_allocation_li2022
  value: 20.6
  unit: "% of total proteome mass (ribosome, proteasome and secretory machinery)"
  grade: A
  host: scerevisiae
  source: "Li F, Chen Y, Qi Q, Wang Y, Yuan L, Huang M, Elsemman IE, Feizi A, Kerkhoven EJ, Nielsen J. Improving recombinant protein production by yeast through genome-scale modeling using proteome constraints. Nat Commun 13:2969 (2022)"
  doi_or_url: 10.1038/s41467-022-30689-7
  locator: "Results, 'Reconstruction of pcSecYeast'"
  quote: "approximately 70% of the total proteome mass (45.7% from metabolic proteins, 20.6% related to ribosome, proteosome and secretory machinery proteins and 4.6% from unmodeled secretory proteins)"
  read: html
  note: >
    The proteome budget a producing cell must keep for itself: ~46% metabolism plus ~21%
    synthesis-and-secretion machinery. A product can only eat into the remainder plus
    whatever the cell gives up by slowing down. Supports an allocation factor well below 1.

# ===========================================================================
# 3. SECRETORY-PATHWAY CAPACITY (where the bottleneck is)
# ===========================================================================

- key: kphaffii_secretion_bottleneck_er_export_love2012
  value: null
  unit: "qualitative (ER-to-Golgi export identified as the limiting step)"
  grade: A
  host: kphaffii
  source: "Love KR, Politano TJ, Panagiotou V, Jiang B, Stadheim TA, Love JC. Systematic single-cell analysis of Pichia pastoris reveals secretory capacity limits productivity. PLoS ONE 7:e37915 (2012)"
  doi_or_url: 10.1371/journal.pone.0037915
  locator: "Abstract / Introduction"
  quote: "we show directly that the key bottleneck in protein secretion is the capacity of the secretory machinery to transport folded protein out of the endoplasmic reticulum (ER) and beyond"
  read: html
  note: >
    No number, but it tells the model WHICH capacity binds: not transcription, not folding,
    but ER export. Their inference: "these results are consistent with our model in which
    secretory capacity is fixed, and folded proteins accumulate in the ER faster than they
    are secreted", and raising promoter strength or copy number REDUCES per-cell secretion
    (2-4 fold lower median rates under pAOX1 than pGAPDH).

- key: kphaffii_fraction_of_cells_secreting_love2012
  value: 65
  low: 55
  high: 75
