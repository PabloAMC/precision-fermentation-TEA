# data/evidence/kinetic.yaml: a sourced KINETIC UPPER BOUND on the specific secretion rate q_p
# (mg product per g DCW per hour) of one heterologous protein in a yeast (Komagataella phaffii,
# S. cerevisiae as analogy) or a filamentous fungus (Trichoderma reesei, Aspergillus niger).
# Gathered 2026-10-03 by a research pass; moved here 2026-10-05. Purpose: support or replace the
# model's strain.q_p_max_mg_g_h = 40 (grade D). Decision (2026-10-05): the value stays 40 and its
# source text in data/pf/base.yaml now cites this file; no result changes.
#
# REVIEW NOTE (2026-10-05, for Pablo to check): the growth-law arithmetic in
# derived_kphaffii_translational_throughput_at_mu counts the ~8% non-translating ribosome reserve
# (r0) as if it were translating. With active ribosomes only (r - r0 = mu/gamma), the throughput at
# mu = 0.2/h is gamma x (mu/gamma) x P = mu x P = 74 mg/g/h (net growth, by construction), not 163;
# 163 assumes the reserve is recruited. At the model's near-zero growth in production the growth
# law gives no active ribosomes at all, so the '89 mg/g/h at mu = 0.0014' line is not supported.
# The bracket for one heterologous protein at a 0.25 share is therefore ~18-41 mg/g/h, and 40 sits
# at its generous top. The conclusion stands: 40 is a feasibility ceiling, ~2.5x the best secretion
# rate we found published (15-16 mg/g/h, A. niger glucoamylase), not a target. The entries below were corrected
# to match this note after audit R16 (L6).
#
# Format and grades: data/evidence/README.md.
#   A measured/official | B design basis or patent | C company claim/press
#   D analogy or derived | E guess
#
# HOW QUOTES WERE NORMALISED (same convention as data/evidence/hosts.yaml):
#   Unicode transliterated to ASCII: mu for the Greek letter, ~ for the approximately-equal
#   sign, +/- for plus-minus, - for en/em dashes, deg for the degree sign, superscripts
#   written inline (h-1, g-1). Line breaks and reference-marker numbers removed.
#   A literal grep against the saved .txt dumps will therefore sometimes fail; read around
#   the locator instead. Saved full texts (uncommitted) are in references/text/kinetic/
#   (references/INDEX.md, section 5).
#
# HONESTY NOTES - READ FIRST
#   1. EVERY mg/g/h number below is either (a) printed as mg g-1 h-1 by the source
#      [grade A], or (b) an arithmetic conversion by me, marked `source: "Derived (mine)"`
#      with `quote: null` and the full arithmetic in the note [grade D].
#   2. The headline finding is NEGATIVE for a tight bound: nothing in the literature caps
#      secretion at a number close to 40 mg/g/h. The only hard physical ceiling I could
#      derive is the TOTAL TRANSLATIONAL THROUGHPUT of a yeast cell, ~330 mg/g DCW/h in
#      fast-growing S. cerevisiae and, for K. phaffii at mu = 0.2/h, 74 mg/g DCW/h with active
#      ribosomes only, up to ~163 if the idle ribosome reserve is recruited (see the REVIEW NOTE).
#      The highest specific SECRETION rate of a single protein I could find published, in any
#      industrial microbe, is 15-16.4 mg/g/h (A. niger glucoamylase, 20 gene
#      copies, chemostat / pH auxostat). The model's 40 sits between the two: ~2.5x above
#      anything found published for a secreted protein, and ~0.25-0.55x of K. phaffii's
#      translational capacity at mu = 0.2/h. It is defensible as a FEASIBILITY ceiling, not as an achievable target.
#   3. Four entries read only as abstracts (Withers 1998, Swift 1998, Wiebe 2000,
#      Pakula 2005) are marked read: abstract. Their numbers are in the abstract itself.
#   4. Two compiled values (Peebo 2018 Table 1) are a REVIEW's tabulation of other
#      people's primary papers; I did not read the primaries. Grade kept A for the
#      tabulated number but flagged in the note.
#   5. QUOTE CHECK RUN 2026-10-03: every quote was matched, punctuation- and
#      case-insensitively, against the saved source text. Four did not match mechanically,
#      each for a known reason, none for a wording error:
#        kphaffii_mumax_glucose_maurer2006          - (entry dropped on the move: it duplicated
#                                                     hosts.yaml, where it is audited)
#        scerevisiae_ribosome_mass_turnover_...     - Greek delta written "delta-"
#        kphaffii_er_residence_time_love2012        - subscripts written t_sec / t_ERAD
#        compiled_qpmax_by_host_peebo2018           - table row, footnote marker "d" dropped
#   6. I did NOT find a genome-scale secretory model that prints a maximum secretion flux
#      in mg/gDCW/h. pcSecYeast (Li 2022) constrains the proteome, not the flux, and its
#      published results are relative. The secretory-capacity evidence below is therefore
#      mechanistic (where the bottleneck is), not a number.

# ===========================================================================
# 1. TOTAL PROTEIN SYNTHESIS CAPACITY
#    The identity q_total = mu x (protein per g DCW), and the ribosome physics behind it.
# ===========================================================================

- key: kphaffii_protein_fraction_dcw_carnicer2009
  value: 37.0
  low: 34.9
  high: 40.0
  unit: "% w/w of dry biomass"
  grade: A
  host: kphaffii
  source: "Carnicer M, Baumann K, Toplitz I, Sanchez-Ferrando F, Mattanovich D, Ferrer P, Albiol J. Macromolecular and elemental composition analysis and extracellular metabolite balances of Pichia pastoris growing at different oxygen levels. Microb Cell Fact 8:65 (2009)"
  doi_or_url: 10.1186/1475-2859-8-65
  locator: "Table 3 (Biomass composition calculated after the reconciliation procedure), Protein row"
  quote: "Protein | 34.9 | 2.3 | 37.0 | 2.4 | 40.0 | 2.6 | 37.0 | 2.4 | 37.8 | 2.5 | 38.9 | 2.6"
  read: html
  note: >
    TABLE ROW (re-check against the publisher PDF before use). Six columns are
    Fab-expressing and control strains at 21/11/8% inlet O2, glucose-limited chemostat at
    D = 0.1 1/h, 25 degC, reconciled by the Lange-Heijnen maximum-likelihood method.
    sd columns interleaved. Protein rises as oxygen falls. This is THE protein-per-DCW
    input for the q_total = mu x P identity. Note it is lower than the textbook 50%.

- key: microbial_protein_fraction_rule_of_thumb_carnicer2009
  value: 50
  unit: "% w/w of dry biomass"
  grade: D
  host: generic
  source: "Carnicer M, et al. Microb Cell Fact 8:65 (2009), quoting Lange & Heijnen (2001)"
  doi_or_url: 10.1186/1475-2859-8-65
  locator: "Results, 'Proteins and amino acid content'"
  quote: "Proteins are one of the major constituents of the biomass, usually representing around 50% of the dry weight of a microorganism"
  read: html
  note: >
    The textbook rule of thumb, cited (not measured) by Carnicer; their own measurement for
    K. phaffii at D = 0.1/h is 35-40%. Use 0.37 for K. phaffii and 0.50 only as a generous
    upper bound. Grade D because it is a secondary, unspecific statement.

- key: scerevisiae_doubling_times_metzlraz2017
  value: 1.5
  low: 1.5
  high: 6.5
  unit: h (doubling time)
  grade: A
  host: scerevisiae
  source: "Metzl-Raz E, Kafri M, Yaakov G, Soifer I, Gurvich Y, Barkai N. Principles of cellular resource allocation revealed by condition-dependent proteome profiling. eLife 6:e28034 (2017)"
  doi_or_url: 10.7554/eLife.28034
  locator: "Results, 'Growth rate is a major determinant of proteome composition'"
  quote: "Division times of cells in the 15 conditions we examined varied between 1.5 to 6.5 hr."
  read: html
  note: >
    Fastest condition 1.5 h -> mu_max = ln2/1.5 = 0.46 1/h for S. cerevisiae; slowest
    6.5 h -> 0.107 1/h. Used as the S. cerevisiae analogue bracket for the identity.

- key: scerevisiae_translation_elongation_rate_waldron1977
  value: 10.5
  unit: amino acids per ribosome per second
  grade: A
  host: scerevisiae
  source: "Waldron C, Jund R, Lacroute F (1977), as quoted and used by Metzl-Raz E, et al. eLife 6:e28034 (2017)"
  doi_or_url: 10.7554/eLife.28034
  locator: "Results, 'Ribosome content scales linearly with growth rate'"
  quote: "We can estimate gamma using measured parameters: the translation elongation rate (10.5 aa/sec) (Waldron et al., 1977) and the number of amino-acids composing the budding yeast ribosome (12,485 A.A)."
  read: html
  note: >
    SECONDARY: Waldron 1977 itself not read. Metzl-Raz also discuss Bonven & Gullov (1979),
    who report 9.6 aa/s on glucose falling to 5.4 aa/s on acetate, i.e. elongation may fall
    at low growth rate - which would LOWER the ceiling in a slow-growing production phase.

- key: scerevisiae_ribosome_mass_turnover_metzlraz2017
  value: 20
  unit: min (gamma^-1, time for one ribosome to translate its own mass in protein)
  grade: A
  host: scerevisiae
  source: "Metzl-Raz E, et al. eLife 6:e28034 (2017)"
  doi_or_url: 10.7554/eLife.28034
  locator: "Results, 'Ribosome content scales linearly with growth rate'"
  quote: "By this estimation, gamma-1 = 20 min. This predicted value is ~30% smaller than our measured slope delta-r/delta-mu = 21/ln(2) min"
  read: html
  note: >
    gamma = 3.0 1/h is the key constant: mu = gamma x r_active, where r_active is the
    ACTIVE ribosomal-protein fraction of the proteome. Equivalently, one gram of active
    ribosome makes 3 grams of protein per hour. The measured slope (21/ln2 = 30 min) is
    ~1.5x larger, so using gamma = 3/h is the GENEROUS (bound-friendly) choice; the
    measured slope implies gamma = 2.0/h and a ceiling one third lower.

- key: scerevisiae_ribosomal_proteome_fraction_max_warner1999
  value: 30
  unit: "% of proteome mass (ribosomal proteins, rapidly growing cells)"
  grade: D
  host: scerevisiae
  source: "Warner JR (1999), as quoted by Metzl-Raz E, et al. eLife 6:e28034 (2017)"
  doi_or_url: 10.7554/eLife.28034
  locator: "Introduction"
  quote: "Overall, ~30% of the proteome of rapidly growing cells encodes for ribosomal proteins and ~80% of all cellular RNA encodes for the rRNA components of the ribosomes"
  read: html
  note: >
    SECONDARY (Warner 1999 not read). This is the maximum ribosomal allocation; it is the
    r in the ceiling q_max = gamma x r x P. Metzl-Raz's own proteomics gives a
    translation-related fraction of ~40% in standard medium falling to ~15% in slow-growing
    cells, of which ribosomal proteins are the bulk - consistent with 30% at fast growth.

- key: scerevisiae_inactive_ribosome_reserve_metzlraz2017
  value: 8
  unit: "% of proteome (non-translating ribosomal proteins)"
  grade: A
  host: scerevisiae
  source: "Metzl-Raz E, et al. eLife 6:e28034 (2017)"
  doi_or_url: 10.7554/eLife.28034
  locator: "Abstract"
  quote: "We find that cells produce excess ribosomal proteins, amounting to a constant ~8% of the proteome. Accordingly, ~25% of ribosomal proteins expressed in rapidly growing cells does not contribute to translation."
  read: html
  note: >
    IMPORTANT FOR THE BOUND IN BOTH DIRECTIONS. (a) A real cell never runs its ribosomes
    flat out, so the practical ceiling is below the physical one. (b) But the reserve is
    recruitable - "these excess ribosomal proteins are employed when translation demands
    unexpectedly increase" - so a burdened production strain has ~25% headroom over its
    steady-state translation rate. r_active = r - 0.08.

- key: scerevisiae_ribosomes_per_cell_vonderhaar2008
  value: 190000
  unit: ribosomes per cell (rapidly growing haploid)
  grade: D
  host: scerevisiae
  source: "von der Haar T (2008), as quoted by Metzl-Raz E, et al. eLife 6:e28034 (2017)"
  doi_or_url: 10.7554/eLife.28034
  locator: "Introduction"
  quote: "Rapidly growing budding yeast, for example, contain about 190,000 ribosomes (von der Haar, 2008), each of which requires the production of over a hundred different proteins."
  read: html
  note: >
    SECONDARY. von der Haar's own paper (next entries, which I did read) quotes 186,000
    active ribosomes as the figure matching the measured ribosome content. Sanity check:
    190,000 ribosomes x 12,485 aa x 110 Da/aa = 2.6e-13 g = 0.26 pg of ribosomal protein,
    i.e. 7% of the 3.72 pg total protein per cell - well below 30%, because most ribosomal
    mass is rRNA, not protein. Do not mix the two accounting bases.

- key: scerevisiae_protein_per_cell_vonderhaar2008
  value: 3.72
  low: 1.9
  high: 5.6
  unit: pg protein per cell
  grade: A
  host: scerevisiae
  source: "von der Haar T. A quantitative estimation of the global translational activity in logarithmically growing yeast cells. BMC Syst Biol 2:87 (2008)"
  doi_or_url: 10.1186/1752-0509-2-87
  locator: "Results, 'Estimation of cell-wide translational activity'"
  quote: "The total cellular protein content reflected in the curated dataset amounts to 3.72 pg per cell, and 90% confidence limits can be estimated for this value of 1.9 and 5.6 pg"
  read: html
  note: >
    Fast-growing haploid S. cerevisiae, doubling time 90 min. The same paragraph notes two
    independent experimental estimates of 5 pg. low/high are the stated 90% CI.

- key: scerevisiae_proteins_per_cell_vonderhaar2008
  value: 53e6
  low: 30e6
  high: 80e6
  unit: protein molecules per cell
  grade: A
  host: scerevisiae
  source: "von der Haar T. BMC Syst Biol 2:87 (2008)"
  doi_or_url: 10.1186/1752-0509-2-87
  locator: "Results, 'Estimation of cell-wide translational activity'"
  quote: "about 53 million proteins for a fast-growing haploid yeast cell, with 90% confidence limits of 30-80 million"
  read: html
  note: >
    With 3.72 pg/cell this implies a mean protein mass of 3.72e-12/53e6 = 7.0e-20 g =
    42 kDa, which is the conversion factor used in the derivations below.

- key: scerevisiae_global_translation_rate_vonderhaar2008
  value: 13000
  low: 6500
  high: 19500
  unit: proteins synthesised per cell per second
  grade: A
  host: scerevisiae
  source: "von der Haar T. BMC Syst Biol 2:87 (2008)"
  doi_or_url: 10.1186/1752-0509-2-87
  locator: "Results, 'Estimation of cell-wide translational activity'"
  quote: "The cell-wide sum of these rates amounts to about 13,000 (6,500-19,500) proteins synthesised per cell per second on average throughout the cell cycle"
  read: html
  note: >
    THE single best physics-level number in this file. Derived from genome-wide protein
    abundance plus local degradation rates plus dilution by growth; cross-checked in the
    same paper against eIF2/eRF1 nucleotide-exchange kinetics and against ribosome counts.
    Corresponds to 6.0 (3-9) million elongation events per second per cell.

- key: scerevisiae_degradation_share_of_synthesis_vonderhaar2008
  value: 49
  unit: "% of total protein synthesis that merely replaces degraded protein"
  grade: A
  host: scerevisiae
  source: "von der Haar T. BMC Syst Biol 2:87 (2008)"
  doi_or_url: 10.1186/1752-0509-2-87
  locator: "Results, 'Estimation of cell-wide translational activity'"
  quote: "just under half of this activity (6,400 proteins per second) is required to balance protein degradation, whereas the remainder is required to balance protein dilution through cell growth"
  read: html
  note: >
    6,400/13,000 = 49%. CONSEQUENCE FOR THE MODEL: the naive identity q_total = mu x P
    UNDERSTATES translational capacity by about 2x, because half the ribosome flux is
    turnover, not net accumulation. A non-growing production cell that let its own proteome
    decay could in principle redirect that half to product - briefly.

- key: derived_scerevisiae_translational_throughput_mg_g_h
  value: 330
  low: 165
  high: 500
  unit: mg protein/g DCW/h
  grade: D
  host: scerevisiae
  source: "Derived (mine) from vonderHaar2008 + Carnicer2009"
  doi_or_url: null
  locator: null
  quote: null
  read: html   # derived; inputs read as html (schema needs a value)
  note: >
    THE ABSOLUTE TRANSLATIONAL CEILING. Arithmetic:
    (1) mean protein mass = 3.72 pg / 53e6 molecules = 7.02e-20 g (42 kDa).
    (2) synthesis per cell = 13,000 /s x 7.02e-20 g = 9.13e-16 g/s = 3.29e-12 g/h = 3.29 pg/h.
    (3) per g of CELL PROTEIN: 3.29 / 3.72 = 0.884 g protein/g protein/h.
    (4) per g DCW, at protein = 0.37 g/g DCW (Carnicer, K. phaffii): 0.884 x 370 = 327 mg/g DCW/h.
    Independent cross-check from the growth law: gamma x r x P = 3.0/h x 0.30 x 0.37 =
    0.333 g/g DCW/h = 333 mg/g/h. The two routes agree to 2%, which is reassuring.
    low/high scale the 6,500-19,500 CI on the synthesis rate (the mean protein mass is
    fixed by the same dataset so its error partly cancels).
    WHAT IT IS: the rate at which a fast-growing yeast cell makes protein of ALL kinds.
    No single protein can be made faster than this, ever, in this organism.
    WHAT IT IS NOT: an achievable q_p. It assumes 30% of the proteome is ribosome, every
    ribosome is translating, and 100% of the output is the product (so the cell replaces
    neither its ribosomes nor its degraded proteome). Pablo: this is the derivation to
    check hardest - it is the one load-bearing number I computed rather than read.

- key: derived_kphaffii_translational_throughput_at_mu
  value: 74
  low: 37
  high: 163
  unit: mg protein/g DCW/h
  grade: D
  host: kphaffii
  source: "Derived (mine) from Metzl-Raz2017 growth law + Carnicer2009 + Maurer2006"
  doi_or_url: null
  locator: null
  quote: null
  read: html   # derived; inputs read as html (schema needs a value)
  note: >
    Same ceiling, specialised to a K. phaffii production phase. The growth law fixes the
    ribosome content a cell actually carries at growth rate mu: r = r0 + mu/gamma with
    r0 = 0.08 and gamma = 3.0/h.
      mu = 0.2/h (mu_max): r = 0.147; with ACTIVE ribosomes only (r - r0 = mu/gamma) the
        throughput is gamma x (mu/gamma) x P = mu x P = 0.2 x 370 = 74 mg/g DCW/h; counting
        the idle reserve r0 as translating gives 3.0 x 0.147 x 0.37 = 163 (the HIGH).
      mu = 0.1/h: 37 (active only) to 125 (reserve recruited).
    CORRECTED 2026-10-05 (audit R16-L6): the first version also gave 89 mg/g/h at the model's
    production-phase mu = 0.0014/h, from r0 alone. r0 is the NON-translating reserve, so the
    growth law gives no active capacity at near-zero growth and does not bound q_p there; that
    line and a 'half of turnover is divertible, ~44 mg/g/h' estimate were removed. The bracket
    is stated at mu = 0.2/h only.

- key: derived_kphaffii_net_protein_synthesis_at_mumax
  value: 74
  low: 70
  high: 104
  unit: mg protein/g DCW/h
  grade: D
  host: kphaffii
  source: "Derived (mine) from Maurer2006 mu_max and Carnicer2009 protein fraction"
  doi_or_url: null
  locator: null
  quote: null
  read: html   # derived; inputs read as html (schema needs a value)
  note: >
    The simple identity q_total = mu_max x P = 0.2/h x 370 mg/g DCW = 74 mg/g DCW/h.
    low = 0.2 x 349 = 70. high = 0.26 x 400 = 104 (a 30% faster mu_max and the top of
    Carnicer's protein range). This is NET new protein only (see the degradation entry:
    it understates throughput ~2x). It is the number to quote when someone asks "how much
    protein can a K. phaffii cell make per hour at all?" - about 74 mg/g/h of new protein,
    i.e. 35x the best demonstrated secretion of one product (2.1 mg/g/h, Prielhofer 2018).

# ===========================================================================
# 2. HOW LARGE A SHARE ONE PROTEIN CAN TAKE
#    (the allocation factor that multiplies the capacity above)
# ===========================================================================

- key: scerevisiae_single_heterologous_protein_proteome_share_metzlraz2017
  value: 25
  unit: "% of total proteome (one heterologous protein, intracellular)"
  grade: A
  host: scerevisiae
  source: "Metzl-Raz E, et al. eLife 6:e28034 (2017)"
  doi_or_url: 10.7554/eLife.28034
  locator: "Results, 'Forcing unneeded protein production reduces the pool of free ribosomes' (Figure 5)"
  quote: "a library of strains expressing increasing amounts of mCherry proteins was generated, with mCherry levels reaching ~25% of the total proteome in the highest burden cells"
  read: html
  note: >
    THE cleanest measurement of the burden limit in a yeast: one useless heterologous
    protein can occupy a quarter of the proteome. Growth rate and ribosome content both
    fall as the burden rises (Figure 5A), but the slope of the ribosome-growth scaling is
    unchanged, i.e. the ribosomes keep working at the same speed - the cell simply spends
    them on mCherry. For a SECRETED product the share of the SYNTHESIS FLUX, not of the
    standing proteome, is what matters; this is the intracellular analogue.

- key: treesei_cbhi_share_of_total_protein_nummi1983
  value: 60
  unit: "% of total protein"
  grade: D
  host: treesei
  source: "Nummi M, et al. Biochem J 215:677-683 (1983), as quoted by Pakula TM, et al. Biotechnol Biofuels 9:132 (2016)"
  doi_or_url: 10.1186/s13068-016-0547-5
  locator: "Results, 'Description of strains' paragraph"
  quote: "CBHI alone may constitute 60 % of the total protein"
  read: html
  note: >
    SECONDARY (Nummi 1983 not read). The single largest documented share of one protein in
    any industrial microbe's output. It is a HOMOLOGOUS, natively secreted enzyme under its
    own promoter - the easiest possible case - which is exactly why it is the right number
    for an upper bound on the allocation factor.

- key: treesei_cellulase_share_of_secretome_pakula2016
  value: 90
  low: 64
  high: 90
  unit: "% of extracellular protein"
  grade: A
  host: treesei
  source: "Pakula TM, Nygren H, Barth D, Heinonen M, Castillo S, Penttila M, Arvas M. Genome wide analysis of protein production load in Trichoderma reesei. Biotechnol Biofuels 9:132 (2016)"
  doi_or_url: 10.1186/s13068-016-0547-5
