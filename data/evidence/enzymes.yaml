# Industrial enzymes: the one mature market for secreted, fermentation-made protein (added 2026-11-03).
# Context for docs/VALIDATION.md check 7, not model inputs. Each entry was read in the source itself on 2026-11-03
# (PDFs supplied by Pablo or fetched from the open web); research notes in references/leads/.

- key: amylase_value_per_kg_protein_lynd2017
  value: 25
  unit: USD/kg enzyme protein (bulk amylase for corn ethanol)
  grade: C
  source: "Lynd LR, Liang X, Biddy MJ, et al. Cellulosic ethanol: status and innovation. Curr Opin Biotechnol 45:202-211 (2017)"
  doi_or_url: 10.1016/j.copbio.2017.03.008
  locator: "p.204, left column (published version); OSTI author manuscript p.7"
  quote: "amylase enzymes produced via mature technology and purchased in large amounts by the corn ethanol industry are valued at about $25/kg protein [11]"
  read: fulltext
  note: >-
    Second-hand: the value cites Stephen, Mabee and Saddler (2012, Biofuels Bioprod Bioref 6:159), not read. A value
    (price) per kg of protein, not a cost; year not stated (about 2012-2017). The only direct market figure per kg of
    secreted protein found.

- key: enzyme_trade_unit_value_hs350790_2023
  value: 13.39
  low: 5.02
  high: 29.17
  unit: USD/kg of product (export unit value = value / quantity, 2023)
  grade: A
  source: "World Bank WITS, UN Comtrade data, HS 350790 'Enzymes; prepared enzymes (not elsewhere specified)', exports to World, 2023"
  doi_or_url: https://wits.worldbank.org/trade/comtrade/en/country/ALL/year/2023/tradeflow/Exports/partner/WLD/product/350790
  locator: "table rows Denmark, Netherlands, Finland, China, United States (read 2026-11-03)"
  quote: "Denmark Export 350790 ... 2023 World 1,342,445.20 [1000 USD] 100,268,000 Kg; Netherlands 749,210.18 / 70,521,000 Kg; China 527,964.65 / 105,179,000 Kg; Finland 309,534.57 / 50,571,200 Kg; United States 1,561,447.37 / 53,533,400 Kg"
  read: html
  note: >-
    Derived unit values (USD/kg product): Denmark 13.39 (value; mostly Novonesis), Netherlands 10.62, Finland 6.12,
    China 5.02 (low), United States 29.17 (high). Per kg of formulated product of every form (liquid, granulate,
    powder): converting to per kg protein needs the form, which trade data do not record (see the EFSA entries:
    ~9% protein in liquid concentrates, ~65% in dried ones, a ~7x span).

