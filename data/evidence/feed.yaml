# data/evidence/feed.yaml: feed bill of the animal products that precision fermentation replaces, per kg of
# EDIBLE PROTEIN: broiler chicken meat, hen's eggs, cow's milk (US). Gathered 2026-10-03; moved here 2026-10-05.
# Read by src/pftea/benchmarks.py feed_bills (keys named in data/pf/benchmarks.yaml); the PF side is src/pftea/floor.py.
# Purpose: compare the PF metabolic floor (~1.77 kg glucose per kg protein, ~$0.55-0.71/kg protein at $0.31-0.40/kg
# glucose; see data/evidence/prices.yaml glucose_* keys) with the feed bill of the incumbent animal.
# Format: data/evidence/README.md, plus the extra fields of prices.yaml/milk_egg.yaml: `year` (year of `value`),
# `values` (series or component map). `read: html` = HTML page, text file, CSV or JSON record read via curl
# (raw text, never a model summary) except where `note` says the WebFetch markdown converter was used.
# Local copies (uncommitted, as for every source; references/INDEX.md, section 'Feed bill'): PDFs in
# references/reports/, text, CSV, JSON, HTML and XML records in references/text/feed/ (file named in each `note`).
# Reused from data/evidence/milk_egg.yaml (not duplicated here): milk_whole_protein_fdc_foundation (3.27 g/100 g),
# egg_whole_protein_fdc_sr_legacy (12.56 g/100 g), egg_whole_protein_fdc_foundation (12.4 g/100 g),
# us_all_milk_price_nass (2020-2025 USD/cwt), us_wholesale_eggs_ny_ers, us_market_egg_price_nass_jul2026.
# Conversions (mine): 1 lb = 0.45359237 kg; 1 cwt = 100 lb = 45.359 kg; 1 short ton (st) = 2000 lb = 907.185 kg;
# corn 56 lb/bu, soybeans 60 lb/bu. "Protein" = crude protein (N x 6.25 meat/egg, N x 6.38 milk), as in milk_egg.yaml.
# Sections 1-9 are US; the EU column, the US delivered-feed premium and the feed shares follow at the end of the file.


# ---------------- 1. Broiler chicken: feed conversion ----------------

- key: "broiler_fcr_us_industry_ncc"
  value: 1.70
  low: 1.69
  high: 1.79
  unit: "lb feed per lb live weight (= kg/kg), US industry average, grow-out only"
  year: 2025
  values: {2015: 1.89, 2016: 1.86, 2017: 1.83, 2018: 1.82, 2019: 1.80, 2020: 1.79, 2021: 1.79, 2022: 1.77, 2023: 1.75, 2024: 1.69, 2025: 1.70}
  grade: "C"
  source: "National Chicken Council. U.S. Broiler Performance (statistics page), table 1925-2025"
  doi_or_url: "https://www.nationalchickencouncil.org/about-the-industry/statistics/u-s-broiler-performance/"
  locator: "table columns 'Market Age', 'Market Weight (lbs liveweight)', 'Feed to Meat Gain', 'Mortality (%)', rows 2015-2025"
  quote: "2025 | 47.5 | 6.63 | 1.70 | 5.95 ... All data are from USDA or other reliable source. No estimated or forward-looking figures are provided by NCC."
  read: "html"
  note: >-
    Grade C: industry-association compilation; underlying source not named (Agri Stats is the usual industry
    benchmark but NCC does not say so). Read via the WebFetch markdown converter because curl was blocked by
    Cloudflare (references/text/feed/ncc_broiler_performance_webfetch.md). Page footer says 'Last Updated: February 2022' although
    it carries 2024-2025 rows. 'Feed to meat gain' = lb feed per lb live weight at market (6.63 lb = 3.01 kg in 2025,
    47.5 d, mortality 5.95%). Whether feed eaten by birds that died is included is not stated (likely yes in an
    industry flock-level figure). Excludes parent-stock feed (see broiler_parent_feed_ross308). The 2020-2025 range
    1.69-1.79 is the low/high.

- key: "broiler_fcr_ross308_objective"
  value: 1.531
  low: 1.493
  high: 1.569
  unit: "kg feed per kg live weight, as-hatched, at 2.998 kg (day 42); low/high at 2.80 kg (day 40) and 3.20 kg (day 44)"
  grade: "B"
  source: "Aviagen. Ross 308/308 FF Broiler: Performance Objectives 2022 (RossxRoss308-BroilerPerformanceObjectives2022-EN.pdf)"
  doi_or_url: "https://aviagen.com/assets/Tech_Center/Ross_Broiler/RossxRoss308-BroilerPerformanceObjectives2022-EN.pdf"
  locator: "p.3 'As-Hatched Performance' (metric, g), rows day 40, 42, 44; footnote 3"
  quote: "42  2998  100  70  207  4586  1.531 ... FCR includes initial body weight at placement and does not account for mortality."
  read: "fulltext"
  note: >-
    Breeder's target under good management, not a field average: US actual (NCC 1.70 at 3.01 kg) is ~11% worse,
    mainly mortality (5.95%), field conditions and the feed eaten by birds that die (excluded here). Cumulative intake
    4.586 kg/bird at 42 d. File references/reports/ross308_broiler_PO_2022.pdf.

- key: "broiler_parent_feed_ross308"
  value: 0.367
  unit: "kg feed per day-old broiler chick produced (parent-stock females, day old to 64 weeks)"
  values: {feed_per_100_chicks_kg: 36.7, feed_per_100_hatching_eggs_kg: 31.3, chicks_per_female_housed: 152.2, hatchability_pct: 85.3, hatching_eggs_per_hen_housed: 178.5}
  grade: "B"
  source: "Aviagen. Ross 308 Parent Stock: Performance Objectives 2021 (Ross308-ParentStock-PerformanceObjectives-2021-EN.pdf)"
  doi_or_url: "https://en.aviagen.com/assets/Tech_Center/Ross_PS/Ross308-ParentStock-PerformanceObjectives-2021-EN.pdf"
  locator: "p.1 'Performance Summary' and footnote ***"
  quote: "Chicks/female housed at 175 days (25 weeks) 152.2 ... Feed/100 Chicks*** day old - 448 days (0–64 weeks) 36.7 kg ... *** Feed amounts expressed in the table do not include male feed allocations."
  read: "fulltext"
  note: >-
    Includes rearing and laying feed of the hen. EXCLUDES breeder-male feed (not given here; males are a minority
    of the flock but eat more per head, so true parent feed is somewhat higher - not quantified, flag) and
    grandparent/great-grandparent generations (negligible per broiler). Per kg broiler live weight (mine):
    0.367 / 3.007 kg (NCC 2025 market weight) = 0.122; divided by (1 - 0.0595 broiler mortality) = 0.130 kg/kg.
    Spent breeder hens are sold for meat (credit ignored). File references/reports/ross308_PS_PO_2021.pdf.


