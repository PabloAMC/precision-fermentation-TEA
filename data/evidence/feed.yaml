# ---------------- 3. Layers: feed conversion, pullets, edible yield ----------------

- key: "layer_fcr_hyline_w36"
  value: 2.005
  low: 1.93
  high: 2.08
  unit: "kg feed per kg eggs (shell on), 20-100 weeks of age, laying hen only"
  values: {fcr_20_60wk: [1.81, 1.94], fcr_20_100wk: [1.93, 2.08], feed_per_dozen_20_100wk_kg: [1.36, 1.49], hen_housed_eggs_to_100wk: [456, 472], egg_mass_per_hen_housed_18_100wk_kg: [27.4, 29.4], livability_to_100wk_pct: 92.0}
  grade: "B"
  source: "Hy-Line International. W-36 Commercial Layers Performance Standards Guide (International Standards), January 2020 (file W36_CS_Cage_v2026.01.20_EN)"
  doi_or_url: "https://www.hyline.com/filesimages/Hy-Line-Products/Hy-Line-Product-PDFs/W-36/36%20STD%20ENG.pdf"
  locator: "p.3 'Summary of Performance Standards'"
  quote: "Feed Conversion Rate, kg Feed/kg Eggs (20–100 weeks) 1.93–2.08 ... Feed Consumption per Dozen Eggs (20–100 weeks) 1.36–1.49 kg"
  read: "fulltext"
  note: >-
    W-36 is the dominant US white-egg strain. Central = midpoint (mine). Breeder target for conventional cages, not a
    field average. Implied egg mass per dozen (mine): 1.36/1.93 = 0.705 kg, 1.49/2.08 = 0.716 kg; mean 0.711 kg/dozen,
    used to convert per-dozen figures. Excludes pullet rearing (next entry) and breeder flocks (layer parent stock:
    not gathered; each breeder hen yields on the order of 100 pullets, so likely ~1% - not quantified, flag).
    File references/reports/hyline_W36_STD.pdf.

- key: "layer_pullet_feed_hyline_w36"
  value: 5.65
  low: 5.36
  high: 5.94
  unit: "kg feed per pullet, hatch to 17 weeks"
  grade: "B"
  source: "Hy-Line International. W-36 Commercial Layers Performance Standards Guide, January 2020"
  doi_or_url: "https://www.hyline.com/filesimages/Hy-Line-Products/Hy-Line-Product-PDFs/W-36/36%20STD%20ENG.pdf"
