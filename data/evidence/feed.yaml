  note: >-
    Each year's total costs listed (USD/cwt) / 45.359 kg / 0.0327 kg protein per kg milk x that year's milk share: 2025
    23.36/45.359/0.0327 x 0.903 = 14.23; 2022 27.33 -> 17.55. Year-paired, so the range is what was observed (audit R16-M2:
