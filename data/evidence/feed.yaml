# ---------------- 4. Dairy: feed per kg milk ----------------

- key: "dairy_feed_efficiency_lactating_hutjens"
  value: 1.5
  low: 1.4
  high: 1.6
  unit: "lb milk per lb dry matter intake (= kg/kg), lactating cows only, one-group herd at 150-225 days in milk"
  grade: "B"
  source: "Hutjens MF. Feed Efficiency and Its Impact on Feed Intake. Feed Management fact sheet, University of Illinois / USDA NRCS CIG (dated 6-20-2006)"
  doi_or_url: "https://s3.wp.wsu.edu/uploads/sites/346/2014/11/DairyFeedEfficiencyfinal.pdf"
  locator: "Table 2 'Benchmarks for feed efficiency comparisons', row 'One group, all cows'"
  quote: "Feed efficiency values in the field can vary from 1.1 to 2.0 (Table 2). ... One group, all cows 150 to 225 1.4 to 1.6"
  read: "fulltext"
  note: >-
    Extension benchmark (2006; US yields have risen since, which pushes FE up). Excludes dry cows and replacement
    heifers. Inverse (mine): 0.625-0.714 kg DM per kg milk; per kg milk protein (3.27%): 19.1-21.8 kg DM.
    Whole-herd DM per kg milk (incl. dry cows ~12% of adult cow-years and ~0.9 heifers per cow, Capper & Cady 2020 Table 4)
    is materially higher; no US DM figure found - flag. File references/reports/hutjens_feed_efficiency_wsu.pdf.

- key: "dairy_feed_whole_herd_capper_cady2020"
  value: 1.57
  unit: "kg feedstuffs (FRESH weight, not dry matter) per kg energy-corrected milk (ECM), whole US dairy population 2017"
  values: {2007: 1.90, 2017: 1.57, heifer_to_cow_ratio_2017: 0.92, dry_cows_per_1MMT_ECM_2017_thousand: 10.5, lactating_cows_per_1MMT_ECM_2017_thousand: 76.0}
  grade: "B"
  source: "Capper JL, Cady RA. The effects of improved performance in the U.S. dairy cattle industry on environmental impacts between 2007 and 2017. J Anim Sci 98(1):skz291 (2020)"
  doi_or_url: "10.1093/jas/skz291 (PMC6978902)"
  locator: "Table 5 'Resource use ... per 1.0 MMT of saleable energy-corrected milk', row 'Total feedstuffs', footnote 1; Table 4 population"
  quote: "Total feedstuffs 1 , kg | 1.90 × 10 9 | 1.57 × 10 9 | 82.7 | ... 1 Freshweight."
  read: "fulltext"
  note: >-
    Deterministic model (ration software, NASS crop data), so grade B. Includes lactating and dry cows, replacement
    heifers and bulls. FRESH weight includes the water in silages, so it is not comparable with poultry feed
    (~88-90% DM) and cannot be costed per kg; used only as the whole-herd physical check. Per kg protein needs
    ECM-to-milk conversion (US milk at 4.2-4.3% fat is ~10% above ECM per kg; mine, approximate) - not converted.
    File references/text/feed/capper_cady_2020.txt.

- key: "dairy_dmc_feed_cost_formula"
  value: 1.022
  unit: "lb of feed (as fed: corn grain + soybean meal + alfalfa hay) per lb milk implied by the statutory DMC formula"
  values: {corn_bu_per_cwt: 1.0728, sbm_ton_per_cwt: 0.00735, alfalfa_hay_ton_per_cwt: 0.0137, corn_lb_per_cwt: 60.08, sbm_lb_per_cwt: 14.7, hay_lb_per_cwt: 27.4}
  grade: "A"
  source: "7 CFR 1430.411 (Dairy Margin Coverage Program), 'Calculation of average feed cost and actual dairy production margins' (84 FR 28176, June 18, 2019, as amended 86 FR 70708, Dec. 13, 2021)"
  doi_or_url: "https://www.ecfr.gov/current/title-7/subtitle-B/chapter-XIV/subchapter-B/part-1430/subpart-D/section-1430.411"
  locator: "§ 1430.411(b)-(c)"
  quote: "(1) The product determined by multiplying 1.0728 by the price of corn per bushel; (2) ... 0.00735 by the price of soybean meal per ton; and (3) ... 0.0137 by the price of alfalfa hay per ton."
  read: "html"
  note: >-
    Official (statutory) proxy of the feed cost of a cwt of milk, not a measured ration. Physical reading (mine):
    1.0728 bu x 56 lb = 60.1 lb corn + 0.00735 x 2000 = 14.7 lb SBM + 0.0137 x 2000 = 27.4 lb hay = 102.2 lb per
    100 lb milk = 1.02 kg/kg as fed (~0.9 kg DM/kg); per kg milk protein = 31.2 kg as fed. It omits silage and by-products
    and is usually read as a lactating-cow ration; whether it covers dry cows/heifers is not stated. Hay = premium
    and supreme alfalfa (§ 1430.411(c)(3)). File references/text/feed/ecfr_7cfr1430.xml.


# ---------------- 5. Feed prices, 2020-2025 ----------------

- key: "nass_modeled_feed_price_basis"
  value: null
  unit: "composition of the NASS commercial-feed price proxies (by weight) and July 2026 check values"
  values: {broiler_feed: "58% corn, 42% soybeans", layer_feed: "75% corn, 25% soybeans", dairy_16pct_feed: "51% corn, 8% soybeans, 41% alfalfa", jul2026_broiler_feed_ratio: 5.3, jul2026_egg_feed_ratio: 7.4, jul2026_milk_feed_ratio: 2.12, jul2026_broiler_live_usd_lb: 0.662, jul2026_corn_usd_bu: 4.26, jul2026_soybeans_usd_bu: 11.60}
  grade: "A"
  source: "USDA NASS. Agricultural Prices, released August 31, 2026 (agpr0826.txt)"
  doi_or_url: "https://esmis.nal.usda.gov/sites/default/release-files/796040/agpr0826.txt"
  locator: "table 'Feed Price Ratios - United States: July 2026 with Comparisons', footnotes 1/-4/; table 'Prices Received Used to Calculate Feed Price Ratios'"
  quote: "The price of commercial prepared broiler feed is based on current United States prices received for corn and soybeans. The modeled feed uses 58 percent corn and 42 percent soybeans."
  read: "html"
  note: >-
    Check (mine): 0.58 x 4.26/56 + 0.42 x 11.60/60 = 0.1253 USD/lb vs implied 0.662/5.3 = 0.1249 USD/lb; layer
    0.75 x 0.0761 + 0.25 x 0.1933 = 0.1054 vs 0.783/7.4 = 0.1058; dairy 0.51 x 0.0761 + 0.08 x 0.1933 + 0.41 x 203/2000
    = 0.0959 vs 20.30/100/2.12 = 0.0958. So the NASS feed prices are plain ingredient-weighted sums: no milling,
    premix, fat, minerals, transport or mark-up, i.e. a LOW estimate of delivered complete-feed cost (EIC's layer
    formula adds ~10-15% over its corn+SBM content; analogy). July 2026 implied: broiler feed 250 USD/st
    (0.275 USD/kg), layer 211 USD/st, dairy 16% 192 USD/st.

