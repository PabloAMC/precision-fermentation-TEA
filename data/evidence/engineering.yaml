# data/evidence/engineering.yaml — Phase B evidence: FERMENTER TRANSPORT PHYSICS AND SCALE LIMITS
# (oxygen transfer, vessel size, heat of fermentation, heat removal, kLa correlations,
#  aeration power and cost, O2 solubility, K. phaffii at scale).
# Research output 2026-09-26. Format and grades: see README.md in this folder.
#
# CONVENTIONS (read before using any value):
# - read: fulltext = PDF or SI workbook on disk (references/papers|reports, text dumps in
#   references/text/); html = open-access full text read online (Europe PMC full-text XML,
#   OUP HTML, Gale Academic OneFile HTML, publisher HTML); abstract = only the abstract was
#   readable (Europe PMC REST or Semantic Scholar API). No PDF was downloaded for this file.
# - quote: the source's own words. Normalisations: line breaks, end-of-line hyphenation and
#   the spaces that pdftotext inserts around sub/superscripts were removed ("O2 /m3 -h" is
#   written "O2/m3-h"); superscripts lost in the PDF dump are written with ^ (4×10^9).
#   For tables and spreadsheets the needed cells are joined with " | " in reading order
#   (other cells may be omitted; nothing inside a cell is changed).
# - ONLINE QUOTES (read: html/abstract) were extracted with a web-fetch tool that passes the
#   page through a small language model. Each one was re-requested as "the exact sentence,
#   first word to final period", and two renderings were compared where they differed, but a
#   model-mediated quote can still contain a slip. Re-check every html/abstract quote against
#   the source before it enters data/assumptions.yaml. Quotes read from files on disk
#   (read: fulltext) were checked directly against the text dump or workbook cell.
# - value: the number stated by the source, in the source's unit. Range only -> value is
#   the midpoint and the note says so. Bound only ("up to", "above") -> value is the bound
#   and the note says which kind. Any other number in a note is a conversion or derivation
#   made here and is marked "derived"; check those.
# - 1 mol O2/m3-h = 1 mmol O2/L-h. Humbird 2021 is cited from the engrXiv Dec-2020 revision
#   on disk (10.31224/osf.io/795su); printed page = PDF page - 5. NREL 2011: printed page =
#   PDF page - 10. Intelligen 2025: printed page = PDF page - 1.
# - Grade D is used when the source is sound but the parameter is organism- or product-
#   specific and the source studies a different organism.
# - Several requested sources could not be read (Humbird et al. 2017 full text, Garcia-Ochoa
#   & Gomez 2009, van 't Riet 1979, Cooney 1969 body, Doran, Benz 2011). They are recorded
#   with quote: null in section 8. Do not fill them in from memory.

# ---------------------------------------------------------------------------------------
# 1. Oxygen-transfer ceilings at production scale (OTR, kLa, head pressure, O2 enrichment)
# ---------------------------------------------------------------------------------------

- key: otr_practical_ceiling_fermentation
  value: 200
  unit: mol O2/m3-h (= mmol/L-h)
  grade: B
  source: "Humbird D. Scale-up economics for cultured meat. Biotechnol Bioeng 118:3239-3250 (2021)"
  doi_or_url: 10.1002/bit.27848
  locator: "Sec. 1, 'analysis approach: powers of ten', printed p.10 (PDF p.15), engrXiv revision"
  quote: "In fermentation, 200 mol O2/m3-h is about as high as it gets; in animal cell culture, a practical limit is <50 mol O2/m3-h."
  read: fulltext
  note: >-
    Expert judgement in a peer-reviewed TEA; no primary data cited for the 200 figure. Same
    paper, printed p.28 (PDF p.33): "Although an OTR approaching 200 mol O2/m3-h is common in
    an air-sparged STR fermentor, the sparging and agitation limits of a cell culture
    bioreactor effectively limit OTR to <~25 mol O2/m3-h when air is used." Treat 200 as an
    upper bound for air-sparged, unpressurised production vessels, not a design point.

- key: otr_max_design_bakers_yeast_bubble_column
  value: 150
  unit: mol O2/m3-h
  grade: B
  source: "Humbird D. Scale-up economics for cultured meat. Biotechnol Bioeng 118:3239-3250 (2021), SI workbook"
  doi_or_url: 10.1002/bit.27848
  locator: "SI workbook Humbird2021_cultured_meat_SI.xlsm, sheet A.1, cells A93:D93; paper Table 1.3, printed p.6"
  quote: "Max aeration (OTR) | 150 | mol/m3-h"
  read: fulltext
  note: >-
    Design cap in the baker's-yeast simulator (sheet A.1): 6 x 200 m3 production vessels
    (cell C142 '198733' L, diameter 3.7 m, height 18.5 m, i.e. a bubble column with H/D = 5,
    derived), 30 deg C, back pressure 1.33 bar (cell C81), air (21% O2). Table 1.3 of the
    paper lists "Max. OTR (mol O2/m3-h) 150 25" for the standard and constrained cases. The
    paper (printed p.5) states the practice it reproduces: "Commercial yeast is typically
    produced in large (~200 m3) bubble-column bioreactors at cell density approaching
    4×10^9/mL (70 g/L dry matter) and extremely high OUR of ~150 mol O2/m3-h."

- key: bubble_column_aeration_cost_advantage_vs_str
  value: 15
  low: 10
  high: 20
  unit: "% lower O2-delivery cost than stirred tank, valid at OTR up to 150 mmol/L-h"
  grade: B
  source: "Humbird D, Davis R, McMillan JD. Aeration costs in stirred-tank and bubble column bioreactors. Biochem Eng J 127:161-166 (2017)"
  doi_or_url: 10.1016/j.bej.2017.08.006
  locator: abstract
  quote: "This analysis suggests bubble-column reactor systems can reduce overall costs for oxygen delivery by 10–20% relative to stirred tanks at low to moderate oxygen transfer rates up to 150 mmol/L-h."
  read: abstract
  note: >-
    value = midpoint of the stated 10-20% range. Abstract read via the Semantic Scholar API
    (field 'abstract'). The full text (OSTI accepted manuscript, osti.gov/biblio/1392775)
    could not be read: osti.gov refused connections from the fetch tool and navigation was
    denied in the browser pane; ScienceDirect returned HTTP 403. The paper's design equations
    and its maximum-OTR assumption are therefore unverified (see section 8). Upper end of the
    studied range, 150 mmol/L-h, coincides with Humbird's baker's-yeast design cap above.

- key: vessel_size_standard_worldclass_hypothetical
  value: 500
  low: 200
  high: 1000
  unit: m3 (200 'standard', 500 'world-class', 1000 'hypothetically large')
  grade: B
  source: "Humbird D, Davis R, McMillan JD. Biochem Eng J 127:161-166 (2017)"
  doi_or_url: 10.1016/j.bej.2017.08.006
  locator: abstract
  quote: "capital and operating costs for oxygen delivery drop considerably moving from standard-size (200 m 3 ) to world-class size (500 m 3 ) reactors, but only marginally in further scaling up to hypothetically large (1000 m 3 ) reactors."
  read: abstract
  note: >-
    Here value is the 'world-class' size, not a midpoint. The economy of scale in O2
    delivery flattens above ~500 m3 in this analysis. Aspen Plus + Aspen Capital Cost
    Estimator, validated against vendor quotes (per the abstract). "m 3" spacing is as in
    the Semantic Scholar abstract text.

- key: otr_required_modern_biomanufacturing
  value: 120
  unit: mmol O2/L-h (lower bound, "typically larger than")
  grade: A
  source: "Takors R. Food for thoughts for prospective biomanufacturing. Microb Biotechnol 18:e70088 (2025)"
  doi_or_url: 10.1111/1751-7915.70088
  locator: "Sec. 4 'Begin with the end in mind' (Europe PMC PMC11727576)"
  quote: "Sufficiently high oxygen transfer rates (OTRs) typically larger than 120 mmol O₂ L⁻¹ h⁻¹ need to be ensured even for high filling volumes."
  read: html
  note: >-
    Value is a lower bound stated as a design requirement for competitive large-scale
    processes, not a measured ceiling. Next sentences, verbatim: "Furthermore, oxidation of
    NADH in the respiratory chain provides 220 kJ mol⁻¹ free Gibbs energy (At standard
    conditions) that is released as heat in large quantities. Hence, proper cooling
    capacities need to be installed that get more and more challenging with rising
    bioreactor volumes." Also: "bubble column type bioreactors (BCRs) can achieve similar
    mass transfer qualities than stirred tanks (i.e., kLa coefficients) but require less
    power input."

- key: kla_upper_limit_fermentation
  value: 800
  unit: 1/h
  grade: B
  source: "Humbird D. Biotechnol Bioeng 118:3239-3250 (2021)"
  doi_or_url: 10.1002/bit.27848
  locator: "Sec. 1 'industrial scale-up perspectives', printed p.5 (PDF p.10)"
  quote: "upper limits of the O2 mass transfer coefficient kLa are ~800 h-1 in fermentation and ~15 h-1 in cell culture [53]."
  read: fulltext
  note: >-
    [53] = Nienow AW, 'Scale-up, stirred tank reactors', Encyclopedia of Industrial
    Biotechnology, Wiley 2010, doi 10.1002/9780470054581.eib001 (secondary; primary not read). Compare measured industrial values in this
    file: 142-226 1/h in a 600 m3 bubble column (Mast 2025) and 180 1/h in a ~24 m3 stirred
    tank (Losoi 2022 note below).

- key: kla_measured_600m3_bubble_column
  value: 226
  low: 142
  high: 226
  unit: 1/h (0.3 to 1 vvm, 470 m3 filling volume)
  grade: A
  source: "Mast Y, Ghaderi A, Takors R. Real case study of 600 m3 bubble column fermentations: spatially resolved simulations unveil optimization potentials for L-phenylalanine production with Escherichia coli. Biotechnol Bioeng (2025)"
  doi_or_url: 10.1002/bit.28869
  locator: "Europe PMC PMC11718436, methods/results on the industrial reactor"
  quote: "Experiments with 470 m³ filling volume found the lowest kLa of 142 h⁻¹ for vvm of 0.3 and the maximum of 226 h⁻¹ for 1 vvm."
  read: html
  note: >-
    value = maximum measured (at 1 vvm). Real industrial vessel (E. coli, L-Phe); kLa measured
    in the vessel, broth coalescence may differ from yeast/fungal broths. Geometry, verbatim:
    "7.92 m of diameter and 13.06 m of maximum filling height resulting in 598 m³ of maximum
    filling volume." Operating data: "In accordance with the original process, a headspace
    overpressure of 0.55 bar was taken into account." and "Fermentation temperature was
    controlled at 32°C." Cooling: "The centered, internal heat exchange coil with 6.55 m
    diameter and 9 m height acts as an internal expansion joint that enables a large
    recirculation flow." Table 2 air flows 344-352 m3/min at 396-475 m3 liquid, i.e.
    ~0.73-0.87 vvm (derived).

- key: bubble_column_600m3_back_pressure_and_airflow
  value: 21
  unit: kPa back pressure (airflow 4.75 Nm3/s, 490 m3 water, 33 deg C)
  grade: A
  source: "Bisgaard J, Zahn JA, Tajsoleiman T, Rasmussen T, Huusom JK, Gernaey KV. Data-based dynamic compartment model: modeling of E. coli fed-batch fermentation in a 600 m3 bubble column. J Ind Microbiol Biotechnol 49:kuac021 (2022)"
  doi_or_url: 10.1093/jimb/kuac021
  locator: "Europe PMC PMC9559308, mixing-time experiment description"
  quote: "The reactor was filled with 490 m³ of reverse osmosis-grade water and a total of 10 separate measurements were performed using the following conditions: an airflow of 4.75 Nm³/s, a bioreactor back pressure of 21 kPa, and liquid temperature 33°C."
  read: html
  note: >-
    Industrial 1,3-propanediol bubble column. Verbatim: "The experiment was performed in a
    bubble column bioreactor (DuPont Tate & Lyle Bio Products Company, TN, USA) with a
    diameter (T) of 5.3 m and a total volume (V) of 600 m³" and "During the 32-hr
    fermentation process, which was operated as a fed-batch (Guske & Miller, 2009), the
    gassed liquid level increased from an initial level of 16 m (H_L,0) to a final level of
    26 m (H_L, end) from dextrose substrate addition." 4.75 Nm3/s on 490 m3 = 0.58 vvm
    (derived). A 26 m gassed level means up to ~2.5 bar of hydrostatic head at the sparger
    (derived; less with gas hold-up), which raises O2 solubility at the bottom.

- key: otr_pressurised_str_heat_removal_limited
  value: 0.7
  high: 1.0
  unit: kmol O2/m3-h (= 700 mmol/L-h); high = theoretical transfer capacity at 11 bar without the heat limit
  grade: A
  source: "Knoll A, Maier B, Tscherrig H, Büchs J. The oxygen mass transfer, carbon dioxide inhibition, heat removal, and the energy and cost efficiencies of high pressure fermentation. Adv Biochem Eng Biotechnol 92:77-99 (2005)"
  doi_or_url: 10.1007/b98918
  locator: abstract
  quote: "the oxygen transfer capacities of stirred tank reactors can theoretically be increased to values above 1 kmol m(-3) h(-1), although the problem of heat removal limits that value to levels of 0.7 kmol m(-3) h(-1)."
  read: abstract
  note: >-
    The quoted clause is preceded by "By applying reactor pressures up to 11 bar (10 bar
    overpressure)". Example 5 m3 fermentor with P. putida sorption characteristics
    (abstract). The single
    clearest literature statement that heat removal, not O2 transfer, caps OTR once pressure is
    used. 0.7 kmol/m3-h x 455 kJ/mol O2 = ~88 kW/m3 of metabolic heat (derived). Abstract via
    Europe PMC; unit notation "m(-3) h(-1)" as in Europe PMC. Full chapter not read.

- key: pressure_cost_efficiency_optimum
  value: 5.6
  unit: bar (reactor pressure up to which O2-transfer cost efficiency increases)
  grade: A
  source: "Knoll A, Maier B, Tscherrig H, Büchs J. Adv Biochem Eng Biotechnol 92:77-99 (2005)"
  doi_or_url: 10.1007/b98918
  locator: abstract
  quote: "The cost efficiency of the oxygen mass transfer [...] also increases with reactor pressure up to 5.6 bar."
  read: abstract
  note: >-
    [...] = "defined as the ratio of the oxygen transfer capacity to the overall cost of the
    system (overall purchase cost divided by a project lifetime of ten years, plus total
    energy cost)". Same abstract: "It is shown that increasing reactor pressure enhances the energy
    efficiency, defined as the ratio of the oxygen transfer capacity to the total power
    consumption of the reactor system." Model study for a 5 m3 example vessel; pressure-rated
    vessels cost more, which is inside their cost-efficiency metric.

- key: otr_lab_nonpressurised_high_power
  value: 0.51
  unit: mol O2/L-h at ~48 kW/m3 specific power (lab stirred tank, E. coli)
  grade: A
  source: "Knoll A, Bartsch S, Husemann B, et al. High cell density cultivation of recombinant yeasts and bacteria under non-pressurized and pressurized conditions in stirred tank bioreactors. J Biotechnol 132:167-179 (2007)"
  doi_or_url: 10.1016/j.jbiotec.2007.06.010
  locator: abstract
  quote: "By applying specific power inputs of approx. 48kWm(-3) the oxygen transfer rate of a E. coli culture in the non-pressurized stirred tank bioreactor was lifted up to values of 0.51moll(-1)h(-1)."
  read: abstract
  note: >-
    Bench-scale result at ~10-40x the specific power used in production vessels (derived
    comparison with the 1-5 kW/m3 design range in this file); do not use as a production
    ceiling. Same abstract: "When a reactor pressure up to 10bar was applied, the oxygen
    transfer rate of a pressurized stirred tank bioreactor was lifted up to values of
    0.89moll(-1)h(-1)." and "it is demonstrated that only the pressure is a scaleable tool
    for oxygen transfer enhancement in industrial stirred tank bioreactors." Also: "it was
    shown that increased carbon dioxide partial pressures did not remarkably inhibit the
    growth of the investigated model organisms" (E. coli, A. adeninivorans, S. cerevisiae,
    C. glutamicum).

- key: pichia_air_pressure_our_gain
  value: 59
  unit: "% increase in OUR when air pressure raised from 1.2 to 1.9 bar (P. pastoris, 10 L, ~120 g/L DCW)"
  grade: A
  source: "Liu WC, Gong T, Wang QH, Liang X, Chen JJ, Zhu P. Scaling-up fermentation of Pichia pastoris to demonstration-scale using new methanol-feeding strategy and increased air pressure instead of pure oxygen supplement. Sci Rep 6:18439 (2016)"
  doi_or_url: 10.1038/srep18439
  locator: "Discussion (Europe PMC PMC4726300)"
  quote: "Charoenrat et al. reported that increasing air pressure from 1.2 to 1.9 bar increased the oxygen uptake rate (OUR) of P. pastoris by 59%."
  read: html
  note: >-
    Secondary citation of Charoenrat et al. (Biochem Eng J 2006, 'Increased total air
    pressure versus oxygen limitation...'), whose full text was not read. An earlier
    rendering of the same passage added: "and the heterologous β-glucosidase yield increased
    by 50% in the HCDF of the 10-L scale with ~120 g/L DCW" (verify). Direction and size
    are consistent with Henry's law: +58% absolute pressure (derived).

- key: pichia_air_pressure_replaces_pure_o2
  value: 0.10
  low: 0.05
  high: 0.15
  unit: MPa gauge (jar air pressure; normal practice 0.05 MPa)
  grade: A
  source: "Liu WC, Gong T, Wang QH, et al. Sci Rep 6:18439 (2016)"
  doi_or_url: 10.1038/srep18439
  locator: "Discussion (Europe PMC PMC4726300)"
  quote: "In this paper, we first demonstrated that a pure oxygen supplement could be omitted from HCDF if jar air pressure is increased from the normal 0.05 MPa (super atmospheric pressure) to 0.10±0.05 MPa."
  read: html
  note: >-
    Shown in 10 L to 1,000 L stirred tanks. Introduction, verbatim: "However, in large-scale
    fermentation, supplying and handling pure oxygen can be highly expensive and dangerous."
    and "Comparatively, a more practical and economical strategy is to increase jar air
    pressure, especially for large-scale HCDF (a special tank is sometimes needed to tolerate
    the higher pressure)."

- key: pure_o2_otr_600m3_bubble_column_predicted
  value: 1.1
  unit: mol O2/(kg broth h) (= ~1100 mmol/L-h), pure O2 sparging, model prediction
  grade: B
  source: "Almeida Benalcázar E, van Winden WA, Puiman L, Posada JA, Jansen MLA, Noorman H, Straathof AJJ. Single cell protein production from ethanol: model-based bioreactor operation at industrial scale. Biotechnol Bioeng (2025)"
  doi_or_url: 10.1002/bit.28969
  locator: "abstract (Europe PMC PMC12067044)"
  quote: "producing up to 58 kt/y of SCP in a 600 m³ bubble column operating in continuous mode was assessed and attributed mainly to a high O₂ transfer rate of 1.1 mol/(kg h) through the use of pure O₂."
  read: html
  note: >-
    Model prediction, not a measurement; the abstract adds: "Although the large predicted O₂
    transfer capacity seems technically feasible, it needs further experimental validation."
