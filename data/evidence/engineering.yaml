# ---------------------------------------------------------------------------------------
# 3. Heat of fermentation per mol O2 (oxycaloric equivalent, Thornton's rule)
# ---------------------------------------------------------------------------------------

- key: oxycaloric_equivalent
  value: -455
  low: -480
  high: -430
  unit: kJ/mol O2 consumed (heat released; sign = enthalpy convention)
  grade: A
  source: "Maskow T, Kemp R, Buchholz F, Schubert T, Kiesel B, Harms H. What heat is telling us about microbial conversions in nature and technology: from chip- to megacalorimetry. Microb Biotechnol 3:269-284 (2010)"
  doi_or_url: 10.1111/j.1751-7915.2009.00121.x
  locator: "Section 'The additional benefit of calorespirometric ratios' (Europe PMC PMC3815370)"
  quote: "This ratio (rq/rO2) is called the oxycaloric equivalent (Gnaiger and Kemp, 1990) and usually attains values between −430 and −480 kJ mol‐O2−1 with an averaged value of −455 ± 15 kJ mol‐O2−1 (Gnaiger and Kemp, 1990)."
  read: html
  note: >-
    Review; primary = Gnaiger & Kemp 1990 (not read). Holds for fully respiratory
    metabolism; mixed respiro-fermentative growth deviates. Same review: "A successful test of
    the practicability of the megacalorimetry measurement principle was performed in 2004
    with baker's yeast at the 100 m³ scale (Türker, 2004)."

- key: thornton_rule_heat_per_electron
  value: 113.5
  low: 107
  high: 120
  unit: kJ per mol of electrons transferred to O2 (combustion enthalpy vs degree of reductance)
  grade: A
  source: "Maskow T, et al. Microb Biotechnol 3:269-284 (2010)"
  doi_or_url: 10.1111/j.1751-7915.2009.00121.x
  locator: "Section 'Historical roots and modern trends in biocalorimetry' (Europe PMC PMC3815370)"
  quote: "Thornton (1917) plotted the combustion enthalpy of multiple organic compounds versus the degree of reductance γi (Eqn 7) and found a good linear correlation [the slope depending on the applied data base 107–120 kJ e‐mol−1 (Cordier et al., 1987)]."
  read: html
  note: >-
    value = midpoint. Primary sources (Thornton 1917, Phil Mag 33:196; Cordier et al. 1987)
    not read. 4 electrons per O2 x 113.5 = 454 kJ/mol O2 (derived), consistent with the
    oxycaloric equivalent above.

