- key: manufacturing_scale_fermentor_range
  value: 1010
  low: 20
  high: 2000
  unit: m3 (quoted as 20 000-2000 000 L)
  grade: A
  source: "Crater JS, Lievense JC. Scale-up of industrial microbial processes. FEMS Microbiol Lett 365(13):fny138 (2018)"
  doi_or_url: 10.1093/femsle/fny138
  locator: "Section 'What is scale-up and why does it matter?', paragraph 1"
  quote: "A process developed in a laboratory (e.g. 0.5–10 L fermentors) must be translated into a full manufacturing scale process (e.g. 20 000–2000 000 L fermentors), with scale factors ranging anywhere from thousands to millions."
  read: html
  note: >-
    value = midpoint (not meaningful; use the range). Same section: "The first stage is a
    pilot plant (pilot scale) with 100–10,000 L fermentors and matched downstream equipment."
    and "The second stage of scale-up is a demonstration plant (demo scale) with 10 000–100
    000 L fermentors and matched downstream." Section 'Key considerations': "fermentation is
    usually the costliest process step, both in terms of variable costs (raw materials and
    utilities) and capital investment." The article has no numbers on OTR, heat removal or
    CO2; its Table 2 'Scale-dependent fermentation parameters' lists kLa as "Gradient due to
    power dissipation; upper limitation due to equipment design" and broth hydrostatic
    pressure as "Increase in magnitude with gradient along vertical axis".

