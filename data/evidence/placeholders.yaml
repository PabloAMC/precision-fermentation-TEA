  doi_or_url: 10.1007/s11367-022-02087-0
  locator: "Table 2 'Additional nutrients and antifoam agent taken from Humbird et al. (2011)', p.1023 (local copy)"
  quote: "Antifoam agent | g/l | 0.2"
  read: fulltext
  note: >-
