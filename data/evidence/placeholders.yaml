    Vendor case study. The TVR needed "approximately 1,700 pounds an hour of live steam"; the
    MVR "approximately 40 kW". Payback "almost 10 years" at their prices. Incremental cost of
    the compression device only, not a whole evaporator. No whole-evaporator $/(kg/h) was found
    beyond the NREL brine MVR already in dsp.yaml (~$55 per kg/h, 2010$).

