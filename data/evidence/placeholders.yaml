# =========================================================================================

- key: antifoam_corn_oil_nrel2011
  value: 0.1
  unit: "% v/v corn oil in the cellulase production medium (derived about 0.9-1.0 kg/m3 broth)"
  grade: B
  source: "Humbird D, Davis R, Tao L, et al. Process design and economics for biochemical conversion of lignocellulosic biomass to ethanol. NREL/TP-5100-47764 (2011)"
  doi_or_url: https://docs.nrel.gov/docs/fy11osti/47764.pdf
  locator: "Table 20 Cellulase Production Nutrient Requirements, p.39; Appendix A item P-420, p.103 (local copy references/text/NREL_2011_...txt)"
  quote: "Corn oil 0.1% v/v"
  read: fulltext
  note: >-
    T. reesei, 300 m3 fed-batch. The equipment list row "P- 420 Anti-foam Pump ... 11 kg/hr
    ... 13.4" gives an antifoam stream of 13.4 kg/h. Derived: 9 vessels x 240 m3 final broth
    per 168 h = 12.9 m3/h, so about 1.0 kg antifoam per m3 of broth, consistent with 0.1% v/v
    oil. Vegetable oil is a weak antifoam used at high dose; silicone or polyglycol antifoams
    are dosed 5-50x lower (next keys). This is the high end.

- key: antifoam_typical_usage_sensor_controlled_fedbatch_us5260202
  value: 0.11
  low: 0.02
  high: 0.2
  unit: "g antifoam per L fermentation broth (total usage, sensor-controlled yeast fed-batch)"
  grade: B
  source: "Clarke PM, Mead DJ, Collins SH (Delta Biotechnology Ltd). Fermentation method. US 5,260,202 A (1993)"
  doi_or_url: https://patents.google.com/patent/US5260202A/en
  locator: "Description, background on fed-batch foam control; Example 1"
  quote: "Typical total usage rates for an antifoam agent in such a sensor-controlled process are 0.02-0.2 g per liter of fermentation broth."
  read: html
  note: >-
    value is the midpoint. Example 1 (S. cerevisiae secreting albumin, 93 g/L final biomass):
    polypropylene glycol 2000 added by the foam sensor, "the final level of addition was 0.2
    g/l." The invention itself deliberately runs polyoxyalkylenes at 1-5 g/L as a protein
    stabiliser ("between about 0.5 and 10 g, preferably between about 1 and 5 g, per liter"),
    which raised recombinant albumin yield, so higher doses are possible if they pay back.

