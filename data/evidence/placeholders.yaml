# 2. capital.dsp_area_factor (downstream + drying floor area / fermentation floor area)
# =========================================================================================

- key: dsp_area_factor_no_direct_source
  value: null
  unit: "downstream + drying building area as a fraction of fermentation building area"
  grade: E
  source: "not found"
  doi_or_url: null
  locator: null
  quote: null
  read: abstract
  note: >-
    No public source gives the floor area of a recovery/drying section relative to the
    fermentation hall. I searched TEA reports (NREL 2011, Intelligen 2025 OVA, Humbird 2021),
    press material for PF plants (Liberation Labs Richmond: 600,000 L, "fully dedicated DSP",
    no floor area published), enzyme-plant press releases and food-plant design texts. The
    Humbird rules below are the nearest analogue. Two ways to settle it: (1) a plot plan or
    permit filing for a real PF, enzyme or WPC plant; (2) calibrate the area factor so that the
    total building cost lands near Petrides' building multiplier (next-but-one key).

- key: shop_and_warehouse_area_frac_humbird2021
  value: 0.25
  unit: "shop area, and separately warehouse area, as a fraction of fermentation area"
  grade: B
  source: "Humbird D. Scale-up economics for cultured meat. Biotechnol Bioeng 118:3239-3250 (2021), SI workbook"
  doi_or_url: 10.1002/bit.27848
  locator: "SI sheet 4FB-020, rows 237-238 (Buildings block), columns A-K"
  quote: "Shop | % of ferm area | 0.25 | 1316.9916518612665 | 1 | Maint shop | ... | ratioed to total ferm area"
  read: fulltext
  note: >-
    Cells joined with "|"; the warehouse row reads "Warehouse | % of ferm area | 0.25 | ...
    | Every ton of product occupies an area of warehouse for some time". Row 232 has the
    packing factor 0.15 already used in base.yaml. plant.py hard-codes both 0.25 factors
    without a YAML source; this is that source. Humbird's cultured-meat plant has no separate
    downstream building, so it gives no DSP ratio.

- key: building_multiplier_enzyme_plants_petrides
  value: 0.45
  low: 0.1
  high: 3.0
  unit: "building cost as a multiple of total equipment purchase cost (PC)"
  grade: B
  source: "Petrides D. Bioprocess Design and Economics. Intelligen web version (Mar 2015) of ch.11 in Harrison et al., Bioseparations Science and Engineering, 2nd ed. (2015)"
  doi_or_url: https://www.intelligen.com/wp-content/uploads/2020/05/BioProcessDesignAndEconomics_March_2015.pdf
  locator: "Table 11.3 and text, pp.11-25 to 11-26"
  quote: "The average value of 0.45 corresponds to relatively large plants that produce medium to high value products (e.g., industrial enzymes)."
  read: fulltext
  note: >-
    Table 11.3 row: "Buildings 0.45 x PC 0.1-3.0". The text says commodity plants (ethanol,
    citric acid) sit at the low end and biopharma at the high end. The next paragraph gives the
    area method: "For more accurate estimation of building costs, it is necessary to estimate
    the process area required based on the footprint of the equipment and the space required
    around the equipment". Use as a calibration check on dsp_area_factor: compute modelled
    building cost / PEC and compare with 0.45 (my suggestion, not the source's). The quoted
    sentence runs across the page break between pp.11-25 and 11-26.

