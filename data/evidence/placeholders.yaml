# data/evidence/placeholders.yaml: evidence gathered 2026-09-26 (audit batch 2) for the parameters
# that were grade-E placeholders in v1, and for the audit's open sourcing requests: membrane skid
# cost (1), downstream floor area (2), lab area (3), antifoam (4), spent-biomass disposal (5),
# NL-vs-US construction location factor (6), fermenter heat transfer (7), ovalbumin solubility (8),
# spray-dryer cost (9), evaporators (10), dryer feed solids (11), minimum initial fill (12) and the
# maintenance of producing K. phaffii (13). Decisions taken from it are in data/pf/base.yaml and
# docs/AUDIT.md (P-1 to P-13). Items are numbered in the section headers below.
#
# Evidence for the grade-E placeholders and the extra items 9-13 (research pass 2026-09-26).
# Format: data/evidence/README.md. Every quote was read from raw text: curl + tag stripping,
# Europe PMC full-text XML, pdftotext on PDFs downloaded to the scratch dir (then deleted),
# official JSON APIs (Comext, Comtrade, eCFR), or DOM text from the built-in browser.
# No quote comes from a summarising fetch tool. Entries with quote: null are leads that could
# not be verified; they are NOT usable until someone reads the source.
# "Derived" numbers in notes are my arithmetic, not the source's. Check them.
# Values keep the source's own units and years; conversions appear only in notes.

# =========================================================================================
# 1. dsp.membrane_skid_usd_m2 (MF/UF skid excluding membranes, $ per m2 of membrane)
# =========================================================================================

- key: membrane_system_capex_sw_vs_ceramic_dairy_mercierbouchard2017
  value: 321.02
  high: 5079.37
  unit: "CAD per m2 membrane, capital investment excluding membranes (value = polymeric spiral-wound 0.1 um MF; high = ceramic graded-permeability MF); cost year not stated (paper 2017)"
  grade: B
  source: "Mercier-Bouchard D, Benoit S, Doyen A, Britten M, Pouliot Y. Process efficiency of casein separation from milk using polymeric spiral-wound microfiltration membranes. J Dairy Sci 100:8838-8848 (2017)"
  doi_or_url: 10.3168/jds.2017-13015
  locator: "Table 4 footnote 2, p.8846 (author PDF on ideatech.fsaa.ulaval.ca)"
  quote: "Comparative capital investment costs (excluding membranes) of Can$321.02/m2 for SW membranes and Can$5,079.37/m2 for GP membranes. Depreciation of 5% per year applied."
  read: fulltext
  note: >-
    Design assumption in a peer-reviewed simulation of an industrial dairy plant treating
    1.5 million L of skim milk per day (20 h). Table 4 sizes the plants at "Membrane area
    required (m2) 5,184.7" (spiral-wound) and "1,353.6" (ceramic). Footnote 3 prices the
    membranes separately: CAD 300 per 6.69 m2 spiral module (about CAD 45/m2) and CAD 1,200
    per 0.72 m2 ceramic module (about CAD 1,667/m2). The row is labelled "Installation
    capital investment", so these are probably installed costs, not purchase costs; the paper
    does not say. Derived: about USD 250/m2 (spiral) and USD 3,900/m2 (ceramic) at an assumed
    2017 rate of 1.30 CAD/USD. Food-grade sanitary design, the closest analogue found for a PF
    plant. The authors attribute the SW-vs-ceramic comparison to Hu et al. (2015), not read.

- key: ro_system_capex_dairy_chamberland2020
  value: 400
  unit: "CAD per m2 membrane, RO system cost (industrial value); cost year not stated (paper 2020)"
  grade: B
  source: "Chamberland J, Benoit S, Doyen A, Pouliot Y. Integrating reverse osmosis to reduce water and energy consumption in dairy processing: a predictive analysis for Cheddar cheese manufacturing plants. J Water Process Eng 38:101606 (2020)"
  doi_or_url: 10.1016/j.jwpe.2020.101606
  locator: "Section 2.4 (CAPEX assumptions), p.3 (author PDF on ideatech.fsaa.ulaval.ca)"
  quote: "They were calculated using the following assumptions: RO system costs of 400 CA$. m-2 (industrial value), interest rate of 7%, an amortization period of 15 years [37]."
  read: fulltext
  note: >-
    Reverse osmosis on dairy streams (whey, UF permeate, skim milk), spiral-wound. "Industrial
    value" means industry-supplied; the paper does not say whether membranes are included.
    RO skids need higher-pressure housings and pumps than UF, so a UF skid should cost the
    same or less per m2. Derived: about USD 300/m2 at an assumed 2020 rate of 1.34 CAD/USD.
    Quote reassembled from the two-column PDF text (hyphenation "RO sys-tem" removed).

- key: membrane_hardware_cost_food_water_superpro
  value: 85
  low: 70
  high: 100
  unit: "USD per m2 membrane, hardware (purchase) cost for large food and water installations; cost year not stated"
  grade: B
  source: "Intelligen Inc. SuperPro Designer online help, Appendix A 'Feed & Bleed Concentration (Continuous Membrane Filtration)', section Equipment Purchase Cost (accessed 2026-09-26)"
  doi_or_url: https://docs.intelligen.com/spd/SPDWebHelp/Bk7/AppendixA/Feed_Bleed_Concentration_Continuous_Membrane_Filtration.htm
  locator: "Equipment Purchase Cost paragraph"
  quote: "For large membrane installations in the food and water industries, the cost of hardware is in the range of $70-100/m 2 of membrane area. For small installations in the biopharmaceutical industry, the hardware cost is approximately 10 times higher."
  read: html
  note: >-
    value is the midpoint. The preceding sentences say purchase cost comes from "built-in
    correlations derived from vendor data" and that "a unit sold to the biopharmaceutical
    industry may cost 2-5 times the cost of a similar unit (same membrane size) sold to the
    food or water treatment industries." This is the software Intelligen used for the OVA TEA.
    The text is undated and may be old; treat the dollar year as unknown (probably 2000s).

- key: uf_unit_capex_small_superpro_chen2023
  value: 174000
  unit: "USD for an 80 m2 ultrafiltration unit (SuperPro Designer database; cost year not stated, paper 2023)"
  grade: B
  source: "Chen Y, Zicari S, Zhang R. Economic analysis of enzyme recycling during enzymatic hydrolysis of sugar beets for soluble sugars production. Food Bioeng 2(3):200-211 (2023)"
  doi_or_url: 10.1002/fbe2.12056
  locator: "Section 3.1.2 Alternative scenario A, 'Membrane ultrafiltration'"
  quote: "The capital investment and total power consumption of the ultrafiltration unit are assumed to be $174,000 and 16 kW, respectively, from the SuperPro Designer database."
  read: html
  note: >-
    Previous sentence: "A membrane ultrafiltration unit is modeled in the process with a
    membrane area of 80 m2." Derived: USD 2,175/m2. The same section prices the PES flat-sheet
    membrane at "$171/m2" (Synder quote). A small unit, so per-m2 cost is high; it shows that
    $1,000-2,000/m2 is a small-skid number, not a large-plant one. Read from browser DOM text
    (Wiley blocks curl).

- key: membrane_system_cost_curve_biopharma_petrides
  value: 230000
  low: 150000
  unit: "USD2012 hardware (purchase) cost of a membrane filtration system; value at 55 m2, low at 5 m2 (biopharma specification)"
  grade: B
  source: "Petrides D. Bioprocess Design and Economics. Intelligen web version (Mar 2015) of ch.11 in Harrison et al., Bioseparations Science and Engineering, 2nd ed. (2015)"
  doi_or_url: https://www.intelligen.com/wp-content/uploads/2020/05/BioProcessDesignAndEconomics_March_2015.pdf
  locator: "Figure 11.8, p.11-27; text p.11-26"
  quote: "The cost of the membrane filtration systems includes the cost of the skid, tank, pumps and automation hardware and software."
  read: fulltext
  note: >-
    Numbers read by eye from the rendered figure (y axis "Hardware Cost ($1,000)"): about 150
    at 5 m2, 175 at 15 m2, 210 at 30 m2 and 230 at 55 m2 (approximate, +/- 5). Derived: about
    $4,200/m2 at 55 m2, and cost rises only about 1.5x for 11x the area. Biopharma
    specification. The same chapter says food, biofuel and water systems cost "more than an
    order of magnitude lower" (key membrane_system_cost_food_vs_biopharma in dsp.yaml).

