- key: endotoxin_yeast_host
  value: "host is endotoxin-free; endotoxin enters only via contamination (water, raw materials, bacterial contamination)"
  unit: qualitative
  grade: A
  source: "Rueda F, Cano-Garrido O, et al. Functional inclusion bodies produced in the yeast Pichia pastoris. Microb Cell Fact 15:166 (2016)"
  doi_or_url: 10.1186/s12934-016-0565-9
  locator: abstract
  quote: "the yeast Pichia pastoris (Komagataella spp.), an endotoxin-free host system for recombinant protein production"
  read: abstract
  note: >-
    Endotoxin is lipopolysaccharide from Gram-negative bacterial outer membranes; neither K. phaffii
    nor S. cerevisiae makes it (general microbiology). So the <=1 EU/mg cell-culture spec is met by
    hygiene (pyrogen-free water, clean raw materials, closed processing) rather than by a dedicated
    endotoxin-removal step; Delta even ultrafilters its medium "(10,000 Mol. Wt. cut-off) to remove
    endotoxins" (US 5,728,553 Ex. 1). Physics (mine): 1 EU ~ 0.1 ng LPS (BBA Adv 2025 assay note:
    "0.1 EU equals 20 pg endotoxin" - a different conversion, check), so 1 EU/mg ~ 0.1-0.2 ppm LPS.
    A food-grade plant (non-aseptic DSP, open spray drying) may not reach 1 EU/mg without an extra
    step; a CEX capture step itself removes LPS (anionic, flows through at pH 4.5). This is the main
    reason the media-grade route should be 'cex', not 'concentrate'. No public measurement of
    endotoxin in a food-grade PF protein was found (gap).

