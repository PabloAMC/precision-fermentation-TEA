    per broiler (the PROTEIN_CANDIDATES.md basis, not re-checked) that is ~14-74 chickens per kg of
    albumin, conditional on (i) CM displacing chicken 1:1, (ii) CM reaching scale, (iii) media keeping
    albumin. The evidence in this section says (iii) is in decline at the leading firms (Wildtype,
    Believer, Vow per GFI) but still present for muscle satellite-cell media (UPSIDE 2022, Beefy-9).
    The model's job is the price that would keep it in: Beefy-9 shows demand rises steeply as price
    falls.

