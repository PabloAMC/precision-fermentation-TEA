  unit: process train (pharmaceutical Recombumin, >=99.9% pure)
  grade: B
  source: "US 5,728,553 A (1998), Examples 1-3 and claims; US 6,638,740 B1 (2003)"
  doi_or_url: https://patents.google.com/patent/US5728553A/en
