- key: hsa_theoretical_pi_and_charge
  value: 5.80
  unit: theoretical pI of mature HSA (EMBOSS pKa set, 1 free Cys); BSA 5.67
  grade: A
  source: "Derived (mine) from UniProtKB P02768/P02769 mature sequences"
  doi_or_url: https://rest.uniprot.org/uniprotkb/P02768.json
  locator: "computed (D 36, E 62, K 59, R 24, H 16 in mature HSA)"
  quote: null
  read: fulltext
  note: >-
    Derived (mine) - check: net charge of HSA ~+26 at pH 4.5, ~+3 at pH 5.5, ~-11 at pH 7.0 (sequence-
    based, ignoring burial and bound fatty acids; the measured pI of native, fatty-acid-loaded HSA is
    lower, ~4.7-5, from general literature, not sourced in this pass). This explains the Delta CEX
    recipe physically: load at pH 4.5 where albumin is strongly positive, elute by moving to pH 5.5
    (near-neutral net charge) with ~0.1 M acetate rather than 1 M NaCl, then strip with 2 M NaCl.
    Consequence for the model: albumin's CEX elution salt cost is lower than lactoferrin's, but the
    whole MF permeate must be acidified to pH ~4.5 (acid cost; proteolysis risk).

