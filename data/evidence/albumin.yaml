# =======================================================================================
# 6. Welfare / displacement framing: is albumin demand real?
# =======================================================================================

- key: beefy9_albumin_dose_and_cost_driver
  value: 0.8
  low: 0.8
  high: 11.2
  unit: g/L recombinant albumin in Beefy-9 (bovine satellite cells); high = best short-term growth tested
  grade: A
  source: "Stout AJ, Mirliani AB, Rittenberg ML, et al. Simple and effective serum-free medium for sustained expansion of bovine satellite cells for cell cultured meat. Commun Biol 5:466 (2022)"
  doi_or_url: 10.1038/s42003-022-03423-8
  locator: "Results 'Beefy-9' and 'Cost analysis' (PMC9163123, Europe PMC full-text XML)"
  quote: "an augmented B8 media with nine components was established by supplementing with 800 μg/mL rAlbumin alone. This media was termed Beefy-9"
  read: fulltext
  note: >-
    Evidence FOR albumin demand in muscle-cell media: albumin is the single component that makes B8
    work for bovine satellite cells, and more helps: "concentrations of rAlbumin up to 11.2 mg/mL
    revealed continued improvements ... an 8.5-fold improvement in 4-day growth compared to Beefy-9's
    800 ug/mL", but "by 6.4 mg/mL rAlbumin, Beefy-9 had already surpassed the cost of serum-containing
    BSC-GM". Cost: "Beefy-9 prices were dominated by rAlbumin, basal media, FGF-2 (at high
    concentrations), and insulin"; Beefy-9 "$217/L vs. $290/L" for serum medium. So albumin demand is
    price-elastic: at $10/kg cells would use several g/L; at $30k/kg, <1 g/L or zero. This is the
    strongest argument that the PF cost question matters.

- key: beefyR_rapeseed_replaces_albumin
  value: "rapeseed protein isolate replaces recombinant albumin"
  unit: qualitative (dose in the full text, not read)
  grade: A
  source: "Stout AJ, Rittenberg ML, Shub M, et al. A Beefy-R culture medium: replacing albumin with rapeseed protein isolates. Biomaterials 296:122092 (2023)"
  doi_or_url: 10.1016/j.biomaterials.2023.122092
  locator: abstract (PMC10111969; full-text XML not served by Europe PMC)
  quote: "Here we alter Beefy-9 by replacing recombinant albumin with rapeseed protein isolate (RPI), a bulk-protein solution obtained from agricultural waste"
  read: abstract
  note: >-
    Same abstract: cells grew "with an average doubling time of 26.6 h, showing improved growth
    compared with Beefy-9", and maintained myogenicity. Evidence AGAINST albumin demand: a crude
    plant-protein isolate (alkali extraction, pH 4.5 precipitation, 3 kDa UF) does albumin's job.
    The earlier survey's "0.4 g/L" RPI dose and "input cost ... $0.002" per L are from the preprint
    and were not re-read here.

