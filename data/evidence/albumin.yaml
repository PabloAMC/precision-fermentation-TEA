# albumin.yaml: evidence for adding FOOD/MEDIA-GRADE RECOMBINANT SERUM ALBUMIN (for cultivated-meat
# cell-culture media) as a product in pf-tea (research pass 2026-10-02; AI research agent, checked by the main session).
# Format: data/evidence/README.md. Grades: A measured/official; B published design basis or patent
# example; C company claim/trade press/survey; D analogy; E guess.
# Read as raw text: UniProt REST JSON (downloaded here), local files under ~/Developer/pf-tea/references
# (text/ and inbox/protein_survey_2026-10-01/), the Humbird 2021 SI workbook (openpyxl), Europe PMC
# abstracts / full-text XML, patents.google.com. Items computed here are "Derived (mine)", quote: null.

# =======================================================================================
# 1. Identity, sequence, mass balance
# =======================================================================================

- key: hsa_uniprot_mature_chain
  value: "P02768 chain 25-609 (585 aa)"
  unit: residue range of the mature secreted chain (precursor numbering)
  grade: A
  source: "UniProtKB P02768 (ALBU_HUMAN), Albumin, Homo sapiens; entry version 298, last annotation update 2026-09-02"
  doi_or_url: https://rest.uniprot.org/uniprotkb/P02768.json
  locator: "features: Signal 1-18; Propeptide 19-24; Chain 25-609 'Albumin'; 17 'Disulfide bond' features; sequence.molWeight 69367 (609-aa precursor)"
  quote: "{\"type\":\"Chain\",\"description\":\"Albumin\",\"location\":{\"start\":{\"value\":25},\"end\":{\"value\":609}}}"
  read: fulltext
  note: >-
    Pre-pro-albumin: 18-aa signal + 6-aa propeptide (RGVFRR, removed by a furin-type protease; in yeast
    by Kex2) leave the 585-aa mature chain starting DAHKSEVAHRFK. 35 Cys = 17 disulfides + 1 free
    thiol (Cys34 of the mature chain, the redox-active one; relevant to "mercaptalbumin" specs).
    6 Met, 1 Trp. No N-X-S/T sequon in the mature chain (my scan), so native HSA carries no N-glycan;
    UniProt's glycosylation features are non-enzymatic glycation of Lys (in vivo/in vitro) plus two
    rare variants (Redhill, Casebrook) that create a sequon. Secreted (UniProt subcellular location).

- key: bsa_uniprot_mature_chain
  value: "P02769 chain 25-607 (583 aa)"
  unit: residue range of the mature chain
  grade: A
  source: "UniProtKB P02769 (ALBU_BOVIN), Albumin, Bos taurus; entry version 201, 2026-09-02"
  doi_or_url: https://rest.uniprot.org/uniprotkb/P02769.json
  locator: "features: Signal 1-18; Propeptide 19-24; Chain 25-607; 17 Disulfide bond; molWeight 69293"
  quote: "{\"type\":\"Chain\",\"description\":\"Albumin\",\"location\":{\"start\":{\"value\":25},\"end\":{\"value\":607}}}"
  read: fulltext
  note: >-
    583 aa, 35 Cys (17 S-S + free Cys34), 4 Met, 2 Trp, no N-X-S/T sequon in the mature chain (my
    scan); only one glycation feature (Lys, in vitro). N-terminus DTHKSEIAHRFK. Same fold and
    disulfide map as HSA (~76% identity per the literature; identity not computed here).

- key: chicken_albumin_uniprot_mature_chain
  value: "P19121 chain 24-615 (592 aa)"
  unit: residue range of the mature chain
  grade: A
  source: "UniProtKB P19121 (ALBU_CHICK), Albumin (serum albumin, alpha-livetin), Gallus gallus; entry version 156, 2026-09-02"
  doi_or_url: https://rest.uniprot.org/uniprotkb/P19121.json
  locator: "features: Signal 1-18; Propeptide 19-23; Chain 24-615; 17 Disulfide bond; Glycosylation 500 (ECO:0000255 = predicted from sequence); molWeight 69918"
  quote: "{\"type\":\"Glycosylation\",\"location\":{\"start\":{\"value\":500 ... \"description\":\"N-linked (GlcNAc...) asparagine\",\"evidences\":[{\"evidenceCode\":\"ECO:0000255\"}]"
  read: fulltext
  note: >-
    592 aa, 35 Cys (17 S-S), 19 Met (vs 6 in HSA), 0 Trp. ONE N-X-S/T sequon (mature Asn477 =
    precursor 500), annotated only by sequence analysis (ECO:0000255), so in K. phaffii it could be
    hyper-mannosylated; a Gln mutant or EndoH would be needed for a homogeneous product. This is a
    small reason to prefer HSA/BSA. Chicken albumin would only matter if a chicken-cell medium needed
    species-matched albumin; no evidence found that it does.

- key: hsa_mature_formula_and_mw
  value: {C: 2936, H: 4590, N: 786, O: 889, S: 41}
  unit: atoms per molecule of the mature chain (17 disulfides, Cys34 reduced)
  grade: A
  source: "Derived (mine) from UniProtKB P02768 mature chain 25-609 (585 aa, 17 disulfide features)"
  doi_or_url: https://rest.uniprot.org/uniprotkb/P02768.json
  locator: "computed from the sequence (script .preview/albumin/uniprot_calc.py)"
  quote: null
  read: fulltext
  note: >-
    Derived (mine) - check the arithmetic. Residue sums + H2O, minus 2H per disulfide (17): average
    MW 66,437 Da; per C: CH1.5634N0.2677O0.3028S0.01396; 53.08 wt% C, 16.57 wt% N, 1.98 wt% S;
    protein/N = 6.035 (so N x 6.25 overstates HSA by 3.6%). Cross-check: the same residue-sum
    method gives 69,366.0 Da for the 609-aa precursor (no disulfides) vs UniProt molWeight 69,367
    (rounding). The literature value for mature rHSA by MS is ~66.4-66.5 kDa (consistent).
    Sulfate demand: 41 S per molecule = 1.98% S by mass, ~2x ovalbumin's; the model's sulfate
    assimilation term should use this.

- key: bsa_mature_formula_and_mw
  value: {C: 2934, H: 4581, N: 781, O: 897, S: 39}
  unit: atoms per molecule of the mature chain (17 disulfides)
  grade: A
  source: "Derived (mine) from UniProtKB P02769 mature chain 25-607"
  doi_or_url: https://rest.uniprot.org/uniprotkb/P02769.json
  locator: "computed from the sequence"
  quote: null
  read: fulltext
  note: >-
    Derived (mine): MW 66,398 Da; 53.07% C, 16.48% N, 1.88% S; protein/N 6.070. Precursor check:
