- key: albumin_base_product_recommendation
  value: HSA
  unit: recommended base product
  grade: E
  source: "Judgement (mine) from the entries in this file (identity, supplier, titer and market sections)"
  doi_or_url: null
  locator: null
  quote: null
  read: fulltext
  note: >-
    HSA (P02768) is what every recombinant media supplier sells (InVitria Cellastim/Optibumin, rice;
    Sartorius/Albumedix Recombumin/Albucult, S. cerevisiae; Healthgen/Oryzogen, rice; Merck), it has
    by far the deepest titer and DSP literature (Pichia, S. cerevisiae, K. lactis, rice), and it is
    what Beefy-9 used. BSA is the plasma-derived incumbent in serum-free media and the species match
    for bovine cells, but recombinant BSA literature is thin. For the model the two are elementally
    identical (previous entries), so a "HSA" product with a BSA sensitivity note costs nothing.

# =======================================================================================
# 4. Demand, cost targets, prices, market (CM-media framing)
# =======================================================================================

- key: gfi2023_albumin_cost_target
  value: 10
  unit: $/kg protein (production cost tier 1)
  grade: C
  source: "GFI (Swartz E et al.). Anticipated growth factor and recombinant protein costs and volumes for cost-competitive cultivated meat (2023)"
  doi_or_url: references/reports/GFI_2023_growth_factor_recombinant_protein_costs_cultivated_meat.pdf
  locator: "Executive summary p.3; Table 1 p.14 (local text l.117-126, l.512-531)"
  quote: "To satisfy this ambitious cost projection, albumin would need to be produced at $10/kg, insulin and transferrin at $1,000/kg, and growth factors at $100,000/kg."
  read: fulltext
  note: >-
    A target, not an estimate: it is back-solved so that all recombinant proteins cost $1 per kg of
    a hypothetical $10/kg CM. The $10/kg is justified in footnotes 6-8 by analogy only: "Lowest price
    found for a recombinant protein - cellulase (Puetz and Wurm 2019)"; ReThinkX's $10/kg by 2025;
    and "Bulk ordering of common food enzymes at 200-1000kg scales were quoted from Novozymes at costs
    between $12-25/kg" (p.14). Table 1 also gives Humbird's Eq. 3.4 price-volume extrapolation for
    albumin at the GFI volumes: "$26.94/kg" average, "$68.68/kg to $3.95/kg" across scenarios A-F.
    pf-tea's albumin product answers directly whether $10/kg is reachable bottom-up.

- key: gfi2023_albumin_demand_2030
  value: 3600
  low: 3600
  high: 100000
  unit: t/yr recombinant albumin (2030 scenarios)
  grade: C
  source: "GFI 2023 (as above)"
  doi_or_url: references/reports/GFI_2023_growth_factor_recombinant_protein_costs_cultivated_meat.pdf
  locator: "p.11 (local text l.409-417); Box 2 p.8 (scenarios A-F)"
  quote: "For albumin, estimations fall between approximately 3,600 and 100,000 metric tons per year to meet demand"
  read: fulltext
  note: >-
    Scenario arithmetic: average literature concentration (Tab 1 of the supplementary spreadsheet,
    not read) x medium use (8 / 13 / 42 L per kg CM, from CE Delft/Sinke 2021 Table 16) x CM output
    (0.4 or 2.1 Mt in 2030, i.e. 0.1-0.56% of meat). "96.6% of production volume is expected to be
    attributable to albumin, 2.42% to transferrin, 0.97% to insulin" (p.3). These are conditional
    demand scenarios, not forecasts; 2025 CM output is orders of magnitude below 0.4 Mt (see the
    displacement section).

