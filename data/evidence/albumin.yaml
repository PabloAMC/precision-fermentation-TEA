# =======================================================================================
# 3. Downstream processing
# =======================================================================================

- key: hsa_delta_cex_capture_conditions
  value: 40
  low: 30
  high: 50
  unit: g rHA loaded per L of SP/S-Sepharose FF (operating load, not a measured dynamic capacity)
  grade: B
  source: "Delta Biotechnology (Goodey et al.). High purity albumin and method of producing. US 5,728,553 A (1998), Example 2; same in US 6,638,740 B1 (2003)"
  doi_or_url: https://patents.google.com/patent/US5728553A/en
  locator: "Example 2, 'Cation Exchange Chromatography', Table 3 (recipes) and Table 4 (S-FF steps)"
  quote: "S-Sepharose FF (Pharmacia) at a bed height of 12.5 cm, with a column loading of 40±10 g rHA/L matrix."
  read: fulltext
  note: >-
    Capture straight from centrate: "sodium octanoate is added ... to a final concentration of
    approximately 5 mM. The pH is adjusted with acetic acid ... to 4.50±0.1" (Example 2). US 6,638,740
    widens it: "a column loading of 10 to 50 g albumin/L, preferably 40±10". Physics (mine): HSA pI is
    ~4.7-5.0 (literature value, not sourced here), so at pH 4.5 it carries net positive charge and
    binds a cation exchanger, while most yeast proteins (acidic) and pigments do not; octanoate
    (a ligand of albumin's fatty-acid sites) stabilizes it against protease and heat. This is the
    same physics as the model's lactoferrin CEX (LF pI ~8.7 binds at neutral pH), so the cex route
    applies with albumin-specific numbers. Proposed dsp.cex_dbc_g_L for albumin: 40 (30-50), B.

- key: hsa_delta_cex_step_table
  value: {equilibration_cv: 4, wash_cv: 11.5, elution_cv: 2, eluate_collection_cv: 6.5, salt_wash_cv: 3.5, naoh_cv: 3, storage_cv: 3.5, load_flow_cm_min: 6.36, elution_flow_cm_min: 3.18, bed_cm: 12.5}
  unit: column volumes per cycle and linear flows
  grade: B
  source: "US 5,728,553 A, Table 4 (S-FF) and Table 3 (recipes)"
  doi_or_url: https://patents.google.com/patent/US5728553A/en
  locator: "Table 4; Table 3 recipes 1, 2, 3, 4, 7"
  quote: "1. Equili- 1 6.36 D 4 ... 3. Wash 1 6.36 D 11.5 ... 4. Elution 2 3.18 D 2 ... 5. Eluate 2 3.18 D 6.5 ... 6. Salt 3 3.18 D 3.5 ... 7. NaOH 4 3.18 D 3 ... 8. Storage 7 3.18 D 3"
  read: fulltext
  note: >-
    Derived (mine): total buffer per cycle = 4 + 11.5 + 2 + 6.5 + 3.5 + 3 + 3 + 0.5 = 34 CV (vs 16 in
    base.yaml's EVERY lactoferrin table; propose cex_cv_per_cycle 34, low 16). Eluate collected over
    2 + 6.5 = 8.5 CV (the elution and collection steps; propose cex_elution_cv 8.5 for albumin,
    vs 3.5). Load flow 6.36 cm/min x 60 / 12.5 cm = 30.5 CV/h; elution 15.3 CV/h (propose
    cex_flow_cv_per_h 20, the base value, inside this range). Elution is NOT with 1 M NaCl: recipe 2
    is sodium acetate trihydrate 13.6 g/L + acetic acid 0.75 g/L, pH 5.5 (a pH/ionic-strength step;
    ~0.1 M acetate, 6.5-7.5 mS/cm); the 2 M NaCl "salt wash" (recipe 3: NaCl 117 g/L) comes AFTER
    elution as a strip. Derived (mine): elution salt ~ 13.6 g/L NaOAc.3H2O; strip 3.5 CV x 117 kg/m3
    NaCl = 410 kg NaCl per m3 resin-cycle; NaOH 3 CV x 20 kg/m3 (0.5 M) = 60 kg per m3 resin-cycle.
    In base.yaml terms: cex_elution_nacl_kg_m3 ~0 (acetate instead, ~14 kg/m3), regen ~117 kg/m3
    NaCl over 3.5 CV, CIP 0.5 M NaOH. The octanoate-elution variant (US 6,638,740 Ex. 5) elutes
    with ~5 mM octanoate at pH ~5.5 instead.

- key: hsa_delta_cex_step_recovery
  value: 0.56
  low: 0.40
  high: 0.66
  unit: fraction of rHA (monomer) recovered over the S-FF cation-exchange capture step
  grade: B
  source: "US 5,728,553 A Table 4 footnote (>40%); US 6,638,740 B1 Example 5 (46-66% anticipated monomer recovery)"
  doi_or_url: https://patents.google.com/patent/US6638740B1/en
  locator: "US 5,728,553 Table 4 footer; US 6,638,740 text before 'the albumin was therefore eluted ... with a solution of octanoate'"
  quote: "the anticipated recovery of rHA monomer is between 46 and 66%."
  read: fulltext
  note: >-
    US 5,728,553 Table 4 footer: "Recovery of rHA >40% (Centrate SDSPAGE, Seluate HPLC)" - note the
    two different assays (SDS-PAGE in, HPLC out), so the true mass recovery is uncertain. value =
    midpoint of 46-66% (mine). This is MUCH lower than the lactoferrin base (0.832) and is the single
    most important DSP number for albumin: whole-broth acidification to pH 4.5 activates yeast
    proteases (Kobayashi 2000: 660 mg/L/h degradation at pH 4.3), and the pharma process cuts
    narrowly for monomer. A media-grade process could cut wider (accepting dimer/fragment);
    proposed dsp.cex_recovery for albumin: 0.56 (0.40-0.83), B; the high end borrows the EVERY
    lactoferrin CEX figure (D analogy).

