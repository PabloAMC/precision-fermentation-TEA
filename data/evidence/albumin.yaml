- key: gfi2025_albumin_trade_price
  value: 55
  low: 40
  high: 70
  year: 2025
  unit: $/kg "high-value albumins" (public trade databases)
  grade: C
  source: "GFI. Driving down costs: precision fermentation (June 2025)"
  doi_or_url: references/reports/GFI_2025_driving_down_costs_fermentation.pdf
  locator: "p.31, 'Market landscape of PF proteins' (local text l.1236-1241)"
  quote: "high-value albumins ranged from $40 to $70/kg in public trade databases (data not shown)"
  read: fulltext
  note: >-
    BASIS NOT GIVEN ("data not shown"). My reading: 'public trade databases' = customs unit values
    under HS 3502 ('albumins ... albuminates and other albumin derivatives'), which mixes egg albumin
    (3502.11/19), milk albumin / whey-protein concentrates (3502.20) and 'other' (3502.90). Human
    serum albumin as a medicine is classified under HS 3002 (blood fractions), not 3502. So $40-70/kg
    is most likely NOT a serum-albumin price at all; it is the wrong comparator for media-grade rHSA.
    See the Comtrade entry below for a check. value = midpoint (mine).

