  values: {beta_lg: 8.4, alpha_la: 2.3, alpha_la_low: 2.2, alpha_la_high: 2.4, alpha_s1_cn: 33.5, alpha_s2_cn: 10.8, beta_cn: 27.5, kappa_cn: 8.2}
