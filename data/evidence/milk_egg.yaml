- key: "milk_protein_nl_raw_heck2009"
  value: 3.48
  low: 3.39
  high: 3.56
  unit: "g total protein / 100 g raw milk (annual mean; low/high = monthly min/max)"
  values: {total_protein: 3.48, true_protein: 3.30, true_protein_low: 3.21, true_protein_high: 3.38, casein: 2.72, npn: 0.182}
  grade: "A"
  source: "Heck JML, van Valenberg HJF, Dijkstra J, van Hooijdonk ACM. Seasonal variation in the Dutch bovine raw milk composition. J Dairy Sci 92(10):4745-4755 (2009)"
  doi_or_url: "10.3168/jds.2009-2146"
  locator: "Table 2 'Mean, CV, and seasonal variation of several basic milk parameters of Dutch bovine raw milk in 2005'"
  quote: "Protein (g/100g) 3.48 1.7 3.39 July 3.56 December; True protein (g/100g) 3.30 1.9 3.21 July 3.38 December; CN (g/100g) 2.72 1.9 2.64 July 2.78 December"
  read: "fulltext"
  note: "Open-archive HTML read in the browser pane (journalofdairyscience.org). Weekly samples representative of the complete Dutch milk supply, Feb 2005-Feb 2006. NPN 0.182 g/100 g (Table 2), so true protein = 94.8% of total. Per litre at 1.0313 kg/L (mine): 35.9 g total, 34.0 g true protein. EU (Dutch) raw milk is richer than US retail whole milk (3.15-3.27 g/100 g)."

- key: "milk_casein_share_heck2009"
  value: 82.3
  low: 81.8
  high: 82.6
  unit: "% casein in true protein (casein number)"
  values: {casein_pct_of_true_protein: 82.3, casein_pct_of_total_protein: 78.0}
  grade: "A"
  source: "Heck JML et al. J Dairy Sci 92(10):4745-4755 (2009)"
  doi_or_url: "10.3168/jds.2009-2146"
  locator: "Table 3 and section 'Protein Composition'"
  quote: "Dividing CN by total protein would yield a CN number of 78.0 instead of 82.3."
  read: "fulltext"
  note: "Whey (serum) true protein implied = 3.30 - 2.72 = 0.58 g/100 g = 6.0 g/L (mine), i.e. 17.7% of true protein. On a total-protein basis casein 78% and whey+NPN 22%."

