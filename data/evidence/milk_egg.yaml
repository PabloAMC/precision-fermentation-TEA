# data/evidence/milk_egg.yaml: composition of cow's milk and hen's eggs and the prices of milk and eggs,
# gathered 2026-09-26 for the milk and egg equivalents (docs/AUDIT.md; report section on equivalents).
# Format: data/evidence/README.md. 'Derived' numbers are our arithmetic and say so.
#
# milk_egg_evidence.yaml - milk and egg composition, and milk/egg price context (Phase B research, 2026-09-26).
# Format: data/evidence/README.md. Extra fields as in prices.yaml: `year` (year of `value`), `values` (series or component map),
# `csv` (companion annual series; path relative to this scratch dir, intended repo location data/prices/).
# All web sources accessed 2026-09-26. `read: html` = HTML page or JSON/text API record read via curl or the browser pane
# (raw text, never a model summary); `read: fulltext` = full article text (Europe PMC full-text XML or open-archive HTML).
# Conversions (mine): 1 US cup = 236.5882365 mL; 1 US gal = 3.785411784 L; 1 cwt = 100 lb = 45.359237 kg; 1 oz = 28.349523125 g.
# FDC "protein" is crude protein = total N x factor (6.38 milk, 6.25 egg); it includes non-protein N.
# Annual price values marked "computed" are simple means of the published monthly/weekly values (the raw records are in this dir).


# ---------------- 1. Milk composition ----------------

