  locator: "Article 5 'Grading of Class A eggs by weight', paragraph 1"
  quote: "L – large: weight ≥ 63 g and < 73 g; ... M – medium: weight ≥ 53 g and < 63 g; ... S – small: weight < 53 g."
  read: "html"
  note: "Needed to convert EU egg prices (EUR/100 kg, 'average of categories L and M') to per-egg prices: ~63 g in shell (the L/M boundary) is a reasonable mid-value (my assumption); an EU M egg is thus comparable to a US Large (>= 56.7 g). EU L egg is heavier than US Large."

- key: "ova_share_li2022"
  value: 54
  unit: "% of egg-white protein"
  grade: "A"
  source: "Li Z, Huang X, Tang Q, Ma M, Jin Y, Sheng L. Functional properties and extraction techniques of chicken egg white proteins. Foods 11(16):2434 (2022)"
  doi_or_url: "10.3390/foods11162434"
  locator: "Table 1 'Percentage of total protein, MW and pI of major egg proteins'; section 2.1 'Ovalbumin (OVA)'"
  quote: "OVA, the most abundant protein in EW, accounts for about 54% of the total EWP."
  read: "fulltext"
  note: "Europe PMC full text (PMC9407204). Table 1: Ovalbumin 54; Ovotransferrin 12–13; Ovomucoid 11; Lysozyme 3.4–3.5; Ovomucin 1.5–3.5 (% of total egg-white protein). Secondary review; the 54% figure traces to classic reviews (Stevens 1991; Mine 1995; not read, see documents list). OVA per large egg = 3.64 g x 0.54 = 1.96 g (mine)."

