  read: "html"
  note: "US retail whole milk. = 33.7 g/L at 1.0313 kg/L (milk_density_fdc_sr_legacy; conversion mine). Crude protein includes NPN (~5% of crude protein, see milk_protein_nl_raw_heck2009). Foundation also lists '1.0 cup = 249.0 g' (= 1.052 kg/L, implausible for milk), so density is taken from SR Legacy."

