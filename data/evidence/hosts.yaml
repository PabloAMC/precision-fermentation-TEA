  grade: A
  host: kphaffii
  source: "Rebnegger C, Graf AB, Valli M, et al. In Pichia pastoris, growth rate regulates protein synthesis and secretion, mating and stress response. Biotechnol J 9:511-525 (2014)"
  doi_or_url: 10.1002/biot.201300334
  locator: "Abstract; Figure 1B"
  quote: "We conclude that a high μ positively affects specific protein secretion rates by acting on multiple cellular processes."
  read: fulltext
  note: >-
    Read 2026-09-27 via Europe PMC (PMC4162992, CC BY-NC-ND). Human serum albumin secreted in
    glucose-limited chemostats at mu = 0.015-0.15/h; translation and secretion genes rise with mu,
    proteolytic degradation of secretory proteins falls. With Nieto-Taype 2020, Garrigos-Martinez
    2019, Prielhofer 2018 and Rebnegger 2024, the consistent picture is that secretion in K. phaffii
    rises with growth, up to an optimum near 0.08-0.1/h.


- key: kphaffii_glucose_hcd_fedbatch_heyland2010
  value: 218
  unit: g DCW/L at the end of a glucose fed-batch (2.6 L); constant growth only up to ~155 g/L
  grade: A
  host: kphaffii
  source: "Heyland J, Fu J, Blank LM, Schmid A. Quantitative physiology of Pichia pastoris during glucose-limited high-cell density fed-batch cultivation for recombinant protein production. Biotechnol Bioeng 107:357-368 (2010)"
  doi_or_url: 10.1002/bit.22836
  locator: "p.358 (strain, feed), p.360 (batch growth), p.363 and Table I (fed-batch), p.366 (scale, heat)"
  quote: "tested for their intracellular BapA activity"
  read: fulltext
  note: >-
    Read 2026-09-27 (review H2). THE PRODUCT IS INTRACELLULAR: BapA from pGAPZ A (GAP promoter, no
    secretion signal), assayed in crude extracts of sonicated cells; 0.03 g BapA/g DCW x 218 g/L =
    the 6.5 g/L in the abstract. Not evidence for secretion, so never cite it for a secreted titer
    or q_P. What it does show on glucose (SMD1168H): batch mu 0.28/h for the parent and 0.16/h for
    the producer (p.360; Table I gives 0.28 and 0.15); fed-batch at mu 0.12/h with yields 0.55
    (parent) and 0.50 g/g (producer) and glucose uptake 1.2 and 1.4 mmol/g/h (p.363); feed 73% (w/v)
    glucose (p.358); growth constant up to about 155 g DCW/L, slowing above it, 218 g/L at 65 h,
    stopped by reactor volume (p.363); the authors state such densities are reachable only in
    small fermenters because oxygen transfer and heat removal limit larger ones (p.366). Their heat
    illustration (1,000 L, 50 g/L, mu 0.1/h: 16 kW on glucose) is matched within 5% by the model's
    460 kJ/mol O2 (H2's arithmetic, checked).

