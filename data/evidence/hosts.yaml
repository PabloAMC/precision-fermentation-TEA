- key: kphaffii_mumax_methanol_tomasgamisans2018
  value: 0.115
  low: 0.11
  high: 0.12
  unit: 1/h
  grade: A
  host: kphaffii
  source: "Tomas-Gamisans M, Ferrer P, Albiol J. Microb Biotechnol 11:224-237 (2018)"
  doi_or_url: 10.1111/1751-7915.12871
  locator: "Results and discussion: Physiological macroscopic parameters"
  quote: "maximum growth rate on methanol was estimated to be between 0.11 and 0.12 h-1, which is in agreement with previously reported values."
  read: html
  note: >
    Washout kinetics. About half the mu_max on sugar (0.2 1/h), which is one reason methanol
    processes are long. Glycerol chemostats in the same paper ran to D = 0.160 1/h without
    washout, so mu_max on glycerol is >= 0.16 1/h.

