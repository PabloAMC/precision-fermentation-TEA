  locator: "Abstract; Sect. 2.7 (fed-batch method); Sect. 3.6 and Fig. 6B; Supplementary Table S4 (feed profile)"
  quote: "the ESPRIT system produced 5.14 g/L beta-lactoglobulin and 1.95 g/L brazzein on glucose"
  read: fulltext
  values: {feed_g_per_h_per_L_broth: {"24-36": 2.5, "36-48": 3.0, "48-60": 3.5, "60-72": 4.0, "72-84": 4.5,
           "84-96": 5.0, "96-108": 5.5, "108-120": 6.0, "120-132": 6.5},
           batch_glucose_g_L: 40, start_volume_L: 2.5, duration_h: 132, overall_yield_g_g: [0.010, 0.020]}
  note: >-
    Full text and Supplementary data read 2026-09-27 (both were on disk; the earlier note said
    abstract only). Single-copy, methanol-free BLG strain in a 5-L bioreactor started with 2.5 L of
    medium holding 4% glucose; glucose fed from about 24 h at rates stepping up from 2.5 to 6.5 g per
    hour per litre of broth until 132 h (Table S4); 30 C, DO kept at 20-30%; BLG quantified by
