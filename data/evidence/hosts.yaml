  source: "Prielhofer R, Reichinger M, Wagner N, et al. Superior protein titers in half the fermentation time: Promoter and process engineering for the glucose-regulated GTH1 promoter of Pichia pastoris. Biotechnol Bioeng 115:2479-2488 (2018)"
  doi_or_url: 10.1002/bit.26800
  locator: "Section 3 (production kinetics, Figure 7c) and Table 3"
  quote: "a bell-shaped relationship for the production of the i-body with a maximum q P at a growth rate of about 0.1 h -1"
  read: fulltext
  note: >-
    Read 2026-09-27 via Europe PMC (PMC6221138, CC BY-NC; review FS-4 follow-up). Table 3,
    maximal specific secretion rate in the feed phase: 0.6, 1.8 and 2.1 mg/g/h (P_AOX1 standard,
    P_GTH1 basic, P_GTH1 optimised). Lonza and BOKU;
    a secreted antibody-like i-body under the glucose-regulated GTH1 promoter (methanol-free),
    glucose fed-batch. Optimised process: "a final titer of 6.4 g·L-1 i-body in the supernatant
    after 60 h total fermentation time" (3.5 g/L per litre of broth), YDM max 138 g/L, OUR max 148
    mmol/L/h; the feed kept the growth rate falling "from µ = 0.15 to about 0.05 h-1". The best
    secretion rate is about half the 4.75 mg/g/h of Intelligen's design, and it occurs near
    mu = 0.1/h, not at the near-zero growth of that design.

- key: kphaffii_qp_rises_with_mu_hsa_rebnegger2014
  value: null
