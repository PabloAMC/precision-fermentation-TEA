  source: "Maurer M, Kuhleitner M, Gasser B, Mattanovich D. Microb Cell Fact 5:37 (2006)"
  doi_or_url: 10.1186/1475-2859-5-37
  locator: "Results, chemostat section; eq (22)"
  quote: "qPmax = 0.0735 mg g-1 h-1 and kq = 0.116 h-1."
  read: html
  note: >
    THE functional form to use for a growth-coupled product: q_P = q_Pmax * mu / (k_q + mu), a
    saturating (Monod-like) dependence on mu, fitted to chemostat data for a secreted Fab. Note
    the absolute q_P is tiny (0.07 mg/gDCW/h) because a Fab is a hard product; the SHAPE is the
    transferable result. At mu = 0.1 1/h this gives q_P = 0.034 mg/gDCW/h.

