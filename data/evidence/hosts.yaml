  locator: "Results, chemostat section"
  quote: "Y_XS = 0.559 and m_S = 0.0161 h-1 were derived according to eq (26)."
  read: html
  note: >
    Same Pirt fit as the yield entry above. This is the high end of the published K. phaffii
    maintenance range (cf. Rebnegger 2016: 0.0100 chemostat, 0.0031 retentostat).

