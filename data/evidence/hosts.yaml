  quote: "-8.22 +/- 0.37 mmol . gDCW-1 . h-1"
  read: html
  note: >
    TABLE CELL - re-check against the publisher PDF before use. value = methanol, high (mis-named,
    it is the glycerol comparator) = 2.04 +/- 0.11 mmol/gDCW/h, both at D = 0.100 1/h. Implies
