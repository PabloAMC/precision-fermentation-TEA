- key: kphaffii_max_dcw_fedbatch_glycerol_shemesh2024
  value: 244
  unit: g DCW/L
  grade: A
  host: kphaffii
  source: "Shemesh P, Fishman A. Curr Res Food Sci 9:100840 (2024)"
  doi_or_url: Shemesh2024_pichia_glycerol_glucose.fulltext.txt
  locator: "Section 3.4, Determination of growth rates in the fermenter; Table 2"
  quote: "Strain Y-7556 reached a biomass concentration of 244 g DCW/L after 48 h using glycerol and 169 g DCW/L after 41 h using dextrose."
  read: fulltext
  note: >
    3.7 L fermenter, 30 degC, pH 5, ~1200 rpm, 4.5-6 L air/min, 60% w/v glycerol feed, wild-type
    NRRL Y-7556 (no recombinant protein). The paper claims this is the highest DCW reported for
    P. pastoris. Treat 244 g/L as an upper physical bound for cell density, NOT a production
    condition: the mCherry-producing runs in the same paper only reached 122 g DCW/L before the
    methanol switch.

