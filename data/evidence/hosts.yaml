# data/evidence/hosts.yaml — Phase B evidence: HOST PHYSIOLOGY, KINETICS AND YIELDS
#
# Topic: stoichiometric / kinetic inputs for K. phaffii (glucose, glycerol, methanol)
# and T. reesei (glucose, lactose, cellulosic sugars), plus BLG/OVA-specific numbers.
# Format and grades: see data/evidence/README.md.
#
# Extra key `host:` on every entry (kphaffii | treesei | scerevisiae | aoryzae | generic).
# `read:` values: fulltext (file on disk in references/text/), html (open-access HTML or
# Europe PMC full-text XML read online), abstract (only the abstract was readable).
#
# HONESTY NOTES (read before using any of these):
#
# - HOW THE QUOTES WERE NORMALISED. Every quote is the source's own words in reading
#   order, but two mechanical changes were made so the YAML stays ASCII and readable:
#     (1) Unicode transliterated: mu for the Greek letter, +/- for the plus-minus sign,
#         - for en/em dashes and minus signs, -> for the reaction arrow, . for the centre
#         dot, deg for the degree sign, and superscripts written inline (h-1, gDCW-1).
#     (2) Line breaks, page headers, equation numbers and two-column interleaving removed.
#   Consequence: a literal `grep` of a quote against references/text/*.txt WILL often fail
#   even though the quote is correct, because those .txt files are PDF dumps in which the
#   two columns are interleaved line by line. Example, the Every patent on disk reads
#   "...cell densities of up to / medium. In some cases, the medium is BSGY medium. In /
#   100 g dry cell weight/L, 150 g dry cell weight/L or 200 g dry / cell weight/L." - the
#   quoted sentence is exact once the other column is dropped. 27 of the 42 on-disk quotes
#   match after punctuation-insensitive normalisation; 14 of the other 15 fail only for this
#   reason, and one dropped a word (kphaffii_our_methanol_induction_universal2026, fixed in the
#   2026-09-26 audit, R6-m11). When auditing, read around the locator rather than grepping.
#
# - Quotes marked "table cell" or "TABLE ROW" in the note were read from a table (in the
#   Europe PMC full-text XML, or a PDF dump) rather than from running prose. They are the
#   most likely to contain an OCR/encoding slip and should be re-checked against the
#   publisher PDF before entering data/assumptions.yaml.
# - Several high-profile numbers could NOT be sourced and are recorded with quote: null
#   at the bottom of this file. Do not fill them in from memory.

# ---------------------------------------------------------------------------
# 1. K. phaffii — biomass yield on substrate, mu_max, maintenance
# ---------------------------------------------------------------------------

- key: kphaffii_yxs_glucose_chemostat_maurer2006
  value: 0.559
  unit: g DCW/g glucose
  grade: A
  host: kphaffii
  source: "Maurer M, Kuhleitner M, Gasser B, Mattanovich D. Microb Cell Fact 5:37 (2006)"
  doi_or_url: 10.1186/1475-2859-5-37
  locator: "Results, chemostat section"
  quote: "Y_XS = 0.559 and m_S = 0.0161 h-1 were derived according to eq (26)."
  read: html
  note: >
    K. phaffii (P. pastoris) X-33-derived Fab-secreting strain, glucose-limited chemostat,
    Pichia-Salts-Medium. Y_XS here is the MAXIMUM (maintenance-corrected) yield from a
    Pirt plot, not an observed batch yield. The paper writes the unit of m_S as h-1; it is
    dimensionally g glucose / (g DCW . h). Read via PMC1712348.

