# Calibration anchor 1: Humbird (2021) Appendix A, baker's yeast (SI sheet A.1, "standard" case).
# Every value is copied from the SI workbook; `loc` gives sheet!cell. Cost year 2018 US$.
# Reality check: Humbird estimates the actual production cost of dry baker's yeast at
# ~$1.90/kg from a $2.20-2.80/kg wholesale price and a 33% margin (humbird2021, App. A p.89).
source: "Humbird D (2021) Scale-up economics for cultured meat, SI workbook sheet A.1"
cost_year: 2018
market_implied_cost_usd_kg: {value: 1.90, loc: "humbird2021 App. A, printed p.89",
  quote: "assuming a total margin of 33% (profit + taxes), the actual cost of baker's yeast production should be around $1.90/kg"}

