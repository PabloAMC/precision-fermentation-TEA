equations:        # transcribed from the SI equation pictures (drawing anchors in brackets)
  sugar_yield: "Y_s = m_c*y_h/x + m_h*y_p/z  (cellulose, hexose conversion, anhydro corr.; hemicellulose, pentose conv., anhydro corr.)  ['Balance calculation equations'!B5]"
  scp_protein: "m_p = m_s * Y_XS * x_p * R_s  [B19]"
  recombinant_protein: "m_p = m_s * Y_PS  [B30]"
  nitrogen: "m_N = (m_B*c_p + m_p)/6.25 ; m_NH3 = m_N*M_NH3/M_N  [B37, B46]"
  metabolic_heat: "dH_rxn = M_g*dh_g*Y_s - M_b*dh_b - M_p*dh_p  (heats of combustion)  [B55]"
  heating_cooling: "Q = c_p*m*dT + m*H  [H7]"
  heat_exchanger: "T_m = (dT1 - dT2)/ln(dT1/dT2) ; A = Q/(k*T_m*F)  [I20, I30]"
  reactor_volume: "V = m_dot*t/(r*rho)  (r = degree of filling; the image prints rho beside the fraction)  [I42]"
  byproduct_value: "LHV = HHV*m_b - m_H2O*H_vap  [I55]"
  equipment_scaling: "c1 = c0*(m2/m1)^n ; c1 = a + b*S^n ; c1 = M*a*m2^n  ['Capital costs'!B3, A12, B20]"
  cost_index: "I = I2/I1 ; c2 = c1*I*e  (e = USD->EUR, value not given)  ['Capital costs'!B29, B37]"
  capital_charge: "C_CO = f_a*C_FCI ; C_COP = C_CO/m_p  ['Capital costs'!B44, B50]"
  opex: "OPEX = CV + CF  ['Operating costs'!B4]"
  dcf: "Operating profit = sales - costs ; FCF = CFO + Int - CAPEX ; f_D = 1/(1+r)^m ; C_d = C_n*f_D  ['DCF'!B3, B5, B11, B17]"
  dcf_note: "The FCF equation adds interest back (a firm view), but the SI tables deduct interest and principal (an equity view). The tables reproduce the MPSP; the equation does not describe them."
