    ambiguities:
      - "No titer, batch time, turnaround, number of main fermenters, OTR, kLa or O2 demand are given. All are derived above."
      - "Purity is not stated. '90%' is dry matter after spray drying. GFI reports it as '90% purity'."
      - "The hydrolysate is concentrated from 67.7 to 200 g/L (about 150 kt/yr of water to remove), but neither the equipment nor the steam for this step appears separately. The SI flowchart shows no evaporator."
      - "Operating costs sheet total 11.93 M EUR/yr vs DCF year-1 opex 11.02 (variable 5.95 vs 6.86; fixed 5.07 in both). The DCF reproduces 9007. With 11.93 the same DCF gives about 9370 (+4%). Source of the 0.91 gap unknown."
      - "Maintenance: the text says 1.5% of TCI; the numbers use FCI (1.92 vs 2.02 M EUR/yr)."
      - "Printed DCF compounding factors (1.103, 1.050) are not used in the solved NPV, and working capital is outside it. See dcf_reconstruction."
      - "The text calls it 'discounted cash flows to the firm', but the table is an equity cash flow (principal and interest deducted, 40% equity CAPEX only)."
      - "Tax: 20% on revenue minus opex, with no depreciation. This is harsher than a standard DCF and raises the MPSP."
      - "Sugar section share of equipment: 30.50/128.18 = 23.8% for this case, vs '27–48%' on p.6. Possibly the concentration step was booked in the sugar section for this case; unresolved."
      - "The filtration yields of 0.93-0.95 in the text are not needed to reproduce 2508 t/yr. 2% per step does it."
      - "Ammonia 1,084 t/yr (Fig. 4B) implies N = (biomass + protein)/6.25, i.e. biomass counted as about 100% protein, whereas p.7 cites 49.5% crude protein for Trichoderma cell waste."
      - "It is unclear whether agitation and aeration energy (kWh/kg 'protein') are applied per kg protein or per kg biomass + protein, as antifoam evidently is. Per protein is more plausible given the 2.01 M EUR energy total."
      - "USD-to-EUR factor e for equipment costs is not reported. No equipment is itemised, so capital cannot be checked bottom-up."
      - "Location is unspecified (Finnish and global cost sources, p.4). Straw, electricity and labour are Finnish."

  # ======================================================================================
  # SCP cases: brief. Shared parameters (straw, sugar section, design basis, CAPEX factors,
  # labour rate, unit prices, financing) are as in recombinant_protein with scope: shared.
  # Differences: continuous fermentation, sugar diluted to 50 g/L, 2 workers per section per
  # shift, +10% equipment for the RNA-reduction reactor, and 30% biomass loss for RNA reduction.
  # Items common to the three SCP cases only are in the top-level block scp_shared.
  pekilo:
