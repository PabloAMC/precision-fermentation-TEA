        unit: "-"
        scope: case
        locator: "p.3, sec. 2.1.3"
        quote: "The recombinant protein fermentation is a fed-batch process"
        grade: B
      - key: sugar_feed_concentration
        value: 200
        unit: g/L
        scope: case
