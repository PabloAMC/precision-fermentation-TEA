    dcf_reconstruction:
      method: >-
        Checked against all four SI DCF tables, to within 0.02 M EUR. Equity CAPEX:
        -0.4*FCI*0.3 at t=-2 and -0.4*FCI*0.7 at t=-1. Debt = 0.6*FCI at 5%, repaid in 20 equal
        principal instalments (t=0..19), with interest on the opening balance. Revenue_t =
        MPSP*Q*1.01^(t-1) + B for t>=1, where B is a flat by-product credit; revenue_0 = 0.5
        x revenue_1. Tax_t = 0.2*(revenue_t - opex_t). FCF_t = revenue - opex - tax -
        interest - principal. NPV = sum_{t=0..20} FCF_t/1.05^t - 0.4*FCI = 0. In words: the
        equity CAPEX enters undiscounted, although the table prints compounding factors 1.103
        and 1.050, and working capital is excluded. Summing the printed discounted-cash-flow row
        gives -3.39 M EUR, not 0. The convention above gives between -0.02 and +0.01 M EUR in
        all four cases.
      derived: true
      equivalent_unlevered_form:
        statement: "sum_{t=0..20} 0.8*(revenue_t - opex_t)/1.05^t = 1.03*FCI"
        reproduces: 9007.3
        why: >-
          The discount rate equals the debt rate. The loan behaves as if drawn at t=-1 and
          repaid over t=0..19, so its debt service has a present value of 1.05 x 0.6 FCI at
          t=0. Interest is not tax-deductible here, so leverage changes nothing else. The
          result is an unlevered DCF at 5% with capital of 0.4 FCI + 1.05 x 0.6 FCI =
          1.03 FCI at t=0, tax at 20% of EBITDA, and no depreciation or working capital.
      byproduct_credit_B: {value: 0.336, unit: M EUR/yr, note: "Fitted with MPSP fixed at 9007 and Q at 2508; max residual 0.006 across 20 years. That is 1.5% of revenue, matching p.7."}
      reproduced_mpsp: {value: 9007, unit: EUR/t, note: "Uses the table's own opex series. NPV at 9007 is -0.008 M EUR."}
      sensitivity_to_conventions:     # EUR/t, same inputs, one convention changed
        equity_capex_compounded_to_t0: 9127
        working_capital_in_npv: 9149
        both: 9269
        opex_from_operating_costs_sheet_11.93: 9370
      note: "The spread shows how much DCF conventions alone move the target (about 1-4%)."

