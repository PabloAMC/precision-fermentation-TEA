        grade: B
        note: >-
          The hydrolysate (67.7 g/L) is concentrated to 200 g/L. The SI flowchart shows no
          evaporator and the paper does not say how this step was costed. The implied water
          removal is roughly 150,000 t/yr (derived, approx.).
      - key: fermentable_sugar_fraction
