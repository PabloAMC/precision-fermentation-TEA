  dcf_note: >-
    The SCP DCF tables follow the same method as the recombinant one (FCF and NPV reconstruct
    to within 0.02 M EUR). Their revenue rows, however, imply protein revenue 4-6% above
    MPSP x the protein output on p.6. The recombinant table matches its MPSP exactly. The SCP
    tables may come from a slightly different model version. Use the SCP numbers only as
    secondary checks.

