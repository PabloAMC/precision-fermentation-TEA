        scope: case
        locator: "SI 'Process assumptions'!C38"
        also: "p.6, sec. 3.3"
        quote: "Utilization of 90% of total sugars was assumed for simplicity"
        grade: B
        note: "The SI cell holds the text '90 ' and is labelled 'Assumption'."
      - key: yield_protein_on_sugar
        value: 0.2
        unit: g protein/g sugar
        scope: case
        locator: "SI 'Process assumptions'!C37"
        also: "p.3, sec. 2.1.3"
        quote: "The biomass and protein conversions from sugars were assumed to be equal, 0.2 for the recombinant protein process"
        grade: B
        note: "The SI source is 'Simo Ellilä. Interview 22/4/2020'. Balance equation: m_p = m_s * Y_PS (SI 'Balance calculation equations'!B30)."
      - key: yield_biomass_on_sugar
