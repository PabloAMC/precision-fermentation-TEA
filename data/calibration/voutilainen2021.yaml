usd_figure_check:            # task: where does GFI's "$11.2/kg" come from?
  claim:
    value: 11.2
    unit: USD/kg
    source: gfi2025costs
    locator: "GFI 2025 p.28"
    quote: "The lowest reported COP, $11.2/kg for spray-dried protein (90% purity)"
    also: "p.34: 'A single PF-protein TEM reporting $11.2/kg for a 90% protein powder'"
  gfi_appendix_row:
    locator: "GFI 2025 Appendix 2, p.71, publication 49, row 'Specific protein / Recombinant protein / Aerobic / Filamentous fungi'"
    production_volume_t_per_yr: 2507       # = Fig. 4B 'Protein: 2,507 ton/a'
    cop_usd2024_per_kg: 11.16
    opex_musd2024_per_yr: 19.68
    capex_musd2024: 165.56
    gfi_method: "GFI p.69: costs converted to USD, then 'adjusted to 2024 dollars using year-by-year inflation and Chemical Engineering Plant Cost Index rates'. No rates or base year are given."
  which_case: "recombinant_protein. Its MPSP is 9007 EUR/t DM protein (2019 EUR); volume 2507 t/yr matches Fig. 4B."
  is_it_a_currency_conversion: >-
    Yes, and also a change of basis. 11.16/9.007 = 1.239 USD per EUR if taken per kg of protein;
    no standard combination of exchange rate and deflator gives that. Taken per kg of 90%-DM
    powder instead, 9.007 x 0.9 = 8.106 EUR/kg and 11.16/8.106 = 1.3767. That factor is about
    the 2019 exchange rate (~1.12 USD/EUR) times US CPI inflation 2019->2024 (~1.23), which is
    about 1.374. Independent check: the same factor reproduces GFI's Torula entry, 7311 EUR/t
    x 0.53 protein x 1.3765 = 5.33 USD/kg (Appendix 2 row with 5.33; Table 1 'Yeast (1)
    Continuous $5.3'). The recombinant and Torula rows share a factor window of 1.3761-1.3768.
  conclusion: >-
    $11.2/kg is 9007 EUR/t (2019 EUR per t DM protein) re-expressed by GFI per kg of spray-dried
    powder at 90% DM and moved to 2024 USD. Per kg of protein it is about 12.4 USD/kg (2024
    USD); in 2019 USD it is about 10.1 USD/kg protein (x1.12). Confidence in the per-powder
    reading: about 70%. Fallback: an undocumented factor of 1.239 per kg protein.
  external_values_used:
    note: "Recalled, not from files on disk. Check against ECB and BLS before citing."
    eur_usd_2019_average: 1.1195
    us_cpi_u_2024_over_2019: 1.227
  gfi_row_issues: >-
    GFI's OpEx (19.68) and CapEx (165.56) cannot be reproduced from the SI with one factor.
    165.56/134.58 TCI = 1.230, 19.68/11.93 = 1.650. They do satisfy COP x volume = OpEx +
    CapEx/20 to within 0.1%, so one was probably back-calculated. For the SCP rows of this
    paper, GFI's volumes are the SI/Fig. 4 product tonnages (3434 Torula, 6190 Pekilo, 4495
    Fusarium), with the yeast and fungus labels swapped between the 3434 and 4495 rows. The
    Pekilo and Fusarium COPs are about 2% off the factor above. Do not use GFI's OpEx or CapEx
    for this paper.

