        locator: "SI 'Operating costs'!J13"
        also: "p.4, sec. 3.1; Table 1 (triangular 3000/10,000/20,000)"
        quote: "10 €/kg protein was selected as the base case"
        grade: B
      - key: hydrolysis_optimum
        value: {yield_pct: 57.53, enzyme_mg_per_g_DM: 5.07, enzyme_mg_per_g_cellulose: 9.07, time_h: 128.52, solids_pct: 12.80}
        unit: mixed
        scope: shared
        locator: "p.4, sec. 3.1"
        quote: "The optimum hydrolysis yield for the base case was 57.53%, with the optimum E of 5.07 mg/g DM (9.07 mg/g cellulose), optimum t of 128.52 h and optimum c of 12.80%."
        grade: B
        note: "This is a Solver optimum, not an input. Fig. 2 labels give the rounded values Y=58%, E=5.0 mg/g, t=131 h, c=13%."
      - key: hydrolysate_sugar_concentration
        value: 67.7
        unit: g/L
        scope: shared
        locator: "p.3, sec. 2.1.3"
        quote: "The sugar concentration in the hydrolysate was 67.7 g/L for the base case scenario, and thus required concentration to 200 g/L."
        grade: B
      - key: sugar_output
        value: 15417
        unit: t sugars/yr (monomeric pentose + hexose)
        scope: shared
        locator: "p.6, sec. 3.3"
        quote: "The sugar yield from 40,000 DM tons of straw was 15,417 tons/a."
        grade: B
      - key: sugar_production_cost
        value: 504
        low: 460
        high: 550
        unit: EUR/t sugar
        scope: shared
        locator: "Fig. 2C, p.5 (value at the optimum marker); range p.4, sec. 3.1"
        quote: "The sugar production cost were in the range of 460–550 €/DM ton"
        read: figure
        grade: B
        note: >-
          This is the plant's own cost of making sugar (straw, enzymes, chemicals, steam and
          the sugar section's capital), not a market price. The 460-550 range comes from moving
          the enzyme price and hydrolysis CAPEX to 50-150% of base. For comparison, p.4 gives a
          '10-year average sugar market price of 308 €/ton'. The recombinant case's
          sugar-related share of cost comes out at 35% (see derived).

      # ---------------- fermentation (recombinant) ----------------
      - key: fermentation_mode
