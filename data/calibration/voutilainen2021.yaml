# Calibration anchor 4 (PLAN.md, phase D): Voutilainen et al. 2021.
# Extracted 2026-09-26 from the paper (PDF + text) and the SI workbook on disk. Not yet reviewed.
#
# Locators:
#   SI 'Sheet'!A1 = cell in the SI workbook, read with openpyxl (values and formulas)
#   SI 'Sheet'!A1:B2 (image ...) = picture embedded in the workbook at that anchor
#   p.N = printed journal page N (PDF page N+1), with a verbatim quote
#   Fig./Table = read from the figure or table on that page
# `derived: true` means the number is NOT in the source. It is arithmetic on sourced numbers,
# with the formula given. Check these first. Grades follow data/evidence/README.md
# (B = design-basis assumption in a peer-reviewed TEA).

source:
  key: voutilainen2021
  citation: >-
    Voutilainen E, Pihlajaniemi V, Parviainen T (2021). Economic comparison of food protein
    production with single-cell organisms from lignocellulose side-streams. Bioresource
    Technology Reports 14:100683.
  doi: 10.1016/j.biteb.2021.100683
  license: CC BY 4.0
  files:
    paper_pdf: references/papers/Voutilainen2021_scp_lignocellulose_economics.pdf
    paper_text: references/text/Voutilainen2021_scp_lignocellulose_economics.txt
    si_workbook: references/papers/Voutilainen2021_scp_lignocellulose_economics_SI.xlsx
  page_convention: "p.N = printed journal page; PDF page = N + 1 (VTT cover sheet first)."
  si_structure: >-
    A static results workbook, not the live model. The paper's Excel/VBA model (Solver,
    Goal Seek, Monte Carlo) is not supplied. The SI has 8 sheets and only 24 formulas, all
    cosmetic (label copies and averages on 'Commercial protein prices'). Every equation is an
    embedded picture; they are transcribed in `equations` below. The four DCF tables are
    embedded EMF pictures (xl/media/image97-100.emf); their numbers were read from the EMF
    text records. 'Operating costs' values are text strings rounded to 0.01 M EUR. No sheet
    itemises equipment.
  verification: >-
    Paper quotes were checked by script against a column-reflowed copy of the on-disk text.
    SI cells were re-read and compared by script. Values read by eye from figures are marked
    `read: figure`.
  extracted: 2026-09-26
  extracted_by: "Claude (subagent), unreviewed"

cost_year: 2019          # equipment costs brought to 2019 with CEPCI 607.5 (p.4)
currency: EUR
cost_basis: "EUR per DM tonne of protein (recombinant: purified protein; SCP: protein in the biomass)"

calibration_target:
  case: recombinant_protein
  value: 9007
  unit: EUR/t DM protein (2019 EUR)
  note: >-
    Use this number as the anchor, not the $11.2/kg in GFI 2025. The $11.2/kg is GFI's
    restatement in 2024 USD, most likely per kg of 90%-DM powder; see usd_figure_check.
    tests/test_validation.py currently targets cop_usd_kg = 11.2. Revisit that in phase D.

method_notes: |
  Integrated greenfield plant at an unspecified location, 8000 h/yr, processing 40,000 t DM of
  wheat straw a year. All four products share the sugar section: 1% H2SO4 steam explosion
  (190 C, 15 min), enzymatic hydrolysis (enzyme dose, time and solids optimised inside the TEA
  with Excel Solver), then centrifuges. This gives 15,417 t/yr of sugars at 67.7 g/L. Each
  product then has its own fermentation and DSP. Mass balance in Excel, 2% loss per step.
  CAPEX: each item's purchased cost is scaled from literature or quotes with
  c1 = c0 (m2/m1)^n, c = a + b S^n or c = M a m^n. Costs are moved to 2019 with CEPCI and
  converted USD->EUR by a factor e whose value is not reported. Unlisted items (pumps,
  conveyors) add 20% to purchased equipment; SCP adds a further 10% for the RNA reactor.
  FCI = 4.07 x purchased equipment (Peters-Timmerhaus ratio factors); working capital is 5% of
  FCI. The sugar section (FCI 30.5 M EUR) sits inside each product's FCI (inferred; see
  sugar_section_fci).
  OPEX = variable + fixed. Variable: straw, enzymes, water, chemicals (H2SO4, NaOH, NH3,
  antifoam, nutrients), and energy and electricity (agitation + aeration + 20%, plus steam).
  Fixed: labour + maintenance. There is no insurance, overhead, G&A, QC, R&D or regulatory cost.
  MPSP = the price at which the equity cash flow has zero NPV, over 20 years, found with Goal
  Seek. Reconstructed from the SI DCF tables (reproduces 9007, see dcf_reconstruction):
  - 40% equity, spent 30/70 over two construction years;
  - 60% debt at 5%, repaid in 20 equal principal instalments;
  - discount rate 5%;
  - tax 20% on (revenue - opex), with no depreciation or interest deduction;
  - one start-up year (50% revenue);
  - by-products credited at combustion value;
  - the equity CAPEX enters the NPV undiscounted, and working capital is left out.
  This is equivalent to an unlevered 5% DCF with capital of 1.03 x FCI at t=0 (see
  dcf_reconstruction.equivalent_unlevered_form).

cases:

  # ======================================================================================
  recombinant_protein:
    name_in_paper: "generalized recombinant protein (acellular, secreted)"
    name_in_si: "Ovalbumin"                  # SI 'Capital costs'!M4
    one_line: >-
      A fed-batch fungal secretion process modelled on NREL 2011's T. reesei cellulase area.
      Sugar is fed at 200 g/L, with 0.2 g protein and 0.2 g biomass per g sugar and 0.2 g/L/h.
      DSP: pressure filter, then sheet filter, then UF to 28%, then spray dryer to 90% DM.
      Output 2508 t DM protein/yr. MPSP 9007 EUR/t.
    # scope: shared = common to all four cases (the SCP cases below reuse these);
    #        case   = recombinant-specific.
    parameters:

      # ---------------- identity ----------------
      - key: host_organism
        value: "Trichoderma reesei (implied; never named as the host)"
        unit: "-"
        scope: case
        locator: "p.3, sec. 2.1.3"
        quote: "The NREL’s process set up is applicable to recombinant food protein production as the production host is the same and the product similar."
        also: "p.7: 'The Trichoderma cell waste from the recombinant protein process'"
        grade: B
      - key: product
        value: "microbial egg protein, generalized (the SI column is labelled 'Ovalbumin')"
        unit: "-"
        scope: case
        locator: "p.3, sec. 2.1.3; SI 'Capital costs'!M4"
        quote: "One generalized recombinant protein process based on the production of microbial egg protein was designed mainly using VTT’s technical data"
        grade: B

      # ---------------- plant scale and feedstock (shared) ----------------
      - key: straw_capacity
        value: 40000
        unit: t DM straw/yr
        scope: shared
        locator: "p.3, sec. 2.2"
        quote: "annual raw material capacity of 40,000 DM tons of straw with 8000 h of an annual production time"
        grade: B
        note: "The Monte Carlo range is 20,000-60,000 (Table 1). As-received straw = 40,000/0.85 = 47,059 t/yr (derived)."
      - key: operating_hours
        value: 8000
        unit: h/yr
        scope: shared
        locator: "p.3, sec. 2.2"
        quote: "annual raw material capacity of 40,000 DM tons of straw with 8000 h of an annual production time"
        grade: B
      - key: straw_dry_matter
        value: 85
        unit: "% DM"
        scope: shared
        locator: "p.2, sec. 2.1"
        quote: "Wheat straw was assumed to have a dry matter (DM) of 85% and to contain 37% cellulose, 27% hemicelluloses, 20% lignin, and other 16% components"
        grade: B
      - key: straw_composition
        value: {cellulose: 37, hemicellulose: 27, lignin: 20, other: 16}
        unit: "% of DM"
        scope: shared
        locator: "p.2, sec. 2.1"
        quote: "Wheat straw was assumed to have a dry matter (DM) of 85% and to contain 37% cellulose, 27% hemicelluloses, 20% lignin, and other 16% components"
        grade: B
      - key: straw_price
        value: 42.57
        unit: EUR/t DM
        scope: shared
        locator: "SI 'Operating costs'!J12"
        also: "p.2, sec. 2.1"
        quote: "The base case wheat straw price was estimated as 42.57 €/DM ton"
        grade: B
        note: "The SI cites internal information plus a transport-cost calculation. Monte Carlo range 50-150% (Table 1)."

      # ---------------- sugar section (shared) ----------------
      - key: pretreatment_acid
        value: 1
        unit: "% H2SO4 solution, slurry at 30% DM"
        scope: shared
        locator: "p.2, sec. 2.1.1"
        quote: "mixed with a 1% food-grade H2SO4 solution (Niemi et al., 2017) to 30% DM"
        grade: B
        note: "Preheated to 100 C. Neutralised with food-grade NaOH (50%)."
      - key: steam_explosion_temperature
        value: 190
        unit: degC
        scope: shared
        locator: "p.2, sec. 2.1.1"
        quote: "with a retention time of 15 min at a temperature of 190"
        grade: B
        note: "Retention time 15 min. Continuous reactor."
      - key: steam_explosion_pressure
        value: 5.57
        unit: bar
        scope: shared
        locator: "p.2, sec. 2.1.1"
        quote: "a 5.57 bar pressure by adding 13 bar high-pressure steam"
        grade: B
      - key: hp_steam_use
        value: 0.4
        unit: t HP steam (13 bar)/t DM straw
        scope: shared
        locator: "p.2, sec. 2.1.1"
        quote: "The high-pressure steam consumption in the process was estimated as 0.4 ton per ton DM"
        grade: B
      - key: steam_explosion_conversion
        value: {pentose: 44, hexose: 5}
        unit: "%"
        scope: shared
        locator: "SI 'Process assumptions'!C8 (pentose), C9 (hexose)"
        also: "p.3, sec. 2.1.1"
        quote: "during the steam explosion were 0.44 and 0.05, respectively"
        grade: B
        note: "The paper's sentence pairs 'pentose and hexose' with 'cellulose and hemicelluloses' in the wrong order. Physically, 44% of the hemicellulose goes to pentoses and 5% of the cellulose to glucose."
      - key: solid_recovery
        value: {cellulose: 83, hemicellulose: 31}
