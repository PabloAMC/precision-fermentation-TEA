# Every parameter the model uses. One block per parameter.
# Fields: value (base), low, high, unit, source, note.
# source must be a citation or "guess". Phase 1 exit criterion: <3 guesses.
# Distributions for Monte Carlo are triangular(low, value, high) unless stated.

product: blg   # blg | ova

plant:
  annual_output_t:      {value: 10000, low: 2500, high: 25000, unit: t/yr,
                         source: "GFI 2025 Table 2 private-sector range"}
  operating_hours:      {value: 8000, low: 7500, high: 8400, unit: h/yr,
                         source: "standard; Humbird 2021 SI"}
  purity_target:        {value: 0.90, low: 0.60, high: 0.95, unit: fraction,
                         source: "GFI 2025 sec 1.3: 60-90% typical"}

strain:
  titer_g_per_L:        {value: 30, low: 5, high: 60, unit: g/L,
                         source: "GFI 2025 Table 2: public avg 24, private avg 42; academic BLG/OVA 1-5",
                         note: "THE dominant parameter. Always report cost vs titer."}
  yield_g_per_g_sugar:  {value: 0.10, low: 0.03, high: 0.17, unit: g/g,
                         source: "GFI 2025 Table 2 private range"}
  batch_time_h:         {value: 120, low: 80, high: 180, unit: h,
                         source: "guess; typical Pichia fed-batch"}
  turnaround_h:         {value: 24, low: 12, high: 36, unit: h,
                         source: "guess; CIP/SIP + fill"}
  host:                 {value: "K. phaffii", source: "choice"}

fermenter:
  working_volume_m3:    {value: 200, low: 100, high: 500, unit: m3,
                         source: "guess; industry range for aerobic fed-batch"}
  fill_fraction:        {value: 0.75, low: 0.7, high: 0.8, unit: fraction,
                         source: "standard"}
  purchase_cost_ref_usd: {value: 2000000, low: 1500000, high: 3000000, unit: USD,
                         source: "guess; needs Towler-Sinnott or vendor quote",
                         note: "cost of a fermenter of size ref_volume_m3"}
  ref_volume_m3:        {value: 200, unit: m3, source: "same as above"}
  scale_exponent:       {value: 0.6, low: 0.5, high: 0.7, unit: "-",
                         source: "six-tenths rule; Towler & Sinnott"}

downstream:
  # ordered list; each step has a recovery fraction. Overall = product.
  steps:
    - {name: cell_removal,   recovery: {value: 0.95, low: 0.90, high: 0.98},
       source: "Intelligen lactoferrin white paper"}
    - {name: ultrafiltration, recovery: {value: 0.92, low: 0.85, high: 0.97},
       source: "Intelligen lactoferrin white paper"}
    - {name: chromatography,  recovery: {value: 0.85, low: 0.70, high: 0.95},
       source: "guess; pharma literature", note: "skip if purity_target<0.7"}
    - {name: spray_drying,    recovery: {value: 0.97, low: 0.94, high: 0.99},
       source: "standard"}
  dsp_capex_multiplier: {value: 1.0, low: 0.6, high: 1.5, unit: "-",
                         source: "guess",
                         note: "DSP purchased cost as multiple of fermentation purchased cost"}

capex:
  lang_factor:          {value: 4.0, low: 3.0, high: 5.0, unit: "-",
                         source: "Towler & Sinnott, fluid processing plant"}
  lifetime_years:       {value: 15, unit: yr, source: "standard"}
  discount_rate:        {value: 0.10, low: 0.08, high: 0.15, unit: "-",
                         source: "standard"}

opex:
  sugar_price_usd_kg:   {value: 0.40, low: 0.30, high: 0.60, unit: USD/kg,
                         source: "GFI 2025 Table 6, DE95 glucose Midwest US"}
  media_other_usd_per_m3: {value: 150, low: 80, high: 300, unit: USD/m3 broth,
                         source: "guess; salts, trace elements, antifoam"}
  utilities_usd_per_m3: {value: 60, low: 30, high: 120, unit: USD/m3 broth,
                         source: "guess; aeration, cooling, steam, water"}
  labour_usd_per_yr:    {value: 6000000, low: 4000000, high: 9000000, unit: USD/yr,
                         source: "guess; ~60 FTE"}
  maintenance_frac_capex: {value: 0.03, low: 0.02, high: 0.05, unit: "-",
                         source: "standard"}
  other_fixed_frac_capex: {value: 0.02, low: 0.01, high: 0.03, unit: "-",
                         source: "insurance, tax; standard"}
