# Bovine αs1-casein, the casein of Formo's pending FDA GRN 1312 (E. coli, precipitated at pH 4) and of New Culture's
# recombinant mozzarella. Sequence: UniProt P02662 (CASA1_BOVIN), entry version 178: signal 1-15, mature chain 16-214,
# 199 residues, no cysteine (data/evidence/casein.yaml, alpha-s1/kappa section). Milk αs1 carries 8-9 phosphoserines; yeasts and bacteria add
# none without a co-expressed kinase, so the formula is unphosphorylated, as for β-casein: C1035 H1587 N265 O317 S5,
# 22,975 Da. Its isoelectric point measured on recombinant αs1 is 5.2 (Formo patent).
